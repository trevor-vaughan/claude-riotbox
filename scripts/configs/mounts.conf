# riotbox-config-version: 2
# ~/.config/riotbox/mounts.conf — Extra host paths to mount into the container.
#
# Each line is a file or directory to bind-mount, read-only (:ro,z) by
# default. Paths are relative to $HOME unless they start with / or ~.
# Lines starting with # are comments; blank lines are ignored.
#
# A line may end in `:rw` to mount that path read-write, or `:ro` to say
# read-only explicitly. Read-only is the default, so an entry with no
# suffix is unchanged. Only lowercase `:rw` and `:ro` are recognised —
# anything else is read as part of the path.
#
# Think before adding `:rw`. The agent inside the container runs
# autonomously, and a read-write entry is a hole straight through to your
# host filesystem at that path. Credentials and configs belong read-only;
# `:rw` is for scratch space and output directories you expect a session
# to change. A session launched with RIOTBOX_READONLY=1 mounts every
# entry read-only regardless and says so on stderr. A `:rw` entry naming
# your home directory, anything above it, or / is refused outright.
#
# Entries here are added to those in the system file (/etc/riotbox/
# mounts.conf), not merged with them: listing a path the system file
# already mounts produces two mounts of the same destination, which the
# container engine rejects. A user entry cannot re-mount a system entry
# at a different mode.
#
# The container NEVER auto-mounts sensitive directories (.ssh, .gnupg,
# .kube, .aws, cloud credentials). Use this file to explicitly mount
# only what the container needs — typically registry auth tokens or
# tool configs that aren't baked into the image at build time.
#
# See also: scripts/detect-mounts.sh for the full mount logic.
# ─────────────────────────────────────────────────────────────────────────

# ── Package registry credentials ─────────────────────────────────────────
# If you use private npm/yarn/pip registries, mount the auth config so
# Claude can install packages. Auth tokens are stripped from configs at
# build time, so runtime mounts are the recommended way to provide them.
#
# .npmrc
# .yarnrc.yml
# .config/pip/pip.conf

# ── Build tool configs ───────────────────────────────────────────────────
# Maven settings, Gradle properties, etc.
#
# .m2/settings.xml
# .gradle/gradle.properties

# ── Other ────────────────────────────────────────────────────────────────
# Any file or directory. Absolute paths work too:
#
# /etc/ssl/certs/custom-ca.pem

# ── Read-write ───────────────────────────────────────────────────────────
# A scratch or output directory the session is meant to write back to.
# Everything above is read-only; only these entries are not.
#
# .cache/mytool:rw
# ~/riotbox-output:rw
