# riotbox-config-version: 4
# egress.conf — what a RIOTBOX_EGRESS=1 session may reach. RiotBox reads
# /etc/riotbox/egress.conf (system) and ~/.config/riotbox/egress.conf (yours)
# and combines them; see README "Egress proxy".
#
# With RIOTBOX_EGRESS=1 (see config), the agent reaches the network only
# through its own Envoy proxy, which allows HTTPS (CONNECT) to what these
# files allow and refuses everything else. Unless strict mode is on, two
# groups are allowed without listing them:
#
#   @registries   the package registries: @npm @pypi @go @crates @github
#   @agent        the active agent's own API hosts (e.g. api.anthropic.com)
#
# Groups you can allow (`riotbox egress groups` lists each one's hosts):
#
#   @forges      source forges: GitHub, GitLab, Bitbucket, Codeberg, Gitea,
#                SourceHut, Azure DevOps and Launchpad; git over HTTPS only
#   @containers  container registries, for nested podman (RIOTBOX_NESTED=1)
#   @centos @fedora @rhel @debian @ubuntu @arch
#                each distro's own package mirrors (see "OS packages" below)
#   @os          every distro's mirrors above in one name
#   @npm @pypi @go @crates @github @gitlab @rubygems @maven @huggingface
#                one package registry or model hub each
#   @search @docs @wikipedia
#                search engines; documentation and Q&A sites; Wikipedia.
#                @search and @docs let the agent send data (its queries) out
#
# Groups can change between releases as vendors move their hosts; define
# your own group for a set that must not.
#
# Settings come first, then sections; lines before any section are [allow]
# lines. `#` starts a comment.
#
#   strict               allow only what these files list: not even
#                        @registries or @agent (same as: strict = on)
#   strict = off         turn strict mode off (e.g. over the system file's)
#
#   [allow]              then one per line:
#   example.com          that host, port 443
#   example.com:8443     that host, that port only
#   *.example.com        any subdomain of example.com (not example.com itself)
#   @containers          every host of a group
#   -pypi.org            remove an entry another line, file or group allows;
#   -@npm                it must match exactly
#
#   [group NAME]         define a group. NAME: lowercase letters, digits and
#                        -, starting with a letter or digit, at most 63;
#                        "agent" is reserved. Lines: host, host:port or
#                        *.domain, no - or @. It replaces a built-in group
#                        of the same name.
#
# Only names are accepted, never IP addresses. Plain HTTP is never proxied.
#
# This file and /etc/riotbox/egress.conf are read when a session starts.
# To apply an edit to running sessions: riotbox egress reload
# To change one running session without editing this file:
#   riotbox egress allow <entry|@group>    riotbox egress deny <entry|@group>
#   riotbox egress strict --enable|--disable|--clear
# Denied requests are logged; `riotbox egress list` shows where.
# ─────────────────────────────────────────────────────────────────────────

# ── Strict mode with your own mirror ─────────────────────────────────────
# strict
#
# [group mirrors]
# mirror.corp.example:8443
# *.pkg.corp.example
#
# [allow]
# @agent
# @mirrors

# ── Container registries (for nested podman: RIOTBOX_NESTED=1) ───────────
# @containers

# ── Source forges (git clone, fetch and push) ────────────────────────────
# Git over SSH does not work through the proxy; use HTTPS remotes.
# @forges

# ── OS packages (sudo dnf install inside the session) ────────────────────
# In an egress session RiotBox points the distro's package manager at its
# own HTTPS mirror, as stock configs use mirror lists and plain HTTP that no
# allowlist can cover. Allow the group of the distro the session runs:
# @centos for the RiotBox image (CentOS Stream 10, with EPEL). @fedora,
# @rhel, @debian, @ubuntu and @arch do the same for those distros; Debian
# and Ubuntu need ca-certificates in the image. @os allows every distro's
# mirrors at once.
# @centos
