name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # Deliberately unpinned. We want new hadolint rules the day they ship and
      # accept that a release can turn this job red with no commit on our side —
      # 2.15.0 did exactly that by adding DL3066 and widening DL3025. Do not
      # "fix" that by pinning; the intended response is to answer the new rule.
      # The version is echoed so a linter-driven failure is identifiable from
      # the log instead of looking like a regression in the change under review.
      - name: Install hadolint
        run: |
          set -euo pipefail
          curl -sSfL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/latest/download/hadolint-linux-x86_64
          chmod +x /usr/local/bin/hadolint
          hadolint --version

      - name: Install task
        run: |
          sudo sh -c 'curl -sL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin'
          task --version

      - name: Run linters
        run: task lint

      - name: Lint venom test suites
        run: task test:lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install task
        run: |
          sudo sh -c 'curl -sL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin'
          task --version

      - name: Ensure podman is available
        run: command -v podman || sudo apt-get update && sudo apt-get install -y podman

      - name: Run tests
        id: tests
        run: task test

      # The probe case in tests/doctor-context-mode.venom.yml drops to uid 65534
      # with setpriv, and that branch is only taken when the runner is uid 0 —
      # which nothing above ever is: the job runs as `runner` and the test image
      # ends `USER testuser`. Left at that, the drop (and the four sentinel
      # shapes it recovered, which a root runner used to skip) would be executed
      # only when a maintainer happened to be root, so a typo in it would land
      # green. This re-runs that one suite as uid 0 against the image the step
      # above already built, so it costs a suite rather than a rebuild.
      - name: Run the Context Mode doctor suite as uid 0
        run: task test:as-root -- tests/doctor-context-mode.venom.yml

      # The egress E2E suite needs podman networks, which the venom test
      # container `task test` runs in cannot create, so it runs here on the
      # runner. Unlike tests/Containerfile.test, this pins venom: GitHub
      # publishes a sha256 digest for each release asset, verified here.
      - name: Install venom
        env:
          VENOM_VERSION: v1.3.0
          VENOM_SHA256: 89832ec25e820c605cf0d3c09122e60bad43d13c1724aa6d375ef7109fbfe201
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL -o /tmp/venom \
            "https://github.com/ovh/venom/releases/download/${VENOM_VERSION}/venom.linux-amd64"
          echo "${VENOM_SHA256}  /tmp/venom" | sha256sum -c -
          sudo install -m 0755 /tmp/venom /usr/local/bin/venom
          rm -f /tmp/venom
          venom version

      - name: Egress proxy end-to-end (host podman)
        run: task test:egress-e2e MODE=llm

      - name: Run Go suites (LLM-readable copy of failures)
        if: failure() && steps.tests.outcome == 'failure'
        run: task go:test MODE=llm
