name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # Deliberately unpinned. We want new hadolint rules the day they ship and
      # accept that a release can turn this job red with no commit on our side —
      # 2.15.0 did exactly that by adding DL3066 and widening DL3025. Do not
      # "fix" that by pinning; the intended response is to answer the new rule.
      # The version is echoed so a linter-driven failure is identifiable from
      # the log instead of looking like a regression in the change under review.
      - name: Install hadolint
        run: |
          set -euo pipefail
          curl -sSfL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/latest/download/hadolint-linux-x86_64
          chmod +x /usr/local/bin/hadolint
          hadolint --version

      - name: Install task
        run: |
          sudo sh -c 'curl -sL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin'
          task --version

      - name: Run linters
        run: task lint

      - name: Lint venom test suites
        run: task test:lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install task
        run: |
          sudo sh -c 'curl -sL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin'
          task --version

      - name: Ensure podman is available
        run: command -v podman || sudo apt-get update && sudo apt-get install -y podman

      - name: Run tests
        run: task test
