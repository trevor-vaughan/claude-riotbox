name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.23"
          cache: false

      - name: Install task
        run: |
          sudo sh -c 'curl -sL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin'
          task --version

      - name: Install nfpm (pinned)
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3
          echo "${HOME}/go/bin" >> "${GITHUB_PATH}"

      - name: Verify tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(cat VERSION)"
          if [ "${tag}" != "${file}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION (${file})" >&2
            exit 1
          fi

      - name: Build packages
        run: task release:package

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          # Bound as an env var and quoted at every use. Git ref names may
          # contain shell metacharacters ($, ;, backtick are all legal), so the
          # tag never reaches the shell as unquoted text.
          TAG: ${{ github.ref_name }}
        run: |
          # Notes come from the CHANGELOG.md that `task release:bump` committed
          # alongside this tag, so the published release and the file in the
          # repository cannot disagree. The extraction is a script rather than
          # an inline awk so tests/release-bump.venom.yml covers it.
          .taskfiles/scripts/changelog-section.sh "${TAG#v}" CHANGELOG.md > release-notes.md
          gh release create "${TAG}" \
            dist/*.rpm dist/*.deb dist/SHA256SUMS \
            --title "${TAG}" \
            --notes-file release-notes.md
