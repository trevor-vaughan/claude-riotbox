name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Runs every unpinned or third-party-script step (task installer, linters)
  # with a read-only token and no OIDC access.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No build cache for releases: a poisoned cache could taint
          # published, signed artifacts.
          cache: false

      - name: Install task
        run: |
          sudo sh -c 'curl -sL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin'
          task --version

      - name: Verify tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(cat VERSION)"
          if [ "${tag}" != "${file}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION (${file})" >&2
            exit 1
          fi

      # The Go half of the quality gate. The bash/venom half needs podman and
      # ran on main in test.yml before the tag was cut.
      - name: Go quality gate
        run: |
          task go:lint
          task go:test MODE=llm

  # SECURITY: the OIDC token is job-wide, so any step in this job can mint a
  # token that cosign keyless signing accepts. Nothing unpinned may run here.
  # Exactly this runs, and nothing else may be added without the same scrutiny:
  #   - SHA-pinned actions: checkout, setup-go (downloads the Go toolchain),
  #     cosign-installer (verifies cosign against a sha256 and Sigstore
  #     bundles inside the action), attest-build-provenance
  #   - the syft tarball below, verified against a hard-coded sha256
  #   - .taskfiles/scripts/changelog-section.sh, from this repository
  #   - `go tool goreleaser`, version-pinned in go.mod and verified by go.sum
  # No curl|sh installers, no task. Put anything else in `gate`.
  publish:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + upload assets
      id-token: write # keyless cosign signing + provenance OIDC token
      attestations: write # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser derives the version from the tag
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Release notes from CHANGELOG.md
        env:
          # Bound as an env var and quoted at every use. Git ref names may
          # contain shell metacharacters ($, ;, backtick are all legal), so the
          # tag never reaches the shell as unquoted text.
          TAG: ${{ github.ref_name }}
        run: |
          # Notes come from the CHANGELOG.md that `task release:bump` committed
          # alongside this tag, so the published release and the file in the
          # repository cannot disagree. The extraction is a script rather than
          # an inline awk so tests/release-bump.venom.yml covers it.
          .taskfiles/scripts/changelog-section.sh "${TAG#v}" CHANGELOG.md > "${RUNNER_TEMP}/release-notes.md"

      # GoReleaser shells out to syft (SBOM) and cosign (sign); both must be on PATH.
      # anchore/sbom-action/download-syft is not used: it pipes install.sh from
      # syft's main branch into sh, which is unpinned code in a job holding the
      # OIDC token. To bump syft, update SYFT_VERSION and SYFT_SHA256 together;
      # the hash is the linux_amd64 line of
      # https://github.com/anchore/syft/releases/download/<version>/syft_<number>_checksums.txt
      - name: Install syft (checksum-verified)
        env:
          SYFT_VERSION: v1.55.0
          SYFT_SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
        run: |
          set -euo pipefail
          archive="syft_${SYFT_VERSION#v}_linux_amd64.tar.gz"
          curl --proto =https --tlsv1.2 -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/${archive}"
          echo "${SYFT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/syft-bin"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/syft-bin" syft
          echo "${RUNNER_TEMP}/syft-bin" >> "${GITHUB_PATH}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build, sign and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Release exactly the tag the gate checked, even if several tags point at HEAD.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
        run: go tool goreleaser release --clean --release-notes "${RUNNER_TEMP}/release-notes.md"

      # GitHub-native SLSA build provenance for every published artifact.
      # Verify with: gh attestation verify <file> --repo trevor-vaughan/claude-riotbox
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.rpm
            dist/*.deb
            dist/*.sbom.json
            dist/checksums.txt
