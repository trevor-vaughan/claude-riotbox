version: "3"

vars:
  TEST_IMAGE: riotbox-test
  CONTAINER_CMD:
    sh: command -v podman 2>/dev/null || echo docker

tasks:
  default:
    silent: true
    cmd: task test --list

  build:
    desc: Build the riotbox-test image from tests/Containerfile.test
    internal: true
    cmds:
      - |
        echo "Building test image..."
        {{.CONTAINER_CMD}} build \
            --build-arg "HOST_UID=$(id -u)" \
            --build-arg "HOST_GID=$(id -g)" \
            -f "{{.ROOT_DIR}}/tests/Containerfile.test" \
            -t "{{.TEST_IMAGE}}" \
            "{{.ROOT_DIR}}"

  list:
    desc: List available test suites
    cmd: find "{{.ROOT_DIR}}/tests" -name '*.venom.yml' -printf '%f\n' | sort

  lint:
    desc: Lint .venom.yml test suites for structural issues
    cmd: bash "{{.ROOT_DIR}}/scripts/lint-venom.sh" "{{.ROOT_DIR}}/tests"

  run:
    desc: "Run tests (venom integration suites; MODE=human|llm)"
    deps: [build, ":go:build"]
    vars:
      ARGS: "{{.ARGS | default .CLI_ARGS}}"
    env:
      TEST_DIR: "{{.ROOT_DIR}}/{{.TEST_DIR}}"
      TEST_AS_ROOT: '{{.TEST_AS_ROOT | default ""}}'
      TEST_MODE: '{{.MODE | default "human"}}'
      # Git isolation: the suites run git, so they must not see the caller's
      # git config or identity. run-tests.sh passes these into the container.
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_SYSTEM: /dev/null
      GIT_AUTHOR_NAME: RiotBox Tests
      GIT_AUTHOR_EMAIL: riotbox-tests@invalid
      GIT_COMMITTER_NAME: RiotBox Tests
      GIT_COMMITTER_EMAIL: riotbox-tests@invalid
    cmds:
      - mkdir -p "{{.ROOT_DIR}}/{{.TEST_DIR}}"
      - "{{.ROOT_DIR}}/.taskfiles/scripts/run-tests.sh {{.ARGS}}"

  # Delegates to `run` so the image build and the venom invocation stay defined
  # once; the only difference is the uid the suites execute under. Pass a single
  # suite — this exists for coverage of the privilege drop, not as a second full
  # test pass.
  as-root:
    desc: "Run tests as uid 0 in the container — covers the setpriv drop in doctor-context-mode (pass a suite via --)"
    cmds:
      - task: run
        vars:
          ARGS: "{{.ARGS | default .CLI_ARGS}}"
          TEST_AS_ROOT: "1"

  direct:
    desc: "Run venom tests directly without the test container (artifacts to .test-output/; MODE=human|llm)"
    deps: [":go:build"]
    vars:
      ARGS: "{{.ARGS | default .CLI_ARGS}}"
    env:
      TEST_MODE: '{{.MODE | default "human"}}'
      # Git isolation, as in `run`.
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_SYSTEM: /dev/null
      GIT_AUTHOR_NAME: RiotBox Tests
      GIT_AUTHOR_EMAIL: riotbox-tests@invalid
      GIT_COMMITTER_NAME: RiotBox Tests
      GIT_COMMITTER_EMAIL: riotbox-tests@invalid
    cmds:
      - "{{.ROOT_DIR}}/scripts/venom-run.sh {{.ARGS}}"

  egress-e2e:
    desc: "Run the egress proxy end-to-end suite against this host's podman (pulls Envoy; needs the internet; MODE=human|llm)"
    deps: [":go:build"]
    vars:
      EGRESS_IMAGE:
        sh: bash -c 'source "{{.ROOT_DIR}}/libexec/egress-lib.sh" && printf "%s" "${RIOTBOX_EGRESS_DEFAULT_IMAGE}"'
    env:
      RIOTBOX_EGRESS_E2E: "1"
      RIOTBOX_EGRESS_IMAGE: "{{.EGRESS_IMAGE}}"
      TEST_MODE: '{{.MODE | default "human"}}'
    cmds:
      - go tool ginkgo --label-filter=e2e {{if eq (.MODE | default "human") "llm"}}--succinct --no-color{{end}} ./internal/egress/...
      - "{{.ROOT_DIR}}/scripts/venom-run.sh tests/egress-e2e.venom.yml"
