version: "3"

vars:
  TEST_IMAGE: riotbox-test
  TEST_DIR: '{{.ROOT_DIR}}/{{.TEST_DIR | default ".test-output"}}'
  CONTAINER_CMD:
    sh: command -v podman 2>/dev/null || echo docker

tasks:
  default:
    silent: true
    cmd: task test --list

  build:
    internal: true
    cmds:
      - |
        echo "Building test image..."
        {{.CONTAINER_CMD}} build \
            --build-arg "HOST_UID=$(id -u)" \
            --build-arg "HOST_GID=$(id -g)" \
            -f "{{.ROOT_DIR}}/tests/Containerfile.test" \
            -t "{{.TEST_IMAGE}}" \
            "{{.ROOT_DIR}}"

  list:
    desc: List available test suites
    cmd: find "{{.ROOT_DIR}}/tests" -name '*.venom.yml' -printf '%f\n' | sort

  lint:
    desc: Lint .venom.yml test suites for structural issues
    cmd: bash "{{.ROOT_DIR}}/scripts/lint-venom.sh" "{{.ROOT_DIR}}/tests"

  run:
    desc: Run tests (venom integration suites)
    deps: [build]
    vars:
      ARGS: "{{.ARGS | default .CLI_ARGS}}"
    env:
      TEST_DIR: "{{.TEST_DIR}}"
      TEST_AS_ROOT: '{{.TEST_AS_ROOT | default ""}}'
    cmds:
      - mkdir -p "{{.TEST_DIR}}"
      - "{{.ROOT_DIR}}/.taskfiles/scripts/run-tests.sh {{.ARGS}}"

  # Delegates to `run` so the image build and the venom invocation stay defined
  # once; the only difference is the uid the suites execute under. Pass a single
  # suite — this exists for coverage of the privilege drop, not as a second full
  # test pass.
  as-root:
    desc: "Run tests as uid 0 in the container — covers the setpriv drop in doctor-context-mode (pass a suite via --)"
    cmds:
      - task: run
        vars:
          ARGS: "{{.ARGS | default .CLI_ARGS}}"
          TEST_AS_ROOT: "1"

  direct:
    desc: "Run venom tests directly without the test container (artifacts to .test-output/)"
    vars:
      ARGS: "{{.ARGS | default .CLI_ARGS}}"
    cmds:
      - "{{.ROOT_DIR}}/scripts/venom-run.sh {{.ARGS}}"
