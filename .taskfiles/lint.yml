version: "3"

tasks:
  default:
    silent: true
    cmd: task lint --list

  shellcheck:
    desc: Lint shell scripts with shellcheck
    # Excluded checks:
    #   SC1090 — Can't follow non-constant source (we source scripts dynamically)
    #   SC1091 — Not following sourced file (sourced files not available as input)
    cmd: |
      shellcheck -x \
        -e SC1090 \
        -e SC1091 \
        {{.ROOT_DIR}}/bin/riotbox \
        {{.ROOT_DIR}}/setup.sh \
        {{.ROOT_DIR}}/install.sh \
        {{.ROOT_DIR}}/libexec/*.sh \
        {{.ROOT_DIR}}/scripts/*.sh \
        {{.ROOT_DIR}}/scripts/lib/*.sh \
        {{.ROOT_DIR}}/container/*.sh \
        {{.ROOT_DIR}}/.taskfiles/scripts/*.sh \
        {{.ROOT_DIR}}/agents/*.sh \
        {{.ROOT_DIR}}/agents/*/*.sh \
        {{.ROOT_DIR}}/tests/lib/*.sh

  hadolint:
    desc: Lint Containerfiles with hadolint
    # Excluded checks live in .hadolint.yaml, next to the rationale for each
    # one. The config is passed explicitly because hadolint only auto-discovers
    # it from the current working directory, which would silently drop every
    # suppression when the task is invoked from a subdirectory.
    cmd: |
      hadolint \
        --config {{.ROOT_DIR}}/.hadolint.yaml \
        {{.ROOT_DIR}}/Containerfile \
        {{.ROOT_DIR}}/tests/Containerfile.test

  run:
    desc: Run all linters (shellcheck, hadolint)
    cmds:
      - task: shellcheck
      - task: hadolint
