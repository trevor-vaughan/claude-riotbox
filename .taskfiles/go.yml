version: "3"

tasks:
  default:
    silent: true
    cmd: task go --list

  build:
    desc: Build libexec/riotbox-core from the Go sources
    sources:
      - "{{.ROOT_DIR}}/**/*.go"
      - exclude: "{{.ROOT_DIR}}/**/*_test.go"
      - exclude: "{{.ROOT_DIR}}/**/testdata/**"
      - exclude: "{{.ROOT_DIR}}/.worktrees/**"
      - "{{.ROOT_DIR}}/go.mod"
      - "{{.ROOT_DIR}}/go.sum"
      - "{{.ROOT_DIR}}/VERSION"
      - "{{.ROOT_DIR}}/scripts/build-core.sh"
    generates:
      - "{{.ROOT_DIR}}/libexec/riotbox-core"
    cmd: '"{{.ROOT_DIR}}/scripts/build-core.sh" "{{.ROOT_DIR}}/libexec/riotbox-core"'

  test:
    desc: "Run the Go (Ginkgo) suites (MODE=human|llm)"
    # The root's TEST_DIR is repo-root-relative; go-test.sh resolves it.
    env:
      TEST_DIR: '{{.TEST_DIR}}'
      # Git isolation: tests must not see the caller's git config or
      # identity. Same values as test.yml's run and direct.
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_SYSTEM: /dev/null
      GIT_AUTHOR_NAME: RiotBox Tests
      GIT_AUTHOR_EMAIL: riotbox-tests@invalid
      GIT_COMMITTER_NAME: RiotBox Tests
      GIT_COMMITTER_EMAIL: riotbox-tests@invalid
    cmd: '"{{.ROOT_DIR}}/.taskfiles/scripts/go-test.sh" "{{.MODE | default "human"}}"'

  fmt:
    desc: Format Go code with golangci-lint's configured formatters (gofmt, goimports)
    dir: "{{.ROOT_DIR}}"
    cmd: go tool golangci-lint fmt ./...

  lint:
    desc: Lint Go code with golangci-lint
    dir: "{{.ROOT_DIR}}"
    cmd: go tool golangci-lint run ./...
