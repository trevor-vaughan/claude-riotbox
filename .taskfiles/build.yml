version: "3"

# Image builds, one task per flavor. `build:image` is the base image (the root
# `build` alias points at it, so `task build` builds it); each other task here
# is a flavor of it.
#
# These are thin on purpose: container.yml owns image operations (build,
# rebuild, update, clean) and these delegate to it, the same way the root
# Taskfile's rebuild/update aliases do. The namespace exists so a flavor reads
# as what it is — `task build:gh-glab` rather than `task container:build-gh-glab`.
#
# Cross-namespace references need the leading colon (`:container:build`).
# Without it Task resolves the name inside this file and fails.

tasks:
  default:
    silent: true
    cmd: task build --list

  image:
    desc: "Build the RiotBox image (detects your local toolchains)"
    cmds:
      - task: :container:build

  gh-glab:
    desc: "Build the riotbox-gh-glab flavor (adds the gh and glab CLIs)"
    cmds:
      - task: :container:build-gh-glab
