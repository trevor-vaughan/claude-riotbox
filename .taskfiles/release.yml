version: "3"

tasks:
  default:
    silent: true
    cmd: task release --list

  bump:
    desc: "Bump the version, regenerate CHANGELOG.md, commit and tag (prompts; or: task release:bump -- 0.6.0)"
    # interactive so the version prompt reaches the terminal unbuffered, silent
    # so task does not echo the command over it. Validation, the suggested
    # version and the changelog all live in the script — duplicating any of it
    # as preconditions here would give two answers that drift apart.
    interactive: true
    silent: true
    cmd: '"{{.ROOT_DIR}}/.taskfiles/scripts/release-bump.sh" {{.CLI_ARGS}}'

  current:
    desc: Show the current version
    silent: true
    cmd: cat "{{.ROOT_DIR}}/VERSION"

  package:
    desc: "Build rpm + deb into dist/ (requires nfpm)"
    vars:
      DIST: "{{.ROOT_DIR}}/dist"
    cmds:
      - rm -rf "{{.DIST}}"
      - mkdir -p "{{.DIST}}"
      - cmd: |
          command -v nfpm >/dev/null 2>&1 || {
            echo "nfpm not found. Install nfpm v2.46.3:" >&2
            echo "  go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3" >&2
            exit 1
          }
      - cmd: |
          export RB_VERSION="$(cat '{{.ROOT_DIR}}/VERSION')"
          nfpm package -f '{{.ROOT_DIR}}/nfpm.yaml' -p rpm -t '{{.DIST}}'
          nfpm package -f '{{.ROOT_DIR}}/nfpm.yaml' -p deb -t '{{.DIST}}'
      - cmd: |
          cd '{{.DIST}}' && sha256sum ./*.rpm ./*.deb > SHA256SUMS
      - cmd: ls -1 '{{.DIST}}'
