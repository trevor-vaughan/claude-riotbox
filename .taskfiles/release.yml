version: "3"

tasks:
  default:
    silent: true
    cmd: task release --list

  bump:
    desc: "Bump the version, regenerate CHANGELOG.md, commit and tag (prompts; or: task release:bump -- 0.6.0)"
    # interactive so the version prompt reaches the terminal unbuffered, silent
    # so task does not echo the command over it. Validation, the suggested
    # version and the changelog all live in the script — duplicating any of it
    # as preconditions here would give two answers that drift apart.
    interactive: true
    silent: true
    cmd: '"{{.ROOT_DIR}}/.taskfiles/scripts/release-bump.sh" {{.CLI_ARGS}}'

  current:
    desc: Show the current version
    silent: true
    cmd: cat "{{.ROOT_DIR}}/VERSION"

  package:
    desc: "Dry-run the release into dist/: binaries, archives, rpm + deb per arch, checksums (unsigned)"
    dir: "{{.ROOT_DIR}}"
    env:
      # A snapshot never publishes, so the token is unused; forcing one only
      # stops GoReleaser refusing to start when several forge tokens are set.
      GORELEASER_FORCE_TOKEN: github
    cmds:
      - go tool goreleaser check
      # --skip=sign,sbom: signing needs the release workflow's OIDC identity
      # and SBOMs need syft; both run only in .github/workflows/release.yml.
      - go tool goreleaser release --snapshot --clean --skip=sign,sbom
      - ls -1 dist
