  - name: --binary installs from a release tree unpacked inside an unrelated git repo
    steps:
      - type: exec
        script: |
          root="$(mktemp -d)"
          trap 'rm -rf "${root}"' EXIT
          export HOME="${root}/home"
          export XDG_DATA_HOME="${HOME}/.local/share"
          export XDG_CONFIG_HOME="${HOME}/.config"
          mkdir -p "${HOME}"
          ver="$(cat "{{.riotbox_dir}}/VERSION")"
          source "{{.riotbox_dir}}/tests/lib/fake-release.sh"
          git_test_env
          install_fake_release "${root}/rel" "${ver}" "{{.riotbox_dir}}/libexec/riotbox-core"
          # e.g. a tarball unpacked under a dotfiles repo: that repo is not
          # this checkout, so its tags and state say nothing about it.
          mkdir -p "${root}/outer"
          (cd "${root}/outer" && git init -q && git commit -q --allow-empty -m dotfiles)
          copy_source_tree "{{.riotbox_dir}}" "${root}/outer/src"
          ln -s "${root}/outer/src" "${root}/src"
          "${root}/src/install.sh" --binary >/dev/null
          test -s "${root}/rel/curl-urls" && echo DOWNLOADED
          test "$("${XDG_DATA_HOME}/riotbox/libexec/riotbox-core" version)" = "${ver}" && echo INSTALLED
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "DOWNLOADED"
          - result.systemout ShouldContainSubstring "INSTALLED"

  - name: --binary without git on PATH treats the checkout as a source tree
    steps:
      - type: exec
        script: |
          root="$(mktemp -d)"
          trap 'rm -rf "${root}"' EXIT
          export HOME="${root}/home"
          export XDG_DATA_HOME="${HOME}/.local/share"
          export XDG_CONFIG_HOME="${HOME}/.config"
          mkdir -p "${HOME}"
          ver="$(cat "{{.riotbox_dir}}/VERSION")"
          source "{{.riotbox_dir}}/tests/lib/fake-release.sh"
          git_test_env
          install_fake_release "${root}/rel" "${ver}" "{{.riotbox_dir}}/libexec/riotbox-core"
          make_tagged_checkout "{{.riotbox_dir}}" "${root}/src" "${ver}"
          git -C "${root}/src" commit -q --allow-empty -m "past the tag"
          # Every tool --binary uses except git; the fake release first.
          mkdir -p "${root}/nogit"
          for t in bash cat sed mktemp dirname rm mkdir cp install ln chmod grep awk tr stat uname tar gzip sha256sum sort head; do
            p="$(command -v "${t}")" && ln -s "${p}" "${root}/nogit/${t}"
          done
          PATH="${root}/rel/bin:${root}/nogit" "${root}/src/install.sh" --binary >/dev/null
          test -s "${root}/rel/curl-urls" && echo DOWNLOADED
          test "$("${XDG_DATA_HOME}/riotbox/libexec/riotbox-core" version)" = "${ver}" && echo INSTALLED
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "DOWNLOADED"
          - result.systemout ShouldContainSubstring "INSTALLED"
