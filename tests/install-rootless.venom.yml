      - type: exec
        script: |
          root="$(mktemp -d)"
          trap 'rm -rf "${root}"' EXIT
          export HOME="${root}/home"
          export XDG_DATA_HOME="${HOME}/.local/share"
          export XDG_CONFIG_HOME="${HOME}/.config"
          mkdir -p "${HOME}"
          # A tree without .git, as a source tarball unpacks: the repo itself
          # may be a checkout past the release tag, which --binary refuses.
          source "{{.riotbox_dir}}/tests/lib/fake-release.sh"
          copy_source_tree "{{.riotbox_dir}}" "${root}/src"
          mkdir -p "${root}/fakebin"
          printf '#!/bin/sh\n[ "$1" = version ] && echo "GitVersion:    v3.0.6"\nexit 0\n' >"${root}/fakebin/cosign"
          # curl stub: checksums.txt names the archive with an all-zero hash;
          # every other download (the archive itself) is arbitrary bytes.
          cat >"${root}/fakebin/curl" <<'EOF'
          #!/bin/sh
          while [ $# -gt 0 ]; do
            if [ "$1" = -o ]; then
              case "$2" in
              *checksums.txt)
                ver="$(cat "${RIOTBOX_TEST_VERSION_FILE}")"
                arch=amd64
                [ "$(uname -m)" = aarch64 ] && arch=arm64
                printf '%064d  riotbox-core_%s_linux_%s.tar.gz\n' 0 "${ver}" "${arch}" >"$2"
                ;;
              *) echo tampered >"$2" ;;
              esac
              shift
            fi
            shift
          done
          EOF
          chmod +x "${root}/fakebin/cosign" "${root}/fakebin/curl"
          rc=0
          RIOTBOX_TEST_VERSION_FILE="{{.riotbox_dir}}/VERSION" PATH="${root}/fakebin:${PATH}" "${root}/src/install.sh" --binary || rc=$?
          echo "rc=${rc}"
          test ! -e "${XDG_DATA_HOME}/riotbox" && echo UNTOUCHED
        assertions:
          - result.systemout ShouldContainSubstring "rc=1"
