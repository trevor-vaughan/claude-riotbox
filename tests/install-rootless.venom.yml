          source "{{.riotbox_dir}}/tests/lib/fake-release.sh"
          install_fake_release "${root}/rel" "$(cat "{{.riotbox_dir}}/VERSION")" "{{.riotbox_dir}}/libexec/riotbox-core" ok devel
          "{{.riotbox_dir}}/install.sh" --binary && echo "UNEXPECTED SUCCESS"
          test ! -e "${root}/rel/curl-urls" && echo NOTHING_DOWNLOADED
          test ! -e "${XDG_DATA_HOME}/riotbox" && echo UNTOUCHED
        assertions:
          - result.systemout ShouldContainSubstring "UNTOUCHED"
          - result.systemout ShouldContainSubstring "NOTHING_DOWNLOADED"
          - result.systemout ShouldNotContainSubstring "UNEXPECTED SUCCESS"
          - result.systemerr ShouldContainSubstring "--binary needs cosign 2.6.2+ or 3.0.4+ (found devel); upgrade cosign or use --build."

