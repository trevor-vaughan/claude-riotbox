  - name: --binary installs the verified release binary
    steps:
      - type: exec
        script: |
          root="$(mktemp -d)"
          trap 'rm -rf "${root}"' EXIT
          export HOME="${root}/home"
          export XDG_DATA_HOME="${HOME}/.local/share"
          export XDG_CONFIG_HOME="${HOME}/.config"
          mkdir -p "${HOME}"
          ver="$(cat "{{.riotbox_dir}}/VERSION")"
          source "{{.riotbox_dir}}/tests/lib/fake-release.sh"
          # A tree without .git, as a source tarball unpacks: the repo itself
          # may be a checkout past the release tag, which --binary refuses.
          copy_source_tree "{{.riotbox_dir}}" "${root}/src"
          install_fake_release "${root}/rel" "${ver}" "{{.riotbox_dir}}/libexec/riotbox-core"
          "${root}/src/install.sh" --binary
          core="${XDG_DATA_HOME}/riotbox/libexec/riotbox-core"
          test -x "${core}" && test "$("${core}" version)" = "${ver}" && echo CORE_VERSION_OK
          # cosign was asked to verify checksums.txt against this repo's
          # release workflow at this exact tag, using the downloaded bundle.
          args="${root}/rel/cosign-args"
          after() { awk -v f="$1" 'p { print; exit } $0 == f { p = 1 }' "${args}"; }
          test "$(head -1 "${args}")" = verify-blob && echo VERB_OK
          bundle="$(after --bundle)"
          checksums="$(tail -1 "${args}")"
          case "${bundle}" in */checksums.txt.sigstore.json) echo BUNDLE_OK ;; *) ;; esac
          test "${checksums}" = "$(dirname "${bundle}")/checksums.txt" && echo CHECKSUMS_OK
          test "$(after --certificate-identity)" = "https://github.com/trevor-vaughan/claude-riotbox/.github/workflows/release.yml@refs/tags/v${ver}" && echo IDENTITY_OK
          test "$(after --certificate-oidc-issuer)" = "https://token.actions.githubusercontent.com" && echo ISSUER_OK
          grep -qxF "https://github.com/trevor-vaughan/claude-riotbox/releases/download/v${ver}/checksums.txt" "${root}/rel/curl-urls" && echo URL_OK
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "Fetching riotbox-core v"
          - result.systemout ShouldContainSubstring "(binary)"
          - result.systemout ShouldContainSubstring "CORE_VERSION_OK"
          - result.systemout ShouldContainSubstring "VERB_OK"
          - result.systemout ShouldContainSubstring "BUNDLE_OK"
          - result.systemout ShouldContainSubstring "CHECKSUMS_OK"
          - result.systemout ShouldContainSubstring "IDENTITY_OK"
          - result.systemout ShouldContainSubstring "ISSUER_OK"
          - result.systemout ShouldContainSubstring "URL_OK"

