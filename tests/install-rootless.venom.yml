          make_tagged_checkout "{{.riotbox_dir}}" "${root}/src" "${ver}"
          # The branch changed the key rules after the release: the release
          # binary would still report the same VERSION and be accepted.
          echo '// changed after the release' >>"${root}/src/internal/sessionkey/sessionkey.go"
          git -C "${root}/src" commit -q -am "change key rules"
          "${root}/src/install.sh" --binary && echo "UNEXPECTED SUCCESS"
