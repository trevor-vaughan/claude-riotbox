name: session state dir — mount sources live outside the container-writable session dir
vars:
  root: "."
  riotbox_dir: "{{.root}}"

# The session dir is the container's read-write ~/.claude, so anything nested
# in it can be swapped for a symlink before the next launch. Every other mount
# source lives in the session's state dir (scripts/lib/session-state.sh). These
# cases pin the helpers that create and migrate it, and the launch path that
# uses them, against planted links: relative, absolute and dangling, at the
# legacy paths inside the session dir and at the new paths in the state dir.
# A followed link shows up as a change to the victim directory.

testcases:
  # ── ensure_real_dir ─────────────────────────────────────────────────────

  - name: ensure_real_dir creates a missing directory and leaves a real one alone
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-state-helpers.sh"
          setup_state_test
          trap 'rm -rf "${T}"' EXIT
          source "{{.riotbox_dir}}/scripts/lib/session-state.sh"
          ensure_real_dir "${T}/a/b" 2>"${T}/err"
          [ -d "${T}/a/b" ] || { echo "FAIL: not created"; exit 1; }
          echo data > "${T}/a/b/f"
          ensure_real_dir "${T}/a/b" 2>>"${T}/err"
          [ "$(cat "${T}/a/b/f")" = data ] || { echo "FAIL: a real dir lost its content"; exit 1; }
          [ ! -s "${T}/err" ] || { echo "FAIL: warned about a real dir"; cat "${T}/err"; exit 1; }
          echo "ENSURE_PLAIN_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "ENSURE_PLAIN_OK"

  - name: ensure_real_dir replaces relative, absolute and dangling symlinks without following them
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-state-helpers.sh"
          setup_state_test
          trap 'rm -rf "${T}"' EXIT
          source "{{.riotbox_dir}}/scripts/lib/session-state.sh"
          mkdir -p "${T}/d"
          ln -s ../victim "${T}/d/relative"
          ln -s "${VICTIM}" "${T}/d/absolute"
          ln -s ../nowhere "${T}/d/dangling"
          [ "$(readlink -f "${T}/d/relative")" = "${VICTIM}" ] || { echo "FAIL: fixture link is wrong"; exit 1; }
          for kind in relative absolute dangling; do
            ensure_real_dir "${T}/d/${kind}" 2>"${T}/err"
            [ -d "${T}/d/${kind}" ] && [ ! -L "${T}/d/${kind}" ] || { echo "FAIL: ${kind}: not a real dir"; exit 1; }
            [ -z "$(ls -A "${T}/d/${kind}")" ] || { echo "FAIL: ${kind}: replacement is not empty"; exit 1; }
            grep -qF "${T}/d/${kind} is not a real directory" "${T}/err" || { echo "FAIL: ${kind}: no warning"; exit 1; }
          done
          [ ! -e "${T}/nowhere" ] || { echo "FAIL: the dangling link's target was created"; exit 1; }
          assert_victim_intact
          echo "ENSURE_LINKS_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "ENSURE_LINKS_OK"

  - name: ensure_real_dir detects a symlink named with a trailing slash
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-state-helpers.sh"
          setup_state_test
          trap 'rm -rf "${T}"' EXIT
          source "{{.riotbox_dir}}/scripts/lib/session-state.sh"
          ln -s "${VICTIM}" "${T}/lnk"
          ensure_real_dir "${T}/lnk/" 2>"${T}/err"
          [ -d "${T}/lnk" ] && [ ! -L "${T}/lnk" ] || { echo "FAIL: link not replaced"; exit 1; }
          grep -qF 'is not a real directory' "${T}/err" || { echo "FAIL: no warning"; exit 1; }
          assert_victim_intact
          echo "ENSURE_SLASH_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "ENSURE_SLASH_OK"

  - name: ensure_real_dir replaces a regular file with a directory
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-state-helpers.sh"
          setup_state_test
          trap 'rm -rf "${T}"' EXIT
          source "{{.riotbox_dir}}/scripts/lib/session-state.sh"
          echo junk > "${T}/f"
          ensure_real_dir "${T}/f" 2>"${T}/err"
          [ -d "${T}/f" ] || { echo "FAIL: not replaced"; exit 1; }
          grep -qF 'is not a real directory' "${T}/err" || { echo "FAIL: no warning"; exit 1; }
          echo "ENSURE_FILE_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "ENSURE_FILE_OK"

  # ── valid_session_key ───────────────────────────────────────────────────

  - name: valid_session_key accepts one path component and rejects anything that leaves the data dir
    steps:
      - type: exec
        script: |
          set -euo pipefail
          source "{{.riotbox_dir}}/scripts/lib/session-state.sh"
          for key in abc -home-user-proj a.b ... '.x' 'a b'; do
            valid_session_key "${key}" || { echo "FAIL: rejected '${key}'"; exit 1; }
          done
          for key in '' . .. / a/b ../x a/ /a; do
            if valid_session_key "${key}"; then echo "FAIL: accepted '${key}'"; exit 1; fi
          done
          echo "VALID_KEY_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "VALID_KEY_OK"

  # ── replace_entry ───────────────────────────────────────────────────────

  - name: replace_entry renames a staged file over relative, absolute and dangling links without following them
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-state-helpers.sh"
          setup_state_test
          trap 'rm -rf "${T}"' EXIT
          source "{{.riotbox_dir}}/scripts/lib/session-state.sh"
          mkdir -p "${T}/dest"
          for target in "../victim/keep" "${VICTIM}/keep" "${T}/missing"; do
            rm -f "${T}/dest/f"
            ln -s "${target}" "${T}/dest/f"
            echo new > "${T}/staged"
            replace_entry "${T}/staged" "${T}/dest/f" 2>"${T}/err"
            assert_victim_intact
            [ -f "${T}/dest/f" ] && [ ! -L "${T}/dest/f" ] || { echo "FAIL: ${target}: not a regular file"; exit 1; }
            [ "$(cat "${T}/dest/f")" = new ] || { echo "FAIL: ${target}: wrong content"; exit 1; }
            [ ! -e "${T}/staged" ] || { echo "FAIL: ${target}: staged copy left behind"; exit 1; }
            grep -qF "Warning: ${T}/dest/f is not a regular file; removing it." "${T}/err" || { echo "FAIL: ${target}: no warning"; cat "${T}/err"; exit 1; }
          done
          echo "REPLACE_LINK_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "REPLACE_LINK_OK"

  - name: replace_entry replaces a directory at a file's destination with a warning, and a regular file silently
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-state-helpers.sh"
          setup_state_test
          trap 'rm -rf "${T}"' EXIT
          source "{{.riotbox_dir}}/scripts/lib/session-state.sh"
          mkdir -p "${T}/dest/f/sub"
          ln -s "${VICTIM}" "${T}/dest/f/sub/link"
          echo new > "${T}/staged"
          replace_entry "${T}/staged" "${T}/dest/f" 2>"${T}/err"
          assert_victim_intact
          [ "$(cat "${T}/dest/f")" = new ] || { echo "FAIL: directory not replaced"; exit 1; }
          grep -qF "Warning: ${T}/dest/f is not a regular file; removing it." "${T}/err" || { echo "FAIL: no warning"; cat "${T}/err"; exit 1; }
          echo newer > "${T}/staged"
          replace_entry "${T}/staged" "${T}/dest/f" 2>"${T}/err"
          [ "$(cat "${T}/dest/f")" = newer ] || { echo "FAIL: file not replaced"; exit 1; }
          [ ! -s "${T}/err" ] || { echo "FAIL: warned about a regular file"; cat "${T}/err"; exit 1; }
          echo "REPLACE_FILE_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "REPLACE_FILE_OK"

  - name: replace_entry replaces a directory with a staged directory instead of merging into it
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-state-helpers.sh"
          setup_state_test
          trap 'rm -rf "${T}"' EXIT
          source "{{.riotbox_dir}}/scripts/lib/session-state.sh"
          mkdir -p "${T}/dest/d" "${T}/staged"
          echo stale > "${T}/dest/d/old"
          ln -s "${VICTIM}" "${T}/dest/d/link"
          echo new > "${T}/staged/new"
          replace_entry "${T}/staged" "${T}/dest/d" 2>"${T}/err"
          assert_victim_intact
          [ "$(ls -A "${T}/dest/d")" = new ] || { echo "FAIL: merged or not replaced: $(ls -A "${T}/dest/d")"; exit 1; }
          [ ! -s "${T}/err" ] || { echo "FAIL: warned about the old copy"; cat "${T}/err"; exit 1; }
          echo "REPLACE_DIR_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "REPLACE_DIR_OK"

  - name: replace_entry returns 1 when the old entry cannot be removed and 2 when the rename fails
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-state-helpers.sh"
          setup_state_test
          trap 'rm -rf "${T}"' EXIT
          source "{{.riotbox_dir}}/scripts/lib/session-state.sh"
          mkdir -p "${T}/shim-rm" "${T}/shim-mv" "${T}/dest/f"
          printf '#!/bin/sh\necho "rm: simulated failure" >&2\nexit 1\n' > "${T}/shim-rm/rm"
          printf '#!/bin/sh\necho "mv: simulated failure" >&2\nexit 1\n' > "${T}/shim-mv/mv"
          chmod +x "${T}/shim-rm/rm" "${T}/shim-mv/mv"
          echo new > "${T}/staged"
          rc=0
          PATH="${T}/shim-rm:${PATH}" replace_entry "${T}/staged" "${T}/dest/f" 2>"${T}/err" || rc=$?
          [ "${rc}" -eq 1 ] || { echo "FAIL: removal failure returned ${rc}, want 1"; exit 1; }
          [ -d "${T}/dest/f" ] && [ -f "${T}/staged" ] || { echo "FAIL: renamed after a failed removal"; exit 1; }
          rm -rf "${T}/dest/f"
          rc=0
          PATH="${T}/shim-mv:${PATH}" replace_entry "${T}/staged" "${T}/dest/f" 2>"${T}/err" || rc=$?
          [ "${rc}" -eq 2 ] || { echo "FAIL: rename failure returned ${rc}, want 2"; exit 1; }
          [ -f "${T}/staged" ] || { echo "FAIL: staged copy removed on a failed rename"; exit 1; }
          echo "REPLACE_FAIL_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "REPLACE_FAIL_OK"

  # ── migrate_legacy_state ────────────────────────────────────────────────

  - name: migrate_legacy_state does nothing, and creates nothing, when no legacy entry exists
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-state-helpers.sh"
          setup_state_test
          trap 'rm -rf "${T}"' EXIT
          source "{{.riotbox_dir}}/scripts/lib/session-state.sh"
          mkdir -p "${SESSION}"
          migrate_legacy_state "${SESSION}" "${STATE}" headroom:headroom git-ai:git-ai 2>"${T}/err"
          [ ! -s "${T}/err" ] || { echo "FAIL: spoke with nothing to do"; cat "${T}/err"; exit 1; }
          [ ! -e "${STATE}" ] || { echo "FAIL: created the state dir with nothing to move"; exit 1; }
          echo "MIGRATE_ABSENT_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "MIGRATE_ABSENT_OK"

  - name: migrate_legacy_state moves a real legacy dir once, and a second run is a no-op
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-state-helpers.sh"
          setup_state_test
          trap 'rm -rf "${T}"' EXIT
          source "{{.riotbox_dir}}/scripts/lib/session-state.sh"
          mkdir -p "${SESSION}/.pi-agent/sessions"
          echo history > "${SESSION}/.pi-agent/sessions/one.jsonl"
          migrate_legacy_state "${SESSION}" "${STATE}" .pi-agent:pi-agent 2>"${T}/err1"
          [ "$(cat "${STATE}/pi-agent/sessions/one.jsonl")" = history ] || { echo "FAIL: not moved"; exit 1; }
          [ ! -e "${SESSION}/.pi-agent" ] || { echo "FAIL: legacy dir left behind"; exit 1; }
          [ "$(grep -c '^Notice: moved' "${T}/err1")" -eq 1 ] || { echo "FAIL: want exactly one notice"; cat "${T}/err1"; exit 1; }
          [ "$(stat -c '%a' "${STATE}")" = 700 ] || { echo "FAIL: state dir not 0700"; exit 1; }
          [ "$(stat -c '%a' "${STATE%/*}")" = 700 ] || { echo "FAIL: state root not 0700"; exit 1; }
          migrate_legacy_state "${SESSION}" "${STATE}" .pi-agent:pi-agent 2>"${T}/err2"
          [ ! -s "${T}/err2" ] || { echo "FAIL: second run was not silent"; cat "${T}/err2"; exit 1; }
          [ "$(cat "${STATE}/pi-agent/sessions/one.jsonl")" = history ] || { echo "FAIL: second run changed data"; exit 1; }
          echo "MIGRATE_MOVE_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "MIGRATE_MOVE_OK"

  - name: migrate_legacy_state removes legacy symlinks and files without following them
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-state-helpers.sh"
          setup_state_test
          trap 'rm -rf "${T}"' EXIT
          source "{{.riotbox_dir}}/scripts/lib/session-state.sh"
          mkdir -p "${SESSION}"
          # SESSION is ${T}/data/riotbox/<key>, so ../../../victim is ${VICTIM}.
          ln -s ../../../victim "${SESSION}/headroom"
          ln -s "${VICTIM}" "${SESSION}/git-ai"
          ln -s ../nowhere "${SESSION}/overlay"
          echo junk > "${SESSION}/.pi-agent"
          [ "$(readlink -f "${SESSION}/headroom")" = "${VICTIM}" ] || { echo "FAIL: fixture link is wrong"; exit 1; }
          migrate_legacy_state "${SESSION}" "${STATE}" \
            headroom:headroom git-ai:git-ai overlay:overlay .pi-agent:pi-agent 2>"${T}/err"
          for legacy in headroom git-ai overlay .pi-agent; do
            [ ! -e "${SESSION}/${legacy}" ] && [ ! -L "${SESSION}/${legacy}" ] || { echo "FAIL: ${legacy} not removed"; exit 1; }
          done
          [ "$(grep -c 'not a real directory' "${T}/err")" -eq 4 ] || { echo "FAIL: want one warning per entry"; cat "${T}/err"; exit 1; }
          [ ! -e "${STATE}" ] || { echo "FAIL: a planted entry was migrated"; exit 1; }
          assert_victim_intact
          echo "MIGRATE_LINKS_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "MIGRATE_LINKS_OK"

  - name: migrate_legacy_state never merges when both the legacy and the new dir exist
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-state-helpers.sh"
          setup_state_test
          trap 'rm -rf "${T}"' EXIT
          source "{{.riotbox_dir}}/scripts/lib/session-state.sh"
          mkdir -p "${SESSION}/headroom" "${STATE}/headroom" "${SESSION}/git-ai" "${STATE}"
          echo old > "${SESSION}/headroom/mem"
          echo new > "${STATE}/headroom/mem"
          echo old > "${SESSION}/git-ai/config.json"
          # A symlink at the new path counts as present, and is not followed.
          ln -s "${VICTIM}" "${STATE}/git-ai"
          rc=0
          migrate_legacy_state "${SESSION}" "${STATE}" headroom:headroom git-ai:git-ai 2>"${T}/err" || rc=$?
          [ "${rc}" -eq 2 ] || { echo "FAIL: exit ${rc}, want 2 (left stranded)"; exit 1; }
          [ "$(cat "${SESSION}/headroom/mem")" = old ] || { echo "FAIL: legacy changed"; exit 1; }
          [ "$(cat "${STATE}/headroom/mem")" = new ] || { echo "FAIL: new changed"; exit 1; }
          [ ! -e "${STATE}/headroom/headroom" ] || { echo "FAIL: legacy was moved into new"; exit 1; }
          [ "$(cat "${SESSION}/git-ai/config.json")" = old ] || { echo "FAIL: git-ai legacy changed"; exit 1; }
          [ -L "${STATE}/git-ai" ] || { echo "FAIL: the new-path link was replaced"; exit 1; }
          grep -qF "both ${SESSION}/headroom and ${STATE}/headroom exist" "${T}/err" || { echo "FAIL: warning does not name both"; cat "${T}/err"; exit 1; }
          [ "$(grep -c '^Warning: both' "${T}/err")" -eq 2 ] || { echo "FAIL: want one warning per conflict"; cat "${T}/err"; exit 1; }
          assert_victim_intact
          echo "MIGRATE_CONFLICT_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "MIGRATE_CONFLICT_OK"

  - name: migrate_legacy_state leaves the legacy dir in place when the move fails
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-state-helpers.sh"
          setup_state_test
          trap 'rm -rf "${T}"' EXIT
          source "{{.riotbox_dir}}/scripts/lib/session-state.sh"
          mkdir -p "${SESSION}/headroom" "${T}/shim"
          echo keep > "${SESSION}/headroom/mem"
          printf '#!/bin/sh\necho "mv: simulated failure" >&2\nexit 1\n' > "${T}/shim/mv"
          chmod +x "${T}/shim/mv"
          rc=0
          PATH="${T}/shim:${PATH}" migrate_legacy_state "${SESSION}" "${STATE}" headroom:headroom 2>"${T}/err" || rc=$?
          [ "${rc}" -eq 2 ] || { echo "FAIL: exit ${rc}, want 2 (left stranded)"; exit 1; }
          [ "$(cat "${SESSION}/headroom/mem")" = keep ] || { echo "FAIL: legacy data lost"; exit 1; }
          [ -d "${SESSION}/headroom" ] && [ ! -L "${SESSION}/headroom" ] || { echo "FAIL: legacy dir is no longer a real dir"; exit 1; }
          grep -qF "could not move ${SESSION}/headroom" "${T}/err" || { echo "FAIL: no warning"; cat "${T}/err"; exit 1; }
          grep -qF 'simulated failure' "${T}/err" || { echo "FAIL: mv's own error was dropped"; exit 1; }
          grep -qF 'will not retry this move on its own' "${T}/err" || { echo "FAIL: no word that the move is not retried"; cat "${T}/err"; exit 1; }
          grep -qF 'riotbox session-migrate' "${T}/err" || { echo "FAIL: no word of session-migrate"; cat "${T}/err"; exit 1; }
          grep -qF "mv -T -- ${SESSION}/headroom ${STATE}/headroom" "${T}/err" || { echo "FAIL: no recovery command"; cat "${T}/err"; exit 1; }
          grep -qF "If ${STATE}/headroom exists by then" "${T}/err" || { echo "FAIL: no advice for an existing new dir"; cat "${T}/err"; exit 1; }
          echo "MIGRATE_MVFAIL_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "MIGRATE_MVFAIL_OK"

  - name: migrate_legacy_state discards a legacy dir swapped for a symlink during the move
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-state-helpers.sh"
          setup_state_test
          trap 'rm -rf "${T}"' EXIT
          source "{{.riotbox_dir}}/scripts/lib/session-state.sh"
          export VICTIM
          mkdir -p "${SESSION}/headroom" "${T}/shim"
          echo mem > "${SESSION}/headroom/mem"
          # The shim stands for a container swapping the entry between the
          # type check and the rename: it plants a link, then really moves it.
          printf '#!/bin/sh\nrm -rf "$2"\nln -s "$VICTIM" "$2"\nexec /usr/bin/mv "$@"\n' > "${T}/shim/mv"
          chmod +x "${T}/shim/mv"
          PATH="${T}/shim:${PATH}" migrate_legacy_state "${SESSION}" "${STATE}" headroom:headroom 2>"${T}/err"
          [ ! -e "${STATE}/headroom" ] && [ ! -L "${STATE}/headroom" ] || { echo "FAIL: the swapped-in link reached the state dir"; exit 1; }
          [ ! -e "${SESSION}/headroom" ] && [ ! -L "${SESSION}/headroom" ] || { echo "FAIL: legacy entry left behind"; exit 1; }
          grep -qF "${SESSION}/headroom changed during the move" "${T}/err" || { echo "FAIL: no warning"; cat "${T}/err"; exit 1; }
          assert_victim_intact
          echo "MIGRATE_SWAP_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "MIGRATE_SWAP_OK"

  - name: migrate_legacy_state removes FIFO and socket legacy entries
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-state-helpers.sh"
          setup_state_test
          trap 'rm -rf "${T}"' EXIT
          source "{{.riotbox_dir}}/scripts/lib/session-state.sh"
          mkdir -p "${SESSION}"
          mkfifo "${SESSION}/headroom"
          python3 -I -c 'import socket,sys; s=socket.socket(socket.AF_UNIX); s.bind(sys.argv[1])' "${SESSION}/git-ai"
          [ -p "${SESSION}/headroom" ] && [ -S "${SESSION}/git-ai" ] || { echo "FAIL: fixtures not created"; exit 1; }
          migrate_legacy_state "${SESSION}" "${STATE}" headroom:headroom git-ai:git-ai 2>"${T}/err"
          for legacy in headroom git-ai; do
            [ ! -e "${SESSION}/${legacy}" ] && [ ! -L "${SESSION}/${legacy}" ] || { echo "FAIL: ${legacy} not removed"; exit 1; }
          done
          [ "$(grep -c 'not a real directory' "${T}/err")" -eq 2 ] || { echo "FAIL: want one warning per entry"; cat "${T}/err"; exit 1; }
          [ ! -e "${STATE}" ] || { echo "FAIL: a special file was migrated"; exit 1; }
          echo "MIGRATE_SPECIAL_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "MIGRATE_SPECIAL_OK"

  # ── setup_projects ──────────────────────────────────────────────────────

  - name: setup_projects creates a private state dir beside the session dir, except under dry run
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-state-helpers.sh"
          setup_state_test
          trap 'rm -rf "${T}"' EXIT
          source "{{.riotbox_dir}}/scripts/mount-projects.sh"
          RIOTBOX_DRY_RUN=1 setup_projects "${PROJ}" 2>/dev/null
          [ ! -e "${XDG_DATA_HOME}/riotbox-state" ] || { echo "FAIL: dry run created the state root"; exit 1; }
          setup_projects "${PROJ}" 2>/dev/null
          [ "${RIOTBOX_STATE_DIR}" = "${STATE}" ] || { echo "FAIL: state dir ${RIOTBOX_STATE_DIR}, want ${STATE}"; exit 1; }
          [ -d "${STATE}" ] || { echo "FAIL: state dir not created"; exit 1; }
          [ "$(stat -c '%a' "${STATE}")" = 700 ] || { echo "FAIL: state dir not 0700"; exit 1; }
          [ "$(stat -c '%a' "${XDG_DATA_HOME}/riotbox-state")" = 700 ] || { echo "FAIL: state root not 0700"; exit 1; }
          echo "SETUP_STATE_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "SETUP_STATE_OK"

  # ── Projects that contain the RiotBox data roots ───────────────────────
  # Such a project bind-mounts other sessions' data (and a rootless install's
  # app tree) into the container. The user's decision is to warn, not refuse.

  - name: a project that is the data home's parent warns once on launch and still succeeds
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-state-helpers.sh"
          setup_state_test
          trap 'rm -rf "${T}"' EXIT
          source "{{.riotbox_dir}}/scripts/mount-projects.sh"
          setup_projects "${T}" 2>"${T}/err"
          [ "$(grep -c 'contains RiotBox data' "${T}/err")" -eq 1 ] || { echo "FAIL: want exactly one warning"; cat "${T}/err"; exit 1; }
          grep -qF "WARN: project ${T} contains RiotBox data:" "${T}/err" || { echo "FAIL: warning does not name the project"; cat "${T}/err"; exit 1; }
          grep -qxF "        ${XDG_DATA_HOME}/riotbox" "${T}/err" || { echo "FAIL: data dir not listed"; cat "${T}/err"; exit 1; }
          grep -qxF "        ${XDG_DATA_HOME}/riotbox-state" "${T}/err" || { echo "FAIL: state root not listed"; cat "${T}/err"; exit 1; }
          grep -qF "other sessions" "${T}/err" || { echo "FAIL: warning does not say what is exposed"; cat "${T}/err"; exit 1; }
          grep -qF "narrower project" "${T}/err" || { echo "FAIL: warning does not suggest a fix"; cat "${T}/err"; exit 1; }
          [ -d "${RIOTBOX_SESSION_DIR}" ] || { echo "FAIL: the launch did not continue"; exit 1; }
          echo "ANCESTOR_WARN_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "ANCESTOR_WARN_OK"

  - name: riotbox mounts warns once about a project that contains the data dir and writes nothing
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-state-helpers.sh"
          setup_state_test
          trap 'rm -rf "${T}"' EXIT
          # Script mode reads RIOTBOX_PROJECTS and the system config; keep both hermetic.
          unset RIOTBOX_PROJECTS
          export RIOTBOX_SYSCONF_DIR="${T}/etc"
          RIOTBOX_DRY_RUN=1 "{{.riotbox_dir}}/scripts/mount-projects.sh" --format=triple "${T}" >"${T}/out" 2>"${T}/err"
          [ "$(grep -c 'contains RiotBox data' "${T}/err")" -eq 1 ] || { echo "FAIL: want exactly one warning"; cat "${T}/err"; exit 1; }
          grep -q ":/workspace:rw$" "${T}/out" || { echo "FAIL: no mount table"; cat "${T}/out"; exit 1; }
          # Only RiotBox's own roots: podman, run for the container name, keeps its storage under XDG_DATA_HOME.
          for d in riotbox riotbox-state riotbox-context-mode; do
            [ ! -e "${XDG_DATA_HOME}/${d}" ] || { echo "FAIL: dry run created ${d}"; exit 1; }
          done
          echo "MOUNTS_WARN_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "MOUNTS_WARN_OK"

