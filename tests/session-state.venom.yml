          RIOTBOX_DRY_RUN=1 setup_projects "${XDG_DATA_HOME} ${PROJ}" 2>"${T}/err"
          [ "$(grep -c 'contains RiotBox data' "${T}/err")" -eq 1 ] || { echo "FAIL: want exactly one warning"; cat "${T}/err"; exit 1; }
          grep -qF "WARN: project ${XDG_DATA_HOME} contains RiotBox data:" "${T}/err" || { echo "FAIL: wrong project named"; cat "${T}/err"; exit 1; }
          [ "$(grep -cxF "        ${XDG_DATA_HOME}/riotbox" "${T}/err")" -eq 1 ] || { echo "FAIL: the shared root is not listed exactly once"; cat "${T}/err"; exit 1; }
          [ "$(grep -c 'narrower project' "${T}/err")" -eq 1 ] || { echo "FAIL: advice not printed exactly once"; cat "${T}/err"; exit 1; }
          echo "PROJECT_SET_WARN_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PROJECT_SET_WARN_OK"

  - name: two projects that contain roots share one advice block
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-state-helpers.sh"
          setup_state_test
          trap 'rm -rf "${T}"' EXIT
          export RIOTBOX_CONTEXT_LEDGER="${PROJ}/ledger"
          mkdir -p "${XDG_DATA_HOME}"
          source "{{.riotbox_dir}}/scripts/mount-projects.sh"
          RIOTBOX_DRY_RUN=1 setup_projects "${XDG_DATA_HOME} ${PROJ}" 2>"${T}/err"
          [ "$(grep -c 'contains RiotBox data' "${T}/err")" -eq 2 ] || { echo "FAIL: want one warning per project"; cat "${T}/err"; exit 1; }
          [ "$(grep -c 'narrower project' "${T}/err")" -eq 1 ] || { echo "FAIL: advice not printed exactly once"; cat "${T}/err"; exit 1; }
          echo "SHARED_ADVICE_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "SHARED_ADVICE_OK"

  - name: a data root of / neither aborts the launch nor warns
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-state-helpers.sh"
          setup_state_test
          trap 'rm -rf "${T}"' EXIT
          # A fresh shell, so errexit is live as in launch.sh: a `||` here would disable it.
          for ledger in / //; do
            set +e
            RIOTBOX_CONTEXT_LEDGER="${ledger}" RIOTBOX_DRY_RUN=1 bash -c 'set -euo pipefail; source "$1"; setup_projects "$2"' _ \
              "{{.riotbox_dir}}/scripts/mount-projects.sh" "${PROJ}" >/dev/null 2>"${T}/err"
            rc=$?
            set -e
            [ "${rc}" -eq 0 ] || { echo "FAIL: ledger ${ledger}: exit ${rc}"; cat "${T}/err"; exit 1; }
            if grep -qF "contains RiotBox data" "${T}/err"; then echo "FAIL: ledger ${ledger}: warned"; cat "${T}/err"; exit 1; fi
          done
          echo "ROOT_LEDGER_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "ROOT_LEDGER_OK"

  - name: an unrelated project and one nested inside the data dir print no data warning
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-state-helpers.sh"
          setup_state_test
          trap 'rm -rf "${T}"' EXIT
          source "{{.riotbox_dir}}/scripts/mount-projects.sh"
          setup_projects "${PROJ}" 2>"${T}/err"
          if grep -qF "contains RiotBox data" "${T}/err"; then echo "FAIL: warned about an unrelated project"; cat "${T}/err"; exit 1; fi
          mkdir -p "${XDG_DATA_HOME}/riotbox/nested"
          RIOTBOX_DRY_RUN=1 setup_projects "${XDG_DATA_HOME}/riotbox/nested" 2>"${T}/err"
          if grep -qF "contains RiotBox data" "${T}/err"; then echo "FAIL: warned about a project nested in the data dir"; cat "${T}/err"; exit 1; fi
          echo "NO_DATA_WARN_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "NO_DATA_WARN_OK"

  - name: setup_projects stops on an unwritable session dir before it migrates or records anything
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-state-helpers.sh"
          setup_state_test
          trap 'chmod 700 "${SESSION}" 2>/dev/null || true; rm -rf "${T}"' EXIT
          mkdir -p "${SESSION}/headroom" "${T}/shim"
          echo memory > "${SESSION}/headroom/mem.db"
          # A session dir left owned by a subordinate UID: setup_projects'
          # chmod cannot make it writable, so the shim leaves the mode alone.
          printf '#!/bin/sh\nexit 0\n' > "${T}/shim/chmod"
          chmod +x "${T}/shim/chmod"
          chmod 500 "${SESSION}"
          rc=0
          (
            PATH="${T}/shim:${PATH}"
            source "{{.riotbox_dir}}/scripts/mount-projects.sh"
            setup_projects "${PROJ}"
          ) 2>"${T}/err" || rc=$?
          [ "${rc}" -eq 1 ] || { echo "FAIL: exit ${rc}, want 1"; cat "${T}/err"; exit 1; }
          grep -qF "${SESSION} is not writable" "${T}/err" || { echo "FAIL: no wrong-UID error"; cat "${T}/err"; exit 1; }
          [ ! -e "${STATE}/.migrated" ] || { echo "FAIL: .migrated written before the check"; cat "${STATE}/.migrated"; exit 1; }
          [ "$(cat "${SESSION}/headroom/mem.db")" = memory ] || { echo "FAIL: the legacy dir was touched"; exit 1; }
          if grep -qF 'could not move' "${T}/err"; then echo "FAIL: the migration ran"; cat "${T}/err"; exit 1; fi
          echo "UNWRITABLE_SESSION_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "UNWRITABLE_SESSION_OK"

  - name: a contended sync or migration lock says what the launch is waiting for, then proceeds
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-state-helpers.sh"
          setup_state_test
          trap 'rm -rf "${T}"' EXIT
          source "{{.riotbox_dir}}/scripts/mount-projects.sh"
          setup_projects "${PROJ}" 2>/dev/null
          flock "${STATE}/.sync.lock" sleep 2 &
          holder=$!
          sleep 0.5
          setup_projects "${PROJ}" 2>"${T}/err"
          wait "${holder}"
          grep -qF 'Waiting for another launch of this project to finish syncing' "${T}/err" || { echo "FAIL: no waiting message"; cat "${T}/err"; exit 1; }
          flock "${STATE}/.migrate.lock" sleep 2 &
          holder=$!
          sleep 0.5
          setup_projects "${PROJ}" 2>"${T}/err"
          wait "${holder}"
          grep -qF 'Waiting for another RiotBox command on this session to finish migrating' "${T}/err" || { echo "FAIL: no migration waiting message"; cat "${T}/err"; exit 1; }
          setup_projects "${PROJ}" 2>"${T}/err2"
          if grep -qF 'Waiting for' "${T}/err2"; then echo "FAIL: an uncontended lock printed the message"; exit 1; fi
          echo "LOCK_WAIT_MESSAGE_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "LOCK_WAIT_MESSAGE_OK"

  - name: setup_projects moves legacy headroom and git-ai dirs into the state dir and mounts them from there
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-state-helpers.sh"
          setup_state_test
          trap 'rm -rf "${T}"' EXIT
          mkdir -p "${SESSION}/headroom" "${SESSION}/git-ai"
          echo memory > "${SESSION}/headroom/mem.db"
          echo '{}' > "${SESSION}/git-ai/config.json"
          export RIOTBOX_HEADROOM=1
          source "{{.riotbox_dir}}/scripts/mount-projects.sh"
          setup_projects "${PROJ}" 2>"${T}/err1"
          [ "$(cat "${STATE}/headroom/mem.db")" = memory ] || { echo "FAIL: headroom not moved"; exit 1; }
          [ -f "${STATE}/git-ai/config.json" ] || { echo "FAIL: git-ai not moved"; exit 1; }
          [ ! -e "${SESSION}/headroom" ] && [ ! -e "${SESSION}/git-ai" ] || { echo "FAIL: legacy dir left in the session dir"; exit 1; }
          [ "$(grep -c '^Notice: moved' "${T}/err1")" -eq 2 ] || { echo "FAIL: want one notice per entry"; cat "${T}/err1"; exit 1; }
          printf '%s\n' "${PROJECT_VOLUME_FLAGS}" | grep -qF -- "-v ${STATE}/headroom:/home/llm/.headroom:z" || { echo "FAIL: headroom mount"; exit 1; }
          printf '%s\n' "${PROJECT_VOLUME_FLAGS}" | grep -qF -- "-v ${STATE}/git-ai:/home/llm/.git-ai:z" || { echo "FAIL: git-ai mount"; exit 1; }
          setup_projects "${PROJ}" 2>"${T}/err2"
          if grep -qE '^(Notice: moved|Warning)' "${T}/err2"; then echo "FAIL: second launch was not a no-op"; cat "${T}/err2"; exit 1; fi
          [ "$(cat "${STATE}/headroom/mem.db")" = memory ] || { echo "FAIL: second launch changed the data"; exit 1; }
          echo "SETUP_MIGRATE_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "SETUP_MIGRATE_OK"

  - name: setup_projects removes headroom and git-ai links planted in the session dir without following them
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-state-helpers.sh"
          setup_state_test
          trap 'rm -rf "${T}"' EXIT
          mkdir -p "${SESSION}"
          ln -s ../../../victim "${SESSION}/headroom"
          ln -s "${VICTIM}" "${SESSION}/git-ai"
          [ "$(readlink -f "${SESSION}/headroom")" = "${VICTIM}" ] || { echo "FAIL: fixture link is wrong"; exit 1; }
          export RIOTBOX_HEADROOM=1
          source "{{.riotbox_dir}}/scripts/mount-projects.sh"
          setup_projects "${PROJ}" 2>"${T}/err"
          assert_victim_intact
          for d in headroom git-ai; do
            [ ! -L "${SESSION}/${d}" ] || { echo "FAIL: ${d}: planted link kept"; exit 1; }
            [ -d "${STATE}/${d}" ] && [ ! -L "${STATE}/${d}" ] || { echo "FAIL: ${d}: no real state dir"; exit 1; }
          done
          if printf '%s\n' "${PROJECT_VOLUME_FLAGS}" | grep -qF -- "${VICTIM}"; then echo "FAIL: the victim is mounted"; exit 1; fi
          [ "$(grep -c 'not a real directory' "${T}/err")" -eq 2 ] || { echo "FAIL: want one warning per link"; cat "${T}/err"; exit 1; }
          echo "SETUP_LEGACY_LINKS_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "SETUP_LEGACY_LINKS_OK"

  - name: setup_projects replaces headroom and git-ai links at the state-dir path without following them
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-state-helpers.sh"
          setup_state_test
          trap 'rm -rf "${T}"' EXIT
          mkdir -p "${STATE}"
          # STATE is ${T}/data/riotbox-state/<key>, so ../../../victim is ${VICTIM}.
          ln -s ../../../victim "${STATE}/headroom"
          ln -s "${VICTIM}" "${STATE}/git-ai"
          [ "$(readlink -f "${STATE}/headroom")" = "${VICTIM}" ] || { echo "FAIL: fixture link is wrong"; exit 1; }
          export RIOTBOX_HEADROOM=1
          source "{{.riotbox_dir}}/scripts/mount-projects.sh"
          setup_projects "${PROJ}" 2>"${T}/err"
          assert_victim_intact
          for d in headroom git-ai; do
            [ -d "${STATE}/${d}" ] && [ ! -L "${STATE}/${d}" ] || { echo "FAIL: ${d}: link not replaced"; exit 1; }
          done
          if printf '%s\n' "${PROJECT_VOLUME_FLAGS}" | grep -qF -- "${VICTIM}"; then echo "FAIL: the victim is mounted"; exit 1; fi
          echo "SETUP_STATE_LINKS_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "SETUP_STATE_LINKS_OK"

  - name: launch.sh pre-labels the state dir as well as the session dir
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-state-helpers.sh"
          setup_state_test
          source "{{.riotbox_dir}}/tests/lib/chcon-stub.sh"
          trap 'rm -rf "${T}" "${CHCON_STUB_DIR:-}"' EXIT
          mkdir -p "${T}/etc"
          printf '#!/usr/bin/env bash\nexit 0\n' > "${T}/fake-cmd"
          chmod +x "${T}/fake-cmd"
          RIOTBOX_DRY_RUN=1 RIOTBOX_PROJECTS="${PROJ}" RIOTBOX_SYSCONF_DIR="${T}/etc" \
          CONTAINER_CMD="${T}/fake-cmd" IMAGE_NAME=riotbox \
            bash "{{.riotbox_dir}}/libexec/launch.sh" bash >/dev/null 2>"${T}/err" \
            || { echo "FAIL: launch failed"; cat "${T}/err"; exit 1; }
          grep -qF -- " ${STATE}" "${CHCON_MARKER}" || { echo "FAIL: the state dir was not labelled"; cat "${CHCON_MARKER}"; exit 1; }
          grep -qF -- " ${SESSION}" "${CHCON_MARKER}" || { echo "FAIL: the session dir was not labelled"; exit 1; }
          echo "CHCON_STATE_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "CHCON_STATE_OK"

  - name: setup_projects moves a legacy overlay tree into the state dir and mounts it from there
    steps:
