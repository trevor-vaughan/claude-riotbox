          grep -qxF "        ${PROJ}/ledger -> ${T}/disk/ledger" "${T}/err" || { echo "FAIL: link and target not listed"; cat "${T}/err"; exit 1; }
          grep -qF "replace the link" "${T}/err" || { echo "FAIL: warning does not cover a held link"; cat "${T}/err"; exit 1; }
