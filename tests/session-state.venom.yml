          setup_state_test
          trap 'rm -rf "${T}"' EXIT
          # lnk/.. is deep, not T: collapsing .. before resolving the link would miss it.
          mkdir -p "${T}/deep/dir"
          ln -s "${T}/deep/dir" "${T}/lnk"
          export XDG_DATA_HOME="${T}/lnk/../x"
          source "{{.riotbox_dir}}/scripts/mount-projects.sh"
          RIOTBOX_DRY_RUN=1 setup_projects "${T}/deep" 2>"${T}/err"
          grep -qF "WARN: project ${T}/deep contains RiotBox data:" "${T}/err" || { echo "FAIL: no warning"; cat "${T}/err"; exit 1; }
          grep -qF "${T}/deep/x/riotbox-state" "${T}/err" || { echo "FAIL: resolved state root not listed"; cat "${T}/err"; exit 1; }
          echo "DOTDOT_WARN_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "DOTDOT_WARN_OK"

  - name: in a project set, only the project that contains a root is warned about, once, and a shared root is listed once
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-state-helpers.sh"
          setup_state_test
          trap 'rm -rf "${T}"' EXIT
