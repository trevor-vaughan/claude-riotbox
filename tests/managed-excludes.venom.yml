name: Checkpoint maintains managed .git/info/exclude block
vars:
  root: "."
  riotbox_dir: "{{.root}}"
  helpers: "{{.root}}/tests/lib/git-test-helpers.sh"

testcases:

  # -- Artifacts excluded from checkpoint commit --

  - name: Checkpoint commit omits .headroom/ and venom.log when exclude block is injected
    steps:
      - type: exec
        script: |
          source "{{.helpers}}"
          init_test_repo
          trap 'rm -rf "${TEST_DIR}"' EXIT

          # Tracked file to confirm basic checkpoint still works
          echo "src" > "${REPO_DIR}/main.go"
          git -C "${REPO_DIR}" add main.go
          GIT_AUTHOR_NAME="${HUMAN_NAME}" GIT_AUTHOR_EMAIL="${HUMAN_EMAIL}" \
          GIT_COMMITTER_NAME="${HUMAN_NAME}" GIT_COMMITTER_EMAIL="${HUMAN_EMAIL}" \
          git -C "${REPO_DIR}" commit -m "initial"

          # Runtime artifacts that must NOT land in the checkpoint commit
          mkdir -p "${REPO_DIR}/.headroom"
          echo "db" > "${REPO_DIR}/.headroom/junk.db"
          echo "log output" > "${REPO_DIR}/venom.log"

          out="$(ROOT_DIR="{{.riotbox_dir}}" RIOTBOX_PROJECTS="${REPO_DIR}" \
                 RIOTBOX_CHECKPOINT_QUIET=1 \
                 bash "{{.riotbox_dir}}/libexec/checkpoint.sh" 2>&1)" && rc=0 || rc=$?
          echo "${out}"
          echo "rc=${rc}"
          [ "${rc}" -eq 0 ]

          # The managed block must be present
          exclude_path="${REPO_DIR}/.git/info/exclude"
          grep -q '>>> riotbox managed excludes' "${exclude_path}"

          # The SNAPSHOT tree must not contain the artifact files. Reading HEAD
          # here would be vacuous — the checkpoint never moves it.
          ref="$(git -C "${REPO_DIR}" for-each-ref --format='%(refname)' refs/riotbox/checkpoints)"
          echo "ref=${ref}"
          [ -n "${ref}" ]
          tree_out="$(git -C "${REPO_DIR}" ls-tree -r --name-only "${ref}")"
          echo "snapshot tree: ${tree_out}"
          if echo "${tree_out}" | grep -q '^\.headroom/'; then echo "FAIL: .headroom/ appeared in the snapshot"; exit 1; fi
          if echo "${tree_out}" | grep -qx 'venom\.log'; then echo "FAIL: venom.log appeared in the snapshot"; exit 1; fi
          # ...while the tracked source still is, so an over-broad exclude that
          # swallowed everything could not pass this case.
          echo "${tree_out}" | grep -qx 'main.go'

          echo "artifacts_excluded_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "artifacts_excluded_ok=true"

  # -- Idempotency: exactly one marker pair after two runs --

  - name: Running checkpoint twice leaves exactly one managed block
    steps:
      - type: exec
        script: |
          source "{{.helpers}}"
          init_test_repo
          trap 'rm -rf "${TEST_DIR}"' EXIT

          echo "src" > "${REPO_DIR}/main.go"
          git -C "${REPO_DIR}" add main.go
          GIT_AUTHOR_NAME="${HUMAN_NAME}" GIT_AUTHOR_EMAIL="${HUMAN_EMAIL}" \
          GIT_COMMITTER_NAME="${HUMAN_NAME}" GIT_COMMITTER_EMAIL="${HUMAN_EMAIL}" \
          git -C "${REPO_DIR}" commit -m "initial"

          # Run checkpoint twice. A sleep 1 between runs ensures the tag
          # timestamp differs so the second run never collides with the first.
          ROOT_DIR="{{.riotbox_dir}}" RIOTBOX_PROJECTS="${REPO_DIR}" \
            RIOTBOX_CHECKPOINT_QUIET=1 \
            bash "{{.riotbox_dir}}/libexec/checkpoint.sh" >/dev/null 2>&1
          sleep 1
          ROOT_DIR="{{.riotbox_dir}}" RIOTBOX_PROJECTS="${REPO_DIR}" \
            RIOTBOX_CHECKPOINT_QUIET=1 \
            bash "{{.riotbox_dir}}/libexec/checkpoint.sh" >/dev/null 2>&1

          exclude_path="${REPO_DIR}/.git/info/exclude"
          marker_count="$(grep -c '>>> riotbox managed excludes' "${exclude_path}")"
          echo "marker_count=${marker_count}"
          [ "${marker_count}" -eq 1 ]

          echo "idempotent_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "marker_count=1"
          - result.systemout ShouldContainSubstring "idempotent_ok=true"

  # -- User content outside markers is preserved; stale list is replaced --

  - name: User lines outside markers survive; stale managed block is replaced
    steps:
      - type: exec
        script: |
          source "{{.helpers}}"
          init_test_repo
          trap 'rm -rf "${TEST_DIR}"' EXIT

          echo "src" > "${REPO_DIR}/main.go"
          git -C "${REPO_DIR}" add main.go
          GIT_AUTHOR_NAME="${HUMAN_NAME}" GIT_AUTHOR_EMAIL="${HUMAN_EMAIL}" \
          GIT_COMMITTER_NAME="${HUMAN_NAME}" GIT_COMMITTER_EMAIL="${HUMAN_EMAIL}" \
          git -C "${REPO_DIR}" commit -m "initial"

          # Pre-seed a stale managed block with an obsolete pattern.
          # Use printf to avoid heredoc indentation contaminating the file.
          mkdir -p "${REPO_DIR}/.git/info"
          printf '%s\n' \
            '# user'"'"'s own line' \
            'mystuff/' \
            '# >>> riotbox managed excludes (do not edit between markers) >>>' \
            'old-pattern/' \
            '# <<< riotbox managed excludes <<<' \
            > "${REPO_DIR}/.git/info/exclude"

          ROOT_DIR="{{.riotbox_dir}}" RIOTBOX_PROJECTS="${REPO_DIR}" \
            RIOTBOX_CHECKPOINT_QUIET=1 \
            bash "{{.riotbox_dir}}/libexec/checkpoint.sh" >/dev/null 2>&1

          exclude_path="${REPO_DIR}/.git/info/exclude"

          # User line must survive
          grep -q 'mystuff/' "${exclude_path}"

          # Old pattern must be gone
          if grep -q 'old-pattern/' "${exclude_path}"; then echo "FAIL: stale pattern survived"; exit 1; fi

          # New patterns must be present
          grep -q '\.headroom/' "${exclude_path}"
          grep -q 'venom\.log' "${exclude_path}"

          # Still only one marker pair
          marker_count="$(grep -c '>>> riotbox managed excludes' "${exclude_path}")"
          [ "${marker_count}" -eq 1 ]

          echo "stale_replaced_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "stale_replaced_ok=true"

  # -- Already-tracked file keeps being tracked (exclude != rm --cached) --

  - name: Tracked .claude/settings.local.json is still checkpointed after exclude injection
    steps:
      - type: exec
        script: |
          source "{{.helpers}}"
          init_test_repo
          trap 'rm -rf "${TEST_DIR}"' EXIT

          # Commit .claude/settings.local.json so it is tracked
          mkdir -p "${REPO_DIR}/.claude"
          echo '{"version":1}' > "${REPO_DIR}/.claude/settings.local.json"
          git -C "${REPO_DIR}" add .claude/settings.local.json
          GIT_AUTHOR_NAME="${HUMAN_NAME}" GIT_AUTHOR_EMAIL="${HUMAN_EMAIL}" \
          GIT_COMMITTER_NAME="${HUMAN_NAME}" GIT_COMMITTER_EMAIL="${HUMAN_EMAIL}" \
          git -C "${REPO_DIR}" commit -m "initial"

          # Modify the tracked file — checkpoint must capture the change
          echo '{"version":2}' > "${REPO_DIR}/.claude/settings.local.json"

          out="$(ROOT_DIR="{{.riotbox_dir}}" RIOTBOX_PROJECTS="${REPO_DIR}" \
                 RIOTBOX_CHECKPOINT_QUIET=1 \
                 bash "{{.riotbox_dir}}/libexec/checkpoint.sh" 2>&1)" && rc=0 || rc=$?
          echo "${out}"
          echo "rc=${rc}"
          [ "${rc}" -eq 0 ]

          # The snapshot must carry the file at its NEW content: an exclude
          # pattern must not stop an already-tracked file from being captured.
          ref="$(git -C "${REPO_DIR}" for-each-ref --format='%(refname)' refs/riotbox/checkpoints)"
          echo "ref=${ref}"
          [ -n "${ref}" ]
          # A modified tracked file makes the snapshot a NEW commit, so this is
          # reading the snapshot's tree and not HEAD's.
          [ "$(git -C "${REPO_DIR}" rev-parse "${ref}")" != "$(git -C "${REPO_DIR}" rev-parse HEAD)" ]
          content="$(git -C "${REPO_DIR}" show "${ref}:.claude/settings.local.json")"
          echo "snapshot content: ${content}"
          [ "${content}" = '{"version":2}' ]

          echo "tracked_file_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "tracked_file_ok=true"

  # -- Unclosed managed block (corrupt state): warn, preserve user content --

  - name: Unclosed managed block warns and preserves user content
    steps:
      - type: exec
        script: |
          source "{{.helpers}}"
          init_test_repo
          trap 'rm -rf "${TEST_DIR}"' EXIT

          echo "src" > "${REPO_DIR}/main.go"
          git -C "${REPO_DIR}" add main.go
          GIT_AUTHOR_NAME="${HUMAN_NAME}" GIT_AUTHOR_EMAIL="${HUMAN_EMAIL}" \
          GIT_COMMITTER_NAME="${HUMAN_NAME}" GIT_COMMITTER_EMAIL="${HUMAN_EMAIL}" \
          git -C "${REPO_DIR}" commit -m "initial"

          # Seed exclude with open marker but NO close marker — corrupt state.
          mkdir -p "${REPO_DIR}/.git/info"
          printf '%s\n' \
            '# >>> riotbox managed excludes (do not edit between markers) >>>' \
            'user-line-after-open-marker/' \
            > "${REPO_DIR}/.git/info/exclude"

          err="$(ROOT_DIR="{{.riotbox_dir}}" RIOTBOX_PROJECTS="${REPO_DIR}" \
                 RIOTBOX_CHECKPOINT_QUIET=1 \
                 bash "{{.riotbox_dir}}/libexec/checkpoint.sh" 2>&1 >/dev/null)" || true

          exclude_path="${REPO_DIR}/.git/info/exclude"

          # User line must survive — function must NOT destroy content
          grep -q 'user-line-after-open-marker/' "${exclude_path}" \
            || { echo "FAIL: user line was destroyed"; exit 1; }

          # A warning must have been emitted to stderr
          echo "stderr=${err}"
          printf '%s\n' "${err}" | grep -qi "warning" \
            || { echo "FAIL: no warning emitted for unclosed block"; exit 1; }

          # No new block should have been appended (skip means skip)
          open_count="$(grep -c '>>> riotbox managed excludes' "${exclude_path}")"
          [ "${open_count}" -eq 1 ] \
            || { echo "FAIL: block appended after skip — open_count=${open_count}"; exit 1; }

          echo "unclosed_block_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "unclosed_block_ok=true"

  # -- Substring marker does not block installation --

  - name: A user line merely containing the marker text does not block installation
    steps:
      - type: exec
        script: |
          source "{{.helpers}}"
          init_test_repo
          trap 'rm -rf "${TEST_DIR}"' EXIT

          echo "src" > "${REPO_DIR}/main.go"
          git -C "${REPO_DIR}" add main.go
          GIT_AUTHOR_NAME="${HUMAN_NAME}" GIT_AUTHOR_EMAIL="${HUMAN_EMAIL}" \
          GIT_COMMITTER_NAME="${HUMAN_NAME}" GIT_COMMITTER_EMAIL="${HUMAN_EMAIL}" \
          git -C "${REPO_DIR}" commit -m "initial"

          # Seed exclude with a line that CONTAINS the open marker text as a
          # substring but is NOT the exact marker line (has trailing " for details").
          # grep -qF matches this as a substring; awk $0==marker does not — so
          # without the fix the replace path fires but awk matches nothing, the
          # block is silently never installed.
          mkdir -p "${REPO_DIR}/.git/info"
          printf '%s\n' \
            '# >>> riotbox managed excludes (do not edit between markers) >>> for details' \
            > "${REPO_DIR}/.git/info/exclude"

          ROOT_DIR="{{.riotbox_dir}}" RIOTBOX_PROJECTS="${REPO_DIR}" \
            RIOTBOX_CHECKPOINT_QUIET=1 \
            bash "{{.riotbox_dir}}/libexec/checkpoint.sh" >/dev/null 2>&1

          exclude_path="${REPO_DIR}/.git/info/exclude"

          # The managed block must have been installed (append path, not replace)
          grep -q '>>> riotbox managed excludes (do not edit between markers) >>>' "${exclude_path}" \
            || { echo "FAIL: managed block not installed"; exit 1; }
          grep -q '\.headroom/' "${exclude_path}" \
            || { echo "FAIL: .headroom/ pattern missing from block"; exit 1; }

          # The user's substring-containing line must survive
          grep -q '# >>> riotbox managed excludes.*for details' "${exclude_path}" \
            || { echo "FAIL: user substring line was destroyed"; exit 1; }

          echo "substring_marker_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "substring_marker_ok=true"

  # -- Non-git directory: silent no-op, no error --

  - name: Duplicate open marker after a valid block warns and preserves trailing content
    steps:
      - type: exec
        script: |
          source "{{.helpers}}"
          init_test_repo
          trap 'rm -rf "${TEST_DIR}"' EXIT

          echo "src" > "${REPO_DIR}/main.go"
          git -C "${REPO_DIR}" add main.go
          GIT_AUTHOR_NAME="${HUMAN_NAME}" GIT_AUTHOR_EMAIL="${HUMAN_EMAIL}" \
          GIT_COMMITTER_NAME="${HUMAN_NAME}" GIT_COMMITTER_EMAIL="${HUMAN_EMAIL}" \
          git -C "${REPO_DIR}" commit -m "initial"

          # Seed a valid block followed by a stray duplicate open marker and a
          # user line. The rewrite must not re-enter the block at the second
          # open and eat the user line to EOF.
          mkdir -p "${REPO_DIR}/.git/info"
          printf '%s\n' \
            '# >>> riotbox managed excludes (do not edit between markers) >>>' \
            'stale-pattern/' \
            '# <<< riotbox managed excludes <<<' \
            '# >>> riotbox managed excludes (do not edit between markers) >>>' \
            'user-after-second-open/' \
            > "${REPO_DIR}/.git/info/exclude"

          err="$(ROOT_DIR="{{.riotbox_dir}}" RIOTBOX_PROJECTS="${REPO_DIR}" \
                 RIOTBOX_CHECKPOINT_QUIET=1 \
                 bash "{{.riotbox_dir}}/libexec/checkpoint.sh" 2>&1 >/dev/null)" || true

          exclude_path="${REPO_DIR}/.git/info/exclude"

          grep -q 'user-after-second-open/' "${exclude_path}" \
            || { echo "FAIL: trailing user line was destroyed"; exit 1; }

          echo "stderr=${err}"
          printf '%s\n' "${err}" | grep -qi "warning" \
            || { echo "FAIL: no warning emitted for duplicate open marker"; exit 1; }

          echo "duplicate_open_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "duplicate_open_ok=true"

  - name: Orphan close before an unclosed open warns and preserves all user content
    steps:
      - type: exec
        script: |
          source "{{.helpers}}"
          init_test_repo
          trap 'rm -rf "${TEST_DIR}"' EXIT

          echo "src" > "${REPO_DIR}/main.go"
          git -C "${REPO_DIR}" add main.go
          GIT_AUTHOR_NAME="${HUMAN_NAME}" GIT_AUTHOR_EMAIL="${HUMAN_EMAIL}" \
          GIT_COMMITTER_NAME="${HUMAN_NAME}" GIT_COMMITTER_EMAIL="${HUMAN_EMAIL}" \
          git -C "${REPO_DIR}" commit -m "initial"

          # Both markers exist, but the close precedes the open and the open is
          # never closed. A count-based probe calls this "both present"; the
          # rewrite would still eat everything after the open. Must warn+skip.
          mkdir -p "${REPO_DIR}/.git/info"
          printf '%s\n' \
            '# <<< riotbox managed excludes <<<' \
            'user-line-one/' \
            '# >>> riotbox managed excludes (do not edit between markers) >>>' \
            'user-line-two/' \
            > "${REPO_DIR}/.git/info/exclude"

          err="$(ROOT_DIR="{{.riotbox_dir}}" RIOTBOX_PROJECTS="${REPO_DIR}" \
                 RIOTBOX_CHECKPOINT_QUIET=1 \
                 bash "{{.riotbox_dir}}/libexec/checkpoint.sh" 2>&1 >/dev/null)" || true

          exclude_path="${REPO_DIR}/.git/info/exclude"

          grep -q 'user-line-one/' "${exclude_path}" \
            || { echo "FAIL: user-line-one was destroyed"; exit 1; }
          grep -q 'user-line-two/' "${exclude_path}" \
            || { echo "FAIL: user-line-two was destroyed"; exit 1; }

          echo "stderr=${err}"
          printf '%s\n' "${err}" | grep -qi "warning" \
            || { echo "FAIL: no warning emitted for malformed block"; exit 1; }

          echo "orphan_close_ordering_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "orphan_close_ordering_ok=true"

  - name: Non-git directory produces no exclude file and no error
    steps:
      - type: exec
        script: |
          source "{{.helpers}}"
          init_test_workdir
          trap 'rm -rf "${TEST_DIR}"' EXIT

          echo "code" > "${WORK_DIR}/main.go"

          out="$(ROOT_DIR="{{.riotbox_dir}}" RIOTBOX_PROJECTS="${WORK_DIR}" \
                 RIOTBOX_GIT_INIT=0 \
                 bash "{{.riotbox_dir}}/libexec/checkpoint.sh" 2>&1)" && rc=0 || rc=$?
          echo "${out}"
          echo "rc=${rc}"
          [ "${rc}" -eq 0 ]

          # No .git/info/exclude file should have been created
          if [ -f "${WORK_DIR}/.git/info/exclude" ]; then
            echo "FAIL: exclude file appeared in non-git dir"
            exit 1
          fi

          echo "nongit_noop_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "nongit_noop_ok=true"

  # -- Bulk dependency and build trees --
  #
  # An unignored node_modules cost 3412 ms and an 83 MB backup per launch, on
  # every launch, for content that is reproducible from a lockfile.
  - name: Untracked dependency and build trees are kept out of the snapshot
    steps:
      - type: exec
        script: |
          source "{{.helpers}}"
          init_test_repo
          trap 'rm -rf "${TEST_DIR}"' EXIT

          echo "src" > "${REPO_DIR}/main.go"
          git -C "${REPO_DIR}" add main.go
          GIT_AUTHOR_NAME="${HUMAN_NAME}" GIT_AUTHOR_EMAIL="${HUMAN_EMAIL}" \
          GIT_COMMITTER_NAME="${HUMAN_NAME}" GIT_COMMITTER_EMAIL="${HUMAN_EMAIL}" \
          git -C "${REPO_DIR}" commit -m "initial"

          # One file per pattern class in the bulk group.
          bulk="node_modules/left-pad/index.js
          .venv/lib/site.py
          venv/lib/site.py
          __pycache__/mod.cpython-312.pyc
          target/debug/app
          .next/cache/chunk.js
          .nuxt/dist/app.js
          vendor/github.com/x/y.go
          .gradle/caches/journal.bin
          .m2/repository/pom.sha1
          Pods/Alamofire/Source.swift
          .terraform/providers/lock
          riotbox.egg-info/PKG-INFO
          .pytest_cache/v/lastfailed
          .mypy_cache/3.12/mod.json
          .ruff_cache/content"
          while IFS= read -r rel; do
            rel="$(printf '%s' "${rel}" | sed 's/^ *//')"
            mkdir -p "${REPO_DIR}/$(dirname "${rel}")"
            echo "bulk bytes" > "${REPO_DIR}/${rel}"
          done <<< "${bulk}"

          # Prove the fixture: without the managed block every one of these
          # would be swept in, so the assertions below are not vacuous. Run the
          # probe against a pristine exclude file — the block is injected by the
          # checkpoint run that has not happened yet.
          before="$(git -C "${REPO_DIR}" ls-files --others --exclude-standard)"
          while IFS= read -r rel; do
            rel="$(printf '%s' "${rel}" | sed 's/^ *//')"
            printf '%s\n' "${before}" | grep -qxF "${rel}" || {
              echo "FIXTURE INVALID: ${rel} is not an untracked candidate before the run — the exclusion assertion would be vacuous" >&2
              exit 1
            }
          done <<< "${bulk}"

          out="$(ROOT_DIR="{{.riotbox_dir}}" RIOTBOX_PROJECTS="${REPO_DIR}" \
                 RIOTBOX_CHECKPOINT_QUIET=1 \
                 bash "{{.riotbox_dir}}/libexec/checkpoint.sh" 2>&1)" && rc=0 || rc=$?
          echo "${out}"; echo "rc=${rc}"
          [ "${rc}" -eq 0 ]

          ref="$(git -C "${REPO_DIR}" for-each-ref --format='%(refname)' refs/riotbox/checkpoints)"
          [ -n "${ref}" ]
          tree_out="$(git -C "${REPO_DIR}" ls-tree -r --name-only "${ref}")"
          echo "snapshot tree: ${tree_out}"
          while IFS= read -r rel; do
            rel="$(printf '%s' "${rel}" | sed 's/^ *//')"
            if printf '%s\n' "${tree_out}" | grep -qxF "${rel}"; then
              echo "FAIL: ${rel} appeared in the snapshot"; exit 1
            fi
          done <<< "${bulk}"
          # ...and the ordinary source file still is, so an exclude that
          # swallowed the whole tree could not pass this case.
          printf '%s\n' "${tree_out}" | grep -qx 'main.go'

          echo "bulk_excluded_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "bulk_excluded_ok=true"
          - result.systemerr ShouldNotContainSubstring "FIXTURE INVALID"

  # -- Secrets the project forgot to gitignore --
  #
  # A snapshot is pushed to the off-host backup, so an ungitignored .env.local
  # or stray *.pem gets copied out of the project on every launch.
  - name: Untracked secret files are kept out of the snapshot
    steps:
      - type: exec
        script: |
          source "{{.helpers}}"
          init_test_repo
          trap 'rm -rf "${TEST_DIR}"' EXIT

          echo "src" > "${REPO_DIR}/main.go"
          git -C "${REPO_DIR}" add main.go
          GIT_AUTHOR_NAME="${HUMAN_NAME}" GIT_AUTHOR_EMAIL="${HUMAN_EMAIL}" \
          GIT_COMMITTER_NAME="${HUMAN_NAME}" GIT_COMMITTER_EMAIL="${HUMAN_EMAIL}" \
          git -C "${REPO_DIR}" commit -m "initial"

          secrets=".env
          .env.local
          certs/server.pem
          certs/server.key
          .ssh/id_rsa
          .ssh/id_rsa.pub
          .ssh/id_ed25519
          .npmrc
          .netrc
          certs/bundle.p12
          certs/bundle.pfx"
          while IFS= read -r rel; do
            rel="$(printf '%s' "${rel}" | sed 's/^ *//')"
            mkdir -p "${REPO_DIR}/$(dirname "${rel}")"
            echo "SUPER-SECRET-TOKEN" > "${REPO_DIR}/${rel}"
          done <<< "${secrets}"

          # Prove the fixture: each of these is an untracked candidate before
          # the managed block exists, so the assertions below are not vacuous.
          before="$(git -C "${REPO_DIR}" ls-files --others --exclude-standard)"
          while IFS= read -r rel; do
            rel="$(printf '%s' "${rel}" | sed 's/^ *//')"
            printf '%s\n' "${before}" | grep -qxF "${rel}" || {
              echo "FIXTURE INVALID: ${rel} is not an untracked candidate before the run — the exclusion assertion would be vacuous" >&2
              exit 1
            }
          done <<< "${secrets}"

          out="$(ROOT_DIR="{{.riotbox_dir}}" RIOTBOX_PROJECTS="${REPO_DIR}" \
                 RIOTBOX_CHECKPOINT_QUIET=1 \
                 bash "{{.riotbox_dir}}/libexec/checkpoint.sh" 2>&1)" && rc=0 || rc=$?
          echo "${out}"; echo "rc=${rc}"
          [ "${rc}" -eq 0 ]

          ref="$(git -C "${REPO_DIR}" for-each-ref --format='%(refname)' refs/riotbox/checkpoints)"
          [ -n "${ref}" ]
          tree_out="$(git -C "${REPO_DIR}" ls-tree -r --name-only "${ref}")"
          echo "snapshot tree: ${tree_out}"
          while IFS= read -r rel; do
            rel="$(printf '%s' "${rel}" | sed 's/^ *//')"
            if printf '%s\n' "${tree_out}" | grep -qxF "${rel}"; then
              echo "FAIL: ${rel} appeared in the snapshot"; exit 1
            fi
          done <<< "${secrets}"
          printf '%s\n' "${tree_out}" | grep -qx 'main.go'

          # The backup is the copy that leaves the project directory entirely.
          backup="$(backup_path "${REPO_DIR}")"
          if git -C "${backup}" grep -q 'SUPER-SECRET-TOKEN' "${ref}" -- 2>/dev/null; then
            echo "FAIL: secret content reached the off-host backup"; exit 1
          fi

          echo "secrets_excluded_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "secrets_excluded_ok=true"
          - result.systemerr ShouldNotContainSubstring "FIXTURE INVALID"

  # -- The property that makes an aggressive pattern list safe --
  #
  # Exclude patterns govern UNTRACKED files only. A Go project that vendors its
  # dependencies, or one that deliberately commits a .env template, must keep
  # getting those files snapshotted WITH their edits — otherwise the patterns
  # above would silently drop committed work out of the safety net.
  - name: Tracked files matching bulk and secret patterns are still captured with their edits
    steps:
      - type: exec
        script: |
          source "{{.helpers}}"
          init_test_repo
          trap 'rm -rf "${TEST_DIR}"' EXIT

          mkdir -p "${REPO_DIR}/vendor/github.com/x"
          echo "package x // v1" > "${REPO_DIR}/vendor/github.com/x/y.go"
          echo "TOKEN=v1" > "${REPO_DIR}/.env"
          git -C "${REPO_DIR}" add vendor/github.com/x/y.go .env
          GIT_AUTHOR_NAME="${HUMAN_NAME}" GIT_AUTHOR_EMAIL="${HUMAN_EMAIL}" \
          GIT_COMMITTER_NAME="${HUMAN_NAME}" GIT_COMMITTER_EMAIL="${HUMAN_EMAIL}" \
          git -C "${REPO_DIR}" commit -m "initial"

          # Edit both — the snapshot must carry the NEW content.
          echo "package x // v2" > "${REPO_DIR}/vendor/github.com/x/y.go"
          echo "TOKEN=v2" > "${REPO_DIR}/.env"

          out="$(ROOT_DIR="{{.riotbox_dir}}" RIOTBOX_PROJECTS="${REPO_DIR}" \
                 RIOTBOX_CHECKPOINT_QUIET=1 \
                 bash "{{.riotbox_dir}}/libexec/checkpoint.sh" 2>&1)" && rc=0 || rc=$?
          echo "${out}"; echo "rc=${rc}"
          [ "${rc}" -eq 0 ]

          # Prove the fixture: the patterns really do cover these two paths.
          # If `vendor/` or `.env` were dropped from _MANAGED_BLOCK the files
          # would still be captured — for the wrong reason — and this case
          # would go green while defending nothing. --no-index is required:
          # check-ignore refuses to report on tracked paths without it.
          for rel in vendor/github.com/x/y.go .env; do
            git -C "${REPO_DIR}" check-ignore --no-index -q "${rel}" || {
              echo "FIXTURE INVALID: ${rel} is not matched by any exclude pattern — this case would pass without testing anything" >&2
              exit 1
            }
          done

          ref="$(git -C "${REPO_DIR}" for-each-ref --format='%(refname)' refs/riotbox/checkpoints)"
          [ -n "${ref}" ]
          # Modified tracked files make the snapshot a NEW commit, so these read
          # the snapshot's own tree rather than HEAD's.
          [ "$(git -C "${REPO_DIR}" rev-parse "${ref}")" != "$(git -C "${REPO_DIR}" rev-parse HEAD)" ]
          [ "$(git -C "${REPO_DIR}" show "${ref}:vendor/github.com/x/y.go")" = "package x // v2" ]
          [ "$(git -C "${REPO_DIR}" show "${ref}:.env")" = "TOKEN=v2" ]

          echo "tracked_survives_patterns_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "tracked_survives_patterns_ok=true"
          - result.systemerr ShouldNotContainSubstring "FIXTURE INVALID"

  - name: Checkpoint commit omits .codegraph/ when exclude block is injected
    steps:
      - type: exec
        script: |
          source "{{.helpers}}"
          init_test_repo
          trap 'rm -rf "${TEST_DIR}"' EXIT

          echo "src" > "${REPO_DIR}/main.go"
          git -C "${REPO_DIR}" add main.go
          GIT_AUTHOR_NAME="${HUMAN_NAME}" GIT_AUTHOR_EMAIL="${HUMAN_EMAIL}" \
          GIT_COMMITTER_NAME="${HUMAN_NAME}" GIT_COMMITTER_EMAIL="${HUMAN_EMAIL}" \
          git -C "${REPO_DIR}" commit -m "initial"

          # A CodeGraph index whose self-written .gitignore has been removed —
          # the managed block is the only thing keeping it out of the commit.
          mkdir -p "${REPO_DIR}/.codegraph"
          echo "index bytes" > "${REPO_DIR}/.codegraph/codegraph.db"

          out="$(ROOT_DIR="{{.riotbox_dir}}" RIOTBOX_PROJECTS="${REPO_DIR}" \
                 RIOTBOX_CHECKPOINT_QUIET=1 \
                 bash "{{.riotbox_dir}}/libexec/checkpoint.sh" 2>&1)" && rc=0 || rc=$?
          echo "${out}"
          echo "rc=${rc}"
          [ "${rc}" -eq 0 ]

          exclude_path="${REPO_DIR}/.git/info/exclude"
          grep -q '>>> riotbox managed excludes' "${exclude_path}"

          # Assert against the SNAPSHOT tree; HEAD never moves, so reading it
          # here would be vacuous.
          ref="$(git -C "${REPO_DIR}" for-each-ref --format='%(refname)' refs/riotbox/checkpoints)"
          echo "ref=${ref}"
          [ -n "${ref}" ]
          tree_out="$(git -C "${REPO_DIR}" ls-tree -r --name-only "${ref}")"
          echo "snapshot tree: ${tree_out}"
          if echo "${tree_out}" | grep -q '^\.codegraph/'; then
            echo "FAIL: .codegraph/ appeared in the snapshot"; exit 1
          fi
          echo "${tree_out}" | grep -qx 'main.go'

          echo "codegraph_excluded_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "codegraph_excluded_ok=true"
