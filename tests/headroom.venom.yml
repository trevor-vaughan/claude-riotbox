name: headroom interposition — wrapper gate, guard, and fallbacks
vars:
  root: "."
  riotbox_dir: "{{.root}}"
  shared_helpers: "{{.root}}/tests/lib/wrapper-shared.sh"

# Pins the RIOTBOX_HEADROOM=1 interposition added to agent-wrapper.sh:
# first pass execs `headroom wrap ...` with the guard exported; second pass
# (guard set) takes the normal inject-and-exec path; missing verb or
# missing binary warn and run unwrapped. Gate off must be byte-identical
# to pre-feature behavior.

testcases:
  - name: every build-time kompress preload disables the startup canary
    steps:
      - type: exec
        script: |
          cd "{{.riotbox_dir}}"
          # KompressCompressor.preload() spawns a daemon thread that runs an
          # ONNX canary inference and returns without joining it. In a
          # long-lived proxy that is the point. In a one-shot `python3 -c`
          # that warms the model cache, the interpreter exits immediately
          # after preload() returns and tears down under a daemon thread
          # still inside native ORT code — glibc aborts the process with
          # "FATAL: exception not rethrown" and exit 134. It is a race, so a
          # missing opt-out fails the image build only sometimes, which is
          # worse than never. HEADROOM_KOMPRESS_CANARY_SECONDS=0 is
          # upstream's documented off switch (<=0 disables it entirely).
          #
          # Rebuild logical commands before matching: the env prefix and the
          # preload() call sit on different physical lines. Two ways a command
          # spans lines here, and both must be handled or the check reports a
          # guarded call site as unguarded — the Containerfile uses backslash
          # continuations, while preflight.sh embeds a multi-line python3 -c
          # payload inside an open double quote.
          python3 - <<'PY'
          import sys
          FILES = ("Containerfile", "scripts/preflight.sh")
          ENV = "HEADROOM_KOMPRESS_CANARY_SECONDS=0"
          bad, seen = [], 0
          for path in FILES:
              with open(path) as fh:
                  joined, buf = [], ""
                  for line in fh:
                      line = line.rstrip("\n")
                      buf += line[:-1] + " " if line.endswith("\\") else line + " "
                      # Escaped quotes are data, not delimiters.
                      if line.endswith("\\") or buf.replace('\\"', "").count('"') % 2:
                          continue
                      joined.append(buf)
                      buf = ""
                  if buf:
                      joined.append(buf)
              # Split each logical command on && so a RUN chaining several
              # probes is checked per invocation. Guarding one preload and
              # not its sibling would otherwise pass.
              for cmd in joined:
                  for part in cmd.split("&&"):
                      if "KompressCompressor().preload(" not in part:
                          continue
                      seen += 1
                      if ENV not in part:
                          bad.append(f"{path}: {part.strip()[:120]}")
          if not seen:
              print("FAIL: found no preload call sites — did they move?")
              sys.exit(1)
          if bad:
              print(f"FAIL: {len(bad)} preload call site(s) without {ENV}:")
              for b in bad:
                  print("  " + b)
              sys.exit(1)
          print(f"CANARY_OK ({seen} call sites guarded)")
          PY
          # The opt-out must stay scoped to those build-time probes. Baking it
          # in as an image-wide ENV would also disable the canary for the
          # session proxy, where a degraded ONNX runtime is exactly what it is
          # there to catch.
          grep -qE '^\s*ENV\s+HEADROOM_KOMPRESS_CANARY_SECONDS' Containerfile \
            && { echo "FAIL: canary disabled image-wide; the session proxy needs it" >&2; exit 1; }
          echo "SCOPE_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "CANARY_OK"
          - result.systemout ShouldContainSubstring "SCOPE_OK"

  - name: gate off — wrapper behavior is unchanged and headroom is never invoked
    steps:
      - type: exec
        script: |
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.shared_helpers}}"
          setup_wrapper_sandbox claude
          trap 'rm -rf "${TEST_DIR}"' EXIT
          install_generic_wrapper_for claude
          # A fake headroom that would loudly announce itself if (wrongly) used.
          cat > "${TEST_DIR}/realbin/headroom" <<'FAKE'
          #!/usr/bin/env bash
          echo "FAKE_HEADROOM_INVOKED"
          FAKE
          chmod +x "${TEST_DIR}/realbin/headroom"
          unset RIOTBOX_HEADROOM RIOTBOX_HEADROOM_ACTIVE
          claude -p "do work"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "FAKE_REAL_claude_INVOKED"
          - result.systemout ShouldContainSubstring "arg=--dangerously-skip-permissions"
          - result.systemout ShouldNotContainSubstring "FAKE_HEADROOM_INVOKED"

  - name: gate on for claude — wrapper execs the proxy helper with the guard and memory path exported
    steps:
      - type: exec
        script: |
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.shared_helpers}}"
          setup_wrapper_sandbox claude
          trap 'rm -rf "${TEST_DIR}"' EXIT
          install_generic_wrapper_for claude
          cat > "${TEST_DIR}/realbin/headroom" <<'FAKE'
          #!/usr/bin/env bash
          echo "FAKE_HEADROOM_INVOKED"
          FAKE
          chmod +x "${TEST_DIR}/realbin/headroom"
          # Recorder in place of the copied helper: the wrapper must exec it,
          # never `headroom wrap claude`, which writes .claude/settings.local.json
          # and a SessionStart hook into the CWD (the caller's checkout).
          cat > "${TEST_DIR}/home/.riotbox/agents/claude/headroom-exec.sh" <<'REC'
          #!/usr/bin/env bash
          echo "FAKE_HELPER_INVOKED"
          echo "HR_GUARD=${RIOTBOX_HEADROOM_ACTIVE:-unset}"
          echo "HR_MEMDB=${HEADROOM_MEMORY_DB_PATH:-unset}"
          printf 'helperarg=%s\n' "$@"
          REC
          chmod +x "${TEST_DIR}/home/.riotbox/agents/claude/headroom-exec.sh"
          export RIOTBOX_HEADROOM=1
          unset RIOTBOX_HEADROOM_ACTIVE HEADROOM_MEMORY_DB_PATH
          out="$(claude -p "do work")"
          echo "${out}"
          printf '%s\n' "${out}" | grep -qxF "HR_MEMDB=${HOME}/.headroom/memory.db" \
            || { echo "FAIL: HEADROOM_MEMORY_DB_PATH is not ~/.headroom/memory.db" >&2; exit 1; }
          echo "MEMDB_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "FAKE_HELPER_INVOKED"
          - result.systemout ShouldContainSubstring "HR_GUARD=1"
          - result.systemout ShouldContainSubstring "MEMDB_OK"
          - result.systemout ShouldContainSubstring "helperarg=-p"
          - result.systemout ShouldContainSubstring "helperarg=do work"
          - result.systemout ShouldNotContainSubstring "FAKE_REAL_claude_INVOKED"
          - result.systemout ShouldNotContainSubstring "FAKE_HEADROOM_INVOKED"

  - name: guard set — second pass skips headroom and execs the real binary
    steps:
      - type: exec
        script: |
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.shared_helpers}}"
          setup_wrapper_sandbox claude
          trap 'rm -rf "${TEST_DIR}"' EXIT
          install_generic_wrapper_for claude
          cat > "${TEST_DIR}/realbin/headroom" <<'FAKE'
          #!/usr/bin/env bash
          echo "FAKE_HEADROOM_INVOKED"
          FAKE
          chmod +x "${TEST_DIR}/realbin/headroom"
          export RIOTBOX_HEADROOM=1
          export RIOTBOX_HEADROOM_ACTIVE=1
          claude -p "do work"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "FAKE_REAL_claude_INVOKED"
          - result.systemout ShouldContainSubstring "arg=--dangerously-skip-permissions"
          - result.systemout ShouldNotContainSubstring "FAKE_HEADROOM_INVOKED"

  - name: full chain for claude — the helper re-launches the shim, which runs the real binary once
    steps:
      - type: exec
        script: |
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.shared_helpers}}"
          setup_wrapper_sandbox claude
          source "{{.riotbox_dir}}/tests/lib/headroom-fakes.sh"
          headroom_fakes_init
          trap 'kill_fakes; rm -rf "${TEST_DIR}"' EXIT
          unset CONTEXT_MODE_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED CONTEXT_MODE_DATA_DIR CONTEXT_MODE_PLATFORM HEADROOM_MEMORY_DB_PATH
          install_generic_wrapper_for claude
          # `headroom proxy` is an accept-once TCP listener; anything else
          # headroom is asked to do is logged, and `wrap` fails loudly.
          cat > "${TEST_DIR}/realbin/headroom" <<'FAKE'
          #!/usr/bin/env bash
          printf 'HR=%s\n' "$*" >>"${HOME}/headroom-calls.log"
          case "${1:-}" in
            proxy)
              port=8787 prev=""
              for a in "$@"; do [ "${prev}" = "--port" ] && port="${a}"; prev="${a}"; done
              exec python3 "${RIOTBOX_DIR}/tests/lib/fake-headroom-listener.py" "${port}" ;;
            mcp) exit 0 ;;
            *) echo "FAKE_HEADROOM_UNEXPECTED $*"; exit 3 ;;
          esac
          FAKE
          chmod +x "${TEST_DIR}/realbin/headroom"
          export RIOTBOX_HEADROOM=1
          unset RIOTBOX_HEADROOM_ACTIVE
          out="$(claude -p "do work" 2>&1)"
          echo "${out}"
          real_count="$(printf '%s\n' "${out}" | grep -c 'FAKE_REAL_claude_INVOKED' || true)"
          [ "${real_count}" = "1" ] || { echo "FAIL: real binary ran ${real_count} times" >&2; exit 1; }
          ! grep -q '^HR=wrap' "${HOME}/headroom-calls.log" || { echo "FAIL: headroom wrap was used" >&2; exit 1; }
          [ "$(grep -c '^HR=proxy' "${HOME}/headroom-calls.log")" = 1 ] || { echo "FAIL: proxy not started once" >&2; exit 1; }
          echo "CHAIN_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "CHAIN_OK"
          - result.systemout ShouldContainSubstring "arg=--dangerously-skip-permissions"
          - result.systemout ShouldContainSubstring "arg=do work"
          - result.systemout ShouldNotContainSubstring "FAKE_HEADROOM_UNEXPECTED"

  - name: simulated claude run leaves the project tree exactly as it was
    steps:
      - type: exec
        script: |
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.shared_helpers}}"
          setup_wrapper_sandbox claude
          source "{{.riotbox_dir}}/tests/lib/headroom-fakes.sh"
          headroom_fakes_init
          trap 'kill_fakes; rm -rf "${TEST_DIR}"' EXIT
          unset CONTEXT_MODE_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED CONTEXT_MODE_DATA_DIR CONTEXT_MODE_PLATFORM HEADROOM_MEMORY_DB_PATH
          install_generic_wrapper_for claude
          # Models where headroom 0.39.0 writes. The proxy keeps memory at
          # HEADROOM_MEMORY_DB_PATH, else $PWD/.headroom/memory.db
          # (proxy/server.py:1332-1336); `wrap claude` writes
          # .claude/settings.local.json and its lock in $PWD (cli/wrap.py:
          # 5253, 1672). ~/.headroom stands for the state-dir mount.
          cat > "${TEST_DIR}/realbin/headroom" <<'FAKE'
          #!/usr/bin/env bash
          case "${1:-}" in
            proxy)
              db="${HEADROOM_MEMORY_DB_PATH:-${PWD}/.headroom/memory.db}"
              mkdir -p "${db%/*}"; touch "${db}"
              port=8787 prev=""
              for a in "$@"; do [ "${prev}" = "--port" ] && port="${a}"; prev="${a}"; done
              exec python3 "${RIOTBOX_DIR}/tests/lib/fake-headroom-listener.py" "${port}" ;;
            wrap)
              mkdir -p .claude; echo '{}' > .claude/settings.local.json; : > .claude/.headroom_wrap_settings.lock
              while [ "$#" -gt 0 ]; do a="$1"; shift; [ "${a}" = "--" ] && break; done
              exec claude "$@" ;;
            mcp) exit 0 ;;
          esac
          FAKE
          chmod +x "${TEST_DIR}/realbin/headroom"
          mkdir -p "${TEST_DIR}/proj/src"
          echo code > "${TEST_DIR}/proj/src/main.c"
          echo '# team' > "${TEST_DIR}/proj/CLAUDE.md"
          cd "${TEST_DIR}/proj"
          snap() { find . -printf '%p %y %m %s\n' | LC_ALL=C sort; find . -type f -exec sha256sum {} + | LC_ALL=C sort; }
          before="$(snap)"
          export RIOTBOX_HEADROOM=1
          unset RIOTBOX_HEADROOM_ACTIVE
          claude -p "do work"
          after="$(snap)"
          [ "${before}" = "${after}" ] || { echo "FAIL: the project changed" >&2; diff <(printf '%s\n' "${before}") <(printf '%s\n' "${after}") >&2; exit 1; }
          [ -f "${HOME}/.headroom/memory.db" ] || { echo "FAIL: no memory DB in the state dir" >&2; exit 1; }
          echo "PROJECT_UNTOUCHED"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "FAKE_REAL_claude_INVOKED"
          - result.systemout ShouldContainSubstring "PROJECT_UNTOUCHED"

  - name: agent without headroom_argv warns and runs unwrapped
    steps:
      - type: exec
        script: |
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.shared_helpers}}"
          setup_wrapper_sandbox opencode
          trap 'rm -rf "${TEST_DIR}"' EXIT
          install_generic_wrapper_for opencode
          # opencode gained a real headroom_argv verb; strip it from the
          # sandbox copy so this case still exercises the "agent without
          # headroom support" warning path.
          sed -i '/^agent_opencode_headroom_argv()/,/^}/d' \
            "${TEST_DIR}/home/.riotbox/agents/opencode/manifest.sh"
          cat > "${TEST_DIR}/realbin/headroom" <<'FAKE'
          #!/usr/bin/env bash
          echo "FAKE_HEADROOM_INVOKED"
          FAKE
          chmod +x "${TEST_DIR}/realbin/headroom"
          export RIOTBOX_HEADROOM=1
          unset RIOTBOX_HEADROOM_ACTIVE
          opencode run "do work" 2>"${TEST_DIR}/stderr"
          echo "--- stderr ---"
          cat "${TEST_DIR}/stderr"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "FAKE_REAL_opencode_INVOKED"
          - result.systemout ShouldNotContainSubstring "FAKE_HEADROOM_INVOKED"
          - result.systemout ShouldContainSubstring "no headroom support"

  - name: gate on for opencode — wrapper execs the proxy helper with the guard exported
    steps:
      - type: exec
        script: |
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.shared_helpers}}"
          setup_wrapper_sandbox opencode
          trap 'rm -rf "${TEST_DIR}"' EXIT
          install_generic_wrapper_for opencode
          # The wrapper requires headroom on PATH before interposing.
          cat > "${TEST_DIR}/realbin/headroom" <<'FAKE'
          #!/usr/bin/env bash
          echo "FAKE_HEADROOM_INVOKED"
          FAKE
          chmod +x "${TEST_DIR}/realbin/headroom"
          # Recorder in place of the copied helper: prove the wrapper execs
          # it with args + guard, without exercising proxy logic (that is
          # tests/headroom-opencode.venom.yml's job).
          cat > "${TEST_DIR}/home/.riotbox/agents/opencode/headroom-exec.sh" <<'REC'
          #!/usr/bin/env bash
          echo "FAKE_HELPER_INVOKED"
          echo "HR_GUARD=${RIOTBOX_HEADROOM_ACTIVE:-unset}"
          printf 'helperarg=%s\n' "$@"
          REC
          chmod +x "${TEST_DIR}/home/.riotbox/agents/opencode/headroom-exec.sh"
          export RIOTBOX_HEADROOM=1
          unset RIOTBOX_HEADROOM_ACTIVE
          opencode run "do work"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "FAKE_HELPER_INVOKED"
          - result.systemout ShouldContainSubstring "HR_GUARD=1"
          - result.systemout ShouldContainSubstring "helperarg=run"
          - result.systemout ShouldContainSubstring "helperarg=do work"
          # First pass must NOT reach the real binary or headroom directly.
          - result.systemout ShouldNotContainSubstring "FAKE_REAL_opencode_INVOKED"
          - result.systemout ShouldNotContainSubstring "FAKE_HEADROOM_INVOKED"

  - name: headroom binary missing warns, names riotbox update, runs unwrapped
    steps:
      - type: exec
        script: |
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.shared_helpers}}"
          setup_wrapper_sandbox claude
          trap 'rm -rf "${TEST_DIR}"' EXIT
          install_generic_wrapper_for claude
          # No fake headroom installed — command -v must miss.
          export RIOTBOX_HEADROOM=1
          unset RIOTBOX_HEADROOM_ACTIVE
          claude -p "do work" 2>"${TEST_DIR}/stderr"
          echo "--- stderr ---"
          cat "${TEST_DIR}/stderr"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "FAKE_REAL_claude_INVOKED"
          - result.systemout ShouldContainSubstring "not installed"
          - result.systemout ShouldContainSubstring "riotbox update"

  # ── Launch-side wiring (env passthrough + state-dir mount) ───────────────

  - name: launch.sh passes -e RIOTBOX_HEADROOM and the state mount when enabled
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"; trap 'rm -rf "${TMP}"' EXIT
          mkdir -p "${TMP}/etc" "${TMP}/xdg" "${TMP}/data" "${TMP}/proj"
          cat > "${TMP}/fake-cmd" <<'FAKE'
          #!/usr/bin/env bash
          printf '%s\n' "$*" > "${CAPTURE}"
          FAKE
          chmod +x "${TMP}/fake-cmd"
          export CAPTURE="${TMP}/argv"
          RIOTBOX_HEADROOM=1 \
          RIOTBOX_HEADROOM_PROXY_TIMEOUT=99 \
          RIOTBOX_DRY_RUN=1 \
          RIOTBOX_PROJECTS="${TMP}/proj" \
          RIOTBOX_DATA_DIR="${TMP}/data" \
          RIOTBOX_SYSCONF_DIR="${TMP}/etc" XDG_CONFIG_HOME="${TMP}/xdg" HOME="${TMP}" \
          ROOT_DIR="{{.riotbox_dir}}" CONTAINER_CMD="${TMP}/fake-cmd" IMAGE_NAME=riotbox \
            bash "{{.riotbox_dir}}/libexec/launch.sh" bash
          argv="$(cat "${CAPTURE}")"
          echo "ARGV=${argv}"
          echo "${argv}" | grep -q -- "-e RIOTBOX_HEADROOM=1" \
            || { echo "BAD: -e RIOTBOX_HEADROOM=1 missing" >&2; exit 1; }
          echo "${argv}" | grep -q -- "-e RIOTBOX_HEADROOM_PROXY_TIMEOUT=99" \
            || { echo "BAD: -e RIOTBOX_HEADROOM_PROXY_TIMEOUT=99 missing" >&2; exit 1; }
          echo "${argv}" | grep -q -- "headroom:/home/llm/.headroom:z" \
            || { echo "BAD: headroom state mount missing" >&2; exit 1; }
          echo "OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "OK"

  - name: launch.sh emits neither headroom env nor mount when the gate is off
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"; trap 'rm -rf "${TMP}"' EXIT
          mkdir -p "${TMP}/etc" "${TMP}/xdg" "${TMP}/data" "${TMP}/proj"
          cat > "${TMP}/fake-cmd" <<'FAKE'
          #!/usr/bin/env bash
          printf '%s\n' "$*" > "${CAPTURE}"
          FAKE
          chmod +x "${TMP}/fake-cmd"
          export CAPTURE="${TMP}/argv"
          # Gate-off means gate-off: shed any ambient headroom env (e.g. when
          # this suite itself runs inside a headroom-enabled riotbox session).
          unset RIOTBOX_HEADROOM RIOTBOX_HEADROOM_ACTIVE
          RIOTBOX_DRY_RUN=1 \
          RIOTBOX_PROJECTS="${TMP}/proj" \
          RIOTBOX_DATA_DIR="${TMP}/data" \
          RIOTBOX_SYSCONF_DIR="${TMP}/etc" XDG_CONFIG_HOME="${TMP}/xdg" HOME="${TMP}" \
          ROOT_DIR="{{.riotbox_dir}}" CONTAINER_CMD="${TMP}/fake-cmd" IMAGE_NAME=riotbox \
            bash "{{.riotbox_dir}}/libexec/launch.sh" bash
          argv="$(cat "${CAPTURE}")"
          echo "ARGV=${argv}"
          echo "${argv}" | grep -q "RIOTBOX_HEADROOM" \
            && { echo "BAD: headroom env leaked into default launch" >&2; exit 1; }
          echo "${argv}" | grep -q "/home/llm/.headroom" \
            && { echo "BAD: headroom mount leaked into default launch" >&2; exit 1; }
          echo "OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "OK"

  - name: riotbox mounts includes the headroom mount when config-persisted
    steps:
      - type: exec
        script: |
          # Choice: invoke mount-projects.sh directly with RIOTBOX_DRY_RUN=1.
          # The wrapper-test-helpers harness stubs mount-projects.sh entirely,
          # so testing via `riotbox mounts` would never exercise the real script.
          # Invoking the real script in dry-run mode is the strongest honest test:
          # it runs the actual headroom gate code and reports what would be mounted,
          # without creating any session directories.
          set -euo pipefail
          TMP="$(mktemp -d)"; trap 'rm -rf "${TMP}"' EXIT
          mkdir -p "${TMP}/xdg/riotbox" "${TMP}/etc" "${TMP}/proj"
          printf ': "${RIOTBOX_HEADROOM:=1}"\n' > "${TMP}/xdg/riotbox/config"
          unset RIOTBOX_HEADROOM
          export XDG_CONFIG_HOME="${TMP}/xdg"
          export RIOTBOX_SYSCONF_DIR="${TMP}/etc"
          export RIOTBOX_DRY_RUN=1
          export RIOTBOX_PROJECTS="${TMP}/proj"
          export ROOT_DIR="{{.riotbox_dir}}"
          export CONTAINER_CMD=podman
          out="$(bash "{{.riotbox_dir}}/scripts/mount-projects.sh" --format=triple 2>&1)"
          echo "${out}"
          echo "${out}" | grep -q "/home/llm/.headroom" \
            || { echo "BAD: headroom mount missing from config-persisted output" >&2; exit 1; }
          echo "OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "/home/llm/.headroom"
          - result.systemout ShouldContainSubstring "OK"

  - name: headroom state dir is created under the state dir on a real (non-dry) setup
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          TMP="$(mktemp -d)"; trap 'rm -rf "${TMP}"' EXIT
          mkdir -p "${TMP}/proj" "${TMP}/data"
          export HOME="${TMP}"
          unset CONTEXT_MODE_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED CONTEXT_MODE_DATA_DIR CONTEXT_MODE_PLATFORM
          # setup_projects runs agent host_sync hooks, which want a host
          # ~/.claude; give it an empty one so claude's sync is a no-op.
          mkdir -p "${TMP}/.claude"
          export RIOTBOX_HEADROOM=1
          # resolve_projects derives both the session and the state dir from
          # XDG_DATA_HOME; a bare RIOTBOX_DATA_DIR would be ignored.
          export XDG_DATA_HOME="${TMP}/data"
          export ROOT_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/scripts/mount-projects.sh"
          setup_projects "${TMP}/proj"
          dir="${RIOTBOX_STATE_DIR}/headroom"
          [ -d "${dir}" ] || { echo "BAD: no headroom dir under the state dir" >&2; exit 1; }
          [ ! -e "${RIOTBOX_SESSION_DIR}/headroom" ] || { echo "BAD: headroom dir created inside the session dir" >&2; exit 1; }
          echo "PROJECT_VOLUME_FLAGS=${PROJECT_VOLUME_FLAGS}"
          echo "${PROJECT_VOLUME_FLAGS}" | grep -qF -- "-v ${dir}:/home/llm/.headroom:z" \
            || { echo "BAD: mount flag does not reference the created dir" >&2; exit 1; }
          echo "OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "OK"

  - name: existing project .headroom gets a one-time notice and is left alone
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"; trap 'rm -rf "${TMP}"' EXIT
          mkdir -p "${TMP}/proj/.headroom" "${TMP}/data" "${TMP}/.claude"
          echo old-memory > "${TMP}/proj/.headroom/memory.db"
          export HOME="${TMP}"
          unset CONTEXT_MODE_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED CONTEXT_MODE_DATA_DIR CONTEXT_MODE_PLATFORM
          export RIOTBOX_HEADROOM=1 XDG_DATA_HOME="${TMP}/data" ROOT_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/scripts/mount-projects.sh"
          setup_projects "${TMP}/proj" 2>"${TMP}/first"
          setup_projects "${TMP}/proj" 2>"${TMP}/second"
          echo "--- first ---"; cat "${TMP}/first"
          echo "--- second ---"; cat "${TMP}/second"
          grep -qF "rm -rf -- ${TMP}/proj/.headroom" "${TMP}/first" \
            || { echo "BAD: no delete command" >&2; exit 1; }
          keep="$(grep -F "cp -a -- ${TMP}/proj/.headroom/. ${RIOTBOX_STATE_DIR}/headroom/" "${TMP}/first")" \
            || { echo "BAD: no keep command" >&2; exit 1; }
          grep -qF "git -C ${TMP}/proj rm -r --cached -- .headroom" "${TMP}/first" \
            || { echo "BAD: no untrack command" >&2; exit 1; }
          grep -qF ".gitignore" "${TMP}/first" || { echo "BAD: no .gitignore advice" >&2; exit 1; }
          ! grep -q headroom "${TMP}/second" || { echo "BAD: notice repeated" >&2; exit 1; }
          [ "$(cat "${TMP}/proj/.headroom/memory.db")" = old-memory ] \
            || { echo "BAD: project .headroom was touched" >&2; exit 1; }
          # The keep command must not pair the old DB with the new location's
          # SQLite journal files or its per-project DBs.
          st="${RIOTBOX_STATE_DIR}/headroom"
          mkdir -p "${st}/memories/projects/x" "${st}/logs"
          echo new > "${st}/memory.db"; echo stale > "${st}/memory.db-wal"; echo stale > "${st}/memory_vectors.db-shm"
          touch "${st}/logs/proxy.log"
          bash -c "${keep}"
          [ "$(cat "${st}/memory.db")" = old-memory ] || { echo "BAD: old memory not in place" >&2; exit 1; }
          [ ! -e "${st}/memory.db-wal" ] && [ ! -e "${st}/memory_vectors.db-shm" ] && [ ! -e "${st}/memories" ] \
            || { echo "BAD: stale journal or per-project DB survived" >&2; ls -A "${st}" >&2; exit 1; }
          [ -e "${st}/logs/proxy.log" ] || { echo "BAD: keep removed unrelated state" >&2; exit 1; }
          [ ! -e "${TMP}/proj/.headroom" ] || { echo "BAD: old copy not removed" >&2; exit 1; }
          echo "OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "OK"

  - name: no project .headroom notice without one, or with the gate off, until headroom runs
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"; trap 'rm -rf "${TMP}"' EXIT
          mkdir -p "${TMP}/clean" "${TMP}/off/.headroom" "${TMP}/data" "${TMP}/.claude"
          export HOME="${TMP}"
          unset CONTEXT_MODE_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED CONTEXT_MODE_DATA_DIR CONTEXT_MODE_PLATFORM
          export XDG_DATA_HOME="${TMP}/data" ROOT_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/scripts/mount-projects.sh"
          RIOTBOX_HEADROOM=1 setup_projects "${TMP}/clean" 2>"${TMP}/clean.err"
          unset RIOTBOX_HEADROOM
          setup_projects "${TMP}/off" 2>"${TMP}/off.err"
          cat "${TMP}/clean.err" "${TMP}/off.err"
          ! grep -q '\.headroom' "${TMP}/clean.err" "${TMP}/off.err" \
            || { echo "BAD: unexpected notice" >&2; exit 1; }
          # Headroom off records nothing, so the first headroom launch of
          # that session still checks and notices.
          ! grep -qx project-headroom-notice "${RIOTBOX_STATE_DIR}/.migrated" \
            || { echo "BAD: headroom-off launch recorded the notice" >&2; exit 1; }
          RIOTBOX_HEADROOM=1 setup_projects "${TMP}/off" 2>"${TMP}/on.err"
          grep -qF "Notice: ${TMP}/off/.headroom" "${TMP}/on.err" \
            || { echo "BAD: later headroom launch did not notice" >&2; cat "${TMP}/on.err" >&2; exit 1; }
          echo "OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "OK"

  - name: headroom memory in an older overlay upper gets the notice too
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"; trap 'rm -rf "${TMP}"' EXIT
          mkdir -p "${TMP}/proj" "${TMP}/state/overlay/project/upper/.headroom" "${TMP}/state/overlay/other/upper"
          ln -s "${TMP}/proj" "${TMP}/state/overlay/other/upper/.headroom"
          # A session can replace its upper with a link: never follow it.
          mkdir -p "${TMP}/victim/.headroom" "${TMP}/state/overlay/linked"
          ln -s "${TMP}/victim" "${TMP}/state/overlay/linked/upper"
          source "{{.riotbox_dir}}/scripts/mount-projects.sh"
          notice_project_headroom "${TMP}/proj" "${TMP}/state" 2>"${TMP}/err"
          cat "${TMP}/err"
          up="${TMP}/state/overlay/project/upper/.headroom"
          grep -qF "Notice: ${up} may hold headroom memory" "${TMP}/err" || { echo "BAD: no overlay notice" >&2; exit 1; }
          grep -qF "overlay-accept never copies it" "${TMP}/err" || { echo "BAD: accept not explained" >&2; exit 1; }
          grep -qxF "          rm -rf -- ${up}" "${TMP}/err" || { echo "BAD: no delete command" >&2; exit 1; }
          ! grep -qF "${TMP}/state/overlay/other" "${TMP}/err" || { echo "BAD: followed a symlinked .headroom" >&2; exit 1; }
          ! grep -qF "${TMP}/state/overlay/linked" "${TMP}/err" || { echo "BAD: followed a symlinked upper" >&2; exit 1; }
          [ -d "${TMP}/victim/.headroom" ] || { echo "BAD: victim changed" >&2; exit 1; }
          ! grep -q 'git -C' "${TMP}/err" || { echo "BAD: git advice for a state-dir copy" >&2; exit 1; }
          [ "$(grep -c 'shown once per session' "${TMP}/err")" = 1 ] || { echo "BAD: footer count" >&2; exit 1; }
          echo "OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "OK"

  - name: a symlinked project .headroom is not followed and gets no notice
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"; trap 'rm -rf "${TMP}"' EXIT
          mkdir -p "${TMP}/proj" "${TMP}/elsewhere" "${TMP}/data" "${TMP}/.claude"
          echo theirs > "${TMP}/elsewhere/memory.db"
          ln -s "${TMP}/elsewhere" "${TMP}/proj/.headroom"
          export HOME="${TMP}"
          unset CONTEXT_MODE_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED CONTEXT_MODE_DATA_DIR CONTEXT_MODE_PLATFORM
          export RIOTBOX_HEADROOM=1 XDG_DATA_HOME="${TMP}/data" ROOT_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/scripts/mount-projects.sh"
          setup_projects "${TMP}/proj" 2>"${TMP}/err"
          cat "${TMP}/err"
          ! grep -q 'headroom memory' "${TMP}/err" || { echo "BAD: notice for a symlink" >&2; exit 1; }
          [ -L "${TMP}/proj/.headroom" ] && [ "$(cat "${TMP}/elsewhere/memory.db")" = theirs ] \
            && [ "$(ls -A "${TMP}/elsewhere")" = memory.db ] \
            || { echo "BAD: link or its target changed" >&2; exit 1; }
          echo "OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "OK"

  - name: the notice quotes a project path with spaces and shell metacharacters
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"; trap 'rm -rf "${TMP}"' EXIT
          proj="${TMP}/my proj \$(x);y"
          mkdir -p "${proj}/.headroom" "${TMP}/data" "${TMP}/.claude"
          export HOME="${TMP}"
          unset CONTEXT_MODE_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED CONTEXT_MODE_DATA_DIR CONTEXT_MODE_PLATFORM
          export RIOTBOX_HEADROOM=1 XDG_DATA_HOME="${TMP}/data" ROOT_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/scripts/mount-projects.sh"
          # resolve_projects splits on spaces, so set PROJECT_DIRS the way it
          # would and call the notice directly.
          mkdir -p "${TMP}/state"
          notice_project_headroom "${proj}" "${TMP}/state" 2>"${TMP}/err"
          cat "${TMP}/err"
          q="$(printf '%q' "${proj}/.headroom")"
          grep -qxF "          rm -rf -- ${q}" "${TMP}/err" || { echo "BAD: delete command not quoted" >&2; exit 1; }
          # Running the printed delete command removes exactly that directory.
          bash -c "$(grep -F "rm -rf -- ${q}" "${TMP}/err" | head -1)"
          [ ! -e "${proj}/.headroom" ] && [ -d "${proj}" ] || { echo "BAD: quoted command misbehaved" >&2; exit 1; }
          echo "OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "OK"

  - name: a failed headroom notice warns and does not stop the launch
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"; trap 'rm -rf "${TMP}"' EXIT
          mkdir -p "${TMP}/proj/.headroom" "${TMP}/data" "${TMP}/.claude"
          export HOME="${TMP}"
          unset CONTEXT_MODE_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED CONTEXT_MODE_DATA_DIR CONTEXT_MODE_PLATFORM
          export RIOTBOX_HEADROOM=1 XDG_DATA_HOME="${TMP}/data" ROOT_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/scripts/mount-projects.sh"
          # Stands in for a marker that cannot be written (disk full).
          notice_project_headroom() { return 1; }
          setup_projects "${TMP}/proj" 2>"${TMP}/err"
          cat "${TMP}/err"
          grep -q 'Warning: could not record that the headroom memory notice was checked' "${TMP}/err" \
            || { echo "BAD: no warning" >&2; exit 1; }
          echo "${PROJECT_VOLUME_FLAGS}" | grep -qF -- "/home/llm/.headroom:z" || { echo "BAD: launch setup stopped" >&2; exit 1; }
          echo "OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "OK"

  # ── headroom-summary.sh: renderer and gate tests ─────────────────────────

  - name: renderer produces the compact summary from a real perf JSON
    steps:
      - type: exec
        script: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "{{.riotbox_dir}}/container/headroom-summary.sh"
          out="$(headroom_render_perf_json <<'PERF'
          Provider List: https://docs.litellm.ai/docs/providers

          {
            "window_hours": 168.0,
            "total_requests": 238,
            "total_tokens_before": 10592487,
            "total_tokens_after": 9897955,
            "tokens_saved": 694532,
            "savings_pct": 6.6,
            "cache_hit_pct": 86.9,
            "by_model": [
              {"model": "claude-fable-5", "requests": 16, "tokens_before": 677294, "tokens_after": 676582, "tokens_saved": 712, "savings_pct": 0.1, "list_price_per_mtok": 10.0},
              {"model": "claude-opus-4-8", "requests": 1, "tokens_before": 23102, "tokens_after": 23102, "tokens_saved": 0, "savings_pct": 0.0, "list_price_per_mtok": 5.0},
              {"model": "claude-sonnet-4-6", "requests": 220, "tokens_before": 9892091, "tokens_after": 9198271, "tokens_saved": 693820, "savings_pct": 7.0, "list_price_per_mtok": 3.0},
              {"model": "claude-noprice", "requests": 2, "tokens_before": 50000, "tokens_after": 45000, "tokens_saved": 5000, "savings_pct": 10.0, "list_price_per_mtok": null},
              {"model": "passthrough:count_tokens", "requests": 1, "tokens_before": 0, "tokens_after": 0, "tokens_saved": 0, "savings_pct": 0.0, "list_price_per_mtok": null}
            ],
            "by_transform": [{"transform": "content_router", "uses": 240, "tokens_before": 12020023, "tokens_saved": 60749, "savings_pct": 0.5}]
          }
          PERF
          )"
          echo "${out}"
          echo "${out}" | grep -q "requests 238" || { echo "FAIL: missing requests 238" >&2; exit 1; }
          echo "${out}" | grep -q "10.59M" || { echo "FAIL: missing 10.59M" >&2; exit 1; }
          echo "${out}" | grep -q "9.90M" || { echo "FAIL: missing 9.90M" >&2; exit 1; }
          echo "${out}" | grep -q "694.5K (6.6%)" || { echo "FAIL: missing 694.5K (6.6%)" >&2; exit 1; }
          echo "${out}" | grep -q "cache-hit 86.9%" || { echo "FAIL: missing cache-hit 86.9%" >&2; exit 1; }
          sonnet_line="$(echo "${out}" | grep -n "claude-sonnet-4-6" | cut -d: -f1)"
          fable_line="$(echo "${out}" | grep -n "claude-fable-5" | cut -d: -f1)"
          [ "${sonnet_line}" -lt "${fable_line}" ] || { echo "FAIL: sonnet not before fable-5 (lines ${sonnet_line} vs ${fable_line})" >&2; exit 1; }
          echo "${out}" | grep -q "passthrough:count_tokens" && { echo "FAIL: passthrough row must be excluded" >&2; exit 1; }
          echo "${out}" | grep -q "full report: headroom perf" || { echo "FAIL: missing footer" >&2; exit 1; }
          # Dollar fields: sonnet has a price → expect spent/saved amounts
          echo "${out}" | grep "claude-sonnet-4-6" | grep -q '\$27.59 spent' \
            || { echo "FAIL: sonnet row missing \$27.59 spent" >&2; exit 1; }
          echo "${out}" | grep "claude-sonnet-4-6" | grep -q '\$2.08 saved' \
            || { echo "FAIL: sonnet row missing \$2.08 saved" >&2; exit 1; }
          echo "${out}" | grep "claude-sonnet-4-6" | grep -q '7.0%)' \
            || { echo "FAIL: sonnet row missing (7.0%)" >&2; exit 1; }
          # Null-price model: row must not contain any dollar sign
          noprice_row="$(echo "${out}" | grep "claude-noprice")"
          [ -n "${noprice_row}" ] || { echo "FAIL: claude-noprice row missing from output" >&2; exit 1; }
          echo "${noprice_row}" | grep -q '\$' && { echo "FAIL: null-price row must not contain dollar sign" >&2; exit 1; }
          echo "RENDER_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "RENDER_OK"
          - result.systemout ShouldContainSubstring "requests 238"
          - result.systemout ShouldContainSubstring "10.59M"
          - result.systemout ShouldContainSubstring "9.90M"
          - result.systemout ShouldContainSubstring "694.5K (6.6%)"
          - result.systemout ShouldContainSubstring "cache-hit 86.9%"
          - result.systemout ShouldContainSubstring "claude-sonnet-4-6"
          - result.systemout ShouldContainSubstring "$27.59 spent"
          - result.systemout ShouldContainSubstring "$2.08 saved"
          - result.systemout ShouldContainSubstring "claude-fable-5"
          - result.systemout ShouldContainSubstring "claude-noprice"
          - result.systemout ShouldNotContainSubstring "passthrough:count_tokens"
          - result.systemout ShouldContainSubstring "full report:"

  - name: renderer is silent on zero requests
    steps:
      - type: exec
        script: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "{{.riotbox_dir}}/container/headroom-summary.sh"
          out1="$(printf '{"total_requests": 0}\n' | headroom_render_perf_json || true)"
          out2="$(printf '{}\n' | headroom_render_perf_json || true)"
          [ -z "${out1}" ] || { echo "FAIL: zero requests produced output: ${out1}" >&2; exit 1; }
          [ -z "${out2}" ] || { echo "FAIL: empty object produced output: ${out2}" >&2; exit 1; }
          echo "SILENT_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "SILENT_OK"

  - name: renderer is silent on garbage input
    steps:
      - type: exec
        script: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "{{.riotbox_dir}}/container/headroom-summary.sh"
          out="$(printf 'not json at all\n' | headroom_render_perf_json || true)"
          [ -z "${out}" ] || { echo "FAIL: garbage input produced output: ${out}" >&2; exit 1; }
          echo "GARBAGE_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "GARBAGE_OK"

  - name: summary_print is a no-op when the gate is off
    steps:
      - type: exec
        script: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "{{.riotbox_dir}}/container/headroom-summary.sh"
          TMP="$(mktemp -d)"; trap 'rm -rf "${TMP}"' EXIT
          cat > "${TMP}/headroom" <<'FAKE'
          #!/usr/bin/env bash
          echo "FAKE_HEADROOM_INVOKED"
          FAKE
          chmod +x "${TMP}/headroom"
          export PATH="${TMP}:${PATH}"
          unset RIOTBOX_HEADROOM
          headroom_summary_init
          out="$(headroom_summary_print || true)"
          [ -z "${out}" ] || { echo "FAIL: gate-off produced output: ${out}" >&2; exit 1; }
          echo "GATE_OFF_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "GATE_OFF_OK"
          - result.systemout ShouldNotContainSubstring "FAKE_HEADROOM_INVOKED"

  - name: summary_print gate-on invokes headroom perf and renders the summary
    steps:
      - type: exec
        script: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "{{.riotbox_dir}}/container/headroom-summary.sh"
          TMP="$(mktemp -d)"; trap 'rm -rf "${TMP}"' EXIT
          ARGV_FILE="${TMP}/argv"
          # Fake headroom: record "$@" and emit fixture JSON on stdout when
          # called as `perf`.  Must work via `timeout 10 headroom perf ...`
          # since headroom_summary_print calls: timeout 10 headroom perf --hours X --format json
          cat > "${TMP}/headroom" <<'FAKE'
          #!/usr/bin/env bash
          printf '%s\n' "$@" >> "${ARGV_FILE}"
          if [ "${1:-}" = "perf" ]; then
            printf '%s\n' \
              '{' \
              '  "window_hours": 1.0,' \
              '  "total_requests": 238,' \
              '  "total_tokens_before": 10592487,' \
              '  "total_tokens_after": 9897955,' \
              '  "tokens_saved": 694532,' \
              '  "savings_pct": 6.6,' \
              '  "cache_hit_pct": 86.9,' \
              '  "by_model": [' \
              '    {"model": "claude-sonnet-4-6", "requests": 238, "tokens_before": 9892091, "tokens_after": 9198271, "tokens_saved": 693820, "savings_pct": 7.0, "list_price_per_mtok": 3.0}' \
              '  ],' \
              '  "by_transform": []' \
              '}'
          fi
          FAKE
          chmod +x "${TMP}/headroom"
          export PATH="${TMP}:${PATH}"
          export ARGV_FILE
          export RIOTBOX_HEADROOM=1
          headroom_summary_init
          out="$(headroom_summary_print || true)"
          echo "${out}"

          # Summary output must contain the key fields
          printf '%s\n' "${out}" | grep -q "requests 238" \
            || { echo "FAIL: missing 'requests 238' in output"; exit 1; }
          printf '%s\n' "${out}" | grep -qF "full report: headroom perf" \
            || { echo "FAIL: missing 'full report: headroom perf' in output"; exit 1; }

          # headroom was called with: perf --hours <float> --format json
          grep -q "^perf$" "${ARGV_FILE}" \
            || { echo "FAIL: 'perf' not in recorded argv"; exit 1; }
          grep -q "^--hours$" "${ARGV_FILE}" \
            || { echo "FAIL: '--hours' not in recorded argv"; exit 1; }
          grep -q "^--format$" "${ARGV_FILE}" \
            || { echo "FAIL: '--format' not in recorded argv"; exit 1; }
          grep -q "^json$" "${ARGV_FILE}" \
            || { echo "FAIL: 'json' not in recorded argv"; exit 1; }

          echo "GATE_ON_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "GATE_ON_OK"
          - result.systemout ShouldContainSubstring "requests 238"
          - 'result.systemout ShouldContainSubstring "full report: headroom perf"'
