name: context-mode-summary.sh — exit report rendering
vars:
  root: "."
  riotbox_dir: "{{.root}}"

# The report is the only evidence a Context Mode session leaves. Before it
# existed, a run where the model took every routing suggestion and a run where
# it ignored all of them looked identical from outside, which is why the
# head-to-head measurement docs/dev/decisions/context-mode-adoption.md demands could
# not be made.
#
# A wired session therefore always reports, including when it saved nothing:
# silence on a zero was itself indistinguishable from a session where the
# feature never engaged, which is the question the report exists to answer.
# What silence used to convey is now carried by the numbers — a zero kept-out
# beside a non-zero tool-call count says the hooks fired and withheld nothing.
#
# Two kinds of case live here.
#
# The pure ones drive context_mode_compute_deltas and context_mode_render_stats
# with the stats reader's JSON on stdin, or the gate through a fake shim. They
# need no store and no Node, so they run everywhere, the test image included.
#
# The store cases build real context-mode 2.x stores (upstream's DDL, see
# tests/lib/context-mode-store-helpers.sh) and read them through
# container/context-mode-stats.mjs, the same reader the image runs. They pin
# the SQL: which rows count as kept out, which as re-read, and which belong to
# this run at all. They need Node 24 or later on PATH. The test image installs
# it and declares RIOTBOX_REQUIRE_CM_NODE=1, so there a missing Node fails;
# on a bare host the cases print "<name>=SKIPPED" instead of their pass
# sentinel.
#
# Every case clears _CONTEXT_MODE_WIRED, CONTEXT_MODE_DIR, CONTEXT_MODE_DATA_DIR,
# RIOTBOX_CONTEXT_MODE and RIOTBOX_AGENT before it does anything else, and
# re-exports whatever it actually needs afterwards. A wired RiotBox session —
# the environment a maintainer of this feature runs the suite in — exports
# them, and the gate case in particular asserts what happens with the wired
# flag ABSENT, so an inherited 1 turns a real regression into a green run in CI
# and a red one on a developer's machine.

testcases:
  - name: renders the kept-out, re-read, call count and store total in natural units
    steps:
      - type: exec
        script: |
          set -e
          unset _CONTEXT_MODE_WIRED CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          export HOME="/nonexistent-home"
          source "{{.riotbox_dir}}/container/context-mode-summary.sh"
          out="$(jq -nc '{
            after: {seq: {}, kept_out: 224256, re_read: 21504, calls: 12,
                    total_kept_out: 1468006, rewound: false},
            baseline_unknown: false
          }' | context_mode_render_stats)"
          printf '%s\n' "${out}"
          # kept out:    224256 B = 219.0 KB -> "219 KB" (whole numbers at or
          #              above 100 units)
          # re-read:     21504 B = 21.0 KB  -> "21.0 KB" (one decimal below 100)
          # store total: 1468006 B = 1.40 MB -> "1.4 MB"
          printf '%s' "${out}" | grep -q '── context-mode ─' \
            || { echo "FAIL: missing section rule"; exit 1; }
          printf '%s' "${out}" | grep -qx ' this run 219 KB kept out · 21.0 KB re-read via ctx_search · 12 tool calls recorded' \
            || { echo "FAIL: this-run line wrong: ${out}"; exit 1; }
          printf '%s' "${out}" | grep -qx ' store total 1.4 MB kept out' \
            || { echo "FAIL: store total line wrong: ${out}"; exit 1; }
          printf '%s' "${out}" | grep -qx ' store: /nonexistent-home/.context-mode (this project set)' \
            || { echo "FAIL: store path line wrong: ${out}"; exit 1; }
          # No percentage anywhere: upstream's reductionPct divides by what was
          # produced, and the ratio says nothing about what reached the model.
          if printf '%s' "${out}" | grep -q '%'; then
            echo "FAIL: output carries a percentage: ${out}"; exit 1
          fi
          echo "render_normal=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "render_normal=pass"

  # A large kept-out with nothing re-read is a shape worth recognising, not a
  # formatting edge: it is what a session looks like when the MCP server never
  # started — the hooks replaced tool output and pointed the model at
  # ctx_search tools that did not exist, so the bytes went out of context and
  # came back by no route at all. " · 0 B re-read" would hide that among the
  # ordinary runs, so the term is omitted and its absence carries the signal.
  - name: omits the re-read term when nothing was retrieved from the store
    steps:
      - type: exec
        script: |
          set -e
          unset _CONTEXT_MODE_WIRED CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          source "{{.riotbox_dir}}/container/context-mode-summary.sh"
          out="$(jq -nc '{
            after: {seq: {}, kept_out: 3145728, re_read: 0, calls: 1,
                    total_kept_out: 3145728, rewound: false}
          }' | context_mode_render_stats)"
          printf '%s\n' "${out}"
          # 1 call, singular: "1 tool calls" reads as a formatting bug.
          printf '%s' "${out}" | grep -qx ' this run 3.0 MB kept out · 1 tool call recorded' \
            || { echo "FAIL: this-run line wrong: ${out}"; exit 1; }
          if printf '%s' "${out}" | grep -q 're-read'; then
            echo "FAIL: printed a zero re-read term: ${out}"; exit 1
          fi
          echo "render_no_reread=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "render_no_reread=pass"

  # The floor case: a wired session that did nothing at all still reports, so
  # "no report" never has to be interpreted. With every counter at zero there is
  # no activity to disclose either, so the call term stays off — it earns its
  # place on the line only when there is a number behind it.
  - name: reports a zero run rather than staying silent
    steps:
      - type: exec
        script: |
          set -e
          unset _CONTEXT_MODE_WIRED CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          source "{{.riotbox_dir}}/container/context-mode-summary.sh"
          rc=0
          out="$(jq -nc '{after: {seq: {}, kept_out: 0, re_read: 0, calls: 0,
                                  total_kept_out: 0, rewound: false}}' \
            | context_mode_render_stats)" || rc=$?
          printf '%s\n' "${out}"
          [ "${rc}" = "0" ] || { echo "FAIL: status ${rc} for a zero run"; exit 1; }
          printf '%s' "${out}" | grep -qx ' this run 0 B kept out' \
            || { echo "FAIL: zero run not reported: ${out}"; exit 1; }
          printf '%s' "${out}" | grep -qx ' store total 0 B kept out' \
            || { echo "FAIL: zero store total not reported: ${out}"; exit 1; }

          # The diagnosis the call term exists for: the hooks fired, nothing
          # was withheld.
          out="$(jq -nc '{after: {seq: {}, kept_out: 0, re_read: 0, calls: 7,
                                  total_kept_out: 2048, rewound: false}}' \
            | context_mode_render_stats)"
          printf '%s\n' "${out}"
          printf '%s' "${out}" | grep -qx ' this run 0 B kept out · 7 tool calls recorded' \
            || { echo "FAIL: idle-but-engaged run wrong: ${out}"; exit 1; }
          echo "render_zero=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "render_zero=pass"

  # Both ways a run can lose its baseline print the store total with no
  # this-run claim: init could not read the store (baseline_unknown), or a
  # store's AUTOINCREMENT counter is now below the watermark taken at start
  # (rewound), which means the database was recreated during the run and rows
  # above the watermark are not this run's rows.
  - name: reports the store total with no this-run claim when the baseline is unusable
    steps:
      - type: exec
        script: |
          set -e
          unset _CONTEXT_MODE_WIRED CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          source "{{.riotbox_dir}}/container/context-mode-summary.sh"
          for payload in \
              '{"baseline_unknown":true,"after":{"seq":{},"kept_out":1468006,"re_read":51200,"calls":3,"total_kept_out":1468006,"rewound":false}}' \
              '{"baseline_unknown":false,"after":{"seq":{},"kept_out":1468006,"re_read":51200,"calls":3,"total_kept_out":1468006,"rewound":true}}'; do
            out="$(printf '%s' "${payload}" | context_mode_render_stats)"
            printf '%s\n' "${out}"
            printf '%s' "${out}" | grep -qx ' this run unknown (no usable baseline) · store total 1.4 MB kept out' \
              || { echo "FAIL: unusable baseline not disclosed for ${payload}: ${out}"; exit 1; }
            printf '%s' "${out}" | grep -q 'kept out ·' \
              && { echo "FAIL: fabricated a this-run figure: ${out}"; exit 1; }
          done
          echo "render_unknown=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "render_unknown=pass"

  - name: silent on malformed input and on a missing or mistyped after
    steps:
      - type: exec
        script: |
          set -e
          unset _CONTEXT_MODE_WIRED CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          source "{{.riotbox_dir}}/container/context-mode-summary.sh"
          # A field that is absent, null, negative, fractional or a string is
          # malformed, not zero: a `// 0` fallback would turn a reader that
          # lost a column into a confident "0 B kept out".
          for payload in '' 'not json' '{}' '[]' '{"after":[1]}' \
              '{"after":{"kept_out":1,"re_read":0,"calls":0}}' \
              '{"after":{"kept_out":null,"re_read":0,"calls":0,"total_kept_out":0}}' \
              '{"after":{"kept_out":-1,"re_read":0,"calls":0,"total_kept_out":0}}' \
              '{"after":{"kept_out":1.5,"re_read":0,"calls":0,"total_kept_out":0}}' \
              '{"after":{"kept_out":"1","re_read":0,"calls":0,"total_kept_out":0}}' \
              '{"baseline_unknown":true,"after":{"total_kept_out":"x"}}'; do
            rc=0
            out="$(printf '%s' "${payload}" | context_mode_render_stats)" || rc=$?
            [ "${rc}" != "0" ] \
              || { echo "FAIL: status 0 for payload '${payload}'"; exit 1; }
            [ -z "${out}" ] \
              || { echo "FAIL: output for payload '${payload}': ${out}"; exit 1; }
          done
          echo "render_malformed=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "render_malformed=pass"

  - name: humanizes at the KB, MB and GB boundaries
    steps:
      - type: exec
        script: |
          set -e
          unset _CONTEXT_MODE_WIRED CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          source "{{.riotbox_dir}}/container/context-mode-summary.sh"
          check() {
            got="$(_humanize_bytes "$1")"
            [ "${got}" = "$2" ] \
              || { echo "FAIL: $1 bytes rendered as '${got}', expected '$2'"; exit 1; }
          }
          check 0 "0 B"
          check 512 "512 B"
          check 1023 "1023 B"
          check 1024 "1.0 KB"
          check 102400 "100 KB"
          check 1048576 "1.0 MB"
          check 104857600 "100 MB"
          check 1073741824 "1.00 GB"
          # Rounding, not truncation: awk's %d would render this 220 KB while
          # upstream's kb() says 221 KB for the same store. Two numbers that
          # disagree about one store read as one of them being broken.
          check 226280 "221 KB"
          # Same distinction one branch up: 100.59 MB rounds to 101, truncates
          # to 100. Both values verified equal to upstream kb() before this test
          # was written.
          check 105479373 "101 MB"
          echo "humanize=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "humanize=pass"

  # POSIXLY_CORRECT makes gawk honor LC_NUMERIC for printf's "%f" family,
  # and a de_DE-family locale renders the decimal point as a comma. A report
  # and a ctx-stats rollup that disagree about the separator for the same
  # number read as one of them being wrong, so it must not depend on the
  # caller's locale. Only runs if the locale is installed; skips cleanly
  # otherwise rather than failing on an environment that never had it.
  - name: humanizes with a locale-stable decimal separator
    steps:
      - type: exec
        script: |
          set -e
          unset _CONTEXT_MODE_WIRED CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          if ! locale -a 2>/dev/null | grep -qi '^de_DE\.utf8$\|^de_DE\.UTF-8$'; then
            echo "SKIP: de_DE.UTF-8 locale not installed"
            echo "humanize_locale=pass"
            exit 0
          fi
          source "{{.riotbox_dir}}/container/context-mode-summary.sh"
          got="$(LC_ALL=de_DE.UTF-8 POSIXLY_CORRECT=1 _humanize_bytes 1500)"
          [ "${got}" = "1.5 KB" ] \
            || { echo "FAIL: locale-dependent separator leaked: '${got}'"; exit 1; }
          echo "humanize_locale=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "humanize_locale=pass"

  # The gate and the watermark plumbing, driven through a fake stats shim. What
  # has to be verified here is that the gate is closed unless the session was
  # actually wired, and that the exit read is handed exactly the per-project
  # watermark the start read returned — the fake fails the second call
  # otherwise.
  - name: init and print are gated on a wired session and pass the watermark through
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset _CONTEXT_MODE_WIRED CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          export CONTEXT_MODE_STATS_BIN="${HOME}/fake-stats"
          # Deliberately never created: this suite is about the report, not the
          # ledger, and an absent CONTEXT_MODE_LEDGER_DIR keeps
          # context_mode_ledger_append a no-op. Declared explicitly rather than
          # left to fall out of the HOME override — inside a real container
          # /home/llm/.riotbox-ledger is a live bind mount, so a case that
          # forgets to override HOME first must not be able to write into it.
          export CONTEXT_MODE_LEDGER_DIR="${TEST_DIR}/no-ledger"
          mkdir -p "${HOME}/.context-mode/projects"

          # $1 store root, $2 agent id, $3 watermark or --seq-only. The start
          # read asks for the counters alone; the exit read must get the start
          # read's seq map, and claude must be asked for as upstream's
          # claude-code.
          cat > "${CONTEXT_MODE_STATS_BIN}" <<'SHIM'
          #!/bin/sh
          [ "$1" = "${HOME}/.context-mode" ] || exit 9
          [ "$2" = "claude-code" ] || exit 9
          if [ -f "${HOME}/second" ]; then
            [ "$3" = '{"0123456789abcdef":41}' ] || exit 9
            echo '{"seq":{"0123456789abcdef":57},"kept_out":524288,"re_read":51200,"calls":4,"total_kept_out":1048576,"rewound":false}'
          else
            [ "$3" = "--seq-only" ] || exit 9
            touch "${HOME}/second"
            echo '{"seq":{"0123456789abcdef":41}}'
          fi
          SHIM
          chmod +x "${CONTEXT_MODE_STATS_BIN}"

          source "{{.riotbox_dir}}/container/context-mode-summary.sh"

          # Gate closed: no wired flag, so neither call may produce anything.
          context_mode_summary_init
          out="$(context_mode_summary_print)"
          [ -z "${out}" ] || { echo "FAIL: printed while unwired: ${out}"; exit 1; }
          [ -z "${_CONTEXT_MODE_SUMMARY_START:-}" ] \
            || { echo "FAIL: took a baseline while unwired"; exit 1; }

          # Gate open.
          rm -f "${HOME}/second"
          export _CONTEXT_MODE_WIRED=1
          context_mode_summary_init
          [ "${_CONTEXT_MODE_SUMMARY_START:-}" = '{"0123456789abcdef":41}' ] \
            || { echo "FAIL: baseline is not the start read's seq map: '${_CONTEXT_MODE_SUMMARY_START:-}'"; exit 1; }
          out="$(context_mode_summary_print)"
          printf '%s\n' "${out}"
          printf '%s' "${out}" | grep -qx ' this run 512 KB kept out · 50.0 KB re-read via ctx_search · 4 tool calls recorded' \
            || { echo "FAIL: run line missing or the watermark was not passed: ${out}"; exit 1; }
          printf '%s' "${out}" | grep -qx ' store total 1.0 MB kept out' \
            || { echo "FAIL: store total missing: ${out}"; exit 1; }
          echo "gate=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "gate=pass"

  - name: print stays silent and successful when the shim is absent or broken
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset _CONTEXT_MODE_WIRED CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          # Declared, not implied by the HOME override — see the same note in
          # "init and print are gated on a wired session".
          export CONTEXT_MODE_LEDGER_DIR="${TEST_DIR}/no-ledger"
          export _CONTEXT_MODE_WIRED=1
          mkdir -p "${HOME}/.context-mode/projects"
          source "{{.riotbox_dir}}/container/context-mode-summary.sh"

          # Absent shim — an older image, or a session whose toggle was set
          # without a rebuild.
          export CONTEXT_MODE_STATS_BIN="${HOME}/does-not-exist"
          rc=0
          out="$(context_mode_summary_print 2>&1)" || rc=$?
          [ "${rc}" = "0" ] || { echo "FAIL: nonzero status for absent shim"; exit 1; }
          [ -z "${out}" ] || { echo "FAIL: output for absent shim: ${out}"; exit 1; }

          # Present but broken: exits nonzero and prints garbage on both streams.
          export CONTEXT_MODE_STATS_BIN="${HOME}/broken"
          printf '#!/bin/sh\necho oops >&2\necho "not json"\nexit 3\n' \
            > "${CONTEXT_MODE_STATS_BIN}"
          chmod +x "${CONTEXT_MODE_STATS_BIN}"
          rc=0
          out="$(context_mode_summary_print 2>&1)" || rc=$?
          [ "${rc}" = "0" ] || { echo "FAIL: nonzero status for broken shim"; exit 1; }
          [ -z "${out}" ] || { echo "FAIL: output for broken shim: ${out}"; exit 1; }

          # Present, exits 0, but stdout is not JSON at all. This is the case
          # the type gate in context_mode_read_stats exists for: a shim that
          # "succeeds" while handing back garbage must not turn into a
          # confident wrong number.
          export CONTEXT_MODE_STATS_BIN="${HOME}/not-json"
          printf '#!/bin/sh\necho not-json\n' > "${CONTEXT_MODE_STATS_BIN}"
          chmod +x "${CONTEXT_MODE_STATS_BIN}"
          rc=0
          out="$(context_mode_summary_print 2>&1)" || rc=$?
          [ "${rc}" = "0" ] || { echo "FAIL: nonzero status for non-JSON shim"; exit 1; }
          [ -z "${out}" ] || { echo "FAIL: output for non-JSON shim: ${out}"; exit 1; }

          # Present, exits 0, valid JSON but not an object — the same gate,
          # the other shape it has to reject.
          export CONTEXT_MODE_STATS_BIN="${HOME}/json-array"
          printf '#!/bin/sh\necho "[1,2,3]"\n' > "${CONTEXT_MODE_STATS_BIN}"
          chmod +x "${CONTEXT_MODE_STATS_BIN}"
          rc=0
          out="$(context_mode_summary_print 2>&1)" || rc=$?
          [ "${rc}" = "0" ] || { echo "FAIL: nonzero status for array-shaped shim"; exit 1; }
          [ -z "${out}" ] || { echo "FAIL: output for array-shaped shim: ${out}"; exit 1; }
          echo "degrade=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "degrade=pass"

  # The seam the ledger depends on. render_stats formats these numbers and
  # ledger_append records them; if the two ever computed their own, one store
  # would produce two different answers.
  - name: compute_deltas emits the four integers the formatter prints
    steps:
      - type: exec
        script: |
          set -e
          unset _CONTEXT_MODE_WIRED CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          source "{{.riotbox_dir}}/container/context-mode-summary.sh"
          out="$(jq -nc '{after: {seq: {}, kept_out: 224256, re_read: 21504, calls: 12,
                                  total_kept_out: 1468006, rewound: false},
                          baseline_unknown: false}' | context_mode_compute_deltas)"
          [ "${out}" = "224256 21504 1468006 12" ] \
            || { echo "FAIL: expected '224256 21504 1468006 12', got '${out}'"; exit 1; }

          unknown="$(jq -nc '{baseline_unknown: true,
                              after: {seq: {}, kept_out: 9, re_read: 9, calls: 9,
                                      total_kept_out: 1468006, rewound: false}}' \
            | context_mode_compute_deltas)"
          [ "${unknown}" = "UNKNOWN 1468006" ] \
            || { echo "FAIL: expected 'UNKNOWN 1468006', got '${unknown}'"; exit 1; }

          rewound="$(jq -nc '{after: {seq: {}, kept_out: 9, re_read: 9, calls: 9,
                                      total_kept_out: 77, rewound: true}}' \
            | context_mode_compute_deltas)"
          [ "${rewound}" = "UNKNOWN 77" ] \
            || { echo "FAIL: expected 'UNKNOWN 77' for a rewound store, got '${rewound}'"; exit 1; }

          rc=0
          bad="$(printf 'not json' | context_mode_compute_deltas)" || rc=$?
          [ -z "${bad}" ] || { echo "FAIL: malformed input produced '${bad}'"; exit 1; }
          # jq exits nonzero (a parse error) on unparsable stdin even with the
          # trailing `2>/dev/null`, which only silences the message, not the
          # status.
          [ "${rc}" -ne 0 ] \
            || { echo "FAIL: expected a nonzero status for malformed input, got 0"; exit 1; }
          echo "compute_deltas=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "compute_deltas=pass"

  # ── Real stores ────────────────────────────────────────────────────────────
  #
  # The central case. Three project stores under one ~/.context-mode, two of
  # them holding rows from before the run, one created during it. Between init
  # and print the run writes one row of every kind the SQL has to classify:
  #
  #   A  Bash         146890 -> 161   kept out 146729 (the hook's replace, the
  #                                   byte pair the real 2.1.4 hook wrote for a
  #                                   146890-byte output)
  #   A  ctx_execute  108894 -> 2477  kept out 106417
  #   A  ctx_execute     500 -> 600   kept out 0 (clamped per row: a small
  #                                   output comes back wrapped in a reply longer
  #                                   than itself, which withheld nothing and
  #                                   must not cancel another's saving the way
  #                                   upstream's netting does)
  #   A  ctx_search        0 -> 3072  re-read 3072
  #   A  ctx_resume        0 -> 1024  re-read 1024
  #   A  ctx_doctor    50000 -> 2000  neither: a diagnostic report
  #   A  ctx_index     40000 -> 80    neither: ctx_index content can be bytes
  #                                   the model itself wrote into the call
  #   A  cost/prompt rows             not tool calls at all
  #   A  Bash (pi)     90000 -> 100   another agent's row: excluded
  #   A  Bash (S2)      2048 -> 0     kept out 2048: the same agent's second
  #                                   session in this run (a /clear starts one)
  #   B  Bash          20480 -> 0     kept out 20480, above B's watermark
  #   C  Bash          10250 -> 10    kept out 10240; C did not exist at start,
  #                                   so its watermark is 0
  #
  # this run:    146729 + 106417 + 2048 + 20480 + 10240 = 285914  re-read 4096
  #              tool calls 10 (every claude-code tool row above, cost and
  #              prompt rows aside)
  # store total: 285914 + the pre-existing 99900 (A) + 51200 (B) = 437014
  #
  # No row here is a Read, Grep or WebFetch: 2.x writes no events row for a
  # clean one, replaced or not. See "a replaced Read contributes nothing".
  #
  # What this case cannot show, because 2.x cannot tell it: a CONCURRENT run of
  # the same agent on the same project set writes to the same stores, with the
  # same agent and its own session ids, and its rows above the watermark are
  # counted here too. See "Concurrent runs" in container/context-mode-summary.sh.
  - name: a run counts only its own agent's rows above each store's watermark
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset _CONTEXT_MODE_WIRED CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          RIOTBOX_DIR="{{.riotbox_dir}}"
          source "${RIOTBOX_DIR}/tests/lib/context-mode-store-helpers.sh"
          cm_require_node store_scoping
          export CONTEXT_MODE_STATS_BIN="${HOME}/stats"
          cm_stats_shim "${CONTEXT_MODE_STATS_BIN}"
          export CONTEXT_MODE_LEDGER_DIR="${TEST_DIR}/no-ledger"
          export RIOTBOX_AGENT=claude
          export _CONTEXT_MODE_WIRED=1
          P="${HOME}/.context-mode/projects"

          cm_store rows "${P}/aaaaaaaaaaaaaaaa/context.db" \
            '[{"session_id":"S0","agent":"claude-code","tool":"Bash","sandbox_bytes":100000,"returned_bytes":100}]'
          cm_store rows "${P}/bbbbbbbbbbbbbbbb/context.db" \
            '[{"session_id":"S0","agent":"claude-code","tool":"Bash","sandbox_bytes":51200,"returned_bytes":0}]'

          source "${RIOTBOX_DIR}/container/context-mode-summary.sh"
          context_mode_summary_init
          [ "$(jq -cS . <<<"${_CONTEXT_MODE_SUMMARY_START}")" = '{"aaaaaaaaaaaaaaaa":1,"bbbbbbbbbbbbbbbb":1}' ] \
            || { echo "FAIL: watermark is not each store's sequence: ${_CONTEXT_MODE_SUMMARY_START:-}"; exit 1; }

          cm_store rows "${P}/aaaaaaaaaaaaaaaa/context.db" '[
            {"session_id":"S1","agent":"claude-code","tool":"Bash","sandbox_bytes":146890,"returned_bytes":161},
            {"session_id":"S1","agent":"claude-code","tool":"ctx_execute","sandbox_bytes":108894,"returned_bytes":2477},
            {"session_id":"S1","agent":"claude-code","tool":"ctx_execute","sandbox_bytes":500,"returned_bytes":600},
            {"session_id":"S1","agent":"claude-code","tool":"ctx_search","sandbox_bytes":0,"returned_bytes":3072},
            {"session_id":"S1","agent":"claude-code","tool":"ctx_resume","sandbox_bytes":0,"returned_bytes":1024},
            {"session_id":"S1","agent":"claude-code","tool":"ctx_doctor","sandbox_bytes":50000,"returned_bytes":2000},
            {"session_id":"S1","agent":"claude-code","kind":"index","tool":"ctx_index","sandbox_bytes":40000,"returned_bytes":80},
            {"session_id":"S1","agent":"claude-code","kind":"cost","tool":"Bash","sandbox_bytes":9999,"returned_bytes":0},
            {"session_id":"S1","agent":"claude-code","kind":"prompt","sandbox_bytes":7777,"returned_bytes":0},
            {"session_id":"P1","agent":"pi","tool":"Bash","sandbox_bytes":90000,"returned_bytes":100},
            {"session_id":"S2","agent":"claude-code","tool":"Bash","sandbox_bytes":2048,"returned_bytes":0}]'
          cm_store rows "${P}/bbbbbbbbbbbbbbbb/context.db" \
            '[{"session_id":"S1","agent":"claude-code","tool":"Bash","sandbox_bytes":20480,"returned_bytes":0}]'
          cm_store rows "${P}/cccccccccccccccc/context.db" \
            '[{"session_id":"S1","agent":"claude-code","tool":"Bash","sandbox_bytes":10250,"returned_bytes":10}]'

          # The exact integers, from the reader itself.
          raw="$("${CONTEXT_MODE_STATS_BIN}" "${HOME}/.context-mode" claude-code "${_CONTEXT_MODE_SUMMARY_START}")"
          printf '%s\n' "${raw}"
          jq -e '.kept_out == 285914 and .re_read == 4096 and .calls == 10
                 and .total_kept_out == 437014 and .rewound == false' <<<"${raw}" >/dev/null \
            || { echo "FAIL: reader totals wrong: ${raw}"; exit 1; }

          out="$(context_mode_summary_print)"
          printf '%s\n' "${out}"
          # 285914 B = 279.2 KB -> "279 KB"; 437014 B = 426.8 KB -> "427 KB"
          printf '%s' "${out}" | grep -qx ' this run 279 KB kept out · 4.0 KB re-read via ctx_search · 10 tool calls recorded' \
            || { echo "FAIL: this-run line wrong: ${out}"; exit 1; }
          printf '%s' "${out}" | grep -qx ' store total 427 KB kept out' \
            || { echo "FAIL: store total wrong: ${out}"; exit 1; }

          # The agent filter is the reader's, not an accident of the fixture:
          # read as pi, only pi's one row is this run's.
          pi="$("${CONTEXT_MODE_STATS_BIN}" "${HOME}/.context-mode" pi "${_CONTEXT_MODE_SUMMARY_START}")"
          jq -e '.kept_out == 89900 and .calls == 1 and .total_kept_out == 89900' <<<"${pi}" >/dev/null \
            || { echo "FAIL: agent filter wrong: ${pi}"; exit 1; }
          echo "store_scoping=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex "store_scoping=(pass|SKIPPED)"

  # The 1.x rule carries over: no store, nothing to report. A projects
  # directory with no context.db in it is the same state — 2.x creates the
  # directory and the database together, so an empty one is a store that has
  # never been written.
  - name: no store and no database print nothing and do not fail
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset _CONTEXT_MODE_WIRED CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          RIOTBOX_DIR="{{.riotbox_dir}}"
          source "${RIOTBOX_DIR}/tests/lib/context-mode-store-helpers.sh"
          cm_require_node store_absent
          export CONTEXT_MODE_STATS_BIN="${HOME}/stats"
          cm_stats_shim "${CONTEXT_MODE_STATS_BIN}"
          export CONTEXT_MODE_LEDGER_DIR="${TEST_DIR}/no-ledger"
          export _CONTEXT_MODE_WIRED=1
          source "${RIOTBOX_DIR}/container/context-mode-summary.sh"

          for layout in none empty-projects owners-only; do
            rm -rf "${HOME}/.context-mode"
            case "${layout}" in
              empty-projects) mkdir -p "${HOME}/.context-mode/projects" ;;
              owners-only) mkdir -p "${HOME}/.context-mode/projects/aaaaaaaaaaaaaaaa/owners" ;;
            esac
            context_mode_summary_init
            [ -z "${_CONTEXT_MODE_SUMMARY_BASELINE_UNKNOWN:-}" ] \
              || { echo "FAIL: ${layout}: no database is a first run, not an unknown baseline"; exit 1; }
            rc=0
            out="$(context_mode_summary_print 2>&1)" || rc=$?
            [ "${rc}" = "0" ] || { echo "FAIL: ${layout}: status ${rc}"; exit 1; }
            [ -z "${out}" ] || { echo "FAIL: ${layout}: printed '${out}'"; exit 1; }
          done
          echo "store_absent=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex "store_absent=(pass|SKIPPED)"

  - name: a run that wrote no rows reports zero against the store total
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset _CONTEXT_MODE_WIRED CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          RIOTBOX_DIR="{{.riotbox_dir}}"
          source "${RIOTBOX_DIR}/tests/lib/context-mode-store-helpers.sh"
          cm_require_node store_no_rows
          export CONTEXT_MODE_STATS_BIN="${HOME}/stats"
          cm_stats_shim "${CONTEXT_MODE_STATS_BIN}"
          export CONTEXT_MODE_LEDGER_DIR="${TEST_DIR}/no-ledger"
          export _CONTEXT_MODE_WIRED=1
          cm_store rows "${HOME}/.context-mode/projects/aaaaaaaaaaaaaaaa/context.db" \
            '[{"session_id":"S0","agent":"claude-code","tool":"Bash","sandbox_bytes":1049600,"returned_bytes":1024}]'
          source "${RIOTBOX_DIR}/container/context-mode-summary.sh"
          context_mode_summary_init
          out="$(context_mode_summary_print)"
          printf '%s\n' "${out}"
          printf '%s' "${out}" | grep -qx ' this run 0 B kept out' \
            || { echo "FAIL: an idle run must report zero: ${out}"; exit 1; }
          printf '%s' "${out}" | grep -qx ' store total 1.0 MB kept out' \
            || { echo "FAIL: store total wrong: ${out}"; exit 1; }
          echo "store_no_rows=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex "store_no_rows=(pass|SKIPPED)"

  # A store another process holds exclusively. The read waits a bounded time
  # and gives up: at exit the report is silent (the 1.x rule for an
  # unreadable store) and the teardown is not held open; at start the
  # baseline is UNKNOWN, because a database is on disk.
  - name: a locked store bounds the wait and never fabricates a figure
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset _CONTEXT_MODE_WIRED CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          RIOTBOX_DIR="{{.riotbox_dir}}"
          source "${RIOTBOX_DIR}/tests/lib/context-mode-store-helpers.sh"
          cm_require_node store_locked
          export CONTEXT_MODE_STATS_BIN="${HOME}/stats"
          cm_stats_shim "${CONTEXT_MODE_STATS_BIN}"
          export CONTEXT_MODE_LEDGER_DIR="${TEST_DIR}/no-ledger"
          export _CONTEXT_MODE_WIRED=1
          DB="${HOME}/.context-mode/projects/aaaaaaaaaaaaaaaa/context.db"
          cm_store rows "${DB}" \
            '[{"session_id":"S0","agent":"claude-code","tool":"Bash","sandbox_bytes":1049600,"returned_bytes":1024}]'
          source "${RIOTBOX_DIR}/container/context-mode-summary.sh"

          hold() {
            cm_store lock "${DB}" "$1" > "${TEST_DIR}/lock.out" &
            for _ in $(seq 1 100); do
              grep -q locked "${TEST_DIR}/lock.out" 2>/dev/null && return 0
              sleep 0.1
            done
            echo "FAIL: the lock holder never took the lock"; exit 1
          }

          # Locked at exit, for longer than the reader's busy timeout. The
          # holder outlives the read, so a read that did not give up on its own
          # would show as the elapsed time, not as a pass.
          context_mode_summary_init
          hold 6000
          start="$(date +%s)"
          rc=0
          out="$(context_mode_summary_print 2>"${TEST_DIR}/err")" || rc=$?
          elapsed=$(( $(date +%s) - start ))
          [ "${rc}" = "0" ] || { echo "FAIL: status ${rc} on a locked store"; exit 1; }
          [ -z "${out}" ] || { echo "FAIL: printed from a locked store: ${out}"; exit 1; }
          grep -qF "exit report skipped, cannot read ${DB}" "${TEST_DIR}/err" \
            || { echo "FAIL: no stderr note naming the locked store: $(cat "${TEST_DIR}/err")"; exit 1; }
          [ "${elapsed}" -le 4 ] \
            || { echo "FAIL: exit read waited ${elapsed}s on a locked store"; exit 1; }
          wait

          # Locked at start, free again at exit.
          hold 2500
          context_mode_summary_init
          [ "${_CONTEXT_MODE_SUMMARY_BASELINE_UNKNOWN:-}" = "1" ] \
            || { echo "FAIL: a locked store at start must be an unknown baseline"; exit 1; }
          wait
          out="$(context_mode_summary_print)"
          printf '%s\n' "${out}"
          printf '%s' "${out}" | grep -qx ' this run unknown (no usable baseline) · store total 1.0 MB kept out' \
            || { echo "FAIL: unknown baseline not disclosed: ${out}"; exit 1; }
          echo "store_locked=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex "store_locked=(pass|SKIPPED)"

  # A context.db that is not a database. It is a store that exists and cannot
  # be read, so it behaves as a locked one: no report at exit, an unknown
  # baseline at start. Skipping it instead would under-count without a word,
  # and so would staying silent about which file did it: the exit leaves one
  # stderr note naming the store.
  - name: a corrupt store is unreadable, not empty
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset _CONTEXT_MODE_WIRED CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          RIOTBOX_DIR="{{.riotbox_dir}}"
          source "${RIOTBOX_DIR}/tests/lib/context-mode-store-helpers.sh"
          cm_require_node store_corrupt
          export CONTEXT_MODE_STATS_BIN="${HOME}/stats"
          cm_stats_shim "${CONTEXT_MODE_STATS_BIN}"
          export CONTEXT_MODE_LEDGER_DIR="${TEST_DIR}/no-ledger"
          export _CONTEXT_MODE_WIRED=1
          cm_store rows "${HOME}/.context-mode/projects/aaaaaaaaaaaaaaaa/context.db" \
            '[{"session_id":"S0","agent":"claude-code","tool":"Bash","sandbox_bytes":1049600,"returned_bytes":1024}]'
          mkdir -p "${HOME}/.context-mode/projects/bbbbbbbbbbbbbbbb"
          head -c 4096 /dev/urandom > "${HOME}/.context-mode/projects/bbbbbbbbbbbbbbbb/context.db"
          source "${RIOTBOX_DIR}/container/context-mode-summary.sh"

          context_mode_summary_init 2>"${TEST_DIR}/init.err"
          [ "${_CONTEXT_MODE_SUMMARY_BASELINE_UNKNOWN:-}" = "1" ] \
            || { echo "FAIL: a corrupt store at start must be an unknown baseline"; exit 1; }
          # The start read stays quiet: it is in front of the agent, and the
          # exit note below says the same thing once.
          [ ! -s "${TEST_DIR}/init.err" ] \
            || { echo "FAIL: init wrote to stderr: $(cat "${TEST_DIR}/init.err")"; exit 1; }
          rc=0
          out="$(context_mode_summary_print 2>"${TEST_DIR}/err")" || rc=$?
          [ "${rc}" = "0" ] || { echo "FAIL: status ${rc} on a corrupt store"; exit 1; }
          [ -z "${out}" ] || { echo "FAIL: printed past a corrupt store: ${out}"; exit 1; }
          # Silent on stdout, but findable: one stderr line naming the store
          # that stopped the report, so a user can find and remove it.
          bad="${HOME}/.context-mode/projects/bbbbbbbbbbbbbbbb/context.db"
          cat "${TEST_DIR}/err"
          [ "$(wc -l < "${TEST_DIR}/err")" = "1" ] \
            || { echo "FAIL: expected exactly one stderr line: $(cat "${TEST_DIR}/err")"; exit 1; }
          grep -qF "[context-mode] NOTE: exit report skipped, cannot read ${bad}:" "${TEST_DIR}/err" \
            || { echo "FAIL: stderr note does not name the corrupt store"; exit 1; }
          echo "store_corrupt=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex "store_corrupt=(pass|SKIPPED)"

  # The watermark is the store's AUTOINCREMENT counter (sqlite_sequence), not
  # MAX(seq). ctx_purge deletes rows but leaves the counter, so a purge during
  # the run must not make the run's later rows look old. A counter BELOW the
  # watermark means the database was recreated (the dead-project sweep, or a
  # heal) and has not yet grown past the old counter; the run is unknown. A
  # recreated store that has already grown past it is NOT detected — its rows
  # above the watermark are counted as the run's — so this case recreates the
  # store with fewer rows than it had.
  - name: a purge keeps the watermark and a recreated store below it makes the run unknown
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset _CONTEXT_MODE_WIRED CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          RIOTBOX_DIR="{{.riotbox_dir}}"
          source "${RIOTBOX_DIR}/tests/lib/context-mode-store-helpers.sh"
          cm_require_node store_rewind
          export CONTEXT_MODE_STATS_BIN="${HOME}/stats"
          cm_stats_shim "${CONTEXT_MODE_STATS_BIN}"
          export CONTEXT_MODE_LEDGER_DIR="${TEST_DIR}/no-ledger"
          export _CONTEXT_MODE_WIRED=1
          DB="${HOME}/.context-mode/projects/aaaaaaaaaaaaaaaa/context.db"
          row='{"session_id":"S0","agent":"claude-code","tool":"Bash","sandbox_bytes":2048,"returned_bytes":1024}'
          cm_store rows "${DB}" "[${row},${row},${row}]"
          source "${RIOTBOX_DIR}/container/context-mode-summary.sh"

          context_mode_summary_init
          cm_store purge "${DB}"
          cm_store rows "${DB}" "[${row}]"
          out="$(context_mode_summary_print)"
          printf '%s\n' "${out}"
          printf '%s' "${out}" | grep -qx ' this run 1.0 KB kept out · 1 tool call recorded' \
            || { echo "FAIL: a purge must not hide the run's later rows: ${out}"; exit 1; }

          context_mode_summary_init
          rm -f "${DB}" "${DB}-wal" "${DB}-shm"
          cm_store rows "${DB}" "[${row}]"
          out="$(context_mode_summary_print)"
          printf '%s\n' "${out}"
          printf '%s' "${out}" | grep -qx ' this run unknown (no usable baseline) · store total 1.0 KB kept out' \
            || { echo "FAIL: a recreated store must make the run unknown: ${out}"; exit 1; }
          echo "store_rewind=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex "store_rewind=(pass|SKIPPED)"

  # A baseline that is not a map of store keys to counters cannot scope
  # anything. Treating it as "no baseline" would credit the whole store to
  # this run, so the reader refuses it and the report stays silent.
  - name: a malformed watermark is refused, not read as a first run
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset _CONTEXT_MODE_WIRED CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          RIOTBOX_DIR="{{.riotbox_dir}}"
          source "${RIOTBOX_DIR}/tests/lib/context-mode-store-helpers.sh"
          cm_require_node store_bad_watermark
          export CONTEXT_MODE_STATS_BIN="${HOME}/stats"
          cm_stats_shim "${CONTEXT_MODE_STATS_BIN}"
          export CONTEXT_MODE_LEDGER_DIR="${TEST_DIR}/no-ledger"
          export _CONTEXT_MODE_WIRED=1
          cm_store rows "${HOME}/.context-mode/projects/aaaaaaaaaaaaaaaa/context.db" \
            '[{"session_id":"S0","agent":"claude-code","tool":"Bash","sandbox_bytes":1049600,"returned_bytes":1024}]'
          source "${RIOTBOX_DIR}/container/context-mode-summary.sh"
          for wm in '42' '[1]' '"x"' 'null' '{"aaaaaaaaaaaaaaaa":-1}' '{"aaaaaaaaaaaaaaaa":1.5}' '{"aaaaaaaaaaaaaaaa":"1"}' 'not json'; do
            _CONTEXT_MODE_SUMMARY_START="${wm}"
            rc=0
            out="$(context_mode_summary_print 2>&1)" || rc=$?
            [ "${rc}" = "0" ] || { echo "FAIL: status ${rc} for watermark ${wm}"; exit 1; }
            [ -z "${out}" ] || { echo "FAIL: watermark ${wm} printed '${out}'"; exit 1; }
          done
          echo "store_bad_watermark=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex "store_bad_watermark=(pass|SKIPPED)"

  # 2.x journals only shell commands, edits, tool errors and ctx_* calls
  # (journalKind in upstream's hooks/dispatch.ts). A clean Read, Grep or
  # WebFetch writes no events row even when the hook replaces its output; the
  # only trace is the indexed copy in `sources`. The real 2.1.4 hook, fed a
  # 168893-byte Read, leaves exactly that: no events row, one sources row of
  # that size. So the report does not count those savings at all, and its
  # kept-out figure is a lower bound. This case pins the reader's side of it —
  # a sources row is not a saving it can measure — and the image build pins
  # upstream's side with a real Read.
  - name: a replaced Read contributes nothing, so kept out is a lower bound
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset _CONTEXT_MODE_WIRED CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          RIOTBOX_DIR="{{.riotbox_dir}}"
          source "${RIOTBOX_DIR}/tests/lib/context-mode-store-helpers.sh"
          cm_require_node store_replaced_read
          export CONTEXT_MODE_STATS_BIN="${HOME}/stats"
          cm_stats_shim "${CONTEXT_MODE_STATS_BIN}"
          export CONTEXT_MODE_LEDGER_DIR="${TEST_DIR}/no-ledger"
          export _CONTEXT_MODE_WIRED=1
          DB="${HOME}/.context-mode/projects/aaaaaaaaaaaaaaaa/context.db"
          cm_store rows "${DB}" '[]'
          source "${RIOTBOX_DIR}/container/context-mode-summary.sh"
          context_mode_summary_init
          cm_store source "${DB}" \
            '[{"session_id":"S1","agent":"claude-code","kind":"content","label":"Read:#h08870ea2","bytes_total":168893,"chunk_count":3582}]'
          out="$(context_mode_summary_print)"
          printf '%s\n' "${out}"
          printf '%s' "${out}" | grep -qx ' this run 0 B kept out' \
            || { echo "FAIL: a replaced Read was counted: ${out}"; exit 1; }
          echo "store_replaced_read=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex "store_replaced_read=(pass|SKIPPED)"

  # The store cases above skip on a host without Node 24, and that was how
  # they ran in CI before the test image installed one: green, having run
  # nothing. An environment that declares RIOTBOX_REQUIRE_CM_NODE=1 must
  # really provide it, and the test image must keep declaring it beside an
  # install of the same Node the runtime image pins. The two images are
  # separate builds with no shared ARG, so a drift is caught here instead of
  # the suites quietly running on a Node RiotBox does not ship.
  - name: the test image provides the pinned Node the store cases require
    steps:
      - type: exec
        script: |
          set -e
          cd "{{.riotbox_dir}}"
          runtime="$(sed -n 's/^ARG CONTEXT_MODE_NODE=//p' Containerfile)"
          test_pin="$(sed -n 's/^ARG CM_NODE_VERSION=//p' tests/Containerfile.test)"
          [ -n "${runtime}" ] || { echo "FAIL: Containerfile no longer pins CONTEXT_MODE_NODE"; exit 1; }
          [ "${test_pin}" = "${runtime}" ] \
            || { echo "FAIL: tests/Containerfile.test pins Node '${test_pin}', the runtime image pins '${runtime}'"; exit 1; }
          grep -qE '^ENV RIOTBOX_REQUIRE_CM_NODE=1$' tests/Containerfile.test \
            || { echo "FAIL: the test image installs Node but does not declare RIOTBOX_REQUIRE_CM_NODE=1"; exit 1; }
          if [ "${RIOTBOX_REQUIRE_CM_NODE:-0}" = "1" ]; then
            [ "$(node --version 2>/dev/null)" = "v${runtime}" ] \
              || { echo "FAIL: RIOTBOX_REQUIRE_CM_NODE=1 but node on PATH is '$(node --version 2>/dev/null)', not v${runtime}"; exit 1; }
          fi
          echo "node_pin=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "node_pin=pass"
