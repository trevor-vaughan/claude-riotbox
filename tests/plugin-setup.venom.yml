            { echo "FAIL - an unreadable marketplace file must not fail the session"; exit 1; }

          if jq -e '.plugins | has("context-mode@context-mode")' "${installed}" >/dev/null; then
            echo "FAIL - an unreadable marketplace file kept a registry entry this code wrote"; exit 1
          fi
          [ "$(cat "${markets}")" = '{"context-mode":' ] || {
            echo "FAIL - overwrote a marketplace file it could not read"; exit 1; }
          grep -q 'not valid JSON' "${stderr_file}" || {
            echo "FAIL - no warning on stderr"; cat "${stderr_file}"; exit 1; }
          echo "OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "OK"

  # The removal's own give-up branches, which its two unparseable-file cases
  # above do not reach: an ownership filter that cannot run, a cleaned document
  # that cannot be formatted, and a write that cannot land. None is reachable
  # from a JSON document — the filters are type-gated the whole way down
  # precisely so no shape can raise — so these break jq and the filesystem the
  # way the registration's last two cases do.
  #
  # One case each covers both files, unlike the registration's, and that is the
  # asymmetry itself: this function judges the two documents independently and
  # returns at neither, so a hostile condition that applies to both is answered
  # twice in one run. Each case reads stdout as well, because a removal that
  # could not finish must not announce one.

  - name: Removal leaves both files alone when the ownership filter cannot run
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/tests/lib/plugin-setup-test-helpers.sh"
          plugin_setup_test_env off
          export RIOTBOX_CM_PLUGIN_DIR="${HOME}/.riotbox/context-mode-plugin"
          staged="${RIOTBOX_CM_PLUGIN_DIR}/v1.0.169"
          mkdir -p "${HOME}/.claude/plugins"
          installed="${HOME}/.claude/plugins/installed_plugins.json"
          markets="${HOME}/.claude/plugins/known_marketplaces.json"
          jq -n --arg p "${staged}" \
            '{version:2,plugins:{"context-mode@context-mode":[
               {scope:"user",installPath:$p,version:"1.0.169"}]}}' \
            > "${installed}"
          jq -n --arg p "${staged}" \
            '{"context-mode":{source:{source:"github",repo:"mksglu/context-mode"},
                              installLocation:$p,autoUpdate:false}}' \
            > "${markets}"
          before_installed="$(cat "${installed}")"
          before_markets="$(cat "${markets}")"

          # Both entries are plainly ours, so a jq that ran would remove them
          # both: what this case sees is only what the failure spares. The shim
          # refuses the two programs carrying the shared owned() definition and
          # passes the compacting reads through, so each file is read and only
          # its ownership question goes unanswered.
          SHIM="${TEST_DIR}/shim"
          mkdir -p "${SHIM}"
          REAL_JQ="$(command -v jq)"
          export REAL_JQ
          cat > "${SHIM}/jq" <<'SHIMEOF'
          #!/usr/bin/env bash
          for arg in "$@"; do
            case "${arg}" in
            *"owned("*) exit 5 ;;
            esac
          done
          exec "${REAL_JQ}" "$@"
          SHIMEOF
          chmod +x "${SHIM}/jq"
          PATH="${SHIM}:${PATH}"

          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          # shellcheck disable=SC1091
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/lib/progress.sh"
          source "{{.riotbox_dir}}/container/plugin-setup.sh"
          stdout_file="${TEST_DIR}/stdout"
          stderr_file="${TEST_DIR}/stderr"
          context_mode_plugin_unregister >"${stdout_file}" 2>"${stderr_file}" ||
            { echo "FAIL - a jq that cannot filter must not fail the session"; exit 1; }

          [ "$(cat "${installed}")" = "${before_installed}" ] || {
            echo "FAIL - rewrote a registry whose ownership question went unanswered"
            cat "${installed}"; exit 1; }
          [ "$(cat "${markets}")" = "${before_markets}" ] || {
            echo "FAIL - rewrote a marketplace file whose ownership question went unanswered"
            cat "${markets}"; exit 1; }
          [ "$(grep -c 'could not clean' "${stderr_file}")" = "2" ] || {
            echo "FAIL - both files must warn"; cat "${stderr_file}"; exit 1; }
          [ ! -s "${stdout_file}" ] || {
            echo "FAIL - announced a removal that never happened"
            cat "${stdout_file}"; exit 1; }
          echo "OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "OK"

  - name: Removal leaves both files alone when the cleaned document cannot be formatted
    # A step later than the case above: each file's answer is known and is
