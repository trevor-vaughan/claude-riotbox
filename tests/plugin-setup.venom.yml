          before_installed="$(cat "${installed}")"

          # The premise: the registry half has nothing to change. Without it
          # the registry would be formatted first and this would be the case
          # above wearing another name — which the warning check below is what
          # catches, since it names the marketplace file and only that.
          jq -e --arg p "${staged}" \
            '.plugins["context-mode@context-mode"] | any(.installPath == $p)' \
            "${installed}" >/dev/null || {
            echo "FAIL - fixture registry does not already name the staged tree"; exit 1; }

          SHIM="${TEST_DIR}/shim"
          mkdir -p "${SHIM}"
