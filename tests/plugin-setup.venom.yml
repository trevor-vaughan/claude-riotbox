          stderr_file="${TEST_DIR}/stderr"
          context_mode_plugin_register >"${stdout_file}" 2>"${stderr_file}" ||
            { echo "FAIL - a jq that cannot format must not fail the session"; exit 1; }

          [ "$(cat "${markets}")" = '{}' ] || {
            echo "FAIL - wrote a marketplace entry it could not format"
            cat "${markets}"; exit 1; }
          [ "$(cat "${installed}")" = "${before_installed}" ] || {
            echo "FAIL - rewrote the registry on the way past"
            cat "${installed}"; exit 1; }
          grep -q "could not format the Context Mode entry for ${markets}" "${stderr_file}" || {
            echo "FAIL - no warning naming the marketplace file"; cat "${stderr_file}"; exit 1; }
          [ ! -s "${stdout_file}" ] || {
            echo "FAIL - announced a registration that never landed"
