          - result.systemout ShouldContainSubstring "OK"

  - name: An unparseable registry leaves enabledPlugins alone and warns
    # Step 7 reads two hand-editable documents out of the bind-mounted session
    # directory, and this is the first of them. A registry jq cannot parse must
    # leave settings.json exactly as it is and say which file was bad — the
    # refusal every other give-up in this file makes.
    #
    # Called under `set -e`, and deliberately not as the left side of a `||`,
    # which would suppress it: a standalone assignment from a failing command
    # substitution trips errexit, and the shape this replaces did exactly that —
    # abandoning plugin_setup mid-function for every caller that sets it, which
    # is every case in this suite. Reaching the next line at all is half of what
    # this case asserts.
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/tests/lib/plugin-setup-test-helpers.sh"
          plugin_setup_test_env off
          mkdir -p "${HOME}/.claude/plugins"
          settings="${HOME}/.claude/settings.json"
          registry="${HOME}/.claude/plugins/installed_plugins.json"
          # Written the way jq prints it, so step 6's own rewrite of this file is
          # byte-for-byte a no-op and any difference below is step 7's doing.
          jq -n '{promptSuggestionEnabled:false,autoCompact:true}' > "${settings}"
          printf '{"version":2,"plugins":{' > "${registry}"
          before_settings="$(cat "${settings}")"

          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          # shellcheck disable=SC1091
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/lib/progress.sh"
          source "{{.riotbox_dir}}/container/plugin-setup.sh"
          stderr_file="${TEST_DIR}/stderr"
          plugin_setup >/dev/null 2>"${stderr_file}"

          [ "$(cat "${settings}")" = "${before_settings}" ] || {
            echo "FAIL - rewrote settings.json from a registry it could not read"
            cat "${settings}"; exit 1; }
          # Exact line, because context_mode_plugin_unregister warns about this
          # same file on this same fixture and the two must not be confused for
          # each other.
          want="  [plugins] WARNING: ${registry} is not valid JSON or does not list its plugins as an object — enabledPlugins left as it was."
          grep -q -F -x "${want}" "${stderr_file}" || {
            echo "FAIL - no warning naming the registry"; cat "${stderr_file}"; exit 1; }
          echo "OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "OK"

  - name: A registry that is not an object leaves enabledPlugins alone and warns
    # Parseable, and still not the document this step reads. `.plugins` against a
    # top-level array raises rather than answering false, so what the read has to
    # survive here is jq exiting non-zero on a file that parsed perfectly well.
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/tests/lib/plugin-setup-test-helpers.sh"
          plugin_setup_test_env off
          mkdir -p "${HOME}/.claude/plugins"
          settings="${HOME}/.claude/settings.json"
          registry="${HOME}/.claude/plugins/installed_plugins.json"
          jq -n '{promptSuggestionEnabled:false,autoCompact:true}' > "${settings}"
          echo '[]' > "${registry}"
          before_settings="$(cat "${settings}")"

          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          # shellcheck disable=SC1091
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/lib/progress.sh"
          source "{{.riotbox_dir}}/container/plugin-setup.sh"
          stderr_file="${TEST_DIR}/stderr"
          plugin_setup >/dev/null 2>"${stderr_file}"

          [ "$(cat "${settings}")" = "${before_settings}" ] || {
            echo "FAIL - rewrote settings.json from a registry it could not read"
            cat "${settings}"; exit 1; }
          want="  [plugins] WARNING: ${registry} is not valid JSON or does not list its plugins as an object — enabledPlugins left as it was."
          grep -q -F -x "${want}" "${stderr_file}" || {
            echo "FAIL - no warning naming the registry"; cat "${stderr_file}"; exit 1; }
          echo "OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "OK"

  - name: A registry whose plugins are an array is not read as an empty plugin list
    # The one wrong shape that raises nothing on its own: `keys` answers on an
    # array — with its indices — so an ungated filter reads {"plugins":[]} as a
    # plugin list with nothing in it, and a non-empty array as a list keyed by
    # numbers. A document this step cannot read is not the same fact as a session
    # with no plugins installed, and only one of the two is worth writing
    # settings.json off.
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/tests/lib/plugin-setup-test-helpers.sh"
          plugin_setup_test_env off
          mkdir -p "${HOME}/.claude/plugins"
          settings="${HOME}/.claude/settings.json"
          registry="${HOME}/.claude/plugins/installed_plugins.json"
          jq -n '{promptSuggestionEnabled:false,autoCompact:true}' > "${settings}"
          echo '{"version":2,"plugins":[]}' > "${registry}"
          before_settings="$(cat "${settings}")"

          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          # shellcheck disable=SC1091
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/lib/progress.sh"
          source "{{.riotbox_dir}}/container/plugin-setup.sh"
          stderr_file="${TEST_DIR}/stderr"
          plugin_setup >/dev/null 2>"${stderr_file}"

          [ "$(cat "${settings}")" = "${before_settings}" ] || {
            echo "FAIL - wrote settings.json off a registry shape it cannot read"
            cat "${settings}"; exit 1; }
          if jq -e 'has("enabledPlugins")' "${settings}" >/dev/null; then
            echo "FAIL - synced an enable map from a plugins array"; exit 1
          fi
          want="  [plugins] WARNING: ${registry} is not valid JSON or does not list its plugins as an object — enabledPlugins left as it was."
          grep -q -F -x "${want}" "${stderr_file}" || {
            echo "FAIL - no warning naming the registry"; cat "${stderr_file}"; exit 1; }
          echo "OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "OK"

  - name: A settings.json step 7 cannot parse is left exactly as it is
    # The second of the two documents, and the one the sync writes back. It is
    # hand-editable in the same session directory, so a document jq cannot read is
    # left alone and named.
    #
    # Not called under `set -e`, unlike the cases above: step 6 rewrites
    # settings.json through a redirect of its own and fails on this same fixture,
    # which aborts an errexit caller before step 7 is reached at all.
    # container/entrypoint.sh does not set it, so this is the caller shape that
    # reaches this branch in production. Step 6's own failed redirect is also why
    # this case says nothing about staging files — that one is not step 7's.
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/tests/lib/plugin-setup-test-helpers.sh"
          plugin_setup_test_env off
          mkdir -p "${HOME}/.claude/plugins"
          settings="${HOME}/.claude/settings.json"
          registry="${HOME}/.claude/plugins/installed_plugins.json"
          printf '{"promptSuggestionEnabled":false,' > "${settings}"
          jq -n '{version:2,plugins:{"demo@market":[
                   {scope:"user",installPath:"/opt/demo",version:"1.0.0"}]}}' \
            > "${registry}"
          before_settings="$(cat "${settings}")"

          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          # shellcheck disable=SC1091
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/lib/progress.sh"
          source "{{.riotbox_dir}}/container/plugin-setup.sh"
          declare -F plugin_setup >/dev/null || {
            echo "FAIL - plugin_setup is not defined"; exit 1; }
          stderr_file="${TEST_DIR}/stderr"
          set +e
          plugin_setup >/dev/null 2>"${stderr_file}"
          rc=$?
          set -e
          [ "${rc}" = "0" ] || {
            echo "FAIL - a settings.json it cannot read must not fail the session (rc=${rc})"
            cat "${stderr_file}"; exit 1; }

          [ "$(cat "${settings}")" = "${before_settings}" ] || {
            echo "FAIL - overwrote a settings.json it could not read"
            cat "${settings}"; exit 1; }
          want="  [plugins] WARNING: ${settings} is not valid JSON — enabledPlugins not synced."
          grep -q -F -x "${want}" "${stderr_file}" || {
            echo "FAIL - no warning naming settings.json"; cat "${stderr_file}"; exit 1; }
          echo "OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "OK"

  - name: A settings.json it cannot write warns and leaves the file alone
    # The failure this step cannot see coming, and the one it only has because the
    # write goes through json_write_atomic: the helper stages its replacement
    # inside the target's own directory, so a directory nothing may create files
    # in is what fails it — the shape a read-only mount of the session directory
    # has, and one that leaves settings.json perfectly readable so the reads above
    # still succeed.
    #
    # Not under `set -e`, for the reason the case above gives: step 6 writes
    # settings.json first and cannot write it here either.
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'chmod u+w "${TEST_DIR}/.claude" 2>/dev/null || true; rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/tests/lib/plugin-setup-test-helpers.sh"
          plugin_setup_test_env off
          plugin_setup_test_needs_unprivileged || exit 1
          mkdir -p "${HOME}/.claude/plugins"
          settings="${HOME}/.claude/settings.json"
          registry="${HOME}/.claude/plugins/installed_plugins.json"
          jq -n '{promptSuggestionEnabled:false,autoCompact:true}' > "${settings}"
          jq -n '{version:2,plugins:{"demo@market":[
                   {scope:"user",installPath:"/opt/demo",version:"1.0.0"}]}}' \
            > "${registry}"
          before_settings="$(cat "${settings}")"

          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          # shellcheck disable=SC1091
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/lib/progress.sh"
          source "{{.riotbox_dir}}/container/plugin-setup.sh"
          declare -F plugin_setup >/dev/null || {
            echo "FAIL - plugin_setup is not defined"; exit 1; }
          stderr_file="${TEST_DIR}/stderr"
          chmod a-w "${HOME}/.claude"
          set +e
          plugin_setup >/dev/null 2>"${stderr_file}"
          rc=$?
          set -e
          chmod u+w "${HOME}/.claude"
          [ "${rc}" = "0" ] || {
            echo "FAIL - an unwritable settings.json must not fail the session (rc=${rc})"
            cat "${stderr_file}"; exit 1; }

          [ "$(cat "${settings}")" = "${before_settings}" ] || {
            echo "FAIL - settings.json changed under a failed write"
            cat "${settings}"; exit 1; }
          want="  [plugins] WARNING: could not write ${settings} — enabledPlugins not synced."
          grep -q -F -x "${want}" "${stderr_file}" || {
            echo "FAIL - no warning naming the write it could not make"
            cat "${stderr_file}"; exit 1; }
          echo "OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "OK"

  - name: A sync it cannot make leaves no staging file behind
    # The shape this replaces opened settings.json.tmp before jq ran, so a read it
    # could not make still left an empty staging file in ~/.claude — a bind mount
    # of the user's host session directory, where the litter outlives the
    # container that made it.
    #
    # Reached without `set -e` because that is the only caller shape that gets
    # there: an errexit caller is abandoned at the failing read, before the write
    # that drops the file. container/entrypoint.sh is that caller.
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/tests/lib/plugin-setup-test-helpers.sh"
          plugin_setup_test_env off
          mkdir -p "${HOME}/.claude/plugins"
          settings="${HOME}/.claude/settings.json"
          registry="${HOME}/.claude/plugins/installed_plugins.json"
          jq -n '{promptSuggestionEnabled:false,autoCompact:true}' > "${settings}"
          printf '{"version":2,"plugins":{' > "${registry}"

          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          # shellcheck disable=SC1091
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/lib/progress.sh"
          source "{{.riotbox_dir}}/container/plugin-setup.sh"
          declare -F plugin_setup >/dev/null || {
            echo "FAIL - plugin_setup is not defined"; exit 1; }
          set +e
          plugin_setup >/dev/null 2>/dev/null
          rc=$?
          set -e

          # Every staging name, not just the fixed one: json_write_atomic names
          # its own settings.json.XXXXXX in the same directory and must clean up
          # after itself too.
          leftovers="$(find "${HOME}/.claude" -maxdepth 1 -name 'settings.json.*')"
          [ -z "${leftovers}" ] || {
            echo "FAIL - left a staging file behind: ${leftovers}"; exit 1; }
          [ "${rc}" = "0" ] || {
            echo "FAIL - a registry it cannot read must not fail the session (rc=${rc})"; exit 1; }
          echo "OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "OK"
