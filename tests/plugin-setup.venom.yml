          before_installed="$(cat "${installed}")"
          before_markets="$(cat "${markets}")"

          SHIM="${TEST_DIR}/shim"
          mkdir -p "${SHIM}"
          REAL_JQ="$(command -v jq)"
          export REAL_JQ
          cat > "${SHIM}/jq" <<'SHIMEOF'
          #!/usr/bin/env bash
