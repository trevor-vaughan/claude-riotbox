          - result.systemout ShouldContainSubstring "OK"

  - name: Removal still answers each file's ownership question on its own evidence
    # The asymmetry between the two functions, pinned so it is not "fixed" into
    # symmetry. Registration records one fact in two files and so refuses both
    # halves together; removal asks two questions — is this registry entry ours,
    # is this marketplace entry ours — that a host merge can legitimately answer
    # differently. A marketplace file no answer can be read out of must not keep
    # a registry entry this code can prove it wrote, because that entry is the
    # one that surfaces a plugin whose hooks then fail to load.
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/tests/lib/plugin-setup-test-helpers.sh"
          plugin_setup_test_env off
          export RIOTBOX_CM_PLUGIN_DIR="${HOME}/.riotbox/context-mode-plugin"
          mkdir -p "${HOME}/.claude/plugins"
          installed="${HOME}/.claude/plugins/installed_plugins.json"
          markets="${HOME}/.claude/plugins/known_marketplaces.json"
          jq -n --arg p "${RIOTBOX_CM_PLUGIN_DIR}/v1.0.169" \
            '{version:2,plugins:{"context-mode@context-mode":[
               {scope:"user",installPath:$p,version:"1.0.169"}]}}' \
            > "${installed}"
          printf '{"context-mode":' > "${markets}"

          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          # shellcheck disable=SC1091
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/lib/progress.sh"
          source "{{.riotbox_dir}}/container/plugin-setup.sh"
          stderr_file="${TEST_DIR}/stderr"
