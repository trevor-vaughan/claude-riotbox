          - result.systemout ShouldContainSubstring "OK"

  - name: A registry it cannot write leaves the marketplace unwritten too
    # The last of the four, and the only one the code cannot see coming: the
    # write is where a read-only bind mount, a full filesystem, or a session
    # directory the container cannot write shows up. The marketplace half is
    # formatted and waiting at this point, and must not go out alone.
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'chmod u+w "${TEST_DIR}/.claude/plugins" 2>/dev/null || true; rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/tests/lib/plugin-setup-test-helpers.sh"
          plugin_setup_test_env on
          plugin_setup_test_needs_unprivileged || exit 1
          export RIOTBOX_CM_PLUGIN_DIR="${HOME}/.riotbox/context-mode-plugin"
          staged="${RIOTBOX_CM_PLUGIN_DIR}/v1.0.169"
          mkdir -p "${staged}" "${HOME}/.claude/plugins"
          echo '{"name":"context-mode","version":"1.0.169"}' > "${staged}/package.json"
          installed="${HOME}/.claude/plugins/installed_plugins.json"
          markets="${HOME}/.claude/plugins/known_marketplaces.json"
          echo '{"version":2,"plugins":{}}' > "${installed}"
          echo '{}' > "${markets}"
          before_installed="$(cat "${installed}")"
          before_markets="$(cat "${markets}")"

          # json_write_atomic stages its replacement inside the target's own
          # directory, so a directory nothing may create files in is what fails
          # it — the shape a read-only mount of the session directory has, and
          # one that leaves both documents readable so the reads still succeed.
          chmod a-w "${HOME}/.claude/plugins"

          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          # shellcheck disable=SC1091
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/lib/progress.sh"
          source "{{.riotbox_dir}}/container/plugin-setup.sh"
          stdout_file="${TEST_DIR}/stdout"
          stderr_file="${TEST_DIR}/stderr"
          context_mode_plugin_register >"${stdout_file}" 2>"${stderr_file}" ||
            { chmod u+w "${HOME}/.claude/plugins"
              echo "FAIL - an unwritable registry must not fail the session"; exit 1; }
          chmod u+w "${HOME}/.claude/plugins"

          [ "$(cat "${installed}")" = "${before_installed}" ] || {
            echo "FAIL - the registry changed under a failed write"
            cat "${installed}"; exit 1; }
          [ "$(cat "${markets}")" = "${before_markets}" ] || {
            echo "FAIL - wrote the marketplace half after the registry half failed"
            cat "${markets}"; exit 1; }
          # Both writes target the same directory, so an unchanged marketplace
          # file cannot tell "never attempted" from "attempted and failed too".
          # Its warning is what separates them, and its absence is the claim
          # this case's name makes.
          if grep -q "could not write ${markets}" "${stderr_file}"; then
            echo "FAIL - attempted the marketplace write after the registry write failed"
            cat "${stderr_file}"; exit 1
          fi
          grep -q "could not write ${installed}" "${stderr_file}" || {
            echo "FAIL - no warning naming the registry"; cat "${stderr_file}"; exit 1; }
          [ ! -s "${stdout_file}" ] || {
            echo "FAIL - announced a registration that never landed"
            cat "${stdout_file}"; exit 1; }
          echo "OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "OK"

  - name: A marketplace file it cannot write leaves the registry as it found it
