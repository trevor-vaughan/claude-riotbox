name: libexec/worktree-prompt.sh — linked-worktree warning
vars:
  root: "."
  riotbox_dir: "{{.root}}"

# Pins worktree_prompt: a plain repo, a submodule-style repo (git dir == common
# dir) and a non-repo are silent no-ops; a linked worktree prints the main
# checkout and, on a TTY, asks [y/N] (default No aborts). Without a TTY it
# warns and continues. The interactive cases use `script` to allocate a pty.
# git runs with the caller's config disabled.

testcases:
  - name: silent for a plain repo and a non-repo
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null
          export GIT_AUTHOR_NAME=riotbox-test GIT_AUTHOR_EMAIL=riotbox-test@invalid
          export GIT_COMMITTER_NAME=riotbox-test GIT_COMMITTER_EMAIL=riotbox-test@invalid
          tmp="$(mktemp -d)"; trap 'rm -rf "${tmp}"' EXIT
          git init -q "${tmp}/repo"; mkdir "${tmp}/plain"
          source "{{.riotbox_dir}}/libexec/worktree-prompt.sh"
          for d in "${tmp}/repo" "${tmp}/plain"; do
            out="$(RIOTBOX_PROJECTS="${d}" worktree_prompt 2>&1 </dev/null)"
            [ -z "${out}" ] || { echo "BAD: output for ${d}: ${out}" >&2; exit 1; }
          done
          echo OK
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "OK"

  - name: non-TTY warns naming the main checkout and continues
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null
          export GIT_AUTHOR_NAME=riotbox-test GIT_AUTHOR_EMAIL=riotbox-test@invalid
          export GIT_COMMITTER_NAME=riotbox-test GIT_COMMITTER_EMAIL=riotbox-test@invalid
          tmp="$(mktemp -d)"; trap 'rm -rf "${tmp}"' EXIT
          git init -q "${tmp}/main"
          git -C "${tmp}/main" commit -q --allow-empty -m i
          git -C "${tmp}/main" worktree add -q "${tmp}/wt" -b wt
          mkdir "${tmp}/wt/sub"
          source "{{.riotbox_dir}}/libexec/worktree-prompt.sh"
          for d in "${tmp}/wt" "${tmp}/wt/sub"; do
            out="$(RIOTBOX_PROJECTS="${d}" worktree_prompt 2>&1 </dev/null)"
            echo "${out}" | grep -q "worktree of $(cd "${tmp}/main" && pwd -P)" \
              || { echo "BAD: main root not named for ${d}: ${out}" >&2; exit 1; }
            echo "${out}" | grep -q "not a TTY" || { echo "BAD: no notice" >&2; exit 1; }
          done
          echo OK
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "OK"

  - name: TTY prompt continues on "y"
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null
          export GIT_AUTHOR_NAME=riotbox-test GIT_AUTHOR_EMAIL=riotbox-test@invalid
          export GIT_COMMITTER_NAME=riotbox-test GIT_COMMITTER_EMAIL=riotbox-test@invalid
          tmp="$(mktemp -d)"; trap 'rm -rf "${tmp}"' EXIT
          git init -q "${tmp}/main"
          git -C "${tmp}/main" commit -q --allow-empty -m i
          git -C "${tmp}/main" worktree add -q "${tmp}/wt" -b wt
          out="$(printf 'y\n' | script -qe -c \
            "source '{{.riotbox_dir}}/libexec/worktree-prompt.sh'; RIOTBOX_PROJECTS='${tmp}/wt' worktree_prompt; echo RC=\$?" \
            /dev/null)"
          echo "${out}" | grep -q "Continue in the current directory? \[y/N\]" || { echo "BAD: no prompt: ${out}" >&2; exit 1; }
          echo "${out}" | grep -q "RC=0" || { echo "BAD: did not continue on y: ${out}" >&2; exit 1; }
          echo OK
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "OK"

  - name: TTY prompt aborts on empty answer and on "n"
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null
          export GIT_AUTHOR_NAME=riotbox-test GIT_AUTHOR_EMAIL=riotbox-test@invalid
          export GIT_COMMITTER_NAME=riotbox-test GIT_COMMITTER_EMAIL=riotbox-test@invalid
          tmp="$(mktemp -d)"; trap 'rm -rf "${tmp}"' EXIT
          git init -q "${tmp}/main"
          git -C "${tmp}/main" commit -q --allow-empty -m i
          git -C "${tmp}/main" worktree add -q "${tmp}/wt" -b wt
          for answer in '' n; do
            out="$(printf '%s\n' "${answer}" | script -qe -c \
              "source '{{.riotbox_dir}}/libexec/worktree-prompt.sh'; RIOTBOX_PROJECTS='${tmp}/wt' worktree_prompt; echo RC=\$?" \
              /dev/null)"
            echo "${out}" | grep -q "RC=1" || { echo "BAD: did not abort on '${answer}': ${out}" >&2; exit 1; }
            echo "${out}" | grep -q "Aborted" || { echo "BAD: no abort message" >&2; exit 1; }
          done
          echo OK
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "OK"
