  - name: wrapper_inject passes argv through and flags headless runs with CI=true
    steps:
      - type: exec
        script: |
          set -euo pipefail
          T="$(mktemp -d)"; trap 'rm -rf "${T}"' EXIT
          source "{{.riotbox_dir}}/agents/registry.sh"
          check() { # $1 = want CI (0/1), rest = argv
            local want="$1"; shift
            local -a out=()
            local i
            printf '' > "${T}/env"; export RIOTBOX_INJECT_ENV_FILE="${T}/env"
            mapfile -d '' -t out < <(agent_call pi wrapper_inject "$@")
            [[ "${#out[@]}" -eq "$#" ]] || { echo "FAIL: argc ${#out[@]} != $# for $*"; exit 1; }
            for ((i = 0; i < $#; i++)); do
              [[ "${out[i]}" == "${@:i+1:1}" ]] || { echo "FAIL: token ${i} changed for $*"; exit 1; }
            done
            if [[ "${want}" == 1 ]]; then
              grep -qxF 'CI=true' "${T}/env" || { echo "FAIL: no CI for $*"; exit 1; }
            else
              [[ ! -s "${T}/env" ]] || { echo "FAIL: CI set for $*"; exit 1; }
            fi
          }
          check 1 -p -- "hello"
          check 1 -p -- $'two words\nand a line'
          check 1 --print "hello"
          check 1 --mode json "hello"
          check 1 --mode rpc
          check 0 --mode=rpc
          check 0 --mode=json
          check 0
          check 0 -c
          check 0 -- "-p"
          check 0 -c -- "-p"
          check 0 --model json
          echo "INJECT_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "INJECT_OK"

  - name: host_sync reads PI_CODING_AGENT_DIR when set, else ~/.pi/agent
    steps:
      - type: exec
        script: |
          set -euo pipefail
          T="$(mktemp -d)"; trap 'rm -rf "${T}"' EXIT
          export HOME="${T}/home"
          unset CONTEXT_MODE_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED CONTEXT_MODE_DATA_DIR CONTEXT_MODE_PLATFORM
          mkdir -p "${HOME}/.pi/agent" "${T}/relocated"
          echo default > "${HOME}/.pi/agent/AGENTS.md"
          echo relocated > "${T}/relocated/AGENTS.md"
          source "{{.riotbox_dir}}/agents/registry.sh"
          unset PI_CODING_AGENT_DIR
          # host_sync <session_dir> <state_dir>: Pi writes only under the state dir.
          mkdir -p "${T}/session"
          agent_call pi host_sync "${T}/session" "${T}/s1" >/dev/null
          [[ "$(cat "${T}/s1/pi-agent/AGENTS.md")" == default ]] || { echo "FAIL: default dir not used"; exit 1; }
          PI_CODING_AGENT_DIR="${T}/relocated" agent_call pi host_sync "${T}/session" "${T}/s2" >/dev/null
          [[ "$(cat "${T}/s2/pi-agent/AGENTS.md")" == relocated ]] || { echo "FAIL: PI_CODING_AGENT_DIR ignored"; exit 1; }
          PI_CODING_AGENT_DIR="" agent_call pi host_sync "${T}/session" "${T}/s3" >/dev/null
          [[ "$(cat "${T}/s3/pi-agent/AGENTS.md")" == default ]] || { echo "FAIL: empty PI_CODING_AGENT_DIR not defaulted"; exit 1; }
          mkdir -p "${HOME}/relocated"; echo tilde > "${HOME}/relocated/AGENTS.md"
          PI_CODING_AGENT_DIR='~/relocated' agent_call pi host_sync "${T}/session" "${T}/s4" >/dev/null
          [[ "$(cat "${T}/s4/pi-agent/AGENTS.md")" == tilde ]] || { echo "FAIL: leading ~/ not expanded"; exit 1; }
          (cd "${T}" && PI_CODING_AGENT_DIR='relocated' agent_call pi host_sync "${T}/session" "${T}/s5" >/dev/null)
          [[ "$(cat "${T}/s5/pi-agent/AGENTS.md")" == relocated ]] || { echo "FAIL: relative dir not resolved against PWD"; exit 1; }
          [[ -z "$(ls -A "${T}/session")" ]] || { echo "FAIL: host_sync wrote into the session dir"; exit 1; }
          echo "HOST_SYNC_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "HOST_SYNC_OK"

  - name: pi declares the same provider keys as opencode, so the passthrough union does not widen
    steps:
      - type: exec
        script: |
          set -euo pipefail
          source "{{.riotbox_dir}}/agents/registry.sh"
          [[ -n "$(agent_call pi env_vars)" ]] || { echo "FAIL: pi env_vars empty"; exit 1; }
          diff <(agent_call pi env_vars | sort) <(agent_call opencode env_vars | sort) \
            || { echo "FAIL: pi env_vars differ from opencode's"; exit 1; }
          echo "ENV_VARS_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "ENV_VARS_OK"

  - name: the Containerfile installs Pi core from upstream's per-release lock and gates it on the smoke
    steps:
      - type: exec
        script: |
          set -euo pipefail
          cf="{{.riotbox_dir}}/Containerfile"
          for needle in \
            'ARG PI_NODE=' \
            'COPY --chown=llm:llm container/pi/ /tmp/riotbox-pi/' \
            'https://pi.dev/api/installer/releases/${ver}/package.json' \
            'https://pi.dev/api/installer/releases/${ver}/package-lock.json' \
            'npm ci --ignore-scripts --omit=dev --no-audit --no-fund' \
            'npm ci --ignore-scripts --omit=dev --legacy-peer-deps --no-audit --no-fund' \
            '/tmp/riotbox-pi/smoke.mjs' \
            'ENV RIOTBOX_PI_DIR=/home/llm/.riotbox/pi'; do
            grep -qF -- "${needle}" "${cf}" || { echo "FAIL: Containerfile lacks: ${needle}"; exit 1; }
          done
          bust="$(grep -nF 'ARG LLM_TOOL_UPDATE' "${cf}" | head -1 | cut -d: -f1)" || true
          pi="$(grep -nF 'ARG PI_NODE=' "${cf}" | head -1 | cut -d: -f1)" || true
          [[ -n "${bust}" ]] || { echo "FAIL: Containerfile has no ARG LLM_TOOL_UPDATE"; exit 1; }
          [[ -n "${pi}" ]] || { echo "FAIL: Containerfile has no ARG PI_NODE="; exit 1; }
          (( pi > bust )) || { echo "FAIL: Pi layer precedes LLM_TOOL_UPDATE — riotbox update would not refresh Pi"; exit 1; }
          echo "CONTAINERFILE_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "CONTAINERFILE_OK"

  - name: the image installs fd so Pi never downloads it at runtime
    steps:
      - type: exec
        script: |
          set -euo pipefail
          grep -qE '^[[:space:]]+ripgrep fd-find bats' "{{.riotbox_dir}}/Containerfile" \
            || { echo "FAIL: the system dnf line does not install fd-find"; exit 1; }
          echo "FD_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "FD_OK"

  - name: lock-integrity.sh fills missing integrity from the registry and rejects tampered or non-registry entries
    steps:
      - type: exec
        script: |
          set -euo pipefail
          script="{{.riotbox_dir}}/container/pi/lock-integrity.sh"
          T="$(mktemp -d)"
          trap 'rm -rf "${T}"' EXIT
          mkdir -p "${T}/bin"
          # Stub npm: answers `npm view <name>@<version> dist.integrity` for the
          # two fixture entries that lack integrity, logs every call, and prints
          # nothing when STUB_EMPTY=1 (the registry returned no hash).
          cat > "${T}/bin/npm" <<'STUB'
          #!/usr/bin/env bash
          printf '%s\n' "$*" >> "${STUB_LOG}"
          [[ "${STUB_EMPTY:-0}" == 1 ]] && exit 0
          case "$*" in
            "view -- @scope/core@1.2.0 dist.integrity") echo "sha512-c3R1Yi1jb3Jl" ;;
            "view -- nested@3.1.0 dist.integrity") echo "sha512-c3R1Yi1uZXN0ZWQ=" ;;
            *) echo "stub npm: unexpected call: $*" >&2; exit 1 ;;
          esac
          STUB
          chmod +x "${T}/bin/npm"
          export PATH="${T}/bin:${PATH}" STUB_LOG="${T}/npm.log"
          fixture() {
            jq -n '{packages: {
              "": {name: "root", version: "1.0.0"},
              "node_modules/@scope/core": {version: "1.2.0", resolved: "https://registry.npmjs.org/@scope/core/-/core-1.2.0.tgz"},
              "node_modules/plain": {version: "2.0.0", resolved: "https://registry.npmjs.org/plain/-/plain-2.0.0.tgz", integrity: "sha512-RVhJU1RJTkc="},
              "node_modules/@scope/core/node_modules/nested": {version: "3.1.0", resolved: "https://registry.npmjs.org/nested/-/nested-3.1.0.tgz"}
            }}' > "${T}/lock.json"
            cp "${T}/lock.json" "${T}/orig.json"
            : > "${STUB_LOG}"
          }
          # Runs the script; leaves its stderr in ${err} and its status in ${rc}.
          run() {
            rc=0
            err="$(bash "${script}" "${T}/lock.json" 2>&1 >/dev/null)" || rc=$?
          }

          fixture
          run
          [[ "${rc}" -eq 0 ]] || { echo "FAIL: fill case exited ${rc}: ${err}"; exit 1; }
          [[ "$(jq -r '.packages["node_modules/@scope/core"].integrity' "${T}/lock.json")" == "sha512-c3R1Yi1jb3Jl" ]] \
            || { echo "FAIL: @scope/core integrity not filled from npm view"; exit 1; }
          [[ "$(jq -r '.packages["node_modules/@scope/core/node_modules/nested"].integrity' "${T}/lock.json")" == "sha512-c3R1Yi1uZXN0ZWQ=" ]] \
            || { echo "FAIL: nested entry integrity not filled under its own name"; exit 1; }
          [[ "$(jq -r '.packages["node_modules/plain"].integrity' "${T}/lock.json")" == "sha512-RVhJU1RJTkc=" ]] \
            || { echo "FAIL: an existing integrity was changed"; exit 1; }
          if grep -q plain "${STUB_LOG}"; then echo "FAIL: npm was queried for an entry that already had integrity"; exit 1; fi

          fixture
          jq '.packages["node_modules/plain"].resolved = "https://evil.example/plain/-/plain-2.0.0.tgz"' "${T}/orig.json" > "${T}/lock.json"
          cp "${T}/lock.json" "${T}/orig.json"
          run
          [[ "${rc}" -ne 0 ]] || { echo "FAIL: a non-registry resolved was accepted"; exit 1; }
          [[ "${err}" == *"node_modules/plain"* ]] || { echo "FAIL: non-registry error does not name the entry: ${err}"; exit 1; }
          cmp -s "${T}/lock.json" "${T}/orig.json" || { echo "FAIL: the lock was rewritten despite a rejected entry"; exit 1; }

          fixture
          jq '.packages["node_modules/@scope/core"].resolved = "https://registry.npmjs.org/@scope/core/-/core-1.0.4.tgz"' "${T}/orig.json" > "${T}/lock.json"
          cp "${T}/lock.json" "${T}/orig.json"
          run
          [[ "${rc}" -ne 0 ]] || { echo "FAIL: a tarball for another version was accepted"; exit 1; }
          [[ "${err}" == *"node_modules/@scope/core"* ]] || { echo "FAIL: version mismatch error does not name the entry: ${err}"; exit 1; }
          cmp -s "${T}/lock.json" "${T}/orig.json" || { echo "FAIL: the lock was rewritten despite a version mismatch"; exit 1; }

          fixture
          rc=0
          err="$(STUB_EMPTY=1 bash "${script}" "${T}/lock.json" 2>&1 >/dev/null)" || rc=$?
          [[ "${rc}" -ne 0 ]] || { echo "FAIL: an empty npm view answer was accepted"; exit 1; }
          [[ "${err}" == *"@scope/core@1.2.0"* ]] || { echo "FAIL: empty-integrity error does not name the package: ${err}"; exit 1; }
          cmp -s "${T}/lock.json" "${T}/orig.json" || { echo "FAIL: the lock was rewritten despite a missing hash"; exit 1; }
          # Malformed keys and versions are rejected before any field splitting
          # or npm call: a 0x1f in a key could forge the fields after it, a
          # newline could split one record into two, a key starting with `--`
          # would reach npm as an option, and a range is not a tarball version.
          # Each case names the entry (JSON-escaped) and leaves the lock as is.
          reject() {
            local label="$1" filter="$2" want="$3"
            fixture
            jq "${filter}" "${T}/orig.json" > "${T}/lock.json"
            cp "${T}/lock.json" "${T}/orig.json"
            run
            [[ "${rc}" -ne 0 ]] || { echo "FAIL: ${label} was accepted"; exit 1; }
            [[ "${err}" == *"${want}"* ]] || { echo "FAIL: ${label} error does not name ${want}: ${err}"; exit 1; }
            cmp -s "${T}/lock.json" "${T}/orig.json" || { echo "FAIL: the lock was rewritten despite ${label}"; exit 1; }
            [[ ! -s "${STUB_LOG}" ]] || { echo "FAIL: npm was called despite ${label}: $(cat "${STUB_LOG}")"; exit 1; }
          }
          reject "a key containing 0x1f" \
            '.packages["node_modules/evil\u001f1.0.0\u001fhttps://registry.npmjs.org/evil/-/evil-1.0.0.tgz\u001fsha512-Zm9yZ2Vk"] = {version: "9.9.9", resolved: "https://evil.example/x.tgz"}' \
            '"node_modules/evil\u001f1.0.0'
          reject "a key containing a newline" \
            '.packages["node_modules/evil\nnode_modules/plain"] = {version: "2.0.0", resolved: "https://registry.npmjs.org/plain/-/plain-2.0.0.tgz"}' \
            '"node_modules/evil\nnode_modules/plain"'
          reject "a key ending in a newline" \
            '.packages["node_modules/plain\n"] = {version: "2.0.0", resolved: "https://registry.npmjs.org/plain/-/plain-2.0.0.tgz"}' \
            '"node_modules/plain\n"'
          reject "an option-shaped key" \
            '.packages["node_modules/--registry=http://x"] = {version: "1.0.0", resolved: "https://registry.npmjs.org/--registry=http://x/-/x-1.0.0.tgz"}' \
            '"node_modules/--registry=http://x"'
          reject "a resolved URL with a 0x1f suffix" \
            '.packages["node_modules/@scope/core"].resolved += "\u001f "' \
            '"node_modules/@scope/core"'
          reject "a sha1 integrity" \
            '.packages["node_modules/plain"].integrity = "sha1-c2hhMQ=="' \
            '"node_modules/plain"'
          reject "a non-string integrity" \
            '.packages["node_modules/plain"].integrity = 123' \
            '"node_modules/plain"'
          reject "a version range" \
            '.packages["node_modules/@scope/core"].version = "^1.2.0"' \
            '"node_modules/@scope/core"'
          echo "LOCK_INTEGRITY_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "LOCK_INTEGRITY_OK"

  - name: README documents each pinned Pi extension at its pinned version
    steps:
      - type: exec
        script: |
          set -euo pipefail
          while IFS=$'\t' read -r name version; do
            grep -qF "\`${name}@${version}\`" "{{.riotbox_dir}}/README.md" \
              || { echo "FAIL: README lacks \`${name}@${version}\`"; exit 1; }
          done < <(jq -r '.dependencies | to_entries[] | "\(.key)\t\(.value)"' "{{.riotbox_dir}}/container/pi/package.json")
          echo "README_PINS_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "README_PINS_OK"
