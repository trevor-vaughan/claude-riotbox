name: pi agent — pins, host sync, container setup, manifest
vars:
  root: "."
  riotbox_dir: "{{.root}}"

# Pi core floats (installed at build time from pi.dev's per-release lock);
# the extensions are pinned here. See docs/dev/decisions/pi-support.md.

testcases:
  - name: the extension manifest pins exact versions that the lock resolves
    steps:
      - type: exec
        script: |
          set -euo pipefail
          cd "{{.riotbox_dir}}/container/pi"
          jq -e '.dependencies | length > 0 and all(.[]; test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' package.json >/dev/null \
            || { echo "FAIL: a dependency is not an exact X.Y.Z pin"; exit 1; }
          jq -e --slurpfile m package.json '.packages[""].dependencies == $m[0].dependencies' package-lock.json >/dev/null \
            || { echo "FAIL: lock root dependencies differ from package.json — regenerate the lock"; exit 1; }
          while IFS=$'\t' read -r name version; do
            got="$(jq -r --arg k "node_modules/${name}" '.packages[$k].version // empty' package-lock.json)"
            [[ "${got}" == "${version}" ]] || { echo "FAIL: ${name} locked at '${got}', pinned at '${version}'"; exit 1; }
          done < <(jq -r '.dependencies | to_entries[] | "\(.key)\t\(.value)"' package.json)
          echo "PINS_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PINS_OK"

  - name: the extension lock has no install scripts, registry-only sources, and no Pi SDK
    steps:
      - type: exec
        script: |
          set -euo pipefail
          lock="{{.riotbox_dir}}/container/pi/package-lock.json"
          jq -e '[.packages[] | select(.hasInstallScript == true)] | length == 0' "${lock}" >/dev/null \
            || { echo "FAIL: a locked package declares an install script"; exit 1; }
          jq -e '[.packages | to_entries[] | select(.key != "") | .value
                  | select(((.resolved // "") | test("^https://registry\\.npmjs\\.org/") | not) or ((.integrity | type) != "string"))]
                  | length == 0' "${lock}" >/dev/null \
            || { echo "FAIL: a locked package is not a registry tarball with an integrity hash"; exit 1; }
          # Pi core and its SDK packages (@earendil-works/*) are supplied by
          # Pi's loader; a copy here means the lock was not generated with
          # --legacy-peer-deps and would load a second Pi.
          jq -e '.packages | keys | any(test("(^|/)@earendil-works/")) | not' "${lock}" >/dev/null \
            || { echo "FAIL: the extension lock carries an @earendil-works/* package"; exit 1; }
          echo "LOCK_CLEAN_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "LOCK_CLEAN_OK"

  - name: rpiv-config is overridden to the version the rpiv extensions pin
    steps:
      - type: exec
        script: |
          set -euo pipefail
          cd "{{.riotbox_dir}}/container/pi"
          todo="$(jq -er '.dependencies["@juicesharp/rpiv-todo"]' package.json)"
          ask="$(jq -er '.dependencies["@juicesharp/rpiv-ask-user-question"]' package.json)"
          override="$(jq -er '.overrides["@juicesharp/rpiv-config"]' package.json)"
          locked="$(jq -er '.packages["node_modules/@juicesharp/rpiv-config"].version' package-lock.json)"
          [[ "${override}" == "${todo}" && "${override}" == "${ask}" ]] \
            || { echo "FAIL: overrides.@juicesharp/rpiv-config ${override} != rpiv pins todo=${todo} ask=${ask}"; exit 1; }
          [[ "${locked}" == "${override}" ]] \
            || { echo "FAIL: lock resolves rpiv-config to ${locked}, override is ${override}"; exit 1; }
          echo "OVERRIDE_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "OVERRIDE_OK"
  - name: sync copies the allowlisted host entries and emits the agent-dir mount
    steps:
      - type: exec
        script: |
          set -euo pipefail
          T="$(mktemp -d)"; trap 'rm -rf "${T}"' EXIT
          H="${T}/host"; S="${T}/session"
          mkdir -p "${H}/skills/review" "${H}/prompts" "${H}/themes" "${H}/extensions"
          for f in settings.json models.json mcp.json keybindings.json; do echo '{}' > "${H}/${f}"; done
          for f in AGENTS.md SYSTEM.md APPEND_SYSTEM.md; do echo "# ${f}" > "${H}/${f}"; done
          echo skill > "${H}/skills/review/SKILL.md"
          echo prompt > "${H}/prompts/fix.md"
          echo '{}' > "${H}/themes/dark.json"
          echo 'export default function () {}' > "${H}/extensions/mine.js"
          out="$(bash "{{.riotbox_dir}}/agents/pi/sync-settings.sh" "${H}" "${S}")"
          for p in settings.json models.json mcp.json keybindings.json AGENTS.md SYSTEM.md APPEND_SYSTEM.md \
                   skills/review/SKILL.md prompts/fix.md themes/dark.json extensions/mine.js; do
            [ -f "${S}/pi-agent/${p}" ] || { echo "FAIL: ${p} not copied"; exit 1; }
          done
          printf '%s\n' "${out}" | grep -qxF -- "-v ${S}/pi-agent:/home/llm/.pi/agent:z" \
            || { echo "FAIL: agent-dir mount flag missing"; printf '%s\n' "${out}"; exit 1; }
          echo "SYNC_COPY_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "SYNC_COPY_OK"

  - name: sync never copies Pi state or host install trees
    steps:
      - type: exec
        script: |
          set -euo pipefail
          T="$(mktemp -d)"; trap 'rm -rf "${T}"' EXIT
          H="${T}/host"; S="${T}/session"
          for d in sessions/p install/releases qmd/memory-stack skill-library-deferred/x npm git bin tmp; do mkdir -p "${H}/${d}"; done
          for f in trust.json models-store.json crashes.json mcp.log auth.json mcp-auth.json; do echo x > "${H}/${f}"; done
          bash "{{.riotbox_dir}}/agents/pi/sync-settings.sh" "${H}" "${S}" >/dev/null
          for p in sessions install qmd skill-library-deferred npm git bin tmp trust.json models-store.json crashes.json mcp.log auth.json mcp-auth.json; do
            [ ! -e "${S}/pi-agent/${p}" ] || { echo "FAIL: ${p} was copied"; exit 1; }
          done
          echo "SYNC_DENY_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "SYNC_DENY_OK"

  - name: re-sync keeps Pi state and drops entries removed on the host
    steps:
      - type: exec
        script: |
          set -euo pipefail
          T="$(mktemp -d)"; trap 'rm -rf "${T}"' EXIT
          H="${T}/host"; S="${T}/session"
          mkdir -p "${H}/extensions" "${H}/skills/a"
          echo x > "${H}/extensions/old.js"; echo s > "${H}/skills/a/SKILL.md"
          bash "{{.riotbox_dir}}/agents/pi/sync-settings.sh" "${H}" "${S}" >/dev/null
          mkdir -p "${S}/pi-agent/sessions/proj"
          echo '{"type":"session"}' > "${S}/pi-agent/sessions/proj/one.jsonl"
          echo '{}' > "${S}/pi-agent/trust.json"
          rm -rf "${H}/extensions"
          bash "{{.riotbox_dir}}/agents/pi/sync-settings.sh" "${H}" "${S}" >/dev/null
          [ -f "${S}/pi-agent/sessions/proj/one.jsonl" ] || { echo "FAIL: session history lost on re-sync"; exit 1; }
          [ -f "${S}/pi-agent/trust.json" ] || { echo "FAIL: trust.json lost on re-sync"; exit 1; }
          [ ! -e "${S}/pi-agent/extensions" ] || { echo "FAIL: host-removed extensions/ lingered"; exit 1; }
          [ -f "${S}/pi-agent/skills/a/SKILL.md" ] || { echo "FAIL: skills/ not re-copied"; exit 1; }
          echo "RESYNC_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "RESYNC_OK"

  - name: sync dereferences symlinks and skips dangling ones
    steps:
      - type: exec
        script: |
          set -euo pipefail
          T="$(mktemp -d)"; trap 'rm -rf "${T}"' EXIT
          H="${T}/host"; S="${T}/session"
          mkdir -p "${H}/skills" "${T}/checkout/linked"
          echo real > "${T}/checkout/linked/SKILL.md"
          ln -s "${T}/checkout/linked" "${H}/skills/linked"
          ln -s "${T}/nowhere" "${H}/skills/broken"
          ln -s "${T}/nowhere.md" "${H}/AGENTS.md"
          bash "{{.riotbox_dir}}/agents/pi/sync-settings.sh" "${H}" "${S}" >/dev/null
          [ -f "${S}/pi-agent/skills/linked/SKILL.md" ] && [ ! -L "${S}/pi-agent/skills/linked" ] \
            || { echo "FAIL: symlinked skill not dereferenced"; exit 1; }
          [ ! -e "${S}/pi-agent/skills/broken" ] && [ ! -L "${S}/pi-agent/skills/broken" ] \
            || { echo "FAIL: dangling symlink copied"; exit 1; }
          [[ ! -e "${S}/pi-agent/AGENTS.md" && ! -L "${S}/pi-agent/AGENTS.md" ]] \
            || { echo "FAIL: dangling top-level symlink copied"; exit 1; }
          echo "SYMLINK_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "SYMLINK_OK"

  - name: sync binds credential files read-write only when they exist
    steps:
      - type: exec
        script: |
          set -euo pipefail
          T="$(mktemp -d)"; trap 'rm -rf "${T}"' EXIT
          H="${T}/host"; S="${T}/session"; mkdir -p "${H}"
          none="$(bash "{{.riotbox_dir}}/agents/pi/sync-settings.sh" "${H}" "${S}")"
          printf '%s\n' "${none}" | grep -q 'auth.json' && { echo "FAIL: auth bind emitted with no auth file"; exit 1; }
          echo tok > "${H}/auth.json"; echo tok > "${H}/mcp-auth.json"
          out="$(bash "{{.riotbox_dir}}/agents/pi/sync-settings.sh" "${H}" "${S}")"
          printf '%s\n' "${out}" | grep -qxF -- "-v ${H}/auth.json:/home/llm/.pi/agent/auth.json:z" \
            || { echo "FAIL: auth.json bind missing"; exit 1; }
          printf '%s\n' "${out}" | grep -qxF -- "-v ${H}/mcp-auth.json:/home/llm/.pi/agent/mcp-auth.json:z" \
            || { echo "FAIL: mcp-auth.json bind missing"; exit 1; }
          echo "AUTH_BIND_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "AUTH_BIND_OK"

  - name: sync with no host agent dir prints a notice and still emits the mount
    steps:
      - type: exec
        script: |
          set -euo pipefail
          T="$(mktemp -d)"; trap 'rm -rf "${T}"' EXIT
          out="$(bash "{{.riotbox_dir}}/agents/pi/sync-settings.sh" "${T}/missing" "${T}/session" 2>"${T}/err")"
          grep -qF 'not found on host' "${T}/err" || { echo "FAIL: no notice"; exit 1; }
          printf '%s\n' "${out}" | grep -qxF -- "-v ${T}/session/pi-agent:/home/llm/.pi/agent:z" \
            || { echo "FAIL: mount flag missing"; exit 1; }
          echo "NO_HOST_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "NO_HOST_OK"

  - name: sync rejects the wrong number of arguments
    steps:
      - type: exec
        script: |
          set -euo pipefail
          T="$(mktemp -d)"; trap 'rm -rf "${T}"' EXIT
          script="{{.riotbox_dir}}/agents/pi/sync-settings.sh"
          for n in 0 1 3; do
            args=(); for ((k = 0; k < n; k++)); do args+=("/tmp/arg${k}"); done
            rc=0; bash "${script}" "${args[@]}" 2>"${T}/err" >/dev/null || rc=$?
            [[ "${rc}" -eq 1 ]] || { echo "FAIL: ${n} args exited ${rc}, want 1"; exit 1; }
            grep -qF 'Usage' "${T}/err" || { echo "FAIL: ${n} args: no Usage on stderr"; exit 1; }
          done
          echo "ARGC_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "ARGC_OK"

  - name: sync rejects a relative state dir
    steps:
      - type: exec
        script: |
          set -euo pipefail
          T="$(mktemp -d)"; trap 'rm -rf "${T}"' EXIT
          mkdir -p "${T}/host"
          rc=0; bash "{{.riotbox_dir}}/agents/pi/sync-settings.sh" "${T}/host" relative/session 2>"${T}/err" >/dev/null || rc=$?
          [[ "${rc}" -eq 1 ]] || { echo "FAIL: exit ${rc}, want 1"; exit 1; }
          grep -qF 'must be an absolute path' "${T}/err" || { echo "FAIL: no absolute-path message"; exit 1; }
          [[ ! -e relative ]] || { echo "FAIL: relative dir was created"; exit 1; }
          echo "ABS_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "ABS_OK"

  - name: sync replaces a pi-agent symlink instead of following it
    steps:
      - type: exec
        script: |
          set -euo pipefail
          T="$(mktemp -d)"; trap 'rm -rf "${T}"' EXIT
          H="${T}/host"; V="${T}/victim"
          mkdir -p "${H}" "${V}/skills/x"
          echo host > "${H}/AGENTS.md"
          echo victim-agents > "${V}/AGENTS.md"; echo victim-skill > "${V}/skills/x/SKILL.md"
          for kind in relative absolute dangling; do
            S="${T}/state-${kind}"; mkdir -p "${S}"
            case "${kind}" in
              relative) ln -s ../victim "${S}/pi-agent" ;;
              absolute) ln -s "${V}" "${S}/pi-agent" ;;
              dangling) ln -s ../nowhere "${S}/pi-agent" ;;
            esac
            out="$(bash "{{.riotbox_dir}}/agents/pi/sync-settings.sh" "${H}" "${S}" 2>"${T}/err")"
            [[ "$(cat "${V}/AGENTS.md")" == "victim-agents" ]] || { echo "FAIL: ${kind}: victim AGENTS.md modified"; exit 1; }
            [[ "$(cat "${V}/skills/x/SKILL.md" 2>/dev/null)" == "victim-skill" ]] || { echo "FAIL: ${kind}: victim skills deleted"; exit 1; }
            [[ -d "${S}/pi-agent" && ! -L "${S}/pi-agent" ]] || { echo "FAIL: ${kind}: pi-agent is not a real dir"; exit 1; }
            [[ "$(cat "${S}/pi-agent/AGENTS.md")" == "host" ]] || { echo "FAIL: ${kind}: host AGENTS.md not synced"; exit 1; }
            grep -qF 'Warning' "${T}/err" || { echo "FAIL: ${kind}: no Warning on stderr"; exit 1; }
            printf '%s\n' "${out}" | grep -qxF -- "-v ${S}/pi-agent:/home/llm/.pi/agent:z" \
              || { echo "FAIL: ${kind}: mount flag missing"; exit 1; }
          done
          [[ ! -e "${T}/nowhere" ]] || { echo "FAIL: the dangling link's target was created"; exit 1; }
          echo "PLANT_LINK_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PLANT_LINK_OK"

  - name: sync survives a link planted between the clear and the install without following it
    steps:
      - type: exec
        script: |
          set -euo pipefail
          T="$(mktemp -d)"; trap 'rm -rf "${T}"' EXIT
          H="${T}/host"; V="${T}/victim"; S="${T}/state"; B="${T}/bin"
          mkdir -p "${H}/skills/x" "${V}" "${S}/pi-agent" "${B}"
          echo host > "${H}/AGENTS.md"; echo host-skill > "${H}/skills/x/SKILL.md"
          echo precious > "${V}/keep"; echo victim-file > "${T}/victim-file"
          real_mv="$(command -v mv)"
          # A hostile container wins the race: just before each install it has
          # already planted a link where the host cleared the entry.
          cat > "${B}/mv" <<STUB
          #!/usr/bin/env bash
          case "\${@: -1}" in
            */AGENTS.md) touch "${T}/planted"; ln -s "${T}/victim-file" "${S}/pi-agent/AGENTS.md" ;;
            */skills) ln -s "${V}" "${S}/pi-agent/skills" ;;
          esac
          exec "${real_mv}" "\$@"
          STUB
          sed -i 's/^          //' "${B}/mv"; chmod +x "${B}/mv"
          rc=0; PATH="${B}:${PATH}" bash "{{.riotbox_dir}}/agents/pi/sync-settings.sh" "${H}" "${S}" >/dev/null 2>"${T}/err" || rc=$?
          [[ -e "${T}/planted" ]] || { echo "FAIL: the stub never ran"; exit 1; }
          [[ "$(cat "${V}/keep")" == precious && "$(find "${V}" -mindepth 1 | wc -l)" -eq 1 ]] || { echo "FAIL: victim dir written"; exit 1; }
          [[ "$(cat "${T}/victim-file")" == victim-file ]] || { echo "FAIL: victim file overwritten"; exit 1; }
          [[ ! -L "${S}/pi-agent/AGENTS.md" && "$(cat "${S}/pi-agent/AGENTS.md")" == host ]] || { echo "FAIL: planted file link not replaced"; exit 1; }
          [[ "${rc}" -eq 1 ]] || { echo "FAIL: installing over a planted dir link must exit 1, got ${rc}"; exit 1; }
          grep -qF 'Error: skills in' "${T}/err" && grep -qF 'changed during sync' "${T}/err" || { echo "FAIL: no tamper message"; cat "${T}/err"; exit 1; }
          [[ -z "$(find "${S}" -maxdepth 1 -name '.sync.*')" ]] || { echo "FAIL: staging dir left behind"; exit 1; }
          echo "RACE_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "RACE_OK"

  - name: sync replaces a regular file planted at pi-agent with a directory
    steps:
      - type: exec
        script: |
          set -euo pipefail
          T="$(mktemp -d)"; trap 'rm -rf "${T}"' EXIT
          H="${T}/host"; S="${T}/session"
          mkdir -p "${H}" "${S}"
          echo host > "${H}/AGENTS.md"
          echo junk > "${S}/pi-agent"
          bash "{{.riotbox_dir}}/agents/pi/sync-settings.sh" "${H}" "${S}" >/dev/null 2>&1
          [[ -d "${S}/pi-agent" && ! -L "${S}/pi-agent" ]] || { echo "FAIL: pi-agent is not a real dir"; exit 1; }
          [[ -f "${S}/pi-agent/AGENTS.md" ]] || { echo "FAIL: AGENTS.md not synced"; exit 1; }
          echo "PLANT_FILE_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PLANT_FILE_OK"

  - name: setup forces RiotBox settings, keeps host keys, and lists the image extensions
    steps:
      - type: exec
        script: |
          set -euo pipefail
          T="$(mktemp -d)"; trap 'rm -rf "${T}"' EXIT
          export HOME="${T}"
          unset CONTEXT_MODE_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED CONTEXT_MODE_DATA_DIR CONTEXT_MODE_PLATFORM RIOTBOX_PROMPT
          export RIOTBOX_PI_DIR="${T}/pi"
          mkdir -p "${RIOTBOX_PI_DIR}/extensions" "${HOME}/.pi/agent"
          echo '{"dependencies":{"pi-subagents":"0.77.0","@juicesharp/rpiv-todo":"2.13.8"}}' > "${RIOTBOX_PI_DIR}/extensions/package.json"
          echo '{"theme":"dark","defaultProjectTrust":"never","enableAnalytics":true}' > "${HOME}/.pi/agent/settings.json"
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/pi/setup.sh"
          pi_setup 2>"${T}/err"
          [[ ! -s "${T}/err" ]] || { echo "FAIL: spurious stderr"; cat "${T}/err"; exit 1; }
          s="${HOME}/.pi/agent/settings.json"
          jq -e '.theme == "dark"' "${s}" >/dev/null || { echo "FAIL: host key lost"; exit 1; }
          jq -e '.defaultProjectTrust == "always" and .enableInstallTelemetry == false and .enableAnalytics == false' "${s}" >/dev/null \
            || { echo "FAIL: forced keys wrong"; cat "${s}"; exit 1; }
          jq -e --arg r "${RIOTBOX_PI_DIR}/extensions/node_modules" \
            '.packages == [($r + "/@juicesharp/rpiv-todo"), ($r + "/pi-subagents")]' "${s}" >/dev/null \
            || { echo "FAIL: packages not derived from the manifest"; cat "${s}"; exit 1; }
          echo "SETUP_SETTINGS_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "SETUP_SETTINGS_OK"

  - name: setup drops host packages and names each one on stderr
    steps:
      - type: exec
        script: |
          set -euo pipefail
          T="$(mktemp -d)"; trap 'rm -rf "${T}"' EXIT
          export HOME="${T}"
          unset CONTEXT_MODE_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED CONTEXT_MODE_DATA_DIR CONTEXT_MODE_PLATFORM RIOTBOX_PROMPT
          export RIOTBOX_PI_DIR="${T}/pi"
          mkdir -p "${RIOTBOX_PI_DIR}/extensions" "${HOME}/.pi/agent"
          echo '{"dependencies":{"pi-subagents":"0.77.0"}}' > "${RIOTBOX_PI_DIR}/extensions/package.json"
          keep="${RIOTBOX_PI_DIR}/extensions/node_modules/pi-subagents"
          jq -n --arg keep "${keep}" '{packages: ["/home/me/.pi/agent/install/x", {source: "npm:foo@1.0.0"}, $keep]}' \
            > "${HOME}/.pi/agent/settings.json"
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/pi/setup.sh"
          RIOTBOX_AGENT=pi pi_setup 2>"${T}/err"
          grep -qF '/home/me/.pi/agent/install/x' "${T}/err" || { echo "FAIL: string entry not named"; exit 1; }
          grep -qF 'npm:foo@1.0.0' "${T}/err" || { echo "FAIL: object entry not named"; exit 1; }
          if grep -qF "${keep}" "${T}/err"; then echo "FAIL: kept entry reported as dropped"; exit 1; fi
          jq -e --arg keep "${keep}" '.packages == [$keep]' "${HOME}/.pi/agent/settings.json" >/dev/null \
            || { echo "FAIL: packages not replaced"; exit 1; }
          echo "DROP_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "DROP_OK"

  - name: setup stays silent about dropped packages for other agents but still replaces them
    steps:
      - type: exec
        script: |
          set -euo pipefail
          T="$(mktemp -d)"; trap 'rm -rf "${T}"' EXIT
          export HOME="${T}"
          unset CONTEXT_MODE_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED CONTEXT_MODE_DATA_DIR CONTEXT_MODE_PLATFORM RIOTBOX_PROMPT
          export RIOTBOX_PI_DIR="${T}/pi"
          mkdir -p "${RIOTBOX_PI_DIR}/extensions" "${HOME}/.pi/agent"
          echo '{"dependencies":{"pi-subagents":"0.77.0"}}' > "${RIOTBOX_PI_DIR}/extensions/package.json"
          keep="${RIOTBOX_PI_DIR}/extensions/node_modules/pi-subagents"
          jq -n '{packages: ["/home/me/.pi/agent/install/x"]}' > "${HOME}/.pi/agent/settings.json"
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/pi/setup.sh"
          RIOTBOX_AGENT=claude pi_setup 2>"${T}/err"
          if grep -qF 'NOTE' "${T}/err"; then echo "FAIL: NOTE printed for a non-pi agent"; cat "${T}/err"; exit 1; fi
          jq -e --arg keep "${keep}" '.packages == [$keep]' "${HOME}/.pi/agent/settings.json" >/dev/null \
            || { echo "FAIL: packages not replaced"; exit 1; }
          echo "QUIET_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "QUIET_OK"

  - name: setup replaces a non-object or invalid settings.json with a warning
    steps:
      - type: exec
        script: |
          set -euo pipefail
          T="$(mktemp -d)"; trap 'rm -rf "${T}"' EXIT
          export HOME="${T}"
          unset CONTEXT_MODE_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED CONTEXT_MODE_DATA_DIR CONTEXT_MODE_PLATFORM RIOTBOX_PROMPT
          export RIOTBOX_PI_DIR="${T}/pi"
          mkdir -p "${RIOTBOX_PI_DIR}/extensions" "${HOME}/.pi/agent"
          echo '{"dependencies":{}}' > "${RIOTBOX_PI_DIR}/extensions/package.json"
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/pi/setup.sh"
          for bad in '[1,2]' '{not json'; do
            printf '%s\n' "${bad}" > "${HOME}/.pi/agent/settings.json"
            pi_setup 2>"${T}/err"
            grep -qF 'not a valid JSON object' "${T}/err" || { echo "FAIL: no warning for ${bad}"; exit 1; }
            jq -e '.defaultProjectTrust == "always" and .packages == []' "${HOME}/.pi/agent/settings.json" >/dev/null \
              || { echo "FAIL: not rewritten for ${bad}"; exit 1; }
          done
          echo "BAD_SETTINGS_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "BAD_SETTINGS_OK"

  - name: setup warns and lists no packages when the extensions manifest is missing
    steps:
      - type: exec
        script: |
          set -euo pipefail
          T="$(mktemp -d)"; trap 'rm -rf "${T}"' EXIT
          export HOME="${T}"
          unset CONTEXT_MODE_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED CONTEXT_MODE_DATA_DIR CONTEXT_MODE_PLATFORM RIOTBOX_PROMPT
          export RIOTBOX_PI_DIR="${T}/absent"
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/pi/setup.sh"
          pi_setup 2>"${T}/err"
