  - name: setup places AGENTS.md by RIOTBOX_PROMPT, then host copy, then template
    steps:
      - type: exec
        script: |
          set -euo pipefail
          T="$(mktemp -d)"; trap 'rm -rf "${T}"' EXIT
          export HOME="${T}"
          unset CONTEXT_MODE_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED CONTEXT_MODE_DATA_DIR CONTEXT_MODE_PLATFORM RIOTBOX_PROMPT
          export RIOTBOX_PI_DIR="${T}/pi"
          mkdir -p "${RIOTBOX_PI_DIR}/extensions" "${HOME}/.riotbox" "${HOME}/.pi/agent"
          echo '{"dependencies":{}}' > "${RIOTBOX_PI_DIR}/extensions/package.json"
          echo TEMPLATE > "${HOME}/.riotbox/AGENTS.md.template"
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/pi/setup.sh"
          md="${HOME}/.pi/agent/AGENTS.md"
          pi_setup 2>/dev/null
          [[ "$(cat "${md}")" == "TEMPLATE" ]] || { echo "FAIL: template not used"; exit 1; }
          echo HOSTCOPY > "${md}"
          pi_setup 2>/dev/null
          [[ "$(cat "${md}")" == "HOSTCOPY" ]] || { echo "FAIL: host copy overwritten"; exit 1; }
          echo 'prompt on {{OS_PRETTY_NAME}}' > "${T}/prompt.md"
          RIOTBOX_PROMPT="${T}/prompt.md" pi_setup 2>/dev/null
          if grep -q '^prompt on ' "${md}" && ! grep -qF 'OS_PRETTY_NAME' "${md}"; then :; else
            echo "FAIL: RIOTBOX_PROMPT not rendered"; cat "${md}"; exit 1
          fi
          echo "AGENTS_MD_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "AGENTS_MD_OK"

