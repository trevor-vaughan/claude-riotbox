name: session commands — remove, reset and list touch only marked sessions
vars:
  root: "."
  riotbox_dir: "{{.root}}"

# A session is a directory under ${XDG_DATA_HOME}/riotbox carrying the
# .projects marker that scripts/mount-projects.sh writes at launch. On a
# rootless install that directory also holds the app tree (install.sh
# APP_PATHS) and backups/, so a session command that acts on anything without
# the marker uninstalls RiotBox or destroys the safety backups.

testcases:
  - name: session-remove --all removes marked sessions and leaves the rootless app tree
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          key="$(make_session alpha)"
          mkdir -p "${DATA}/stray"
          printf 'y\n' | bash "{{.riotbox_dir}}/libexec/remove-session.sh" --all
          [ ! -e "${DATA}/${key}" ] || { echo "FAIL: the session survived"; exit 1; }
          [ -d "${DATA}/stray" ] || { echo "FAIL: an unmarked dir was removed"; exit 1; }
          assert_app_tree_intact
          echo "REMOVE_ALL_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "Removed 1 session(s)."
          - result.systemout ShouldContainSubstring "REMOVE_ALL_OK"

  - name: session-reset all force removes marked sessions and leaves the rootless app tree
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          key="$(make_session alpha)"
          mkdir -p "${DATA}/stray"
          bash "{{.riotbox_dir}}/libexec/reset-session.sh" all force
          [ ! -e "${DATA}/${key}" ] || { echo "FAIL: the session survived"; exit 1; }
          [ -d "${DATA}/stray" ] || { echo "FAIL: an unmarked dir was removed"; exit 1; }
          assert_app_tree_intact
          echo "RESET_ALL_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "Removed 1 session(s)."
          - result.systemout ShouldContainSubstring "RESET_ALL_OK"

  - name: session-remove refuses an exact key that names an unmarked directory
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          # Run from a directory with no ./scripts, so the argument can only
          # be read as a session key.
          cd "${T}/projects"
          for key in scripts backups; do
            rc=0
            printf 'y\n' | bash "{{.riotbox_dir}}/libexec/remove-session.sh" "${key}" >/dev/null 2>"${T}/err" || rc=$?
            [ "${rc}" -eq 1 ] || { echo "FAIL: ${key}: exit ${rc}, want 1"; exit 1; }
            grep -qF 'not a session' "${T}/err" || { echo "FAIL: ${key}: no refusal message"; cat "${T}/err"; exit 1; }
          done
          assert_app_tree_intact
          echo "EXACT_KEY_REFUSED"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "EXACT_KEY_REFUSED"

  - name: session-remove never reads a key containing a slash as a path under the data dir
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          # ${DATA}/../../../../victim is ${T}/victim, a directory that carries
          # a .projects file of its own. From ${T}/projects the same string
          # names nothing, so it is neither a project path nor a key.
          mkdir -p "${T}/victim"
          echo /x > "${T}/victim/.projects"
          cd "${T}/projects"
          rc=0
          printf 'y\n' | bash "{{.riotbox_dir}}/libexec/remove-session.sh" ../../../../victim >/dev/null 2>&1 || rc=$?
          [ "${rc}" -eq 1 ] || { echo "FAIL: exit ${rc}, want 1"; exit 1; }
          [ -f "${T}/victim/.projects" ] || { echo "FAIL: a directory outside the data dir was removed"; exit 1; }
          echo "TRAVERSAL_REFUSED"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "TRAVERSAL_REFUSED"

  - name: session-remove and session-reset leave an unmarked directory at a project's key
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          mkdir -p "${T}/projects/beta"
          key="$(source "{{.riotbox_dir}}/scripts/mount-projects.sh" && session_key "${T}/projects/beta")"
          mkdir -p "${DATA}/${key}"
          echo keep > "${DATA}/${key}/payload"
          rc=0
          printf 'y\n' | bash "{{.riotbox_dir}}/libexec/remove-session.sh" "${T}/projects/beta" >/dev/null 2>&1 || rc=$?
          [ "${rc}" -eq 1 ] || { echo "FAIL: remove exit ${rc}, want 1"; exit 1; }
          (cd "${T}/projects/beta" && bash "{{.riotbox_dir}}/libexec/reset-session.sh" force) > "${T}/out"
          grep -qF 'No session dir found' "${T}/out" || { echo "FAIL: reset did not report no session"; cat "${T}/out"; exit 1; }
          [ -f "${DATA}/${key}/payload" ] || { echo "FAIL: the unmarked directory was removed"; exit 1; }
          echo "UNMARKED_KEPT"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "UNMARKED_KEPT"

  - name: session-remove removes a marked session by key and by project path
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          a="$(make_session alpha)"
          b="$(make_session bravo)"
          printf 'y\n' | bash "{{.riotbox_dir}}/libexec/remove-session.sh" "${a}" "${T}/projects/bravo"
          [ ! -e "${DATA}/${a}" ] || { echo "FAIL: key form left the session"; exit 1; }
          [ ! -e "${DATA}/${b}" ] || { echo "FAIL: path form left the session"; exit 1; }
          assert_app_tree_intact
          echo "REMOVE_ONE_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "Removed 2 session(s)."
          - result.systemout ShouldContainSubstring "REMOVE_ONE_OK"

  - name: session-remove refuses an empty key and the dot keys
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          make_session alpha >/dev/null
          # From inside the data dir "." and ".." exist as paths, the worst
          # case for a key that is not rejected up front.
          cd "${DATA}"
          for key in "" . ..; do
            rc=0
            printf 'y\n' | bash "{{.riotbox_dir}}/libexec/remove-session.sh" "${key}" >/dev/null 2>&1 || rc=$?
            [ "${rc}" -eq 1 ] || { echo "FAIL: key '${key}': exit ${rc}, want 1"; exit 1; }
          done
          assert_app_tree_intact
          [ -f "${DATA}/$(ls "${DATA}" | grep alpha)/.projects" ] || { echo "FAIL: a session was removed"; exit 1; }
          echo "DOT_KEYS_REFUSED"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "DOT_KEYS_REFUSED"

  - name: a project at / is refused and the data dir survives session-remove and session-reset
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          # Plant the marker an older launch from / would have written.
          echo / > "${DATA}/.projects"
          rc=0
          for arg in / //; do
            rc=0
            printf 'y\n' | bash "{{.riotbox_dir}}/libexec/remove-session.sh" "${arg}" >/dev/null 2>"${T}/err" || rc=$?
            [ "${rc}" -eq 1 ] || { echo "FAIL: remove ${arg}: exit ${rc}, want 1"; exit 1; }
            grep -qF 'refusing to use / as a project' "${T}/err" || { echo "FAIL: remove ${arg}: no refusal message"; cat "${T}/err"; exit 1; }
          done
          # reset reads the project from the working directory; / is a real
          # directory, so the test cd's there.
          rc=0
          (cd / && bash "{{.riotbox_dir}}/libexec/reset-session.sh" force) >/dev/null 2>"${T}/err" || rc=$?
          [ "${rc}" -eq 1 ] || { echo "FAIL: reset from /: exit ${rc}, want 1"; exit 1; }
          grep -qF 'refusing to use / as a project' "${T}/err" || { echo "FAIL: reset: no refusal message"; cat "${T}/err"; exit 1; }
          assert_app_tree_intact
          [ -f "${DATA}/.projects" ] || { echo "FAIL: the data dir was touched"; exit 1; }
          echo "ROOT_REFUSED"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "ROOT_REFUSED"

  - name: resolve_projects and setup_projects refuse / and create nothing
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          before="$(find "${XDG_DATA_HOME}" | sort | md5sum)"
          source "{{.riotbox_dir}}/scripts/mount-projects.sh"
          rc=0
          resolve_projects / 2>"${T}/err" || rc=$?
          [ "${rc}" -ne 0 ] || { echo "FAIL: resolve_projects accepted /"; exit 1; }
          grep -qF 'refusing to use / as a project' "${T}/err" || { echo "FAIL: no message"; cat "${T}/err"; exit 1; }
          rc=0
          RIOTBOX_DRY_RUN=0 setup_projects / 2>/dev/null || rc=$?
          [ "${rc}" -ne 0 ] || { echo "FAIL: setup_projects accepted /"; exit 1; }
          rc=0
          resolve_projects // 2>/dev/null || rc=$?
          [ "${rc}" -ne 0 ] || { echo "FAIL: resolve_projects accepted //"; exit 1; }
          rc=0
          resolve_projects "${T}/projects / " 2>/dev/null || rc=$?
          [ "${rc}" -ne 0 ] || { echo "FAIL: a project set containing / was accepted"; exit 1; }
          after="$(find "${XDG_DATA_HOME}" | sort | md5sum)"
          [ "${before}" = "${after}" ] || { echo "FAIL: the data dir changed"; exit 1; }
          echo "RESOLVE_ROOT_REFUSED"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "RESOLVE_ROOT_REFUSED"

  - name: a symlinked session entry is unlinked, never followed, by remove by key and --all
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          mkdir -p "${T}/victim"
          echo /x > "${T}/victim/.projects"
          echo keep > "${T}/victim/payload"
          ln -s "${T}/victim" "${DATA}/linksess"
          printf 'y\n' | bash "{{.riotbox_dir}}/libexec/remove-session.sh" linksess >/dev/null
          [ ! -e "${DATA}/linksess" ] && [ ! -L "${DATA}/linksess" ] || { echo "FAIL: the link survived (key)"; exit 1; }
          [ -f "${T}/victim/payload" ] || { echo "FAIL: the link target was removed (key)"; exit 1; }
          ln -s "${T}/victim" "${DATA}/linksess"
          printf 'y\n' | bash "{{.riotbox_dir}}/libexec/remove-session.sh" --all >/dev/null
          [ ! -L "${DATA}/linksess" ] || { echo "FAIL: the link survived (--all)"; exit 1; }
          [ -f "${T}/victim/payload" ] || { echo "FAIL: the link target was removed (--all)"; exit 1; }
          assert_app_tree_intact
          echo "LINK_NOT_FOLLOWED"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "LINK_NOT_FOLLOWED"

  - name: session-reset from a marked project removes that session only
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          a="$(make_session alpha)"
          b="$(make_session bravo)"
          (cd "${T}/projects/alpha" && bash "{{.riotbox_dir}}/libexec/reset-session.sh" force) >/dev/null
          [ ! -e "${DATA}/${a}" ] || { echo "FAIL: the session survived"; exit 1; }
          [ -f "${DATA}/${b}/payload" ] || { echo "FAIL: another session was removed"; exit 1; }
          assert_app_tree_intact
          echo "RESET_ONE_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "RESET_ONE_OK"

  # ── the session's state dir goes with it ────────────────────────────────

  - name: session-remove removes each session's state dir with it, by key, by path and with --all
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          a="$(make_session alpha)"
          b="$(make_session bravo)"
          c="$(make_session charlie)"
          printf 'y\n' | bash "{{.riotbox_dir}}/libexec/remove-session.sh" "${a}" "${T}/projects/bravo" >/dev/null
          [ ! -e "${STATE}/${a}" ] || { echo "FAIL: key form left the state dir"; exit 1; }
          [ ! -e "${STATE}/${b}" ] || { echo "FAIL: path form left the state dir"; exit 1; }
          [ -d "${STATE}/${c}" ] || { echo "FAIL: an unnamed session lost its state dir"; exit 1; }
          printf 'y\n' | bash "{{.riotbox_dir}}/libexec/remove-session.sh" --all >/dev/null
          [ ! -e "${STATE}/${c}" ] || { echo "FAIL: --all left the state dir"; exit 1; }
          [ -d "${STATE}" ] || { echo "FAIL: the state root was removed"; exit 1; }
          assert_app_tree_intact
          echo "REMOVE_STATE_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "REMOVE_STATE_OK"

  - name: session-reset removes the state dir with the session, for one session and for all
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          a="$(make_session alpha)"
          b="$(make_session bravo)"
          (cd "${T}/projects/alpha" && bash "{{.riotbox_dir}}/libexec/reset-session.sh" force) >/dev/null
          [ ! -e "${DATA}/${a}" ] && [ ! -e "${STATE}/${a}" ] || { echo "FAIL: one-session reset left something"; exit 1; }
          [ -d "${STATE}/${b}" ] || { echo "FAIL: the other session lost its state dir"; exit 1; }
          bash "{{.riotbox_dir}}/libexec/reset-session.sh" all force >/dev/null
          [ ! -e "${STATE}/${b}" ] || { echo "FAIL: reset all left the state dir"; exit 1; }
          [ -d "${STATE}" ] || { echo "FAIL: the state root was removed"; exit 1; }
          assert_app_tree_intact
          echo "RESET_STATE_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "RESET_STATE_OK"

  - name: a symlinked state entry is unlinked, never followed, by remove and reset
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          a="$(make_session alpha)"
          b="$(make_session bravo)"
          mkdir -p "${T}/victim"
          echo keep >"${T}/victim/file"
          for k in "${a}" "${b}"; do
            rm -rf "${STATE:?}/${k:?}"
            ln -s "${T}/victim" "${STATE}/${k}"
          done
          printf 'y\n' | bash "{{.riotbox_dir}}/libexec/remove-session.sh" "${a}" >/dev/null
          [ ! -e "${STATE}/${a}" ] && [ ! -L "${STATE}/${a}" ] || { echo "FAIL: remove left the state link"; exit 1; }
          (cd "${T}/projects/bravo" && bash "{{.riotbox_dir}}/libexec/reset-session.sh" force) >/dev/null
          [ ! -L "${STATE}/${b}" ] || { echo "FAIL: reset left the state link"; exit 1; }
          [ "$(cat "${T}/victim/file")" = keep ] || { echo "FAIL: a link target was followed"; exit 1; }
          echo "STATE_LINK_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "STATE_LINK_OK"

  - name: the removal summary and session-list both count the state dir's size
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          key="$(make_session alpha)"
          head -c 3145728 /dev/zero > "${STATE}/${key}/git-ai/big.db"
          want="$(du -shc "${DATA}/${key}" "${STATE}/${key}" | tail -n 1 | cut -f1)"
          alone="$(du -sh "${DATA}/${key}" | cut -f1)"
          [ "${want}" != "${alone}" ] || { echo "FAIL: fixture does not tell the two sizes apart"; exit 1; }
          summary="$(printf 'n\n' | bash "{{.riotbox_dir}}/libexec/remove-session.sh" "${key}")"
          printf '%s\n' "${summary}" | grep -qF "last used:" || { echo "FAIL: no summary"; exit 1; }
          printf '%s\n' "${summary}" | grep -qF ", ${want}" || { echo "FAIL: summary size is not ${want}"; printf '%s\n' "${summary}"; exit 1; }
          listing="$(bash "{{.riotbox_dir}}/libexec/list-sessions.sh")"
          printf '%s\n' "${listing}" | grep -qE "Size: +${want} " || { echo "FAIL: list size is not ${want}"; printf '%s\n' "${listing}"; exit 1; }
          [ -d "${DATA}/${key}" ] || { echo "FAIL: answering n removed the session"; exit 1; }
          echo "SIZE_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "SIZE_OK"

  - name: session-list on a missing data dir prints No sessions found and exits 0
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          trap 'rm -rf "${HOME}"' EXIT
          unset CONTEXT_MODE_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED CONTEXT_MODE_DATA_DIR CONTEXT_MODE_PLATFORM
          export XDG_DATA_HOME="${HOME}/.local/share"
          export ROOT_DIR="{{.riotbox_dir}}"
          bash "{{.riotbox_dir}}/libexec/list-sessions.sh"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "No sessions found."

  # ── .projects content is container-written ──────────────────────────────
  # The session dir is the container's ~/.claude, so .projects can be a link
  # to any host file, or hold bytes a terminal acts on. session-list and the
  # removal summary print it; `riotbox overlays` never does (it prints only
  # the launch's host-only record, which these sessions lack: unknown).

  - name: session-list, the removal summary and overlays never read a symlinked .projects
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          key="$(make_session alpha)"
          mkdir -p "${STATE}/${key}/overlay/project/upper"
          echo change > "${STATE}/${key}/overlay/project/upper/f"
          echo TOPSECRET > "${T}/secret"
          rm "${DATA}/${key}/.projects"
          ln -s "${T}/secret" "${DATA}/${key}/.projects"
          bash "{{.riotbox_dir}}/libexec/list-sessions.sh" >"${T}/list" 2>&1
          printf 'n\n' | bash "{{.riotbox_dir}}/libexec/remove-session.sh" "${key}" >"${T}/summary" 2>&1
          rc=0
          bash "{{.riotbox_dir}}/scripts/overlay.sh" list >"${T}/overlays" 2>&1 || rc=$?
          [ "${rc}" -eq 0 ] || { echo "FAIL: overlays exit ${rc}"; cat "${T}/overlays"; exit 1; }
          for out in list summary overlays; do
            if grep -qF TOPSECRET "${T}/${out}"; then echo "FAIL: ${out} printed the link target"; cat "${T}/${out}"; exit 1; fi
            grep -qF "${key}" "${T}/${out}" || { echo "FAIL: ${out} lost the session"; cat "${T}/${out}"; exit 1; }
          done
          grep -qF '(unknown)' "${T}/list" || { echo "FAIL: list does not say (unknown)"; cat "${T}/list"; exit 1; }
          grep -qF '(unknown)' "${T}/overlays" || { echo "FAIL: overlays does not say (unknown)"; cat "${T}/overlays"; exit 1; }
          if grep -qF 'no longer exists' "${T}/list"; then echo "FAIL: list checked an unknown project"; cat "${T}/list"; exit 1; fi
          [ -d "${DATA}/${key}" ] || { echo "FAIL: answering n removed the session"; exit 1; }
          echo "PROJECTS_LINK_IGNORED"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PROJECTS_LINK_IGNORED"

  - name: session-list, the removal summary and overlays strip control and bidi characters from .projects
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          key="$(make_session alpha)"
          mkdir -p "${STATE}/${key}/overlay/project/upper"
          echo change > "${STATE}/${key}/overlay/project/upper/f"
          printf '%s\n' "/evil"$'\e]0;pwn\a'"esc"$'\e[2J\xe2\x80\xae'"x" "/bidi"$'\xe2\x80\xae'"txt"$'\xe2\x80\x8e\xe2\x80\x8f\xd8\x9c\xe2\x80\x8b\xe2\x80\x8c\xe2\x80\x8d\xe2\x80\xa8\xe2\x80\xa9\xef\xbb\xbf'"y" >"${DATA}/${key}/.projects"
          bash "{{.riotbox_dir}}/libexec/list-sessions.sh" >"${T}/list" 2>&1
          printf 'n\n' | bash "{{.riotbox_dir}}/libexec/remove-session.sh" "${key}" >"${T}/summary" 2>&1
          rc=0
          bash "{{.riotbox_dir}}/scripts/overlay.sh" list >"${T}/overlays" 2>&1 || rc=$?
          [ "${rc}" -eq 0 ] || { echo "FAIL: overlays exit ${rc}"; cat "${T}/overlays"; exit 1; }
          if grep -qF '/evil' "${T}/overlays"; then echo "FAIL: overlays printed .projects"; cat "${T}/overlays"; exit 1; fi
          for out in list summary overlays; do
            [ "${out}" = overlays ] || grep -qF '/evil' "${T}/${out}" || { echo "FAIL: ${out} lost the project"; cat "${T}/${out}"; exit 1; }
            if LC_ALL=C grep -qP '[\x00-\x08\x0b-\x1f\x7f]|\xc2[\x80-\x9f]|\xe2\x80[\x8b-\x8f\xa8-\xae]|\xe2\x81[\xa6-\xa9]|\xd8\x9c|\xef\xbb\xbf' "${T}/${out}"; then
              echo "FAIL: raw control or bidi byte in ${out}"; od -c "${T}/${out}" | head -20; exit 1
            fi
          done
          grep -qF '/bidi' "${T}/list" && grep -qF '/bidi' "${T}/summary" || { echo "FAIL: the second project is missing"; exit 1; }
          echo "PROJECTS_SANITISED"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PROJECTS_SANITISED"

  - name: session-list and overlays show an emptied .projects as unknown
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          key="$(make_session alpha)"
          mkdir -p "${STATE}/${key}/overlay/project/upper"
          echo change > "${STATE}/${key}/overlay/project/upper/f"
          printf '\n\n' > "${DATA}/${key}/.projects"
          bash "{{.riotbox_dir}}/libexec/list-sessions.sh" >"${T}/list" 2>&1
          bash "{{.riotbox_dir}}/scripts/overlay.sh" list >"${T}/overlays" 2>&1
          grep -qF '(unknown)' "${T}/list" || { echo "FAIL: list does not say (unknown)"; cat "${T}/list"; exit 1; }
          grep -qF '(unknown)' "${T}/overlays" || { echo "FAIL: overlays does not say (unknown)"; cat "${T}/overlays"; exit 1; }
          if grep -qF 'no longer exists' "${T}/list"; then echo "FAIL: list warned about an empty path"; cat "${T}/list"; exit 1; fi
          echo "PROJECTS_EMPTY_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PROJECTS_EMPTY_OK"

  - name: a session that made its .projects a directory is still found by its launch record
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          # hide <name>: a launched session (host-only record in its state dir)
          # that replaced its container-writable .projects with a directory.
          hide() {
            local key
            key="$(make_session "$1")"
            printf '%s\n' "${T}/projects/$1" >"${STATE}/${key}/projects"
            rm "${DATA}/${key}/.projects"
            mkdir "${DATA}/${key}/.projects"
            printf '%s\n' "${key}"
          }
          a="$(hide alpha)"; b="$(hide bravo)"; c="$(hide charlie)"; d="$(hide delta)"
          bash "{{.riotbox_dir}}/libexec/list-sessions.sh" >"${T}/list" 2>&1
          for k in "${a}" "${b}" "${c}" "${d}"; do
            grep -qF "${k}" "${T}/list" || { echo "FAIL: session-list hid ${k}"; cat "${T}/list"; exit 1; }
          done
          (cd "${T}/projects/delta" && bash "{{.riotbox_dir}}/libexec/migrate-session.sh") >"${T}/migrate" 2>&1
          if grep -qF 'No session dir found' "${T}/migrate"; then echo "FAIL: session-migrate missed it"; cat "${T}/migrate"; exit 1; fi
          printf 'y\n' | bash "{{.riotbox_dir}}/libexec/remove-session.sh" "${a}" "${T}/projects/bravo" >/dev/null
          [ ! -e "${DATA}/${a}" ] || { echo "FAIL: remove by key refused it"; exit 1; }
          [ ! -e "${DATA}/${b}" ] || { echo "FAIL: remove by path missed it"; exit 1; }
          (cd "${T}/projects/charlie" && bash "{{.riotbox_dir}}/libexec/reset-session.sh" force) >/dev/null
          [ ! -e "${DATA}/${c}" ] || { echo "FAIL: session-reset missed it"; exit 1; }
          printf 'y\n' | bash "{{.riotbox_dir}}/libexec/remove-session.sh" --all >/dev/null
          [ ! -e "${DATA}/${d}" ] || { echo "FAIL: --all missed it"; exit 1; }
          e="$(hide echo)"
          bash "{{.riotbox_dir}}/libexec/reset-session.sh" all force >/dev/null
          [ ! -e "${DATA}/${e}" ] || { echo "FAIL: session-reset all missed it"; exit 1; }
          assert_app_tree_intact
          echo "HIDDEN_SESSION_FOUND"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "HIDDEN_SESSION_FOUND"
