name: agents/claude/sync-settings.sh user-extension copy tests
vars:
  root: "."
  riotbox_dir: "{{.root}}"
  sync_helpers: "{{.root}}/tests/lib/sync-settings-test-helpers.sh"

testcases:
  # ── Copy: positive path ─────────────────────────────────────────────────────
  # The four user-authored extension directories share one copy routine. A
  # single test exercises all of them so a regression in the loop fails one
  # case rather than four near-duplicates.

  - name: Copies all four user extension directories when present
    steps:
      - type: exec
        script: |
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.sync_helpers}}"
          setup_sync_test
          trap 'rm -rf "${TEST_DIR}"' EXIT

          for d in skills agents commands output-styles; do
              mkdir -p "${HOST_CLAUDE}/${d}/sub"
              printf 'top-%s\n' "${d}" > "${HOST_CLAUDE}/${d}/file.txt"
              printf 'nested-%s\n' "${d}" > "${HOST_CLAUDE}/${d}/sub/inner.txt"
          done

          run_sync >/dev/null

          for d in skills agents commands output-styles; do
              grep -qx "top-${d}" "${SESSION_DIR}/${d}/file.txt" \
                  || { echo "MISSING: ${d}/file.txt"; exit 1; }
              grep -qx "nested-${d}" "${SESSION_DIR}/${d}/sub/inner.txt" \
                  || { echo "MISSING: ${d}/sub/inner.txt"; exit 1; }
          done
          echo "all-dirs-copied"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "all-dirs-copied"

  # ── Stale cleanup ───────────────────────────────────────────────────────────
  # The session dir is persistent across launches. If the host directory is
  # removed, the previous copy must not linger — that was the inconsistency
  # the loop refactor fixed (previously only rules/, CLAUDE.md, and
  # statusline cleaned up; skills/ did not).

  - name: Removes stale session copy when host directory is absent
    steps:
      - type: exec
        script: |
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.sync_helpers}}"
          setup_sync_test
          trap 'rm -rf "${TEST_DIR}"' EXIT

          for d in skills agents commands output-styles; do
              mkdir -p "${SESSION_DIR}/${d}"
              printf 'stale\n' > "${SESSION_DIR}/${d}/old.txt"
          done

          run_sync >/dev/null

          for d in skills agents commands output-styles; do
              if [ -e "${SESSION_DIR}/${d}" ]; then
                  echo "STILL-PRESENT: ${d}"
                  exit 1
              fi
          done
          echo "all-stale-cleared"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "all-stale-cleared"

  # ── Symlink dereferencing ───────────────────────────────────────────────────
  # Skills, agents, and commands are routinely symlinks into plugin checkouts.
  # The copy must dereference so the container sees real files, not links
  # pointing into a host path that does not exist inside the container.

  - name: Dereferences valid symlinks during copy
    steps:
      - type: exec
        script: |
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.sync_helpers}}"
          setup_sync_test
          trap 'rm -rf "${TEST_DIR}"' EXIT

          # External target lives outside HOST_CLAUDE — mimicking a plugin
          # checkout that ~/.claude/skills/foo points at.
          mkdir -p "${EXTERNAL_DIR}/payload"
          printf 'real-content\n' > "${EXTERNAL_DIR}/payload/SKILL.md"

          for d in skills agents commands output-styles; do
              mkdir -p "${HOST_CLAUDE}/${d}"
              ln -s "${EXTERNAL_DIR}/payload" "${HOST_CLAUDE}/${d}/linked"
          done

          run_sync >/dev/null

          for d in skills agents commands output-styles; do
              if [ -L "${SESSION_DIR}/${d}/linked" ]; then
                  echo "STILL-A-SYMLINK: ${d}/linked"
                  exit 1
              fi
              grep -qx "real-content" "${SESSION_DIR}/${d}/linked/SKILL.md" \
                  || { echo "MISSING-TARGET: ${d}/linked/SKILL.md"; exit 1; }
          done
          echo "all-symlinks-dereferenced"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "all-symlinks-dereferenced"

  # ── Dangling symlink tolerance ──────────────────────────────────────────────
  # `cp -rL` aborts on the first dangling symlink, which is why the script
  # uses `find -L … ! -type l | tar -h` instead. Verify that a broken link
  # does not prevent the rest of the directory from being copied.

  - name: Tolerates dangling symlinks without aborting the copy
    steps:
      - type: exec
        script: |
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.sync_helpers}}"
          setup_sync_test
          trap 'rm -rf "${TEST_DIR}"' EXIT

          for d in skills agents commands output-styles; do
              mkdir -p "${HOST_CLAUDE}/${d}"
              printf 'survivor\n' > "${HOST_CLAUDE}/${d}/keepme.txt"
              ln -s "${TEST_DIR}/does-not-exist" "${HOST_CLAUDE}/${d}/broken"
          done

          run_sync >/dev/null

          for d in skills agents commands output-styles; do
              grep -qx "survivor" "${SESSION_DIR}/${d}/keepme.txt" \
                  || { echo "REGULAR-FILE-MISSING: ${d}/keepme.txt"; exit 1; }
              # The broken symlink must NOT have been propagated.
              if [ -e "${SESSION_DIR}/${d}/broken" ] || [ -L "${SESSION_DIR}/${d}/broken" ]; then
                  echo "DANGLING-PROPAGATED: ${d}/broken"
                  exit 1
              fi
          done
          echo "all-dangling-tolerated"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "all-dangling-tolerated"

  # ── Absent on host ──────────────────────────────────────────────────────────
  # When a host extension directory was never created, the session dir simply
  # should not contain one — and the script must not error out.

  - name: Skips copy when host directory does not exist
    steps:
      - type: exec
        script: |
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.sync_helpers}}"
          setup_sync_test
          trap 'rm -rf "${TEST_DIR}"' EXIT

          # HOST_CLAUDE is otherwise empty (only the plugins/ stub created by
          # setup_sync_test exists). Run sync — no extension dirs on host.
          run_sync >/dev/null

          for d in skills agents commands output-styles; do
              if [ -e "${SESSION_DIR}/${d}" ]; then
                  echo "UNEXPECTED: ${d}"
                  exit 1
              fi
          done
          echo "no-extensions-copied"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "no-extensions-copied"

  # ── Mixed populations ───────────────────────────────────────────────────────
  # Tests don't cross-contaminate the dirs. With only some of the four on the
  # host, the others must not appear in the session dir.

  - name: Copies only the directories that exist on the host
    steps:
      - type: exec
        script: |
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.sync_helpers}}"
          setup_sync_test
          trap 'rm -rf "${TEST_DIR}"' EXIT

          mkdir -p "${HOST_CLAUDE}/skills"
          printf 'present\n' > "${HOST_CLAUDE}/skills/marker.txt"
          mkdir -p "${HOST_CLAUDE}/commands"
          printf 'present\n' > "${HOST_CLAUDE}/commands/marker.txt"
          # agents/ and output-styles/ deliberately absent.

          run_sync >/dev/null

          grep -qx "present" "${SESSION_DIR}/skills/marker.txt"
          grep -qx "present" "${SESSION_DIR}/commands/marker.txt"
          [ ! -e "${SESSION_DIR}/agents" ]
          [ ! -e "${SESSION_DIR}/output-styles" ]
          echo "mixed-population-correct"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "mixed-population-correct"

  # ── Planted links in the session dir ────────────────────────────────────────
  # The session dir is the container's read-write ~/.claude, so the container
  # can replace any entry in it with a symlink before the next launch. `cp`
  # and `chmod` follow a symlink at their destination, so the sync builds each
  # copy in a private staging dir and renames it into place, which replaces a
  # planted link instead of writing through it to a host file.

  - name: Never writes through a .claude.json symlink planted in the session dir
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.sync_helpers}}"
          setup_sync_test
          trap 'rm -rf "${TEST_DIR}"' EXIT
          echo '{"host":true}' > "${HOME}/.claude.json"
          for kind in relative absolute; do
              echo victim > "${EXTERNAL_DIR}/victim-${kind}"
              chmod 644 "${EXTERNAL_DIR}/victim-${kind}"
              rm -f "${SESSION_DIR}/.claude.json"
              case "${kind}" in
                  relative) ln -s "../external/victim-${kind}" "${SESSION_DIR}/.claude.json" ;;
                  absolute) ln -s "${EXTERNAL_DIR}/victim-${kind}" "${SESSION_DIR}/.claude.json" ;;
              esac
              run_sync >/dev/null 2>"${TEST_DIR}/err"
              [ "$(cat "${EXTERNAL_DIR}/victim-${kind}")" = victim ] || { echo "FAIL: ${kind}: link target overwritten"; exit 1; }
              [ "$(stat -c '%a' "${EXTERNAL_DIR}/victim-${kind}")" = 644 ] || { echo "FAIL: ${kind}: link target chmod'ed"; exit 1; }
              [ -f "${SESSION_DIR}/.claude.json" ] && [ ! -L "${SESSION_DIR}/.claude.json" ] || { echo "FAIL: ${kind}: no regular copy"; exit 1; }
              grep -q '"host"' "${SESSION_DIR}/.claude.json" || { echo "FAIL: ${kind}: host content missing"; exit 1; }
              [ "$(stat -c '%a' "${SESSION_DIR}/.claude.json")" = 600 ] || { echo "FAIL: ${kind}: copy not 0600"; exit 1; }
              grep -qF 'is not a regular file' "${TEST_DIR}/err" || { echo "FAIL: ${kind}: no warning"; exit 1; }
          done
          echo "claude-json-link-safe"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "claude-json-link-safe"

  - name: Never writes through CLAUDE.md or statusline-command.sh symlinks planted in the session dir
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.sync_helpers}}"
          setup_sync_test
          trap 'rm -rf "${TEST_DIR}"' EXIT
          echo '# host' > "${HOST_CLAUDE}/CLAUDE.md"
          printf '#!/bin/sh\necho host\n' > "${HOST_CLAUDE}/statusline-command.sh"
          for f in CLAUDE.md statusline-command.sh; do
              echo victim > "${EXTERNAL_DIR}/${f}"
              chmod 644 "${EXTERNAL_DIR}/${f}"
              ln -s "../external/${f}" "${SESSION_DIR}/${f}"
          done
          run_sync >/dev/null 2>"${TEST_DIR}/err"
          for f in CLAUDE.md statusline-command.sh; do
              [ "$(cat "${EXTERNAL_DIR}/${f}")" = victim ] || { echo "FAIL: ${f}: link target overwritten"; exit 1; }
              [ "$(stat -c '%a' "${EXTERNAL_DIR}/${f}")" = 644 ] || { echo "FAIL: ${f}: link target chmod'ed"; exit 1; }
              [ -f "${SESSION_DIR}/${f}" ] && [ ! -L "${SESSION_DIR}/${f}" ] || { echo "FAIL: ${f}: no regular copy"; exit 1; }
          done
          [ -x "${SESSION_DIR}/statusline-command.sh" ] || { echo "FAIL: statusline copy not executable"; exit 1; }
          echo "md-statusline-link-safe"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "md-statusline-link-safe"

  - name: Removes planted links and directories where the host has no such file
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.sync_helpers}}"
          setup_sync_test
          trap 'rm -rf "${TEST_DIR}"' EXIT
          echo victim > "${EXTERNAL_DIR}/victim"
          ln -s "${EXTERNAL_DIR}/victim" "${SESSION_DIR}/CLAUDE.md"
          mkdir -p "${SESSION_DIR}/statusline-command.sh/sub"
          run_sync >/dev/null 2>"${TEST_DIR}/err"
          [ "$(cat "${EXTERNAL_DIR}/victim")" = victim ] || { echo "FAIL: link target touched"; exit 1; }
          [ ! -e "${SESSION_DIR}/CLAUDE.md" ] && [ ! -L "${SESSION_DIR}/CLAUDE.md" ] || { echo "FAIL: CLAUDE.md link kept"; exit 1; }
          [ ! -e "${SESSION_DIR}/statusline-command.sh" ] || { echo "FAIL: planted directory kept"; exit 1; }
          echo "stale-plants-removed"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "stale-plants-removed"

  - name: Replaces a directory planted at .claude.json with the host copy
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.sync_helpers}}"
          setup_sync_test
          trap 'rm -rf "${TEST_DIR}"' EXIT
          echo '{"host":true}' > "${HOME}/.claude.json"
          mkdir -p "${SESSION_DIR}/.claude.json"
          run_sync >/dev/null 2>/dev/null
          [ -f "${SESSION_DIR}/.claude.json" ] || { echo "FAIL: directory not replaced"; exit 1; }
          grep -q '"host"' "${SESSION_DIR}/.claude.json" || { echo "FAIL: host content missing"; exit 1; }
          echo "claude-json-dir-replaced"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "claude-json-dir-replaced"

  # Directories are built in the staging dir; the old entry is removed with
  # `rm -rf` (which removes a link rather than following it) and the copy is
  # renamed into place. Pinned here so a refactor that switches to copying
  # into an existing directory is caught.
  - name: Never writes through rules/ or skills/ symlinks planted in the session dir
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.sync_helpers}}"
          setup_sync_test
          trap 'rm -rf "${TEST_DIR}"' EXIT
          mkdir -p "${HOST_CLAUDE}/rules" "${HOST_CLAUDE}/skills/s" "${EXTERNAL_DIR}/victim"
          echo rule > "${HOST_CLAUDE}/rules/r.md"
          echo skill > "${HOST_CLAUDE}/skills/s/SKILL.md"
          echo precious > "${EXTERNAL_DIR}/victim/keep"
          ln -s ../external/victim "${SESSION_DIR}/rules"
          ln -s "${EXTERNAL_DIR}/victim" "${SESSION_DIR}/skills"
          run_sync >/dev/null 2>/dev/null
          [ "$(ls -A "${EXTERNAL_DIR}/victim")" = keep ] || { echo "FAIL: written into the link target"; ls -A "${EXTERNAL_DIR}/victim"; exit 1; }
          [ -f "${SESSION_DIR}/rules/r.md" ] && [ ! -L "${SESSION_DIR}/rules" ] || { echo "FAIL: rules not a real copy"; exit 1; }
          [ -f "${SESSION_DIR}/skills/s/SKILL.md" ] && [ ! -L "${SESSION_DIR}/skills" ] || { echo "FAIL: skills not a real copy"; exit 1; }
          echo "dir-links-safe"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "dir-links-safe"

  # ── Re-planted links during the sync ────────────────────────────────────────
  # Several sessions of one project run at once, so a running container can
  # re-plant a link after any check this script makes. The shim mv re-plants
  # the destination just before the rename that installs it; the rename must
  # replace a file link and refuse a directory link, never follow either.

  - name: Installs .claude.json over a link re-planted just before the rename
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.sync_helpers}}"
          setup_sync_test
          trap 'rm -rf "${TEST_DIR}"' EXIT
          echo '{"host":true}' > "${HOME}/.claude.json"
          echo victim > "${EXTERNAL_DIR}/victim"
          chmod 644 "${EXTERNAL_DIR}/victim"
          install_replant_shim .claude.json "${EXTERNAL_DIR}/victim"
          PATH="${SHIM_DIR}:${PATH}" run_sync >/dev/null
          [ -f "${TEST_DIR}/shim-fired" ] || { echo "FAIL: shim never fired"; exit 1; }
          [ "$(cat "${EXTERNAL_DIR}/victim")" = victim ] || { echo "FAIL: link target overwritten"; exit 1; }
          [ "$(stat -c '%a' "${EXTERNAL_DIR}/victim")" = 644 ] || { echo "FAIL: link target chmod'ed"; exit 1; }
          [ -f "${SESSION_DIR}/.claude.json" ] && [ ! -L "${SESSION_DIR}/.claude.json" ] || { echo "FAIL: no regular copy"; exit 1; }
          grep -q '"host"' "${SESSION_DIR}/.claude.json" || { echo "FAIL: host content missing"; exit 1; }
          [ "$(stat -c '%a' "${SESSION_DIR}/.claude.json")" = 600 ] || { echo "FAIL: copy not 0600"; exit 1; }
          ! ls -A "${TEST_DIR}" | grep -q '^\.claude-sync\.' || { echo "FAIL: staging dir left behind"; exit 1; }
          echo "claude-json-race-safe"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "claude-json-race-safe"

  - name: Aborts when rules/ is re-planted as a link just before the rename
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.sync_helpers}}"
          setup_sync_test
          trap 'rm -rf "${TEST_DIR}"' EXIT
          mkdir -p "${HOST_CLAUDE}/rules" "${EXTERNAL_DIR}/victim"
          echo rule > "${HOST_CLAUDE}/rules/r.md"
          echo precious > "${EXTERNAL_DIR}/victim/keep"
          install_replant_shim rules "${EXTERNAL_DIR}/victim"
          rc=0
          PATH="${SHIM_DIR}:${PATH}" run_sync >/dev/null 2>"${TEST_DIR}/err" || rc=$?
          [ -f "${TEST_DIR}/shim-fired" ] || { echo "FAIL: shim never fired"; exit 1; }
          [ "${rc}" = 1 ] || { echo "FAIL: exit ${rc}, want 1"; exit 1; }
          grep -qF 'rules in '"${SESSION_DIR}"' changed during sync' "${TEST_DIR}/err" || { echo "FAIL: no abort error"; cat "${TEST_DIR}/err"; exit 1; }
          [ "$(ls -A "${EXTERNAL_DIR}/victim")" = keep ] || { echo "FAIL: written into the link target"; ls -A "${EXTERNAL_DIR}/victim"; exit 1; }
          [ "$(cat "${EXTERNAL_DIR}/victim/keep")" = precious ] || { echo "FAIL: link target content changed"; exit 1; }
          ! ls -A "${TEST_DIR}" | grep -q '^\.claude-sync\.' || { echo "FAIL: staging dir left behind"; exit 1; }
          echo "rules-race-aborts"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "rules-race-aborts"

  - name: Aborts when a directory is re-planted at .claude.json just before the rename
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.sync_helpers}}"
          setup_sync_test
          trap 'rm -rf "${TEST_DIR}"' EXIT
          echo '{"host":true}' > "${HOME}/.claude.json"
          install_replant_shim .claude.json --dir
          rc=0
          PATH="${SHIM_DIR}:${PATH}" run_sync >/dev/null 2>"${TEST_DIR}/err" || rc=$?
          [ -f "${TEST_DIR}/shim-fired" ] || { echo "FAIL: shim never fired"; exit 1; }
          [ "${rc}" = 1 ] || { echo "FAIL: exit ${rc}, want 1"; exit 1; }
          grep -qF '.claude.json in '"${SESSION_DIR}"' changed during sync' "${TEST_DIR}/err" || { echo "FAIL: no abort error"; cat "${TEST_DIR}/err"; exit 1; }
          [ -d "${SESSION_DIR}/.claude.json" ] && [ -z "$(ls -A "${SESSION_DIR}/.claude.json")" ] || { echo "FAIL: copied into the planted directory"; exit 1; }
          [ -z "$(ls -A "${EXTERNAL_DIR}")" ] || { echo "FAIL: written outside the session dir"; ls -A "${EXTERNAL_DIR}"; exit 1; }
          ! ls -A "${TEST_DIR}" | grep -q '^\.claude-sync\.' || { echo "FAIL: staging dir left behind"; exit 1; }
          echo "claude-json-dir-race-aborts"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "claude-json-dir-race-aborts"

  - name: Aborts when skills/ is re-planted as a link just before the rename
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.sync_helpers}}"
          setup_sync_test
          trap 'rm -rf "${TEST_DIR}"' EXIT
          mkdir -p "${HOST_CLAUDE}/skills/s" "${EXTERNAL_DIR}/victim"
          echo skill > "${HOST_CLAUDE}/skills/s/SKILL.md"
          echo precious > "${EXTERNAL_DIR}/victim/keep"
          install_replant_shim skills "${EXTERNAL_DIR}/victim"
          rc=0
          PATH="${SHIM_DIR}:${PATH}" run_sync >/dev/null 2>"${TEST_DIR}/err" || rc=$?
          [ -f "${TEST_DIR}/shim-fired" ] || { echo "FAIL: shim never fired"; exit 1; }
          [ "${rc}" = 1 ] || { echo "FAIL: exit ${rc}, want 1"; exit 1; }
          grep -qF 'skills in '"${SESSION_DIR}"' changed during sync' "${TEST_DIR}/err" || { echo "FAIL: no abort error"; cat "${TEST_DIR}/err"; exit 1; }
          [ "$(ls -A "${EXTERNAL_DIR}/victim")" = keep ] || { echo "FAIL: written into the link target"; ls -A "${EXTERNAL_DIR}/victim"; exit 1; }
          [ "$(cat "${EXTERNAL_DIR}/victim/keep")" = precious ] || { echo "FAIL: link target content changed"; exit 1; }
          ! ls -A "${TEST_DIR}" | grep -q '^\.claude-sync\.' || { echo "FAIL: staging dir left behind"; exit 1; }
          echo "skills-race-aborts"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "skills-race-aborts"

  - name: Rejects a relative session dir before writing anything
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.sync_helpers}}"
          setup_sync_test
          trap 'rm -rf "${TEST_DIR}"' EXIT
          echo '{"host":true}' > "${HOME}/.claude.json"
          cd "${TEST_DIR}"
          rc=0
          "${RIOTBOX_DIR}/agents/claude/sync-settings.sh" "${HOST_CLAUDE}" session >/dev/null 2>"${TEST_DIR}/err" || rc=$?
          [ "${rc}" = 1 ] || { echo "FAIL: exit ${rc}, want 1"; exit 1; }
          grep -qF 'session dir must be an absolute path' "${TEST_DIR}/err" || { echo "FAIL: no error"; cat "${TEST_DIR}/err"; exit 1; }
          [ -z "$(ls -A "${SESSION_DIR}")" ] || { echo "FAIL: wrote into the session dir"; exit 1; }
          ! ls -A "${TEST_DIR}" "${SESSION_DIR}" | grep -q '^\.claude-sync\.' || { echo "FAIL: staging dir created"; exit 1; }
          echo "relative-session-dir-rejected"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "relative-session-dir-rejected"
