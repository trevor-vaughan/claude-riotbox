name: git-ai — attribution wiring
vars:
  root: "."
  riotbox_dir: "{{.root}}"

testcases:
  - name: the git-ai binary is pinned to an exact version with per-arch digests
    steps:
      - type: exec
        script: |
          set -e
          cd "{{.riotbox_dir}}"

          grep -qE '^ARG GIT_AI_VERSION=v[0-9]+\.[0-9]+\.[0-9]+$' Containerfile \
            || { echo "FAIL: GIT_AI_VERSION is not pinned to an exact tag"; exit 1; }
          grep -qE '^ARG GIT_AI_SHA256_AMD64=[0-9a-f]{64}$' Containerfile \
            || { echo "FAIL: GIT_AI_SHA256_AMD64 is not a 64-char digest"; exit 1; }
          grep -qE '^ARG GIT_AI_SHA256_ARM64=[0-9a-f]{64}$' Containerfile \
            || { echo "FAIL: GIT_AI_SHA256_ARM64 is not a 64-char digest"; exit 1; }

          # The download must be verified, not merely fetched.
          block="$(sed -n '/^ARG GIT_AI_VERSION=/,/git-ai --version/p' Containerfile)"
          printf '%s' "${block}" | grep -qF 'sha256sum -c -' \
            || { echo "FAIL: git-ai download is not checksum-verified"; exit 1; }
          printf '%s' "${block}" | grep -qF '/tools/bin/git-ai' \
            || { echo "FAIL: git-ai is not installed into the tools-stage bin dir"; exit 1; }

          # The asset name upstream publishes is git-ai-linux-<arch>, and the
          # tools stage normalises uname -m to amd64/arm64 — so the URL must
          # translate amd64 back to x64 or it will 404 on the common arch.
          printf '%s' "${block}" | grep -qF 'git-ai-linux-${ASSET_ARCH}' \
            || { echo "FAIL: download URL does not use the translated asset arch"; exit 1; }

          echo "PASS"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PASS"

  # ── Coverage guard ────────────────────────────────────────────────────────
  # Five cases in this suite exercise the REAL upstream binary — the config
  # writes, install-hooks, the end-to-end note on refs/notes/ai, and the drift
  # guard that is this project's whole early-warning system for upstream
  # reshaping what the strip verbs read. Each one opens with
  #
  #   BIN="$(command -v git-ai || true)"
  #   if [ -z "${BIN}" ]; then echo "SKIP: git-ai not on PATH"; exit 0; fi
  #
  # and asserts only on result.code, so without the binary every one of them
  # reports PASS having run nothing. That branch is deliberate — a maintainer
  # running `task test:direct` on a bare host should not be blocked — but it
  # made the suite green in CI while proving nothing, because
  # tests/Containerfile.test did not install git-ai.
  #
  # An environment that ships the binary declares RIOTBOX_REQUIRE_GIT_AI=1, and
  # this case turns a missing binary there into a red suite. The declaration
  # lives in the test image next to the install, so the claim and the thing it
  # claims cannot drift apart — removing the install removes the ENV with it
  # only if both are edited, and this case is what notices when they are not.
  - name: an environment that requires git-ai actually provides it
    steps:
      - type: exec
        script: |
          set -e
          if [ "${RIOTBOX_REQUIRE_GIT_AI:-0}" != "1" ]; then
            echo "PASS (git-ai not required here — the real-binary cases will skip)"
            exit 0
          fi
          command -v git-ai >/dev/null \
            || { echo "FAIL: RIOTBOX_REQUIRE_GIT_AI=1 but git-ai is not on PATH — the five real-binary cases in this suite are silently skipping"; exit 1; }
          echo "PASS"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PASS"

  # The test image has to pin git-ai independently of the runtime image — two
  # separate builds, no shared ARG — so the two pins can drift. A test image on
  # an older release would exercise the strip verbs and the drift guard against
  # a binary that is not the one RiotBox ships, which is the one thing this
  # suite must never quietly do.
  - name: the test image pins the same git-ai release as the runtime image
    steps:
      - type: exec
        script: |
          set -e
          cd "{{.riotbox_dir}}"

          runtime="$(sed -n 's/^ARG GIT_AI_VERSION=\(v.*\)$/\1/p' Containerfile | head -1)"
          [ -n "${runtime}" ] \
            || { echo "FAIL: could not read GIT_AI_VERSION from the Containerfile"; exit 1; }

          test_ver="$(sed -n 's/^ARG GIT_AI_VERSION=\(v.*\)$/\1/p' tests/Containerfile.test | head -1)"
          [ -n "${test_ver}" ] \
            || { echo "FAIL: tests/Containerfile.test does not pin GIT_AI_VERSION — the real-binary cases cannot run in CI"; exit 1; }
          [ "${runtime}" = "${test_ver}" ] \
            || { echo "FAIL: Containerfile pins ${runtime} but tests/Containerfile.test pins ${test_ver}"; exit 1; }

          # Same for the amd64 digest. The test image is amd64-only (its venom
          # download is too), so only that one is compared.
          runtime_sha="$(sed -n 's/^ARG GIT_AI_SHA256_AMD64=\(.*\)$/\1/p' Containerfile | head -1)"
          test_sha="$(sed -n 's/^ARG GIT_AI_SHA256_AMD64=\(.*\)$/\1/p' tests/Containerfile.test | head -1)"
          [ "${runtime_sha}" = "${test_sha}" ] \
            || { echo "FAIL: the two images pin different amd64 digests"; exit 1; }

          # The download must be verified there too, not merely fetched.
          grep -qF 'sha256sum -c -' tests/Containerfile.test \
            || { echo "FAIL: the test image's git-ai download is not checksum-verified"; exit 1; }

          # The requirement declaration that the coverage guard above reads.
          grep -qE '^ENV RIOTBOX_REQUIRE_GIT_AI=1$' tests/Containerfile.test \
            || { echo "FAIL: the test image installs git-ai but does not declare RIOTBOX_REQUIRE_GIT_AI=1"; exit 1; }

          echo "PASS"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PASS"

  - name: the session store is mounted by default and suppressed when off
    steps:
      - type: exec
        script: |
          set -e
          cd "{{.riotbox_dir}}"

          # On by default: the gate must default to 1, unlike every opt-in flag.
          grep -qF '"${RIOTBOX_GIT_AI:-1}" = "1"' scripts/mount-projects.sh \
            || { echo "FAIL: mount gate does not default to on"; exit 1; }
          grep -qF '/home/llm/.git-ai:z' scripts/mount-projects.sh \
            || { echo "FAIL: no bind mount for the git-ai store"; exit 1; }
          grep -qF 'mkdir -p "${riotbox_session_dir}/git-ai"' scripts/mount-projects.sh \
            || { echo "FAIL: session store dir is not created"; exit 1; }

          # The dry-run guard must wrap the mkdir, as the headroom block does.
          block="$(sed -n '/git-ai store/,/^\tfi$/p' scripts/mount-projects.sh)"
          printf '%s' "${block}" | grep -qF 'RIOTBOX_DRY_RUN' \
            || { echo "FAIL: mkdir is not guarded by the dry-run check"; exit 1; }

          # launch.sh must forward the gate, or RIOTBOX_GIT_AI=0 never reaches
          # the entrypoint and the opt-out silently does nothing.
          grep -qF 'RIOTBOX_GIT_AI:+-e RIOTBOX_GIT_AI=' libexec/launch.sh \
            || { echo "FAIL: RIOTBOX_GIT_AI is not passed into the container"; exit 1; }

          echo "PASS"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PASS"

  # ── Behavioral proof the gate actually controls the mount ────────────────
  # The static-grep testcase above only proves the substrings exist
  # somewhere in the file; it would still pass a gate that is present but
  # decorative (e.g. an `if` whose body is a no-op, with the mount emitted
  # unconditionally afterward). These invoke the real scripts under
  # RIOTBOX_DRY_RUN=1 / a fake CONTAINER_CMD, following the pattern already
  # established in tests/headroom.venom.yml for the same
  # podman-build-is-unavailable constraint.

  - name: mount-projects.sh emits the git-ai mount by default and omits it when RIOTBOX_GIT_AI=0
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"; trap 'rm -rf "${TMP}"' EXIT
          mkdir -p "${TMP}/xdg/riotbox" "${TMP}/etc" "${TMP}/proj"
          export XDG_CONFIG_HOME="${TMP}/xdg"
          export RIOTBOX_SYSCONF_DIR="${TMP}/etc"
          export RIOTBOX_DRY_RUN=1
          export RIOTBOX_PROJECTS="${TMP}/proj"
          export ROOT_DIR="{{.riotbox_dir}}"
          export CONTAINER_CMD=podman
          unset RIOTBOX_GIT_AI

          out_default="$(bash "{{.riotbox_dir}}/scripts/mount-projects.sh" --format=triple 2>&1)"
          echo "DEFAULT=${out_default}"
          echo "${out_default}" | grep -q '/home/llm/.git-ai' \
            || { echo "FAIL: git-ai mount missing with RIOTBOX_GIT_AI unset"; exit 1; }

          out_off="$(RIOTBOX_GIT_AI=0 bash "{{.riotbox_dir}}/scripts/mount-projects.sh" --format=triple 2>&1)"
          echo "OFF=${out_off}"
          if echo "${out_off}" | grep -q '/home/llm/.git-ai'; then
            echo "FAIL: git-ai mount still present with RIOTBOX_GIT_AI=0"
            exit 1
          fi

          echo "PASS"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PASS"

  - name: launch.sh forwards -e RIOTBOX_GIT_AI when set and omits it when unset
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"; trap 'rm -rf "${TMP}"' EXIT
          mkdir -p "${TMP}/etc" "${TMP}/xdg" "${TMP}/data" "${TMP}/proj"
          cat > "${TMP}/fake-cmd" <<'FAKE'
          #!/usr/bin/env bash
          printf '%s\n' "$*" > "${CAPTURE}"
          FAKE
          chmod +x "${TMP}/fake-cmd"
          export CAPTURE="${TMP}/argv"

          # Ambient pollution: this session itself runs headroom-wrapped, with
          # RIOTBOX_CONTEXT_MODE=1 and RIOTBOX_AGENT set. launch.sh hard-fails
          # if RIOTBOX_CONTEXT_MODE=1 and RIOTBOX_HEADROOM=1 are both set, and
          # a stray RIOTBOX_AGENT would perturb the captured argv unrelated to
          # what this test checks. Shed all of it before invoking launch.sh.
          unset CONTEXT_MODE_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED

          RIOTBOX_GIT_AI=0 \
          RIOTBOX_DRY_RUN=1 \
          RIOTBOX_PROJECTS="${TMP}/proj" \
          RIOTBOX_DATA_DIR="${TMP}/data" \
          RIOTBOX_SYSCONF_DIR="${TMP}/etc" XDG_CONFIG_HOME="${TMP}/xdg" HOME="${TMP}" \
          ROOT_DIR="{{.riotbox_dir}}" CONTAINER_CMD="${TMP}/fake-cmd" IMAGE_NAME=riotbox \
            bash "{{.riotbox_dir}}/libexec/launch.sh" bash
          argv_set="$(cat "${CAPTURE}")"
          echo "ARGV_SET=${argv_set}"
          echo "${argv_set}" | grep -q -- "-e RIOTBOX_GIT_AI=0" \
            || { echo "FAIL: RIOTBOX_GIT_AI=0 was not forwarded to the container"; exit 1; }

          unset RIOTBOX_GIT_AI
          RIOTBOX_DRY_RUN=1 \
          RIOTBOX_PROJECTS="${TMP}/proj" \
          RIOTBOX_DATA_DIR="${TMP}/data" \
          RIOTBOX_SYSCONF_DIR="${TMP}/etc" XDG_CONFIG_HOME="${TMP}/xdg" HOME="${TMP}" \
          ROOT_DIR="{{.riotbox_dir}}" CONTAINER_CMD="${TMP}/fake-cmd" IMAGE_NAME=riotbox \
            bash "{{.riotbox_dir}}/libexec/launch.sh" bash
          argv_unset="$(cat "${CAPTURE}")"
          echo "ARGV_UNSET=${argv_unset}"
          if echo "${argv_unset}" | grep -q -- "-e RIOTBOX_GIT_AI="; then
            echo "FAIL: RIOTBOX_GIT_AI was forwarded with no host value set"
            exit 1
          fi

          echo "PASS"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PASS"

  - name: session config disables telemetry, version checks and auto-updates
    steps:
      - type: exec
        script: |
          set -e
          BIN="$(command -v git-ai || true)"
          if [ -z "${BIN}" ]; then echo "SKIP: git-ai not on PATH"; exit 0; fi

          FAKE="$(mktemp -d)"
          trap 'rm -rf "${FAKE}"' EXIT

          # install-hooks honors CLAUDE_CONFIG_DIR, so HOME alone does not
          # contain where it writes. Both must be redirected or this test
          # rewrites the caller's real Claude settings.
          export HOME="${FAKE}"
          export CLAUDE_CONFIG_DIR="${FAKE}/.claude"
          export RIOTBOX_GIT_AI_BIN="${BIN}"
          mkdir -p "${CLAUDE_CONFIG_DIR}"

          # shellcheck disable=SC1091
          . "{{.riotbox_dir}}/container/git-ai-setup.sh"
          git_ai_write_config
          git_ai_stamp_version

          cfg="${FAKE}/.git-ai/config.json"
          [ -f "${cfg}" ] || { echo "FAIL: config.json not written"; exit 1; }

          # Assert against config.json, NOT `git ai config`: the merged dump
          # renders telemetry_oss as null even when the file holds "off".
          [ "$(jq -r '.telemetry_oss' "${cfg}")" = "off" ] \
            || { echo "FAIL: telemetry_oss not off"; exit 1; }
          [ "$(jq -r '.disable_version_checks' "${cfg}")" = "true" ] \
            || { echo "FAIL: version checks not disabled"; exit 1; }
          [ "$(jq -r '.disable_auto_updates' "${cfg}")" = "true" ] \
            || { echo "FAIL: auto updates not disabled"; exit 1; }
          [ "$(jq -r '.feature_flags.daemon_log_upload' "${cfg}")" = "false" ] \
            || { echo "FAIL: daemon log upload not disabled"; exit 1; }

          # The store records which release wrote it. Phase 3's host-side
          # aggregator reads container-written SQLite DBs and needs to know
          # which binary can read them; without this it would have to guess.
          marker="${FAKE}/.git-ai/.riotbox-version"
          [ -f "${marker}" ] || { echo "FAIL: .riotbox-version not written"; exit 1; }
          grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' "${marker}" \
            || { echo "FAIL: .riotbox-version is not a bare version"; cat "${marker}"; exit 1; }

          echo "PASS"
        assertions:
          - result.code ShouldEqual 0

  - name: wiring installs Claude hooks, the opencode plugin and the trace2 target
    steps:
      - type: exec
        script: |
          set -e
          BIN="$(command -v git-ai || true)"
          if [ -z "${BIN}" ]; then echo "SKIP: git-ai not on PATH"; exit 0; fi

          FAKE="$(mktemp -d)"
          trap '"${BIN}" bg shutdown --hard >/dev/null 2>&1 || true; rm -rf "${FAKE}"' EXIT

          export HOME="${FAKE}"
          export CLAUDE_CONFIG_DIR="${FAKE}/.claude"
          export RIOTBOX_GIT_AI_BIN="${BIN}"
          export GIT_AI_ALLOW_SUPERUSER=1
          mkdir -p "${CLAUDE_CONFIG_DIR}" "${FAKE}/.config/opencode"
          echo '{}' > "${CLAUDE_CONFIG_DIR}/settings.json"

          # shellcheck disable=SC1091
          . "{{.riotbox_dir}}/container/git-ai-setup.sh"
          git_ai_setup

          # Claude hooks — the matcher is "*", NOT the documented
          # Write|Edit|MultiEdit. Assert on the command naming our binary
          # rather than on the matcher, so an upstream matcher change does not
          # fail this case (the drift case below is what watches the shape).
          jq -e --arg b "${BIN}" '
            [.hooks.PreToolUse[]?.hooks[]?.command,
             .hooks.PostToolUse[]?.hooks[]?.command]
            | map(select(. // "" | contains($b))) | length >= 2
          ' "${CLAUDE_CONFIG_DIR}/settings.json" >/dev/null \
            || { echo "FAIL: Claude hooks not installed"; exit 1; }

          [ -f "${FAKE}/.config/opencode/plugins/git-ai.ts" ] \
            || { echo "FAIL: opencode plugin not installed"; exit 1; }

          # The trace2 target is the actual git integration; without it git
          # emits no events and attribution silently does nothing.
          grep -qF "${FAKE}/.git-ai/internal/daemon/trace2.sock" "${FAKE}/.gitconfig" \
            || { echo "FAIL: trace2 eventTarget not pointed at the session store"; exit 1; }

          echo "PASS"
        assertions:
          - result.code ShouldEqual 0

  # ── The Claude strip verb (agents/claude/git-ai.sh) ───────────────────────
  # These construct their own settings.json fixture by hand and never invoke
  # git-ai, so — unlike the cases above — there is no SKIP branch: both
  # assertions are unconditional.
  #
  # scripts/lib/json-write.sh is sourced explicitly before the strip file: in
  # a real session container/entrypoint.sh sources it once and composes every
  # setup script into that one shell (see the comment above the "session
  # config disables..." case in tests/context-mode.venom.yml), but the strip
  # file itself deliberately does not source it, so a case that sources only
  # agents/claude/git-ai.sh would hit a 127 on json_write_atomic, warn, leave
  # the hooks in place, and fail here claiming the code is broken when it is
  # only under-sourced.
  - name: the Claude strip removes our hooks and spares the user's
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          export RIOTBOX_GIT_AI_BIN="/home/llm/.local/bin/git-ai"
          mkdir -p "${CLAUDE_CONFIG_DIR}"

          # Two of our own hooks plus one the user wrote that merely mentions
          # git-ai in its text — the lookalike the ownership rule has to spare.
          jq -n --arg bin "${RIOTBOX_GIT_AI_BIN}" '{hooks: {
            PreToolUse: [
              {matcher:"*",    hooks:[{type:"command", command:($bin + " checkpoint claude --hook-input stdin")}]},
              {matcher:"Bash", hooks:[{type:"command", command:"echo '"'"'my own git-ai reminder'"'"'"}]}
            ],
            PostToolUse: [
              {matcher:"*",    hooks:[{type:"command", command:($bin + " checkpoint claude --hook-input stdin")}]}
            ]
          }}' > "${CLAUDE_CONFIG_DIR}/settings.json"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/git-ai.sh"
          agent_claude_git_ai_strip

          settings="${CLAUDE_CONFIG_DIR}/settings.json"
          jq -e '.' "${settings}" >/dev/null \
            || { echo "FAIL: settings.json is no longer valid JSON"; exit 1; }
          jq -e --arg bin "${RIOTBOX_GIT_AI_BIN}" \
            '[.hooks[]?[]?.hooks[]?.command | select((type=="string") and contains($bin))] | length == 0' \
            "${settings}" >/dev/null \
            || { echo "FAIL: a hook naming our binary survived: $(jq -c '.hooks' "${settings}")"; exit 1; }
          jq -e '[.hooks[]?[]?.hooks[]?.command | select(. == "echo '"'"'my own git-ai reminder'"'"'")] | length == 1' \
            "${settings}" >/dev/null \
            || { echo "FAIL: the user's own git-ai hook did not survive exactly once: $(jq -c '.hooks' "${settings}")"; exit 1; }
          echo "PASS"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PASS"

  # Ownership is decided on a whole path token and applied to the individual
  # hook entry, not to the stanza around it. Both halves are load-bearing:
  # a substring test deletes a user's `<bin>-wrapper` hook because our path is
  # a prefix of theirs, and a stanza-level verdict takes the user's own hook
  # down with ours whenever the two share a matcher. Either one over-removes,
  # which is the failure this verb's ownership rule exists to prevent.
  - name: the Claude strip prunes only our inner hooks and respects path boundaries
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          export RIOTBOX_GIT_AI_BIN="/home/llm/.local/bin/git-ai"
          mkdir -p "${CLAUDE_CONFIG_DIR}"

          # PreToolUse[0] mixes one of ours with one of the user's under a
          # single matcher; PreToolUse[1] is a sibling script of the user's
          # whose path merely starts with ours. PostToolUse holds nothing but
          # ours, written the way upstream quotes it. Notification holds an
          # argv array — a shape this filter cannot read, and therefore not
          # ours.
          jq -n --arg bin "${RIOTBOX_GIT_AI_BIN}" '{hooks: {
            PreToolUse: [
              {matcher:"Bash", hooks:[
                {type:"command", command:($bin + " checkpoint claude --hook-input stdin")},
                {type:"command", command:"echo user-own-hook-should-survive"}
              ]},
              {matcher:"Write", hooks:[{type:"command", command:($bin + "-wrapper checkpoint")}]}
            ],
            PostToolUse: [
              {matcher:"*", hooks:[{type:"command", command:("\"" + $bin + "\" checkpoint claude --hook-input stdin")}]}
            ],
            Notification: [
              {matcher:"*", hooks:[{type:"command", command:["/bin/sh","-c","echo argv-array"]}]}
            ]
          }}' > "${CLAUDE_CONFIG_DIR}/settings.json"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/git-ai.sh"
          agent_claude_git_ai_strip 2>/dev/null

          settings="${CLAUDE_CONFIG_DIR}/settings.json"
          jq -e '.' "${settings}" >/dev/null \
            || { echo "FAIL: settings.json is no longer valid JSON"; exit 1; }

          # 1. The mixed stanza keeps its matcher and the user's inner hook.
          jq -e '.hooks.PreToolUse[0].matcher == "Bash"
                 and (.hooks.PreToolUse[0].hooks | length) == 1
                 and .hooks.PreToolUse[0].hooks[0].command == "echo user-own-hook-should-survive"' \
            "${settings}" >/dev/null \
            || { echo "FAIL: the user's inner hook did not survive beside ours: $(jq -c '.hooks.PreToolUse' "${settings}")"; exit 1; }

          # 2. A longer path that merely begins with ours is not ours.
          jq -e --arg bin "${RIOTBOX_GIT_AI_BIN}" \
            '(.hooks.PreToolUse | length) == 2
             and .hooks.PreToolUse[1].hooks[0].command == ($bin + "-wrapper checkpoint")' \
            "${settings}" >/dev/null \
            || { echo "FAIL: the user's sibling wrapper hook was removed: $(jq -c '.hooks.PreToolUse' "${settings}")"; exit 1; }

          # 3. A stanza holding only ours goes, and with it the emptied key.
          jq -e '.hooks | has("PostToolUse") | not' "${settings}" >/dev/null \
            || { echo "FAIL: a stanza holding only our hook survived: $(jq -c '.hooks.PostToolUse' "${settings}")"; exit 1; }

          # 4. The unreadable command is carried through untouched.
          jq -e '.hooks.Notification[0].hooks[0].command == ["/bin/sh","-c","echo argv-array"]' \
            "${settings}" >/dev/null \
            || { echo "FAIL: the argv-array hook was altered or removed: $(jq -c '.hooks.Notification' "${settings}")"; exit 1; }

          echo "PASS"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PASS"

  - name: the Claude strip leaves a malformed settings.json alone
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          export RIOTBOX_GIT_AI_BIN="/home/llm/.local/bin/git-ai"
          mkdir -p "${CLAUDE_CONFIG_DIR}"
          printf 'not json at all' > "${CLAUDE_CONFIG_DIR}/settings.json"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/git-ai.sh"
          agent_claude_git_ai_strip 2>/dev/null || true

          contents="$(cat "${CLAUDE_CONFIG_DIR}/settings.json")"
          [ "${contents}" = "not json at all" ] \
            || { echo "FAIL: malformed settings.json was rewritten: ${contents}"; exit 1; }
          echo "PASS"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PASS"

  - name: the feature is off for any gate value other than 1
    steps:
      - type: exec
        script: |
          set -e
          BIN="$(command -v git-ai || true)"
          if [ -z "${BIN}" ]; then echo "SKIP: git-ai not on PATH"; exit 0; fi

          FAKE="$(mktemp -d)"
          trap 'rm -rf "${FAKE}"' EXIT
          export HOME="${FAKE}"
          export CLAUDE_CONFIG_DIR="${FAKE}/.claude"
          export RIOTBOX_GIT_AI_BIN="${BIN}"
          mkdir -p "${CLAUDE_CONFIG_DIR}"
          echo '{}' > "${CLAUDE_CONFIG_DIR}/settings.json"

          # shellcheck disable=SC1091
          . "{{.riotbox_dir}}/container/git-ai-setup.sh"

          RIOTBOX_GIT_AI=0 git_ai_setup
          jq -e '.hooks // {} | length == 0' "${CLAUDE_CONFIG_DIR}/settings.json" >/dev/null \
            || { echo "FAIL: hooks installed despite RIOTBOX_GIT_AI=0"; exit 1; }

          # Strict "1" compare: "true" must also disable, and the README says so.
          RIOTBOX_GIT_AI=true git_ai_setup
          jq -e '.hooks // {} | length == 0' "${CLAUDE_CONFIG_DIR}/settings.json" >/dev/null \
            || { echo "FAIL: RIOTBOX_GIT_AI=true should disable, not enable"; exit 1; }

          echo "PASS"
        assertions:
          - result.code ShouldEqual 0

  # ── The off-path's dispatch (container/git-ai-setup.sh) ───────────────────
  # Every strip case in this suite calls a verb DIRECTLY. That leaves the glue
  # between them untested: git_ai_setup's off-path is what actually runs at
  # session start with RIOTBOX_GIT_AI=0, and it has two jobs no direct call
  # covers — reaching every registered agent through agent_call, and letting
  # the verbs' own stderr reach the user. The second one matters as much as the
  # first: when a strip cannot complete, the wiring it failed to remove keeps
  # firing a PreToolUse and a PostToolUse hook on upstream's "*" matcher at a
  # binary this session stopped configuring. A user who is not told that has no
  # way to know the opt-out only half-took.
  #
  # The case above this one sources git-ai-setup.sh WITHOUT the registry, so
  # AGENT_REGISTRY is unset, the loop body never executes, and it proves only
  # that hooks were not installed. This one loads the registry, so the loop
  # actually runs.
  #
  # No git-ai binary is involved — the off-path returns before the executable
  # check and the strip verbs compare strings — so there is no SKIP branch and
  # both assertions are unconditional.
  - name: the off-path strips through the registry and reports what it removed
    steps:
      - type: exec
        script: |
          set -e
          FAKE="$(mktemp -d)"
          trap 'rm -rf "${FAKE}"' EXIT
          export HOME="${FAKE}"
          export CLAUDE_CONFIG_DIR="${FAKE}/.claude"
          export RIOTBOX_GIT_AI_BIN="${FAKE}/.local/bin/git-ai"
          mkdir -p "${CLAUDE_CONFIG_DIR}" "${FAKE}/.config/opencode/plugins"

          # Both agents carry wiring an earlier on-run would have left behind.
          jq -n --arg bin "${RIOTBOX_GIT_AI_BIN}" '{
            hooks: {
              PreToolUse: [{matcher: "*", hooks: [
                {type: "command", command: ($bin + " checkpoint --hook-input")}
              ]}]
            }
          }' > "${CLAUDE_CONFIG_DIR}/settings.json"
          cat > "${FAKE}/.config/opencode/plugins/git-ai.ts" <<'EOF'
          /**
           * git-ai plugin for OpenCode
           */
          export const x = 1
          EOF

          # json_write_atomic comes from scripts/lib/json-write.sh, which
          # entrypoint.sh sources ahead of git-ai-setup.sh; the registry is what
          # populates AGENT_REGISTRY and defines agent_call.
          # shellcheck disable=SC1091
          . "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          # shellcheck disable=SC1091
          . "{{.riotbox_dir}}/agents/registry.sh"
          # shellcheck disable=SC1091
          . "{{.riotbox_dir}}/container/git-ai-setup.sh"

          RIOTBOX_GIT_AI=0 git_ai_setup 2>"${FAKE}/err"

          # 1. Every registered agent was reached, not just the first.
          jq -e '(.hooks // {}) | length == 0' "${CLAUDE_CONFIG_DIR}/settings.json" >/dev/null \
            || { echo "FAIL: the Claude hook survived the off-path"; exit 1; }
          [ ! -f "${FAKE}/.config/opencode/plugins/git-ai.ts" ] \
            || { echo "FAIL: the opencode plugin survived the off-path"; exit 1; }

          # 2. The user was told. Each verb announces its own removal, and the
          #    off-path must not swallow it.
          grep -qF 'Removed hook wiring' "${FAKE}/err" \
            || { echo "FAIL: the Claude removal was not reported"; cat "${FAKE}/err"; exit 1; }
          grep -qF 'Removed the generated opencode plugin' "${FAKE}/err" \
            || { echo "FAIL: the opencode removal was not reported"; cat "${FAKE}/err"; exit 1; }

          echo "PASS"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PASS"

  # The warning path of the same dispatch. A settings.json the strip cannot
  # parse is the case that most needs a voice: nothing is removed, the stale
  # hooks stay live, and silence would read as a clean opt-out.
  - name: the off-path reports a strip it could not complete
    steps:
      - type: exec
        script: |
          set -e
          FAKE="$(mktemp -d)"
          trap 'rm -rf "${FAKE}"' EXIT
          export HOME="${FAKE}"
          export CLAUDE_CONFIG_DIR="${FAKE}/.claude"
          export RIOTBOX_GIT_AI_BIN="${FAKE}/.local/bin/git-ai"
          mkdir -p "${CLAUDE_CONFIG_DIR}"

          printf '{ "hooks": ' > "${CLAUDE_CONFIG_DIR}/settings.json"

          # shellcheck disable=SC1091
          . "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          # shellcheck disable=SC1091
          . "{{.riotbox_dir}}/agents/registry.sh"
          # shellcheck disable=SC1091
          . "{{.riotbox_dir}}/container/git-ai-setup.sh"

          RIOTBOX_GIT_AI=0 git_ai_setup 2>"${FAKE}/err"

          grep -qF 'is not valid JSON' "${FAKE}/err" \
            || { echo "FAIL: an unparseable settings.json was stripped in silence"; cat "${FAKE}/err"; exit 1; }
          # The file itself is left exactly as found — the strip does not
          # rewrite what it cannot read.
          [ "$(cat "${CLAUDE_CONFIG_DIR}/settings.json")" = '{ "hooks": ' ] \
            || { echo "FAIL: the malformed file was rewritten"; exit 1; }

          echo "PASS"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PASS"

  # The third way a session can end up with wiring nobody maintains. The two
  # cases above cover the feature being switched off; this one covers it being
  # ON against an image whose binary is gone. The outcome for the session
  # directory is identical — hooks left pointing at a path that does not
  # resolve, fired on every tool call — so the remedy has to be identical too.
  # An earlier draft warned and returned here, which left exactly the stale
  # wiring the off-path exists to clear.
  - name: a missing binary strips the wiring rather than leaving it stale
    steps:
      - type: exec
        script: |
          set -e
          FAKE="$(mktemp -d)"
          trap 'rm -rf "${FAKE}"' EXIT
          export HOME="${FAKE}"
          export CLAUDE_CONFIG_DIR="${FAKE}/.claude"
          # Deliberately not created: this is the broken-image case.
          export RIOTBOX_GIT_AI_BIN="${FAKE}/.local/bin/git-ai"
          mkdir -p "${CLAUDE_CONFIG_DIR}"

          jq -n --arg bin "${RIOTBOX_GIT_AI_BIN}" '{
            hooks: {
              PostToolUse: [{matcher: "*", hooks: [
                {type: "command", command: ($bin + " checkpoint --hook-input")}
              ]}]
            }
          }' > "${CLAUDE_CONFIG_DIR}/settings.json"

          # shellcheck disable=SC1091
          . "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          # shellcheck disable=SC1091
          . "{{.riotbox_dir}}/agents/registry.sh"
          # shellcheck disable=SC1091
          . "{{.riotbox_dir}}/container/git-ai-setup.sh"

          # The feature is ON — this is not the opt-out path.
          RIOTBOX_GIT_AI=1 git_ai_setup 2>"${FAKE}/err"

          jq -e '(.hooks // {}) | length == 0' "${CLAUDE_CONFIG_DIR}/settings.json" >/dev/null \
            || { echo "FAIL: stale hooks survived a missing binary"; cat "${FAKE}/err"; exit 1; }
          grep -qF 'is missing' "${FAKE}/err" \
            || { echo "FAIL: the missing binary was not reported"; cat "${FAKE}/err"; exit 1; }

          echo "PASS"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PASS"

  # ── The opencode strip verb (agents/opencode/git-ai.sh) ───────────────────
  # opencode auto-loads every *.ts under ~/.config/opencode/plugins/, and
  # upstream's install-hooks bakes the binary's absolute path into git-ai.ts
  # at install time. That directory is a session bind mount, so removal is
  # content-gated on upstream's generated banner, not on the path — the same
  # under-remove-rather-than-over-remove rule the Claude strip follows.
  # Neither case below invokes git-ai, so both assertions are unconditional.
  - name: the opencode strip removes only our plugin file
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          export RIOTBOX_GIT_AI_BIN="/home/llm/.local/bin/git-ai"
          mkdir -p "${HOME}/.config/opencode/plugins"

          cat > "${HOME}/.config/opencode/plugins/git-ai.ts" <<'EOF'
          /**
           * git-ai plugin for OpenCode
           */
          export const x = 1
          EOF
          cat > "${HOME}/.config/opencode/plugins/my-plugin.ts" <<'EOF'
          export const mine = 1
          EOF

          source "{{.riotbox_dir}}/agents/opencode/git-ai.sh"
          agent_opencode_git_ai_strip

          [ ! -f "${HOME}/.config/opencode/plugins/git-ai.ts" ] \
            || { echo "FAIL: our plugin file survived"; exit 1; }
          [ -f "${HOME}/.config/opencode/plugins/my-plugin.ts" ] \
            || { echo "FAIL: the user's own plugin was removed"; exit 1; }
          echo "PASS"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PASS"

  - name: a hand-written git-ai.ts is left alone
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          export RIOTBOX_GIT_AI_BIN="/home/llm/.local/bin/git-ai"
          mkdir -p "${HOME}/.config/opencode/plugins"

          cat > "${HOME}/.config/opencode/plugins/git-ai.ts" <<'EOF'
          export const handWritten = true
          EOF
          cat > "${HOME}/.config/opencode/plugins/my-plugin.ts" <<'EOF'
          export const mine = 1
          EOF

          source "{{.riotbox_dir}}/agents/opencode/git-ai.sh"
          agent_opencode_git_ai_strip

          [ -f "${HOME}/.config/opencode/plugins/git-ai.ts" ] \
            || { echo "FAIL: the hand-written file was removed"; exit 1; }
          grep -qF 'handWritten' "${HOME}/.config/opencode/plugins/git-ai.ts" \
            || { echo "FAIL: the hand-written file's contents were altered"; exit 1; }
          echo "PASS"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PASS"

  # Adversarial probing (not a hand-built guess) found that a free-substring
  # match over-removes: a user plugin whose own comment happens to mention the
  # phrase reads as ours under `grep -qF` even though it is not a block-comment
  # banner line. This pins that fix — the same class of bug the Claude strip's
  # `contains($bin)` had before it moved to a whole-token test.
  - name: the opencode strip spares a user plugin that merely mentions the banner text
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          export RIOTBOX_GIT_AI_BIN="/home/llm/.local/bin/git-ai"
          mkdir -p "${HOME}/.config/opencode/plugins"

          cat > "${HOME}/.config/opencode/plugins/git-ai.ts" <<'EOF'
          // replaces the git-ai plugin for OpenCode
          export const custom = true
          EOF

          source "{{.riotbox_dir}}/agents/opencode/git-ai.sh"
          agent_opencode_git_ai_strip

          [ -f "${HOME}/.config/opencode/plugins/git-ai.ts" ] \
            || { echo "FAIL: the user's lookalike plugin was removed"; exit 1; }
          grep -qF 'custom' "${HOME}/.config/opencode/plugins/git-ai.ts" \
            || { echo "FAIL: the user's lookalike plugin's contents were altered"; exit 1; }
          echo "PASS"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PASS"

  - name: the entrypoint sources and calls git-ai setup in the right order
    steps:
      - type: exec
        script: |
          set -e
          cd "{{.riotbox_dir}}"
          f=container/entrypoint.sh

          grep -qF 'source "${RIOTBOX_SCRIPT_DIR}/git-ai-setup.sh"' "${f}" \
            || { echo "FAIL: git-ai-setup.sh is not sourced"; exit 1; }

          agents=$(grep -n 'agent_call "${_agent}" container_setup' "${f}" | cut -d: -f1 | head -1)
          ctx=$(grep -n '^context_mode_setup$' "${f}" | cut -d: -f1 | head -1)
          gitai=$(grep -n '^git_ai_setup$' "${f}" | cut -d: -f1 | head -1)
          branch=$(grep -n '^session_branch_setup$' "${f}" | cut -d: -f1 | head -1)

          [ -n "${gitai}" ] || { echo "FAIL: git_ai_setup is never called"; exit 1; }

          # After the agent loop: opencode's regenerated config must exist
          # before install-hooks writes a plugin next to it.
          [ "${gitai}" -gt "${agents}" ] \
            || { echo "FAIL: git_ai_setup runs before the agent setup loop"; exit 1; }
          # After context_mode_setup: both read-modify-write settings.json, and
          # the later writer must see the settled file.
          [ "${gitai}" -gt "${ctx}" ] \
            || { echo "FAIL: git_ai_setup runs before context_mode_setup"; exit 1; }
          # Before the session branch, so trace2 is live for its git activity.
          [ "${gitai}" -lt "${branch}" ] \
            || { echo "FAIL: git_ai_setup runs after session_branch_setup"; exit 1; }

          echo "PASS"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PASS"

  - name: doctor checks git-ai and is registered in the run list
    steps:
      - type: exec
        script: |
          set -e
          cd "{{.riotbox_dir}}"

          grep -qF 'preflight_check_git_ai()' scripts/preflight.sh \
            || { echo "FAIL: no preflight_check_git_ai function"; exit 1; }
          grep -qF 'preflight_check_git_ai' <(sed -n '/local checks=(/,/)/p' scripts/preflight.sh) \
            || { echo "FAIL: the check is defined but never run"; exit 1; }

          # An unrecognised value silently disables the feature, exactly as it
          # does for RIOTBOX_HEADROOM, so doctor must say so rather than let
          # RIOTBOX_GIT_AI=true read as enabled.
          block="$(sed -n '/^preflight_check_git_ai()/,/^}/p' scripts/preflight.sh)"
          printf '%s' "${block}" | grep -qF 'is not recognized' \
            || { echo "FAIL: an unrecognised gate value is not reported"; exit 1; }
          printf '%s' "${block}" | grep -qF 'GIT_AI_VERSION' \
            || { echo "FAIL: the image version is not checked against the pin"; exit 1; }
          echo "PASS"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PASS"

  - name: doctor is silent about git-ai when it is switched off
    steps:
      - type: exec
        script: |
          set -e
          cd "{{.riotbox_dir}}"
          # shellcheck disable=SC1091
          . scripts/preflight.sh
          rc=0
          RIOTBOX_GIT_AI=0 preflight_check_git_ai >/dev/null 2>&1 || rc=$?
          [ "${rc}" -eq 0 ] \
            || { echo "FAIL: doctor fails when git-ai is disabled (rc=${rc})"; exit 1; }
          echo "PASS"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PASS"

  - name: a checkpointed edit is attributed in refs/notes/ai on commit
    steps:
      - type: exec
        script: |
          set -e
          BIN="$(command -v git-ai || true)"
          if [ -z "${BIN}" ]; then echo "SKIP: git-ai not on PATH"; exit 0; fi

          FAKE="$(mktemp -d)"
          trap '"${BIN}" bg shutdown --hard >/dev/null 2>&1 || true; rm -rf "${FAKE}"' EXIT

          export HOME="${FAKE}"
          export CLAUDE_CONFIG_DIR="${FAKE}/.claude"
          export GIT_AI_ALLOW_SUPERUSER=1
          mkdir -p "${CLAUDE_CONFIG_DIR}"

          # ── git isolation, with a deliberate exception ──────────────────
          # The project rule is GIT_CONFIG_GLOBAL=/dev/null. This suite CANNOT
          # use it: git-ai integrates through trace2.eventTarget in the GLOBAL
          # config, so nulling it disables the very feature under test and the
          # case would pass while proving nothing. A dedicated global config
          # file gives the same isolation from the caller's ~/.gitconfig while
          # leaving somewhere for install-hooks to write.
          # Do not "fix" this back to /dev/null.
          export GIT_CONFIG_GLOBAL="${FAKE}/.gitconfig"
          export GIT_CONFIG_SYSTEM=/dev/null
          export GIT_AUTHOR_NAME=riotbox
          export GIT_AUTHOR_EMAIL=riotbox@invalid
          export GIT_COMMITTER_NAME=riotbox
          export GIT_COMMITTER_EMAIL=riotbox@invalid
          touch "${GIT_CONFIG_GLOBAL}"

          "${BIN}" install-hooks >/dev/null 2>&1

          repo="${FAKE}/repo"
          mkdir -p "${repo}"
          cd "${repo}"
          git init -q
          printf 'line1\n' > f.txt
          git add f.txt
          git commit -qm "human baseline"

          # Mimic what Claude Code sends a PostToolUse hook.
          printf 'line1\nAI_ADDED_LINE\n' > f.txt
          jq -n --arg t "${FAKE}/transcript.jsonl" --arg cwd "${repo}" '{
            session_id: "sess-test-1", transcript_path: $t,
            hook_event_name: "PostToolUse", tool_name: "Write",
            tool_input: {file_path: "f.txt", content: "line1\nAI_ADDED_LINE\n"},
            cwd: $cwd
          }' > "${FAKE}/hook.json"

          "${BIN}" checkpoint claude --hook-input stdin < "${FAKE}/hook.json" >/dev/null 2>&1
          "${BIN}" await --timeout 20 >/dev/null 2>&1 || true

          git add f.txt
          git commit -qm "ai edit"
          "${BIN}" await --timeout 20 >/dev/null 2>&1 || true

          # The ref is refs/notes/ai — NOT refs/notes/git-ai, which is the
          # natural guess and is wrong.
          git for-each-ref refs/notes --format='%(refname)' | grep -qx 'refs/notes/ai' \
            || { echo "FAIL: refs/notes/ai was not created"; \
                 git for-each-ref refs/notes; exit 1; }

          note="$(git notes --ref=ai show HEAD 2>/dev/null || true)"
          [ -n "${note}" ] || { echo "FAIL: HEAD carries no authorship note"; exit 1; }
          printf '%s' "${note}" | grep -qF 'authorship/3.0.0' \
            || { echo "FAIL: note is not an authorship/3.0.0 log"; printf '%s\n' "${note}"; exit 1; }
          printf '%s' "${note}" | grep -qF 'sess-test-1' \
            || { echo "FAIL: note does not name the agent session"; printf '%s\n' "${note}"; exit 1; }

          echo "PASS"
        assertions:
          - result.code ShouldEqual 0

  # ── Upstream drift guard ──────────────────────────────────────────────────
  # This project's whole design leans on "let upstream own the hook shape":
  # the strip verbs and the e2e case above key off upstream's install-hooks
  # output rather than re-implementing it. Upstream's own docs have already
  # drifted from its binary twice — the documented Claude matcher
  # (Write|Edit|MultiEdit) is actually "*", and the documented-looking notes
  # ref (refs/notes/git-ai) is actually refs/notes/ai. Neither of those
  # mistakes would fail a single other testcase in this suite quietly; this
  # case exists to fail loudly the next time upstream reshapes something this
  # project depends on, instead of letting attribution degrade silently.
  #
  # This testcase HAS a SKIP branch (git-ai not on PATH) that exits 0 without
  # printing PASS, so only result.code is asserted — do not add a
  # ShouldContainSubstring "PASS" here, or a legitimate SKIP would fail.
  - name: upstream still installs the shapes this project depends on
    steps:
      - type: exec
        script: |
          set -e
          BIN="$(command -v git-ai || true)"
          if [ -z "${BIN}" ]; then echo "SKIP: git-ai not on PATH"; exit 0; fi

          FAKE="$(mktemp -d)"
          trap '"${BIN}" bg shutdown --hard >/dev/null 2>&1 || true; rm -rf "${FAKE}"' EXIT

          export HOME="${FAKE}"
          export CLAUDE_CONFIG_DIR="${FAKE}/.claude"
          export GIT_AI_ALLOW_SUPERUSER=1
          mkdir -p "${CLAUDE_CONFIG_DIR}" "${FAKE}/.config/opencode"
          echo '{}' > "${CLAUDE_CONFIG_DIR}/settings.json"

          "${BIN}" install-hooks >/dev/null 2>&1

          # 1. Claude hooks land in settings.json under CLAUDE_CONFIG_DIR.
          jq -e '(.hooks.PreToolUse | length) > 0 and (.hooks.PostToolUse | length) > 0' \
            "${CLAUDE_CONFIG_DIR}/settings.json" >/dev/null \
            || { echo "DRIFT: Claude hooks are no longer written to settings.json"; exit 1; }

          # 2. The hook command still uses the checkpoint/--hook-input contract
          #    the strip verbs and the e2e case are written against.
          jq -e '[.hooks[]?[]?.hooks[]?.command
                  | select((. // "") | contains("checkpoint") and contains("--hook-input"))]
                 | length > 0' \
            "${CLAUDE_CONFIG_DIR}/settings.json" >/dev/null \
            || { echo "DRIFT: the checkpoint --hook-input hook contract changed"; exit 1; }

          # 3. The opencode plugin still lands at the path the strip verb
          #    knows, still carrying the banner in the EXACT shape and
          #    position the strip verb's gate requires. This is deliberately
          #    coupled to agents/opencode/git-ai.sh's own gate rather than a
          #    loose substring check: an earlier draft of this project used a
          #    bare `grep -qF` over the whole file, which would still report
          #    PASS if upstream moved the banner past line 10 or reshaped it
          #    out of block-comment form — while the strip verb itself, whose
          #    gate is stricter, would silently stop recognizing its own
          #    generated file and leave stale wiring in every session. This
          #    check sources the strip verb's own marker variable and reuses
          #    its own grep pattern verbatim, so the two can never diverge on
          #    what "the banner" means.
          plugin="${FAKE}/.config/opencode/plugins/git-ai.ts"
          [ -f "${plugin}" ] \
            || { echo "DRIFT: opencode plugin path changed"; exit 1; }
          # shellcheck disable=SC1091
          . "{{.riotbox_dir}}/agents/opencode/git-ai.sh"
          grep -qF "${_GIT_AI_OPENCODE_MARKER}" "${plugin}" \
            || { echo "DRIFT: opencode plugin banner text is gone entirely"; exit 1; }
          # shellcheck disable=SC2312
          head -n 10 "${plugin}" 2>/dev/null |
            grep -qE "^[[:space:]]*\*[[:space:]]+${_GIT_AI_OPENCODE_MARKER}[[:space:]]*\$" \
            || { echo "DRIFT: opencode plugin banner moved past line 10 or is no longer a block-comment line — the strip verb's gate would go blind to it"; exit 1; }

          # 4. The git integration is still trace2 in the global config.
          grep -qF 'trace2' "${FAKE}/.gitconfig" \
            || { echo "DRIFT: git-ai no longer integrates via trace2"; exit 1; }

          # 5. The store layout the mount and doctor checks assume.
          [ -d "${FAKE}/.git-ai/internal/daemon" ] \
            || { echo "DRIFT: the daemon directory moved"; exit 1; }

          echo "PASS"
        assertions:
          - result.code ShouldEqual 0
