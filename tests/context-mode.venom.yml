name: context-mode — the Claude session path and the build-time pins behind it
vars:
  root: "."
  riotbox_dir: "{{.root}}"

# Deciding whether a new case belongs here: the plugin REGISTRATION is covered
# by tests/plugin-setup.venom.yml, not by this file. RiotBox no longer writes
# Claude's wiring — the image stages upstream's marketplace plugin at a pinned
# ref and container/plugin-setup.sh registers it against the session — so what
# is left here is everything around that registration.
#
# Which is three kinds of thing. They are INTERLEAVED rather than sectioned, so
# read this as what the file covers and not as a map of where to find it:
#
#   * The per-session Claude path in container/context-mode-setup.sh — the
#     storage and platform pins, the probe that decides whether this session
#     actually has a Context Mode plugin to claim, and the stripper that clears
#     hook stanzas an earlier release wrote by hand.
#   * The build-time pins that path depends on. No image is built here, so the
#     layer cases read the Containerfile as text — the Context Mode layer, the
#     bun layer, the plugin-staging layer and its three-way version check, the
#     COPY manifests. The claude build assert is the exception: it is sourced
#     through agents/registry.sh and executed against fixtures, both the
#     accepting and the rejecting direction.
#   * The seams either side of it — the launcher forwarding
#     RIOTBOX_SESSION_KEY, entrypoint ordering, and the generated shim
#     context_mode_pkg_root parses.
#
# See docs/dev/decisions/context-mode-native-plugin.md for why the wiring was
# retired, and docs/dev/context-mode.md for how the integration behaves now.

# Every case sources scripts/lib/json-write.sh first, the way entrypoint.sh
# does: the atomic config writer is shared with codegraph-setup.sh, so neither
# setup script owns it and neither may source it (the image build sources this
# one on its own). Its own contract is pinned by tests/lib-json-write.venom.yml.

testcases:
  - name: strip never writes an empty document over an existing config
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          export CONTEXT_MODE_BIN="${HOME}/.local/bin/context-mode"
          mkdir -p "${CLAUDE_CONFIG_DIR}" "${HOME}/.local/bin"
          printf '#!/bin/sh\nexit 0\n' > "${CONTEXT_MODE_BIN}"
          chmod +x "${CONTEXT_MODE_BIN}"

          # The shape the previous release wrote, seeded directly — the verb
          # that wrote it is gone, and the stripper still has to face it.
          jq -n --arg bin "${CONTEXT_MODE_BIN}" '{hooks: {
            PreToolUse:   [{matcher:"Bash", hooks:[{type:"command", command:($bin + " hook claude-code pretooluse")}]}],
            SessionStart: [{matcher:"",     hooks:[{type:"command", command:($bin + " hook claude-code sessionstart")}]}]
          }}' > "${CLAUDE_CONFIG_DIR}/settings.json"
          jq -n --arg bin "${CONTEXT_MODE_BIN}" \
            '{mcpServers: {"plugin_context-mode_context-mode": {type:"stdio", command:$bin, args:[]}}}' \
            > "${CLAUDE_CONFIG_DIR}/.claude.json"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/registry.sh"
          settings_before="$(cat "${CLAUDE_CONFIG_DIR}/settings.json")"
          claude_json_before="$(cat "${CLAUDE_CONFIG_DIR}/.claude.json")"

          jq() {
            if [ "$#" -eq 1 ] && [ "$1" = "." ]; then
              return 0
            fi
            command jq "$@"
          }
          err="$(agent_call claude context_mode_strip 2>&1 >/dev/null)"
          unset -f jq

          [ "${settings_before}" = "$(cat "${CLAUDE_CONFIG_DIR}/settings.json")" ] \
            || { echo "FAIL: settings.json truncated by an empty pretty-print"; exit 1; }
          [ "${claude_json_before}" = "$(cat "${CLAUDE_CONFIG_DIR}/.claude.json")" ] \
            || { echo "FAIL: .claude.json truncated by an empty pretty-print"; exit 1; }
          echo "${err}" | grep -q "left in place" \
            || { echo "FAIL: the failed cleanup was silent: ${err}"; exit 1; }
          echo "strip_empty_format=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "strip_empty_format=pass"

  # The discriminator, not just the preservation. An entry is ours only when its
  # command names the shim path, so "a user-written hook that merely mentions
  # context-mode survives". A hook whose command is unrelated proves nothing
  # about that predicate — a looser `contains("context-mode")` would keep it
  # too. The second entry below is the lookalike that tells the two apart: it
  # says `context-mode hook claude-code pretooluse` with no path, exactly what
  # someone who read the vendor docs and wired their own hook would write.
  - name: strip keeps user PreToolUse entries that are not ours, lookalikes included
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          export CONTEXT_MODE_BIN="${HOME}/.local/bin/context-mode"
          mkdir -p "${CLAUDE_CONFIG_DIR}" "${HOME}/.local/bin"
          printf '#!/bin/sh\nexit 0\n' > "${CONTEXT_MODE_BIN}"
          chmod +x "${CONTEXT_MODE_BIN}"
          # Two user entries and, between them, the stanza the previous release
          # wrote — the one entry the strip below is entitled to remove.
          jq -n --arg bin "${CONTEXT_MODE_BIN}" '{hooks: {PreToolUse: [
            {matcher:"Bash",     hooks:[{type:"command", command:"my-audit.sh"}]},
            {matcher:"WebFetch", hooks:[{type:"command", command:"context-mode hook claude-code pretooluse"}]},
            {matcher:"Bash",     hooks:[{type:"command", command:($bin + " hook claude-code pretooluse")}]}
          ]}}' > "${CLAUDE_CONFIG_DIR}/settings.json"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/registry.sh"
          agent_call claude context_mode_strip 2>/dev/null

          jq -e '.hooks.PreToolUse | length == 2' \
            "${CLAUDE_CONFIG_DIR}/settings.json" >/dev/null \
            || { echo "FAIL: expected both user entries, got $(jq -c '.hooks.PreToolUse' "${CLAUDE_CONFIG_DIR}/settings.json")"; exit 1; }
          jq -e '.hooks.PreToolUse[0].hooks[0].command == "my-audit.sh"' \
            "${CLAUDE_CONFIG_DIR}/settings.json" >/dev/null \
            || { echo "FAIL: the unrelated user entry did not survive"; exit 1; }
          jq -e '.hooks.PreToolUse[1].hooks[0].command == "context-mode hook claude-code pretooluse"' \
            "${CLAUDE_CONFIG_DIR}/settings.json" >/dev/null \
            || { echo "FAIL: the user's own context-mode hook was removed with ours"; exit 1; }
          echo "strip_keeps_user=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "strip_keeps_user=pass"

  # A `command` that is not a string. settings.json lives in a hand-editable
  # host bind mount, and an argv array — `["/bin/sh","-c","…"]` — is a shape a
  # person plausibly writes there. jq's `contains` raises on a non-string
  # instead of answering false, and one raise fails the whole filter: the
  # cleanup jq aborts, and the previous release's deny hooks stay on disk for
  # the life of the session directory, dispatching every event a second time
  # beside the registered plugin's own.
  # A shape jq does not understand is "not ours", never a fatal error — the rule
  # codegraph_strip_session_wiring already spells out for the same reason.
  - name: strip treats a non-string hook command as not ours
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          export CONTEXT_MODE_BIN="${HOME}/.local/bin/context-mode"
          mkdir -p "${CLAUDE_CONFIG_DIR}" "${HOME}/.local/bin"
          printf '#!/bin/sh\nexit 0\n' > "${CONTEXT_MODE_BIN}"
          chmod +x "${CONTEXT_MODE_BIN}"
          # The user's unreadable entry, beside the stanza the previous release
          # wrote in the same array.
          jq -n --arg bin "${CONTEXT_MODE_BIN}" '{hooks: {
            PreToolUse:   [{matcher:"Bash", hooks:[{type:"command", command:["/bin/sh","-c","audit"]}]},
                           {matcher:"Bash", hooks:[{type:"command", command:($bin + " hook claude-code pretooluse")}]}],
            SessionStart: [{matcher:"",     hooks:[{type:"command", command:($bin + " hook claude-code sessionstart")}]}]
          }}' > "${CLAUDE_CONFIG_DIR}/settings.json"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/registry.sh"
          settings="${CLAUDE_CONFIG_DIR}/settings.json"

          err="$(agent_call claude context_mode_strip 2>&1 >/dev/null)"

          echo "${err}" | grep -q "left in place" \
            && { echo "FAIL: the malformed entry blocked the cleanup: ${err}"; exit 1; }
          jq -e '.hooks.SessionStart == null' "${settings}" >/dev/null \
            || { echo "FAIL: our SessionStart survived the strip"; exit 1; }
          jq -e '[.hooks.PreToolUse[] | select(.hooks[0].command | type == "string")] | length == 0' \
            "${settings}" >/dev/null \
            || { echo "FAIL: our PreToolUse survived the strip: $(jq -c '.hooks.PreToolUse' "${settings}")"; exit 1; }
          # The entry we could not read is the user's, and it is carried through
          # byte for byte — "not ours" must not become "delete it".
          jq -e '.hooks.PreToolUse | length == 1
                 and (.[0].hooks[0].command == ["/bin/sh","-c","audit"])
                 and (.[0].matcher == "Bash")' \
            "${settings}" >/dev/null \
            || { echo "FAIL: the malformed user entry was altered or removed: $(jq -c '.hooks.PreToolUse' "${settings}")"; exit 1; }
          echo "non_string_command=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "non_string_command=pass"

  # Ownership is decided on a whole path token and applied to the individual
  # hook entry, not to the stanza around it. Both halves are load-bearing:
  # a substring test deletes a user's `<shim>-wrapper` hook because our path is
  # a prefix of theirs, and a stanza-level verdict takes the user's own hook
  # down with ours whenever the two share a matcher. Either one over-removes,
  # which is the failure this verb's ownership rule exists to prevent.
  #
  # The quoted PostToolUse command is the shape a live session actually holds:
  # the previous release wrote the shim path in double quotes, so a token test
  # that does not strip quotes recognises none of our own wiring and silently
  # strips nothing — a worse outcome than the over-removal it fixes.
  - name: the Claude strip prunes only our inner hooks and respects path boundaries
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          export CONTEXT_MODE_BIN="${HOME}/.local/bin/context-mode"
          mkdir -p "${CLAUDE_CONFIG_DIR}" "${HOME}/.local/bin"
          printf '#!/bin/sh\nexit 0\n' > "${CONTEXT_MODE_BIN}"
          chmod +x "${CONTEXT_MODE_BIN}"

          # PreToolUse[0] mixes one of ours with one of the user's under a
          # single matcher; PreToolUse[1] is a sibling script of the user's
          # whose path merely starts with ours. PostToolUse holds nothing but
          # ours, quoted the way the previous release wrote it. Notification
          # holds an argv array — a shape this filter cannot read, and
          # therefore not ours.
          jq -n --arg bin "${CONTEXT_MODE_BIN}" '{hooks: {
            PreToolUse: [
              {matcher:"Bash", hooks:[
                {type:"command", command:($bin + " hook claude-code pretooluse")},
                {type:"command", command:"echo user-own-hook-should-survive"}
              ]},
              {matcher:"Write", hooks:[{type:"command", command:($bin + "-wrapper hook claude-code pretooluse")}]}
            ],
            PostToolUse: [
              {matcher:"*", hooks:[{type:"command", command:("\"" + $bin + "\" hook claude-code posttooluse")}]}
            ],
            Notification: [
              {matcher:"*", hooks:[{type:"command", command:["/bin/sh","-c","echo argv-array"]}]}
            ]
          }}' > "${CLAUDE_CONFIG_DIR}/settings.json"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/registry.sh"
          agent_call claude context_mode_strip 2>/dev/null

          settings="${CLAUDE_CONFIG_DIR}/settings.json"
          jq -e '.' "${settings}" >/dev/null \
            || { echo "FAIL: settings.json is no longer valid JSON"; exit 1; }

          # 1. The mixed stanza keeps its matcher and the user's inner hook.
          jq -e '.hooks.PreToolUse[0].matcher == "Bash"
                 and (.hooks.PreToolUse[0].hooks | length) == 1
                 and .hooks.PreToolUse[0].hooks[0].command == "echo user-own-hook-should-survive"' \
            "${settings}" >/dev/null \
            || { echo "FAIL: the user's inner hook did not survive beside ours: $(jq -c '.hooks.PreToolUse' "${settings}")"; exit 1; }

          # 2. A longer path that merely begins with ours is not ours.
          jq -e --arg bin "${CONTEXT_MODE_BIN}" \
            '(.hooks.PreToolUse | length) == 2
             and .hooks.PreToolUse[1].hooks[0].command == ($bin + "-wrapper hook claude-code pretooluse")' \
            "${settings}" >/dev/null \
            || { echo "FAIL: the user's sibling wrapper hook was removed: $(jq -c '.hooks.PreToolUse' "${settings}")"; exit 1; }

          # 3. A stanza holding only ours goes, and with it the emptied key.
          jq -e '.hooks | has("PostToolUse") | not' "${settings}" >/dev/null \
            || { echo "FAIL: a stanza holding only our hook survived: $(jq -c '.hooks.PostToolUse' "${settings}")"; exit 1; }

          # 4. The unreadable command is carried through untouched.
          jq -e '.hooks.Notification[0].hooks[0].command == ["/bin/sh","-c","echo argv-array"]' \
            "${settings}" >/dev/null \
            || { echo "FAIL: the argv-array hook was altered or removed: $(jq -c '.hooks.Notification' "${settings}")"; exit 1; }

          echo "strip_inner_prune=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "strip_inner_prune=pass"

  - name: strip is silent and inert on a session that never had context-mode
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          export CONTEXT_MODE_BIN="${HOME}/.local/bin/context-mode"
          mkdir -p "${CLAUDE_CONFIG_DIR}"
          cat > "${CLAUDE_CONFIG_DIR}/settings.json" <<'JSON'
          {"hooks":{"UserPromptSubmit":[{"hooks":[{"type":"command","command":"codegraph prompt-hook"}]}]}}
          JSON
          before="$(cat "${CLAUDE_CONFIG_DIR}/settings.json")"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/container/context-mode-setup.sh"
          source "{{.riotbox_dir}}/agents/registry.sh"
          err="$(agent_call claude context_mode_strip 2>&1 >/dev/null)"

          [ -z "${err}" ] \
            || { echo "FAIL: spoke about a cleanup that did not happen: ${err}"; exit 1; }
          [ "${before}" = "$(cat "${CLAUDE_CONFIG_DIR}/settings.json")" ] \
            || { echo "FAIL: file rewritten"; exit 1; }
          echo "strip_noop=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "strip_noop=pass"

  # The migration guarantee, and the reason the strip verb outlives the wiring
  # it used to undo. Session directories written by the release that authored
  # hooks by hand carry `<shim> hook claude-code <event>` stanzas, and nothing
  # else on the system removes them: settings.json is never synced from the
  # host, so a reused directory would run the plugin's hooks and the previous
  # release's hooks at once — every event dispatched twice, against an MCP
  # server registered under the same name by two writers.
  #
  # Seeded as literal JSON rather than by calling a wiring verb: the verb that
  # wrote this shape is gone, and this case has to keep working against a shape
  # no code in the tree produces any more.
  - name: legacy RiotBox-authored stanzas are stripped from a reused session
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR CONTEXT_MODE_PLATFORM RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          export CONTEXT_MODE_BIN="${HOME}/.local/bin/context-mode"
          mkdir -p "${CLAUDE_CONFIG_DIR}" "${HOME}/.local/bin"
          printf '#!/bin/sh\nexit 0\n' > "${CONTEXT_MODE_BIN}"
          chmod +x "${CONTEXT_MODE_BIN}"

          # A session directory written by the previous release: two of the six
          # stanzas it wrote, plus the MCP entry it registered alongside them,
          # plus a hook and a server the user owns.
          jq -n --arg bin "${CONTEXT_MODE_BIN}" '{
            hooks: {
              PreToolUse: [{matcher:"Bash", hooks:[{type:"command", command:($bin + " hook claude-code pretooluse")}]},
                           {matcher:"Bash", hooks:[{type:"command", command:"my-audit.sh"}]}],
              Stop:       [{matcher:"",     hooks:[{type:"command", command:($bin + " hook claude-code stop")}]}]
            }
          }' > "${CLAUDE_CONFIG_DIR}/settings.json"
          jq -n --arg bin "${CONTEXT_MODE_BIN}" '{
            mcpServers: {"plugin_context-mode_context-mode": {type:"stdio", command:$bin, args:[]},
                         codegraph: {command:"codegraph"}}
          }' > "${CLAUDE_CONFIG_DIR}/.claude.json"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/registry.sh"
          agent_call claude context_mode_strip 2>/dev/null

          left="$(jq -r '[.hooks[]?[]?.hooks[]?.command | select(contains("hook claude-code"))] | length' \
            "${CLAUDE_CONFIG_DIR}/settings.json")"
          [ "${left}" = "0" ] || { echo "FAIL: ${left} legacy stanzas survived"; exit 1; }
          jq -e '(.hooks | has("Stop")) | not' "${CLAUDE_CONFIG_DIR}/settings.json" >/dev/null \
            || { echo "FAIL: the emptied Stop array survived"; exit 1; }
          jq -e '[.hooks.PreToolUse[].hooks[0].command] == ["my-audit.sh"]' \
            "${CLAUDE_CONFIG_DIR}/settings.json" >/dev/null \
            || { echo "FAIL: the user hook did not survive alone"; exit 1; }
          jq -e '.mcpServers | has("plugin_context-mode_context-mode") | not' \
            "${CLAUDE_CONFIG_DIR}/.claude.json" >/dev/null \
            || { echo "FAIL: the legacy MCP entry survived"; exit 1; }
          jq -e '.mcpServers.codegraph.command == "codegraph"' \
            "${CLAUDE_CONFIG_DIR}/.claude.json" >/dev/null \
            || { echo "FAIL: a foreign MCP entry was removed with ours"; exit 1; }
          echo "strip_legacy=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "strip_legacy=pass"

  # Claude Code has no wire verb: its hooks and MCP server arrive with the
  # plugin container/plugin-setup.sh registers, and nothing in this file writes
  # to settings.json for it. What is left is the flag the exit report reads,
  # which has to be set on an agent whose wiring this function never touches,
  # or an enabled session ends with no report. No storage or platform variable
  # goes with it: context-mode 2.x reads neither.
  - name: setup marks the session wired for an agent with no wire verb and exports no 1.x variable
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR CONTEXT_MODE_PLATFORM RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          export CONTEXT_MODE_BIN="${HOME}/.local/bin/context-mode"
          export RIOTBOX_CONTEXT_MODE=1
          # The tree the image stages and the registration reads: the wiring this
          # agent gets is that registration, so the flag asserted below follows it.
          export RIOTBOX_CM_PLUGIN_DIR="${HOME}/.riotbox/context-mode-plugin"
          staged="${RIOTBOX_CM_PLUGIN_DIR}/v2.1.4"
          mkdir -p "${CLAUDE_CONFIG_DIR}" "${HOME}/.local/bin" "${staged}"
          printf '#!/bin/sh\nexit 0\n' > "${CONTEXT_MODE_BIN}"
          chmod +x "${CONTEXT_MODE_BIN}"
          echo '{"name":"context-mode","version":"2.1.4"}' > "${staged}/package.json"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/lib/progress.sh"
          source "{{.riotbox_dir}}/container/plugin-setup.sh"
          source "{{.riotbox_dir}}/container/context-mode-setup.sh"
          source "{{.riotbox_dir}}/agents/registry.sh"
          declare -F agent_claude_context_mode_wire >/dev/null \
            && { echo "FAIL: claude still has a wire verb; this case no longer covers the path it names"; exit 1; }
          # entrypoint.sh's order, in one shell as it runs there: plugin_setup
          # registers, and the wiring below reads what that call decided. Called
          # in this shell, not a subshell: both assertions below are on exports
          # the session inherits.
          context_mode_plugin_register >/dev/null 2>&1
          context_mode_setup >/dev/null 2>&1

          for v in CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR CONTEXT_MODE_PLATFORM; do
            [ -z "${!v+set}" ] || { echo "FAIL: ${v} exported as '${!v}' — context-mode 2.x reads none of them"; exit 1; }
          done
          [ "${_CONTEXT_MODE_WIRED:-unset}" = "1" ] \
            || { echo "FAIL: an enabled session was not marked wired, so it ends with no report"; exit 1; }
          echo "setup_enabled=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "setup_enabled=pass"

  # A guard, not a behaviour test: it passes while nothing exports the variable
  # and fails the day someone "helpfully" turns it on. With it set to 1, a
  # Claude deny-rules file that exists but cannot be parsed makes context-mode
  # deny every tool call. See the note in container/context-mode-setup.sh.
  - name: setup does not export CONTEXT_MODE_REQUIRE_SECURITY
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED CONTEXT_MODE_REQUIRE_SECURITY
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          export CONTEXT_MODE_BIN="${HOME}/.local/bin/context-mode"
          export RIOTBOX_CONTEXT_MODE=1
          export RIOTBOX_CM_PLUGIN_DIR="${HOME}/.riotbox/context-mode-plugin"
          staged="${RIOTBOX_CM_PLUGIN_DIR}/v2.1.4"
          mkdir -p "${CLAUDE_CONFIG_DIR}" "${HOME}/.local/bin" "${staged}"
          printf '#!/bin/sh\nexit 0\n' > "${CONTEXT_MODE_BIN}"
          chmod +x "${CONTEXT_MODE_BIN}"
          echo '{"name":"context-mode","version":"2.1.4"}' > "${staged}/package.json"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/lib/progress.sh"
          source "{{.riotbox_dir}}/container/plugin-setup.sh"
          source "{{.riotbox_dir}}/container/context-mode-setup.sh"
          source "{{.riotbox_dir}}/agents/registry.sh"
          context_mode_plugin_register >/dev/null 2>&1
          context_mode_setup >/dev/null 2>&1

          [ -z "${CONTEXT_MODE_REQUIRE_SECURITY+set}" ] \
            || { echo "FAIL: CONTEXT_MODE_REQUIRE_SECURITY exported as '${CONTEXT_MODE_REQUIRE_SECURITY}'"; exit 1; }
          [ "${_CONTEXT_MODE_WIRED:-unset}" = "1" ] \
            || { echo "FAIL: setup did not run to completion, so the check above proves nothing"; exit 1; }
          echo "require_security_unset=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "require_security_unset=pass"

  # context-mode 2.1.4 reads CONTEXT_MODE_DATA_DIR as its whole data root, so a
  # value that reached the container (a passthrough entry, an extra -e) would
  # move every store off the ~/.context-mode session mount, silently. Setup
  # clears it before any agent starts, whether or not the feature is on: a
  # plugin copied in from the host runs either way.
  - name: setup unsets an inherited CONTEXT_MODE_DATA_DIR, with the feature on and off
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          export CONTEXT_MODE_BIN="${HOME}/.local/bin/context-mode"
          mkdir -p "${CLAUDE_CONFIG_DIR}" "${HOME}/.local/bin"
          printf '#!/bin/sh\nexit 0\n' > "${CONTEXT_MODE_BIN}"
          chmod +x "${CONTEXT_MODE_BIN}"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/lib/progress.sh"
          source "{{.riotbox_dir}}/container/plugin-setup.sh"
          source "{{.riotbox_dir}}/container/context-mode-setup.sh"
          source "{{.riotbox_dir}}/agents/registry.sh"
          for cm in 1 0; do
            export CONTEXT_MODE_DATA_DIR="${HOME}/elsewhere"
            RIOTBOX_CONTEXT_MODE="${cm}" context_mode_setup >/dev/null 2>&1
            [ -z "${CONTEXT_MODE_DATA_DIR+set}" ] \
              || { echo "FAIL: RIOTBOX_CONTEXT_MODE=${cm}: CONTEXT_MODE_DATA_DIR survived setup as '${CONTEXT_MODE_DATA_DIR}'"; exit 1; }
            got="$(bash -c 'printf "%s" "${CONTEXT_MODE_DATA_DIR-unset}"')"
            [ "${got}" = unset ] || { echo "FAIL: RIOTBOX_CONTEXT_MODE=${cm}: a child process sees '${got}'"; exit 1; }
          done
          echo "data_dir_cleared=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "data_dir_cleared=pass"

  # 2.x neither reads nor imports a 1.x store, and the user chose to leave them
  # where they are. Setup says so in one line naming each one it finds, and
  # deletes nothing. An empty directory is not a store.
  - name: setup names every context-mode 1.x store in one notice line and leaves them in place
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          export CONTEXT_MODE_BIN="${HOME}/.local/bin/context-mode"
          export RIOTBOX_CONTEXT_MODE=1
          mkdir -p "${CLAUDE_CONFIG_DIR}" "${HOME}/.local/bin" "${HOME}/.pi/agent" "${HOME}/.local/share/opencode"
          printf '#!/bin/sh\nexit 0\n' > "${CONTEXT_MODE_BIN}"
          chmod +x "${CONTEXT_MODE_BIN}"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/lib/progress.sh"
          source "{{.riotbox_dir}}/container/plugin-setup.sh"
          source "{{.riotbox_dir}}/container/context-mode-setup.sh"
          source "{{.riotbox_dir}}/agents/registry.sh"

          context_mode_setup 2>"${TEST_DIR}/err" >/dev/null
          if grep -q '1\.x' "${TEST_DIR}/err"; then echo "FAIL: a notice with no 1.x store:"; cat "${TEST_DIR}/err"; exit 1; fi

          claude_store="${CLAUDE_CONFIG_DIR}/context-mode"
          pi_store="${HOME}/.pi/agent/context-mode"
          opencode_store="${HOME}/.local/share/opencode/context-mode"
          mkdir -p "${opencode_store}"
          context_mode_setup 2>"${TEST_DIR}/err" >/dev/null
          if grep -q '1\.x' "${TEST_DIR}/err"; then echo "FAIL: an empty directory was named as a store:"; cat "${TEST_DIR}/err"; exit 1; fi

          mkdir -p "${claude_store}/sessions" "${pi_store}/sessions"
          touch "${claude_store}/sessions/a.db" "${pi_store}/sessions/b.db" "${opencode_store}/c.db"
          context_mode_setup 2>"${TEST_DIR}/err" >/dev/null
          [ "$(grep -c '1\.x' "${TEST_DIR}/err")" = 1 ] \
            || { echo "FAIL: expected exactly one notice line:"; cat "${TEST_DIR}/err"; exit 1; }
          line="$(grep '1\.x' "${TEST_DIR}/err")"
          case "${line}" in
            "  [context-mode] "*) ;;
            *) echo "FAIL: not a [context-mode] line: ${line}"; exit 1 ;;
          esac
          for store in "${claude_store}" "${pi_store}" "${opencode_store}"; do
            printf '%s\n' "${line}" | grep -qF -- "${store}" || { echo "FAIL: ${store} not named in: ${line}"; exit 1; }
          done
          [ -f "${claude_store}/sessions/a.db" ] && [ -f "${pi_store}/sessions/b.db" ] && [ -f "${opencode_store}/c.db" ] \
            || { echo "FAIL: a 1.x store was touched"; exit 1; }
          echo "legacy_notice=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "legacy_notice=pass"

  # The other half of that pair: an agent with no wire verb is wired by a plugin
  # or not at all, so the flag has to follow the plugin rather than the absence
  # of a verb. container/plugin-setup.sh gives up quietly when the image staged
  # no tree — what an image built before the staging layer existed looks like,
  # which README's troubleshooting names as a plausible cause — and with no host
  # plugin either that session has no Context Mode at all. Marking it wired
  # anyway hands it the exit report and a ledger record, in the one place the
  # user actually looks, saying the feature ran.
  - name: setup does not mark the session wired when no plugin was registered
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset CONTEXT_MODE_PLATFORM
          # Same neutralisation as every case that reaches container/plugin-setup.sh,
          # kept in one place rather than spelled out here; CONTEXT_MODE_PLATFORM
          # is not part of it because nothing in that file reads it.
          source "{{.riotbox_dir}}/tests/lib/plugin-setup-test-helpers.sh"
          plugin_setup_test_env on
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          export CONTEXT_MODE_BIN="${HOME}/.local/bin/context-mode"
          export RIOTBOX_AGENT=claude
          # The directory the image stages into, left empty: the toggle is on
          # and there is nothing to register.
          export RIOTBOX_CM_PLUGIN_DIR="${HOME}/.riotbox/context-mode-plugin"
          mkdir -p "${CLAUDE_CONFIG_DIR}/plugins" "${HOME}/.local/bin"
          printf '#!/bin/sh\nexit 0\n' > "${CONTEXT_MODE_BIN}"
          chmod +x "${CONTEXT_MODE_BIN}"
          echo '{"version":2,"plugins":{}}' > "${CLAUDE_CONFIG_DIR}/plugins/installed_plugins.json"
          echo '{}' > "${CLAUDE_CONFIG_DIR}/plugins/known_marketplaces.json"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/lib/progress.sh"
          source "{{.riotbox_dir}}/container/plugin-setup.sh"
          source "{{.riotbox_dir}}/container/context-mode-setup.sh"
          source "{{.riotbox_dir}}/agents/registry.sh"

          # entrypoint.sh's order, in one shell as it runs there: plugin_setup
          # registers, and the wiring below reads what that call decided.
          context_mode_plugin_register >/dev/null 2>&1
          context_mode_setup 2>"${TEST_DIR}/err" >/dev/null
          err="$(cat "${TEST_DIR}/err")"

          jq -e '.plugins | has("context-mode@context-mode") | not' \
            "${CLAUDE_CONFIG_DIR}/plugins/installed_plugins.json" >/dev/null \
            || { echo "FAIL: the fixture registered a plugin; this case no longer covers the path it names"; exit 1; }
          [ "${_CONTEXT_MODE_WIRED:-unset}" = "unset" ] \
            || { echo "FAIL: a session with no registered plugin was marked wired, so it ends with a report claiming Context Mode ran"; exit 1; }
          echo "${err}" | grep -q "no Context Mode plugin is installed and enabled" \
            || { echo "FAIL: the session was left with the feature off in silence: ${err}"; exit 1; }
          echo "setup_unregistered=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "setup_unregistered=pass"

  # The mirror of the case above, and the reason the question this asks is
  # "does this session have Context Mode" rather than "did RiotBox stage it".
  # With nothing staged, plugin_setup copies the host plugin tree in
  # (~/.claude/plugins is bind-mounted by agents/claude/sync-settings.sh),
  # context_mode_plugin_unregister spares its registry entry — a host install is
  # not what this toggle governs, and it is the only Context Mode some sessions
  # have — and the enabledPlugins sync switches it on. That session really does
  # run Context Mode, so withholding the flag would deny it the exit report and
  # ledger record it has earned, and warn about a plugin that is in fact there.
  - name: setup marks the session wired when a host-installed plugin is the Context Mode
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR CONTEXT_MODE_PLATFORM RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          export CONTEXT_MODE_BIN="${HOME}/.local/bin/context-mode"
          export RIOTBOX_CONTEXT_MODE=1
          export RIOTBOX_AGENT=claude
          # Nothing staged, so the registration stands down entirely.
          export RIOTBOX_CM_PLUGIN_DIR="${HOME}/.riotbox/context-mode-plugin"
          host_tree="${CLAUDE_CONFIG_DIR}/plugins/cache/context-mode/context-mode/1.0.169"
          mkdir -p "${host_tree}" "${HOME}/.local/bin"
          printf '#!/bin/sh\nexit 0\n' > "${CONTEXT_MODE_BIN}"
          chmod +x "${CONTEXT_MODE_BIN}"
          # What the host merge and the enabledPlugins sync leave behind.
          jq -n --arg p "${host_tree}" '{version:2,plugins:{"context-mode@context-mode":
            [{scope:"user",installPath:$p,version:"1.0.169"}]}}' \
            > "${CLAUDE_CONFIG_DIR}/plugins/installed_plugins.json"
          echo '{}' > "${CLAUDE_CONFIG_DIR}/plugins/known_marketplaces.json"
          echo '{"enabledPlugins":{"context-mode@context-mode":true}}' \
            > "${CLAUDE_CONFIG_DIR}/settings.json"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/lib/progress.sh"
          source "{{.riotbox_dir}}/container/plugin-setup.sh"
          source "{{.riotbox_dir}}/container/context-mode-setup.sh"
          source "{{.riotbox_dir}}/agents/registry.sh"

          context_mode_plugin_register >/dev/null 2>&1
          context_mode_setup 2>"${TEST_DIR}/err" >/dev/null
          err="$(cat "${TEST_DIR}/err")"

          jq -e '.plugins["context-mode@context-mode"][0].installPath != null' \
            "${CLAUDE_CONFIG_DIR}/plugins/installed_plugins.json" >/dev/null \
            || { echo "FAIL: the host entry was removed; this case no longer covers the path it names"; exit 1; }
          [ "${_CONTEXT_MODE_WIRED:-unset}" = "1" ] \
            || { echo "FAIL: a session running a host-installed Context Mode was denied its exit report"; exit 1; }
          [ -z "${err}" ] \
            || { echo "FAIL: warned about a missing plugin while one is installed and enabled: ${err}"; exit 1; }
          echo "setup_host_plugin=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "setup_host_plugin=pass"

  # The probe must not become a false-positive source of its own. A registry
  # entry naming a version-stamped tree an image rebuild took away is the
  # dangling registration container/plugin-setup.sh exists to prevent: Claude
  # Code surfaces the plugin and every hook in it fails to load, so the session
  # has no Context Mode and must not be told it has.
  - name: setup does not count a registration whose tree is gone
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset CONTEXT_MODE_PLATFORM
          # As above: one neutralisation for every case that reaches
          # container/plugin-setup.sh.
          source "{{.riotbox_dir}}/tests/lib/plugin-setup-test-helpers.sh"
          plugin_setup_test_env on
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          export CONTEXT_MODE_BIN="${HOME}/.local/bin/context-mode"
          export RIOTBOX_AGENT=claude
          export RIOTBOX_CM_PLUGIN_DIR="${HOME}/.riotbox/context-mode-plugin"
          mkdir -p "${CLAUDE_CONFIG_DIR}/plugins" "${HOME}/.local/bin"
          printf '#!/bin/sh\nexit 0\n' > "${CONTEXT_MODE_BIN}"
          chmod +x "${CONTEXT_MODE_BIN}"
          # An entry an earlier image wrote, naming a stamped path this one does
          # not carry. Outside RIOTBOX_CM_PLUGIN_DIR so the removal leaves it —
          # what has to hold is that the probe refuses it, not that it is gone.
          jq -n --arg p "${HOME}/.claude/plugins/cache/context-mode/gone" \
            '{version:2,plugins:{"context-mode@context-mode":
              [{scope:"user",installPath:$p,version:"1.0.100"}]}}' \
            > "${CLAUDE_CONFIG_DIR}/plugins/installed_plugins.json"
          echo '{}' > "${CLAUDE_CONFIG_DIR}/plugins/known_marketplaces.json"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/lib/progress.sh"
          source "{{.riotbox_dir}}/container/plugin-setup.sh"
          source "{{.riotbox_dir}}/container/context-mode-setup.sh"
          source "{{.riotbox_dir}}/agents/registry.sh"

          context_mode_plugin_register >/dev/null 2>&1
          context_mode_setup 2>"${TEST_DIR}/err" >/dev/null
          err="$(cat "${TEST_DIR}/err")"

          [ "${_CONTEXT_MODE_WIRED:-unset}" = "unset" ] \
            || { echo "FAIL: a registration pointing at a directory that is gone was read as wired"; exit 1; }
          echo "${err}" | grep -q "no Context Mode plugin" \
            || { echo "FAIL: the session was left with the feature off in silence: ${err}"; exit 1; }
          echo "setup_dangling=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "setup_dangling=pass"

  # A unit test of context_mode_plugin_installed, not a claim about what a
  # session does: it calls the probe directly, with the registry and settings.json
  # it is given. A plugin switched off in settings.json loads nothing, so a report
  # for it would be the same false claim from a third direction — and the probe
  # refuses it. Whether a session can still be in that state when the probe runs
  # is the separate question the case below answers.
  - name: the probe refuses a plugin switched off in settings.json
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          tree="${HOME}/.claude/plugins/cache/context-mode/context-mode/1.0.169"
          mkdir -p "${tree}"
          jq -n --arg p "${tree}" '{version:2,plugins:{"context-mode@context-mode":
            [{scope:"user",installPath:$p,version:"1.0.169"}]}}' \
            > "${HOME}/.claude/plugins/installed_plugins.json"

          source "{{.riotbox_dir}}/container/context-mode-setup.sh"

          # The positive control first, so the refusal below cannot pass because
          # the fixture was unreadable for some other reason.
          echo '{"enabledPlugins":{"context-mode@context-mode":true}}' \
            > "${HOME}/.claude/settings.json"
          context_mode_plugin_installed \
            || { echo "FAIL: an installed, enabled plugin was not counted"; exit 1; }

          echo '{"enabledPlugins":{"context-mode@context-mode":false}}' \
            > "${HOME}/.claude/settings.json"
          if context_mode_plugin_installed; then
            echo "FAIL: a plugin switched off in settings.json was counted"; exit 1
          fi

          # Only an explicit false denies. Another plugin's switch, a missing
          # key and a missing file are not evidence about this one, and reading
          # them as evidence would deny a working session its report.
          echo '{"enabledPlugins":{"other@other":false}}' > "${HOME}/.claude/settings.json"
          context_mode_plugin_installed \
            || { echo "FAIL: another plugin's switch denied this one"; exit 1; }
          echo '{"enabledPlugins":{}}' > "${HOME}/.claude/settings.json"
          context_mode_plugin_installed \
            || { echo "FAIL: a missing key was read as disabled"; exit 1; }
          rm -f "${HOME}/.claude/settings.json"
          context_mode_plugin_installed \
            || { echo "FAIL: a missing settings.json was read as disabled"; exit 1; }
          echo "probe_disabled=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "probe_disabled=pass"

  # What a real session does with that switch, which is not what the probe alone
  # would do: container/entrypoint.sh calls plugin_setup ahead of
  # context_mode_setup, and it takes the answer away. Step 1 of plugin_setup
  # deletes .enabledPlugins wholesale whenever it is present, and step 7 rebuilds
  # it from the registry keys as all-true — '── 1. Seed settings.json' and
  # '── 7. Sync enabledPlugins from installed_plugins.json' in
  # container/plugin-setup.sh — so the plugin is enabled again before Context
  # Mode wiring asks about it, and the session is wired.
  #
  # Pinned as it is rather than as it ought to be. RiotBox re-enabling every
  # plugin a user disabled is a real bug and a product decision beyond Context
  # Mode, raised separately; this case is what tells whoever fixes it that the
  # probe's disabled check goes live at that moment, and it is meant to be
  # rewritten by that fix rather than deleted.
  - name: a session start re-enables a plugin the user switched off
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset CONTEXT_MODE_PLATFORM
          # The only case in this file that runs the whole of plugin_setup, so
          # the only one needing the neutralisation the plugin-setup suite
          # applies to every case: step 4 takes RIOTBOX_PLUGINS from the ambient
          # environment — libexec/launch.sh forwards it into the container this
          # suite runs in — and installs each name it finds there with a real,
          # networked `claude plugin install`.
          source "{{.riotbox_dir}}/tests/lib/plugin-setup-test-helpers.sh"
          plugin_setup_test_env on
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          export CONTEXT_MODE_BIN="${HOME}/.local/bin/context-mode"
          export RIOTBOX_AGENT=claude
          export RIOTBOX_CM_PLUGIN_DIR="${HOME}/.riotbox/context-mode-plugin"
          staged="${RIOTBOX_CM_PLUGIN_DIR}/v1.0.169"
          # ~/.claude/plugins/cache is created by entrypoint.sh, ahead of both
          # calls below; plugin_setup expects to find it.
          mkdir -p "${CLAUDE_CONFIG_DIR}/plugins/cache" "${HOME}/.local/bin" "${staged}"
          printf '#!/bin/sh\nexit 0\n' > "${CONTEXT_MODE_BIN}"
          chmod +x "${CONTEXT_MODE_BIN}"
          echo '{"name":"context-mode","version":"1.0.169"}' > "${staged}/package.json"
          # The switch a user threw in an earlier session, in the file that
          # outlives it.
          echo '{"enabledPlugins":{"context-mode@context-mode":false}}' \
            > "${CLAUDE_CONFIG_DIR}/settings.json"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/lib/progress.sh"
          source "{{.riotbox_dir}}/container/plugin-setup.sh"
          source "{{.riotbox_dir}}/container/context-mode-setup.sh"
          source "{{.riotbox_dir}}/agents/registry.sh"

          # The whole of plugin_setup, not just the registration: steps 1 and 7
          # are the ones this case is about.
          plugin_setup >/dev/null 2>&1
          context_mode_setup 2>"${TEST_DIR}/err" >/dev/null
          err="$(cat "${TEST_DIR}/err")"

          jq -e '.enabledPlugins["context-mode@context-mode"] == true' \
            "${CLAUDE_CONFIG_DIR}/settings.json" >/dev/null \
            || { echo "FAIL: the switch survived plugin_setup — the probe's disabled check is live now, and the case above is the one to trust"; exit 1; }
          [ "${_CONTEXT_MODE_WIRED:-unset}" = "1" ] \
            || { echo "FAIL: a session whose plugin plugin_setup re-enabled was not marked wired"; exit 1; }
          [ -z "${err}" ] \
            || { echo "FAIL: warned about a plugin that is installed and enabled: ${err}"; exit 1; }
          echo "setup_reenabled_plugin=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "setup_reenabled_plugin=pass"

  - name: setup strips wiring when the toggle is off
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          export CONTEXT_MODE_BIN="${HOME}/.local/bin/context-mode"
          mkdir -p "${CLAUDE_CONFIG_DIR}" "${HOME}/.local/bin"
          printf '#!/bin/sh\nexit 0\n' > "${CONTEXT_MODE_BIN}"
          chmod +x "${CONTEXT_MODE_BIN}"

          # An earlier session's wiring, in the form the previous release wrote
          # it: the toggle going off is what has to clear it.
          jq -n --arg bin "${CONTEXT_MODE_BIN}" '{hooks: {
            PreToolUse: [{matcher:"Bash", hooks:[{type:"command", command:($bin + " hook claude-code pretooluse")}]}]
          }}' > "${CLAUDE_CONFIG_DIR}/settings.json"
          jq -n --arg bin "${CONTEXT_MODE_BIN}" \
            '{mcpServers: {"plugin_context-mode_context-mode": {type:"stdio", command:$bin, args:[]}}}' \
            > "${CLAUDE_CONFIG_DIR}/.claude.json"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/container/context-mode-setup.sh"
          source "{{.riotbox_dir}}/agents/registry.sh"
          context_mode_setup >/dev/null 2>&1

          jq -e '(.hooks // {}) | has("PreToolUse") | not' "${CLAUDE_CONFIG_DIR}/settings.json" >/dev/null \
            || { echo "FAIL: wiring survived the toggle going off"; exit 1; }
          jq -e '.mcpServers["plugin_context-mode_context-mode"] == null' \
            "${CLAUDE_CONFIG_DIR}/.claude.json" >/dev/null \
            || { echo "FAIL: MCP entry survived the toggle going off"; exit 1; }
          echo "setup_disabled=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "setup_disabled=pass"

  - name: setup rejects any value other than the literal 1
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          export CONTEXT_MODE_BIN="${HOME}/.local/bin/context-mode"
          export RIOTBOX_CONTEXT_MODE=true
          mkdir -p "${CLAUDE_CONFIG_DIR}" "${HOME}/.local/bin"
          printf '#!/bin/sh\nexit 0\n' > "${CONTEXT_MODE_BIN}"
          chmod +x "${CONTEXT_MODE_BIN}"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/container/context-mode-setup.sh"
          source "{{.riotbox_dir}}/agents/registry.sh"
          context_mode_setup >/dev/null 2>&1

          if [ -f "${CLAUDE_CONFIG_DIR}/settings.json" ]; then
            jq -e '.hooks.PreToolUse == null' "${CLAUDE_CONFIG_DIR}/settings.json" >/dev/null \
              || { echo "FAIL: 'true' read as enabled"; exit 1; }
          fi
          [ -z "${CONTEXT_MODE_DIR:-}" ] \
            || { echo "FAIL: storage root exported for a disabled session"; exit 1; }
          echo "setup_literal=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "setup_literal=pass"

  - name: setup warns and strips when the binary is missing
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          export CONTEXT_MODE_BIN="${HOME}/.local/bin/context-mode"
          export RIOTBOX_CONTEXT_MODE=1
          mkdir -p "${CLAUDE_CONFIG_DIR}" "${HOME}/.local/bin"
          printf '#!/bin/sh\nexit 0\n' > "${CONTEXT_MODE_BIN}"
          chmod +x "${CONTEXT_MODE_BIN}"

          # Wiring an earlier session left, and then the shim it names taken
          # away — the state a rebuild that dropped Context Mode produces.
          jq -n --arg bin "${CONTEXT_MODE_BIN}" '{hooks: {
            PreToolUse: [{matcher:"Bash", hooks:[{type:"command", command:($bin + " hook claude-code pretooluse")}]}]
          }}' > "${CLAUDE_CONFIG_DIR}/settings.json"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/container/context-mode-setup.sh"
          source "{{.riotbox_dir}}/agents/registry.sh"
          rm -f "${CONTEXT_MODE_BIN}"
          err="$(context_mode_setup 2>&1 >/dev/null)"

          echo "${err}" | grep -q "not on PATH" \
            || { echo "FAIL: no warning about the missing binary: ${err}"; exit 1; }
          jq -e '.hooks.PreToolUse == null' "${CLAUDE_CONFIG_DIR}/settings.json" >/dev/null \
            || { echo "FAIL: wiring left pointing at a missing binary"; exit 1; }
          echo "setup_missing=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "setup_missing=pass"

  # Regression guard on the degrade path. An agent opts into Context Mode by
  # implementing the optional verbs; one that implements none of them must be
  # told so rather than have another agent's form written on its behalf — the
  # config lands in the bind-mounted session directory and nothing regenerates
  # it, so the dead stanzas would outlive the session while the toggle,
  # `riotbox doctor` and the launcher all still reported the feature as on.
  #
  # The stand-in agent is appended to AGENT_REGISTRY rather than named from
  # agents/: every agent riotbox ships implements the verbs, so an agent that
  # does not is exactly what the fixture has to invent. It also pins that the
  # strip-everything loop tolerates a registered agent with no strip verb.
  - name: setup warns and strips for an agent with no Context Mode verbs
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          export CONTEXT_MODE_BIN="${HOME}/.local/bin/context-mode"
          export RIOTBOX_CONTEXT_MODE=1
          mkdir -p "${CLAUDE_CONFIG_DIR}" "${HOME}/.local/bin"
          printf '#!/bin/sh\nexit 0\n' > "${CONTEXT_MODE_BIN}"
          chmod +x "${CONTEXT_MODE_BIN}"

          # An earlier session in this same directory, so the degrade below has
          # wiring to clear rather than an empty config to leave alone.
          jq -n --arg bin "${CONTEXT_MODE_BIN}" '{hooks: {
            PreToolUse:   [{matcher:"Bash", hooks:[{type:"command", command:($bin + " hook claude-code pretooluse")}]}],
            SessionStart: [{matcher:"",     hooks:[{type:"command", command:($bin + " hook claude-code sessionstart")}]}]
          }}' > "${CLAUDE_CONFIG_DIR}/settings.json"
          jq -n --arg bin "${CONTEXT_MODE_BIN}" \
            '{mcpServers: {"plugin_context-mode_context-mode": {type:"stdio", command:$bin, args:[]}}}' \
            > "${CLAUDE_CONFIG_DIR}/.claude.json"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/container/context-mode-setup.sh"
          source "{{.riotbox_dir}}/agents/registry.sh"

          AGENT_REGISTRY+=(noverbs)
          export RIOTBOX_AGENT=noverbs
          # Called in this shell, not a subshell: both variables asserted below
          # are exports, and the assertions are on what the session inherits.
          context_mode_setup 2>"${TEST_DIR}/err" >/dev/null
          err="$(cat "${TEST_DIR}/err")"

          echo "${err}" | grep -q "noverbs" \
            || { echo "FAIL: warning does not name the agent: ${err}"; exit 1; }
          echo "${err}" | grep -q "no Context Mode support" \
            || { echo "FAIL: warning does not say the agent is unsupported: ${err}"; exit 1; }
          # Guards a refactor that hoists the storage-root export above the
          # verb probe: a session that wires nothing must not inherit a path to
          # an FTS5 store nothing in that session will ever write.
          [ -z "${CONTEXT_MODE_DIR:-}" ] \
            || { echo "FAIL: storage root exported for an agent that wires nothing"; exit 1; }
          # Same rule for the flag the exit report reads: a session running with
          # the feature off must not end with a report claiming it ran.
          [ "${_CONTEXT_MODE_WIRED:-unset}" = "unset" ] \
            || { echo "FAIL: a degraded session was marked wired"; exit 1; }
          jq -e '.hooks.PreToolUse == null and .hooks.SessionStart == null' \
            "${CLAUDE_CONFIG_DIR}/settings.json" >/dev/null \
            || { echo "FAIL: inherited hooks survived the degrade"; exit 1; }
          jq -e '.mcpServers["plugin_context-mode_context-mode"] == null' \
            "${CLAUDE_CONFIG_DIR}/.claude.json" >/dev/null \
            || { echo "FAIL: inherited MCP entry survived the degrade"; exit 1; }
          echo "setup_unsupported_agent=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "setup_unsupported_agent=pass"

  # A session directory outlives the agent choice: the same directory can be
  # opened once with claude and again with opencode. The second run must clear
  # the hooks the first wrote, because nothing else ever regenerates that file.
  - name: setup strips wiring an earlier claude session left when the agent changes
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          export CONTEXT_MODE_BIN="${HOME}/.local/bin/context-mode"
          export RIOTBOX_CONTEXT_MODE=1
          mkdir -p "${CLAUDE_CONFIG_DIR}" "${HOME}/.local/bin"
          printf '#!/bin/sh\nexit 0\n' > "${CONTEXT_MODE_BIN}"
          chmod +x "${CONTEXT_MODE_BIN}"

          # What a claude session of the previous release left in this
          # directory. The opencode run below has to clear it: opencode's own
          # wiring is a generated plugin file elsewhere, so these stanzas would
          # otherwise keep dispatching for the life of the session directory.
          jq -n --arg bin "${CONTEXT_MODE_BIN}" '{hooks: {
            PreToolUse:   [{matcher:"Bash", hooks:[{type:"command", command:($bin + " hook claude-code pretooluse")}]}],
            SessionStart: [{matcher:"",     hooks:[{type:"command", command:($bin + " hook claude-code sessionstart")}]}]
          }}' > "${CLAUDE_CONFIG_DIR}/settings.json"
          jq -n --arg bin "${CONTEXT_MODE_BIN}" \
            '{mcpServers: {"plugin_context-mode_context-mode": {type:"stdio", command:$bin, args:[]}}}' \
            > "${CLAUDE_CONFIG_DIR}/.claude.json"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/container/context-mode-setup.sh"
          source "{{.riotbox_dir}}/agents/registry.sh"

          RIOTBOX_AGENT=opencode context_mode_setup >/dev/null 2>&1

          jq -e '.hooks.PreToolUse == null and .hooks.SessionStart == null' \
            "${CLAUDE_CONFIG_DIR}/settings.json" >/dev/null \
            || { echo "FAIL: inherited hooks survived the agent change"; exit 1; }
          jq -e '.mcpServers["plugin_context-mode_context-mode"] == null' \
            "${CLAUDE_CONFIG_DIR}/.claude.json" >/dev/null \
            || { echo "FAIL: inherited MCP entry survived the agent change"; exit 1; }
          echo "setup_agent_change=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "setup_agent_change=pass"

  # The agent check must not cost the default path: `riotbox run` leaves
  # RIOTBOX_AGENT unset and means claude (bin/riotbox), so an unset variable
  # has to reach the same support decision an explicit claude does — the same
  # warning-free run and the same wired flag.
  - name: setup treats an unset agent as claude, both paths alike
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          export CONTEXT_MODE_BIN="${HOME}/.local/bin/context-mode"
          export RIOTBOX_CONTEXT_MODE=1
          # A staged tree, because for claude the registration is the wiring: a
          # session without one is the warning case, not the silent one this
          # asserts.
          export RIOTBOX_CM_PLUGIN_DIR="${HOME}/.riotbox/context-mode-plugin"
          staged="${RIOTBOX_CM_PLUGIN_DIR}/v1.0.169"
          mkdir -p "${HOME}/.local/bin" "${staged}"
          printf '#!/bin/sh\nexit 0\n' > "${CONTEXT_MODE_BIN}"
          chmod +x "${CONTEXT_MODE_BIN}"
          echo '{"name":"context-mode","version":"1.0.169"}' > "${staged}/package.json"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/lib/progress.sh"
          source "{{.riotbox_dir}}/container/plugin-setup.sh"
          source "{{.riotbox_dir}}/container/context-mode-setup.sh"
          source "{{.riotbox_dir}}/agents/registry.sh"
          context_mode_plugin_register >/dev/null 2>&1

          for agent_case in unset claude; do
            export CLAUDE_CONFIG_DIR="${HOME}/.claude-${agent_case}"
            mkdir -p "${CLAUDE_CONFIG_DIR}"
            if [ "${agent_case}" = "unset" ]; then
              unset RIOTBOX_AGENT
            else
              export RIOTBOX_AGENT="${agent_case}"
            fi

            # Called in this shell, not a subshell: the flag asserted below is
            # an export, and the assertion is on what the session inherits.
            unset _CONTEXT_MODE_WIRED
            context_mode_setup 2>"${TEST_DIR}/err.${agent_case}" >/dev/null
            [ ! -s "${TEST_DIR}/err.${agent_case}" ] \
              || { echo "FAIL (${agent_case}): warned on a supported agent: $(cat "${TEST_DIR}/err.${agent_case}")"; exit 1; }
            [ "${_CONTEXT_MODE_WIRED:-unset}" = "1" ] \
              || { echo "FAIL (${agent_case}): not marked wired"; exit 1; }
          done
          echo "setup_claude_agent=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "setup_claude_agent=pass"

  # The other one-line seam, next to the launcher passthrough pinned in
  # tests/doctor-context-mode.venom.yml. context_mode_setup is a bare call in
  # container/entrypoint.sh: delete or comment it and every case above still
  # passes while no session ever wires. The order is load-bearing too —
  # codegraph_strip_mcp_entry read-modify-writes the same .claude.json this
  # feature's strip does, so this runs after it and reads a settled file.
  # Neither writes an mcpServers entry any more; both only take out what an
  # older image left, which is why the order still has to be pinned rather than
  # having stopped mattering. tests/lib-json-write.venom.yml pins the *sourcing*
  # order of these files; this pins the call.
  #
  # The check is textual — grep over entrypoint.sh, the same mechanism as
  # "entrypoint calls codegraph_setup after overlay_setup" in
  # tests/codegraph.venom.yml — so it proves the call is written in the right
  # place, not that control reaches it. An early `return`/`exit` above these
  # lines, or a guard that skips them at run time, leaves this case green.
  # Running the real entrypoint would need the image, which is what the
  # container-driven suites are for; this is the cheap half of the guard.
  - name: entrypoint calls context_mode_setup after codegraph_setup
    steps:
      - type: exec
        script: |
          set -e
          cd "{{.riotbox_dir}}"
          # Anchored on the bare invocations: the comment above the
          # context_mode_setup call names codegraph_setup as well, so an
          # unanchored match can report a comment line instead of a call site.
          cm_line="$(grep -n '^context_mode_setup$' container/entrypoint.sh | head -1 | cut -d: -f1)"
          cg_line="$(grep -n '^codegraph_setup$' container/entrypoint.sh | head -1 | cut -d: -f1)"
          [ -n "${cm_line}" ] \
            || { echo "FAIL: entrypoint never calls context_mode_setup"; exit 1; }
          [ -n "${cg_line}" ] \
            || { echo "FAIL: entrypoint never calls codegraph_setup"; exit 1; }
          [ "${cm_line}" -gt "${cg_line}" ] \
            || { echo "FAIL: context_mode_setup runs at line ${cm_line}, before codegraph_setup at ${cg_line}"; exit 1; }
          echo "entrypoint_calls_context_mode=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "entrypoint_calls_context_mode=pass"

  # Everything above runs against a stub shim, so nothing in this suite notices
  # what the image actually installs. Context Mode shipped 223 npm versions in
  # five months (docs/dev/decisions/context-mode-adoption.md), and the build-time
  # guards in the Containerfile — the matcher greps, the MCP-name grep, the
  # dispatcher check — only assert against whatever version the build resolved.
  # Drop the version from the generated package.json and every one of them
  # still passes while the image silently tracks upstream. The pin is the thing
  # they rest on, so it is pinned here, in the shape tests/codegraph.venom.yml
  # pins CodeGraph's.
  #
  # The Node pin and the shim are the same chain: `nvm install 24` accepts a
  # partial version and lands whatever 24.x it resolves, and a bare `node` on
  # PATH resolves to the session default — Node 20 or 22, both of which
  # context-mode 2.x refuses (engines >=24.15.0; its hook prints "Node vX is
  # below 24.15.0" and does nothing). Asserting the exact ARG, its floor, the
  # `nvm which` derivation, and the interpreter the generated shim execs keeps
  # the pin reaching the CLI, the MCP server, and every hook.
  - name: Containerfile pins the Context Mode version and the interpreter it runs on
    steps:
      - type: exec
        script: |
          cd "{{.riotbox_dir}}"
          grep -qE '^ARG CONTEXT_MODE_VERSION=[0-9]+\.[0-9]+\.[0-9]+$' Containerfile \
            || { echo "FAIL: CONTEXT_MODE_VERSION is not pinned to an exact version"; exit 1; }
          grep -qE '^ARG CONTEXT_MODE_NODE=[0-9]+\.[0-9]+\.[0-9]+$' Containerfile \
            || { echo "FAIL: CONTEXT_MODE_NODE is not pinned to an exact version"; exit 1; }
          node_pin="$(sed -nE 's/^ARG CONTEXT_MODE_NODE=(.+)$/\1/p' Containerfile)"
          printf '24.15.0\n%s\n' "${node_pin}" | sort -VC \
            || { echo "FAIL: CONTEXT_MODE_NODE=${node_pin} is below 24.15.0, the floor context-mode 2.x runs on"; exit 1; }
          if grep -qF 'install -g "context-mode@' Containerfile; then
            echo "FAIL: context-mode is still installed with npm install -g, which reads no lockfile"; exit 1
          fi
          # The paths come from `nvm which` rather than a hand-built
          # v${CONTEXT_MODE_NODE}, so a major-only arg still resolves; the shim
          # is what carries the result to run time.
          grep -qF 'CM_NODE_EXE="$(nvm which "${CONTEXT_MODE_NODE}")"' Containerfile \
            || { echo "FAIL: the install paths are not derived from the pinned Node"; exit 1; }
          grep -qF 'exec \"${CM_NODE_BIN}/node\" \"${CM_PKG}/cli.mjs\"' Containerfile \
            || { echo "FAIL: the generated shim does not exec the pinned interpreter against cli.mjs"; exit 1; }
          echo "containerfile_pin=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "containerfile_pin=pass"

  # bun is what ctx_execute runs TypeScript on; without it the executor reports
  # TypeScript as unavailable and every TS snippet fails. Nothing in that layer
  # asserts a feature the way the opencode layer probes for --auto, so the pin
  # is the only control over what lands — and a pin nothing checks is a pin
  # that floats the first time someone edits the tag out. RIOTBOX-20260312-001
  # is open, and the layer answers it by fetching a release asset and verifying
  # it before installing it.
  #
  # The file-wide greps below pin SHAPE only: that the ARGs exist and carry the
  # right form, as the venom pin in the tools stage has them. Whether the layer
  # GATES the install on any of it is a property of the block, not of the file,
  # so the rest is scoped to the lines between the first bun ARG and the
  # pin-mismatch message.
  #
  # The block's own boundaries are asserted first, in both directions, because
  # a sed range that has stopped delimiting silently widens every check below
  # it. Containing its terminator catches an end pattern that was deleted or
  # reworded, which makes sed print to EOF; spanning exactly one `RUN` catches
  # the range over-extending because the closing message moved to a later layer
  # or the phrase came to appear twice. Neither direction is theoretical — the
  # first was measured: deleting `set -e` from this layer AND rewording the
  # closing message left the whole suite green, because the unscoped
  # `grep -q 'set -e'` then matched some other layer's.
  #
  # Each of the three checks below is a way the verification stays present and
  # stops being a gate:
  #
  #   * `set -e`, with no `set +e` after it. Without abort-on-error a failed
  #     sha256sum prints its warning and the unzip runs anyway — a tampered
  #     archive installs and the layer is green. Matching `set -e` alone would
  #     not notice a `set +e` added below it, so both are checked.
  #   * The checksum call comparing the pinned digest against the downloaded
  #     file, and ending the statement there. Two mutations hide behind a
  #     looser match: swapping ${EXPECTED_SHA} for one architecture's ARG
  #     leaves the other architecture verifying nothing, and `|| true` keeps
  #     every string intact while swallowing the only status that matters. So
  #     the compared expression and the terminator are both part of the match.
  #   * Each case arm pairing its own asset with its own digest. Swapping the
  #     two digests, or pointing both arms at BUN_SHA256_AMD64, passes every
  #     other check here and fails at build time only on the architecture that
  #     an amd64-only CI never builds.
  - name: Containerfile pins the bun version and gates the install on the digest
    steps:
      - type: exec
        script: |
          cd "{{.riotbox_dir}}"
          grep -qE '^ARG BUN_VERSION=[0-9]+\.[0-9]+\.[0-9]+$' Containerfile \
            || { echo "FAIL: BUN_VERSION is not pinned to an exact version"; exit 1; }
          grep -qE '^ARG BUN_SHA256_AMD64=[0-9a-f]{64}$' Containerfile \
            || { echo "FAIL: BUN_SHA256_AMD64 is not pinned to a SHA256"; exit 1; }
          grep -qE '^ARG BUN_SHA256_ARM64=[0-9a-f]{64}$' Containerfile \
            || { echo "FAIL: BUN_SHA256_ARM64 is not pinned to a SHA256"; exit 1; }
          grep -qF 'bun-v${BUN_VERSION}/${ASSET}.zip' Containerfile \
            || { echo "FAIL: the download does not request the pinned release tag"; exit 1; }
          grep -qF '[ "${v}" = "${BUN_VERSION}" ]' Containerfile \
            || { echo "FAIL: the build does not check the installed bun against the pin"; exit 1; }
          block="$(sed -n '/^ARG BUN_VERSION=/,/bun reports/p' Containerfile)"
          printf '%s\n' "${block}" | grep -qF 'bun reports' \
            || { echo "FAIL: the bun block did not delimit — its first ARG or its closing message moved, and every match below would be scanning the whole file"; exit 1; }
          [ "$(printf '%s\n' "${block}" | grep -c '^RUN ')" = 1 ] \
            || { echo "FAIL: the bun block spans more than one RUN — its closing message moved to a later layer, or the phrase now appears twice, and every match below is scanning a wider slice than the layer it names"; exit 1; }
          printf '%s\n' "${block}" | grep -q 'set -e' \
            || { echo "FAIL: the bun layer does not abort on the first failed step, so a failed checksum would not stop the install"; exit 1; }
          if printf '%s\n' "${block}" | grep -q 'set +e'; then
            echo "FAIL: the layer re-disables abort-on-error mid-block"; exit 1
          fi
          printf '%s\n' "${block}" | grep -qF 'echo "${EXPECTED_SHA}  /tmp/bun.zip" | sha256sum -c -; \' \
            || { echo "FAIL: the sha256sum call does not end the statement with the pinned digest — something was appended or the compared value changed"; exit 1; }
          printf '%s\n' "${block}" | grep 'x86_64)' | grep -q 'bun-linux-x64-baseline.*BUN_SHA256_AMD64' \
            || { echo "FAIL: the x86_64 arm does not pair the baseline asset with BUN_SHA256_AMD64"; exit 1; }
          printf '%s\n' "${block}" | grep 'aarch64)' | grep -q 'bun-linux-aarch64.*BUN_SHA256_ARM64' \
            || { echo "FAIL: the aarch64 arm does not pair the aarch64 asset with BUN_SHA256_ARM64"; exit 1; }
          echo "bun_pin=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "bun_pin=pass"

  # The Context Mode layer installs the npm package from a committed lockfile,
  # stages it as the Claude plugin, rewrites two interpreters and probes the
  # result. `podman build` does not run in the dev container
  # (docs/dev/context-mode.md), so no CI observes any of it — the layer has to
  # be pinned as text, exactly like bun above.
  #
  # The rest is scoped to the lines between the version ARG and the layer's
  # success line, because whether a step is in THIS block is a property of the
  # block, not of a 1400-line file. The block's boundaries are asserted before
  # anything is matched against it, in both directions — that it contains its
  # terminator (an unmatched end pattern makes sed print to EOF) and that it
  # spans exactly one `RUN` (a terminator that moved to a later layer, or a
  # phrase that came to appear twice, extends the range instead).
  #
  # Each scoped match is a way a step survives review and stops working:
  #
  #   * `set -e`, with no `set +e` after it. The block is one `bash -c` string
  #     of `;`-joined statements, so without abort-on-error every guard in it
  #     prints its message and the layer still exits 0 on the closing echo.
  #   * The lockfile arriving, the generated package.json naming the ARG, and
  #     `npm ci` reading both. `ci` is what makes the lockfile authoritative —
  #     it refuses a package.json the lockfile does not satisfy, so an ARG bump
  #     without a regenerated lockfile fails the layer — and its integrity hash
  #     is the only pin on the bytes. --ignore-scripts keeps any future install
  #     script from running at build time unreviewed.
  #   * The staged Claude plugin being that same installed package, without the
  #     Gemini hooks/hooks.json Claude Code would otherwise load as a second,
  #     invalid hook file (upstream's build/main-tree.mjs drops it too), and
  #     with the marketplace.json container/plugin-setup.sh registers it by.
  #   * Every agent's contract assert running against that package.
  #   * Both interpreter-rewrite counts. `before` > 0 catches upstream changing
  #     the command shape, which would leave the substitution a no-op; `after`
  #     == 0 catches it missing a command. Drop either and hooks run the
  #     session-default Node, which context-mode 2.x refuses.
  #   * The health gate that replaced `context-mode doctor` (which exits 1 for
  #     every agent riotbox does not wire through `context-mode setup`): the CLI
  #     answers --version with the pin, and the OpenCode adapter's default export
  #     carries id, server and setup under the pinned Node.
  #   * The routing probe and its control. The control run feeds a tool the
  #     matcher does not route and must get no decision, so a pass is about
  #     WebFetch and not about a hook that denies everything; the scrubbed PATH
  #     stops an un-rewritten tree from answering anyway on the build's Node.
  - name: Containerfile stages the Context Mode package from its lockfile and keeps its steps load-bearing
    steps:
      - type: exec
        script: |
          cd "{{.riotbox_dir}}"
          for gone in '^ARG CONTEXT_MODE_PLUGIN_REF=' '^ARG CONTEXT_MODE_PLUGIN_SHA=' 'github.com/mksglu/context-mode.git'; do
            if grep -qE -- "${gone}" Containerfile; then
              echo "FAIL: Containerfile still matches '${gone}' — the git clone is gone; the lockfile is the single pin"; exit 1
            fi
          done
          block="$(sed -n '/^ARG CONTEXT_MODE_VERSION=/,/PreToolUse routes WebFetch to/p' Containerfile)"
          printf '%s\n' "${block}" | grep -qF 'PreToolUse routes WebFetch to' \
            || { echo "FAIL: the Context Mode block did not delimit — its ARG or its closing echo moved, and every match below would be scanning the whole file"; exit 1; }
          [ "$(printf '%s\n' "${block}" | grep -c '^RUN ')" = 1 ] \
            || { echo "FAIL: the Context Mode block spans more than one RUN — its closing echo moved to a later layer, or the phrase now appears twice"; exit 1; }
          in_block() {
            printf '%s\n' "${block}" | grep -qF -- "$1" || { echo "FAIL: $2"; exit 1; }
          }
          printf '%s\n' "${block}" | grep -q 'set -e' \
            || { echo "FAIL: the layer does not abort on the first failed step, so every guard in it would print and the layer would still succeed"; exit 1; }
          if printf '%s\n' "${block}" | grep -q 'set +e'; then
            echo "FAIL: the layer re-disables abort-on-error mid-block"; exit 1
          fi
          in_block 'COPY --chown=llm:llm container/context-mode-package-lock.json' \
            "the pinned lockfile is not copied into the build"
          in_block '\"dependencies\":{\"context-mode\":\"%s\"}}\n" "${CONTEXT_MODE_VERSION}" > "${cm_install}/package.json"' \
            "the generated package.json does not depend on exactly CONTEXT_MODE_VERSION, so npm ci has nothing to hold the lockfile to"
          in_block 'mv /tmp/context-mode-package-lock.json "${cm_install}/package-lock.json"' \
            "the lockfile is not moved into the install root, the only directory npm ci reads one from"
          in_block '"${CM_NODE_BIN}/npm" ci --ignore-scripts' \
            "the install is not a lockfile-authoritative \`npm ci --ignore-scripts\`"
          in_block '! -name ".*" -printf "%f\n")" = "context-mode" ]' \
            "the layer does not assert node_modules holds only context-mode before moving it out, so a dependency would be stranded"
          in_block 'CM_PKG="${RIOTBOX_CM_PLUGIN_DIR}/v${CONTEXT_MODE_VERSION}"' \
            "the package is not staged at the version-stamped path container/plugin-setup.sh reads"
          in_block 'mv "${cm_install}/node_modules/context-mode" "${CM_PKG}"' \
            "the staged tree is not the package npm ci installed"
          in_block 'rm -f "${CM_PKG}/hooks/hooks.json"' \
            "the staged tree keeps the Gemini hooks/hooks.json Claude Code would load as a second hook file"
          in_block 'select(.name == \"context-mode\") | .source] | first" "${CM_PKG}/.claude-plugin/marketplace.json")" = "./" ]' \
            "the layer does not check the staged tree still declares itself as the marketplace container/plugin-setup.sh registers"
          in_block 'agent_call "${_cm_agent}" context_mode_build_assert "${CM_PKG}"' \
            "the agents' contract asserts do not run against the staged package"
          in_block '[ "${before}" -gt 0 ]' \
            "the layer does not assert there was a bare-node command to rewrite"
          in_block '[ "${after}" -eq 0 ]' \
            "the layer does not assert every bare-node command was rewritten"
          in_block '[ "$("${CONTEXT_MODE_BIN}" --version)" = "${CONTEXT_MODE_VERSION}" ]' \
            "the health gate does not check the CLI answers with the pinned version"
          in_block 'typeof d.setup === \"function\"' \
            "the health gate does not import the OpenCode adapter's default export"
          in_block '[ -z "${cm_control}" ]' \
            "the routing probe has no control run — a hook that denies every tool would pass"
          in_block 'env PATH=/usr/bin:/bin' \
            "the probe does not scrub node off PATH, so a tree the interpreter rewrite missed would still answer"
          if printf '%s\n' "${block}" | grep -qF '"${CONTEXT_MODE_BIN}" doctor'; then
            echo "FAIL: the layer still gates on context-mode doctor, which exits 1 for agents riotbox does not set up"; exit 1
          fi
          echo "context_mode_staging_shape=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "context_mode_staging_shape=pass"

  # The matcher set is the routing table a session's redirects are built from,
  # and the routing probe exercises exactly one entry of it: it feeds the
  # PreToolUse command a WebFetch payload. That leaves the rest of the
  # PreToolUse set and the whole PostToolUse set with no build-time signal.
  #
  # container/context-mode-hooks-expected.json is the other side of that
  # comparison, committed the way the lockfile is and checked against the
  # staged hooks/claude-code.json inside the layer itself. What repo state can
  # check is the shape — the file parses, it names exactly the 2.x event set,
  # its matchers cover more than the probed tool, and the layer reads it.
  # Whether it MATCHES upstream needs the installed package, which is why the
  # comparison itself runs at build time.
  - name: the staged hook table is gated against a committed expectation
    steps:
      - type: exec
        script: |
          cd "{{.riotbox_dir}}"
          expected=container/context-mode-hooks-expected.json
          [ -r "${expected}" ] \
            || { echo "FAIL: ${expected} is missing"; exit 1; }
          jq -e . "${expected}" > /dev/null \
            || { echo "FAIL: ${expected} is not readable JSON"; exit 1; }
          events="$(jq -r 'keys | join(",")' "${expected}")"
          [ "${events}" = "PostToolUse,PreToolUse,SessionStart,UserPromptSubmit" ] \
            || { echo "FAIL: ${expected} names events '${events}', want PostToolUse,PreToolUse,SessionStart,UserPromptSubmit"; exit 1; }
          [ "$(jq -r 'map_values(type) | to_entries | map(select(.value != "array")) | length' "${expected}")" = 0 ] \
            || { echo "FAIL: ${expected} has an event whose value is not an array of matchers"; exit 1; }
          [ "$(jq -r '[.[][] | select(type != "string" and type != "null")] | length' "${expected}")" = 0 ] \
            || { echo "FAIL: ${expected} has a matcher that is neither a string nor absent"; exit 1; }
          for tool in Bash Read Grep WebFetch; do
            jq -e --arg t "${tool}" '[.PreToolUse[] | strings | test("(^|[(|])" + $t + "([|)]|$)")] | any' "${expected}" > /dev/null \
              || { echo "FAIL: ${expected} does not route ${tool} through PreToolUse — trimming the expectation to what the routing probe exercises is how this gate gets silently emptied"; exit 1; }
          done
          block="$(sed -n '/^ARG CONTEXT_MODE_VERSION=/,/PreToolUse routes WebFetch to/p' Containerfile)"
          printf '%s\n' "${block}" | grep -qF 'PreToolUse routes WebFetch to' \
            || { echo "FAIL: the Context Mode block did not delimit — every match below would be scanning the whole file"; exit 1; }
          in_block() {
            printf '%s\n' "${block}" | grep -qF -- "$1" || { echo "FAIL: $2"; exit 1; }
          }
          in_block 'COPY --chown=llm:llm container/context-mode-hooks-expected.json' \
            "the committed hook expectation is not copied into the build"
          in_block 'hooks="${CM_PKG}/hooks/claude-code.json"' \
            "the layer does not read the hook file the staged plugin.json names"
          in_block 'cm_table="$(jq -Sc ".hooks | map_values([.[].matcher])" "${hooks}")"' \
            "the layer does not project the staged hook file down to its event and matcher set"
          in_block '[ "${cm_table}" = "${cm_expected_table}" ]' \
            "the staged matcher set is not compared against the committed expectation"
          echo "hook_table_gate=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "hook_table_gate=pass"

  # The lockfile is the single pin on what the image installs: its integrity
  # hash is what npm ci verifies the downloaded tarball against. The build
  # itself refuses a lockfile that disagrees with CONTEXT_MODE_VERSION (npm ci
  # exits EUSAGE when the generated package.json and the lockfile are out of
  # sync), so this is the repo-side half: the committed lockfile names the ARG's
  # release, records an integrity hash for it, and pulls in nothing else.
  - name: the lockfile pins exactly the context-mode release the ARG names
    steps:
      - type: exec
        script: |
          cd "{{.riotbox_dir}}"
          lock=container/context-mode-package-lock.json
          [ -r "${lock}" ] || { echo "FAIL: ${lock} is missing — the pinned lockfile npm ci reads"; exit 1; }
          [ "$(grep -c '^ARG CONTEXT_MODE_VERSION=' Containerfile)" = 1 ] \
            || { echo "FAIL: expected exactly one ARG CONTEXT_MODE_VERSION line"; exit 1; }
          version="$(sed -nE 's/^ARG CONTEXT_MODE_VERSION=(.+)$/\1/p' Containerfile)"
          [ -n "${version}" ] || { echo "FAIL: CONTEXT_MODE_VERSION has no value"; exit 1; }
          jq -e . "${lock}" > /dev/null || { echo "FAIL: ${lock} is not readable JSON"; exit 1; }
          [ "$(jq -r '.packages[""].dependencies["context-mode"]' "${lock}")" = "${version}" ] \
            || { echo "FAIL: ${lock} does not depend on exactly context-mode ${version}"; exit 1; }
          [ "$(jq -r '.packages["node_modules/context-mode"].version' "${lock}")" = "${version}" ] \
            || { echo "FAIL: ${lock} resolves a context-mode other than ${version} — regenerate it with the recipe in the Containerfile"; exit 1; }
          jq -r '.packages["node_modules/context-mode"].integrity' "${lock}" | grep -qE '^sha512-' \
            || { echo "FAIL: ${lock} records no sha512 integrity for context-mode, so nothing pins the bytes"; exit 1; }
          [ "$(jq -r '.packages | keys | join(",")' "${lock}")" = ",node_modules/context-mode" ] \
            || { echo "FAIL: ${lock} resolves more than context-mode itself — the package grew dependencies, and staging it out of node_modules would strand them"; exit 1; }
          echo "context_mode_lock_pin=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "context_mode_lock_pin=pass"

  # The 1.x image made ~/.context-mode and ~/.config/context-mode root-owned
  # and read-only to keep 1.x's event bridge from finding a platform.json.
  # 2.x has no event bridge, and ~/.context-mode is its whole data root: left
  # read-only, every hook fails its store write with EACCES, exits 0 and passes
  # the tool output through whole, so the feature reports itself on and saves
  # nothing.
  - name: the image leaves the context-mode data root writable
    steps:
      - type: exec
        script: |
          cd "{{.riotbox_dir}}"
          if grep -nE '(chmod|chown).*\.context-mode|/home/llm/\.(config/)?context-mode' Containerfile; then
            echo "FAIL: the Containerfile still creates or locks down a context-mode data directory"; exit 1
          fi
          echo "data_root_writable=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "data_root_writable=pass"

  # `riotbox build` runs the Containerfile from the INSTALLED app tree, not from
  # the dev repo, so a COPY source that no install manifest ships resolves for
  # the developer who added it and for nobody else. That is not hypothetical:
  # the plugin lockfile landed in packaging/ first, which neither the packages nor
  # install.sh APP_PATHS installs, and it built green here. With no image build
  # available the packaged tree has to be reconstructed from the manifests and
  # compared against the Containerfile as text — tests/lib/copy-manifest-coverage.sh
  # does that and carries the parsing rules.
  - name: every Containerfile COPY source ships in both install manifests
    steps:
      - type: exec
        script: bash "{{.riotbox_dir}}/tests/lib/copy-manifest-coverage.sh" "{{.riotbox_dir}}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "copy_manifest_coverage=pass"

  # The control for the case above: a checker that has quietly stopped parsing
  # anything reports a pass on every repo. The fixture is a copy of the three
  # real files, which is asserted to pass first — so the red below is the
  # injected COPY and not the copying. packaging/ is the right source to inject
  # because it exists in the repo and is deliberately in neither manifest,
  # which is exactly the shape of the defect this guard was written for.
  - name: the COPY manifest checker reddens on a source no manifest ships
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          cd "{{.riotbox_dir}}"
          root="$(pwd)"
          checker="${root}/tests/lib/copy-manifest-coverage.sh"
          # The fixture is a symlink farm over the real tree, not a handful of
          # loose files: the checker resolves each COPY source against the repo
          # root it is given, so a directory of three files would fail every
          # existence check and the premise below would never hold. Only the
          # Containerfile is a real copy, because it is the file being mutated.
          mkdir -p "${TEST_DIR}/repo"
          for entry in $(ls -A "${root}" | grep -v '^\.git$'); do
            ln -s "${root}/${entry}" "${TEST_DIR}/repo/${entry}"
          done
          rm "${TEST_DIR}/repo/Containerfile"
          cp Containerfile "${TEST_DIR}/repo/Containerfile"
          bash "${checker}" "${TEST_DIR}/repo" >"${TEST_DIR}/control" 2>&1 \
            || { echo "FAIL: the unmutated fixture does not pass, so a red below would prove nothing:"; cat "${TEST_DIR}/control"; exit 1; }
          grep -q 'copy_manifest_coverage=pass' "${TEST_DIR}/control" \
            || { echo "FAIL: the unmutated fixture did not report a pass"; cat "${TEST_DIR}/control"; exit 1; }
          echo 'COPY --chown=llm:llm packaging/postinstall.sh /tmp/unshipped.sh' >>"${TEST_DIR}/repo/Containerfile"
          if bash "${checker}" "${TEST_DIR}/repo" >"${TEST_DIR}/mutated" 2>&1; then
            echo "FAIL: the checker passed a COPY from packaging/, which neither manifest ships"; cat "${TEST_DIR}/mutated"; exit 1
          fi
          grep -q 'UNRESOLVED packaging/postinstall.sh' "${TEST_DIR}/mutated" \
            || { echo "FAIL: the checker failed without naming the unshipped source:"; cat "${TEST_DIR}/mutated"; exit 1; }
          echo "copy_manifest_control=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "copy_manifest_control=pass"

  # The ledger record names the project set, and only the host knows it.
  # Asserted against real argv rather than by reading launch.sh, because the
  # failure this guards against is the flag being computed but not forwarded.
  - name: launcher forwards RIOTBOX_SESSION_KEY when Context Mode is on
    steps:
      - type: exec
        script: |
          set -uo pipefail
          cd "{{.riotbox_dir}}"
          # cd + pwd -P, not a bare mktemp -d: resolve_projects canonicalises
          # every project path the same way, and a symlinked TMPDIR would
          # otherwise make the exact-match assertion below fail on some hosts.
          stub_dir="$(cd "$(mktemp -d)" && pwd -P)"
          trap 'rm -rf "${stub_dir}"' EXIT
          cat > "${stub_dir}/podman" <<'STUB'
          #!/usr/bin/env bash
          printf '%s\n' "$@" > "${STUB_ARGV_FILE}"
          exit 0
          STUB
          chmod +x "${stub_dir}/podman"
          export HOME="${stub_dir}/home"
          unset CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          export XDG_CONFIG_HOME="${stub_dir}/home/.config"
          export XDG_DATA_HOME="${stub_dir}/home/.local/share"
          mkdir -p "${XDG_CONFIG_HOME}/riotbox" "${XDG_DATA_HOME}"
          export ROOT_DIR="{{.riotbox_dir}}"
          export PATH="${stub_dir}:${PATH}"
          export CONTAINER_CMD="${stub_dir}/podman"
          export IMAGE_NAME="riotbox-stub"
          export STUB_ARGV_FILE="${stub_dir}/argv.txt"
          export RIOTBOX_PROJECTS="${stub_dir}"
          export RIOTBOX_CONTEXT_MODE=1
          bash libexec/launch.sh true 2>"${stub_dir}/launch.err" || true
          echo "--- ARGV ---"
          cat "${STUB_ARGV_FILE}" 2>/dev/null || echo "(no argv captured)"
          echo "--- END ARGV ---"
          # Exact whole-line match on the computed value, not just the key's
          # presence: a wrong or empty value never crashes anything downstream
          # (it only mislabels a ledger record), so a substring check on the
          # key name alone would pass even if the value were garbage.
          # resolve_projects (scripts/mount-projects.sh) derives the
          # session key with session_key, which this calls too.
          expected_key="$(source "{{.riotbox_dir}}/scripts/mount-projects.sh" && session_key "${stub_dir}")"
          grep -qxF "RIOTBOX_SESSION_KEY=${expected_key}" "${STUB_ARGV_FILE}" \
            || { echo "BAD: expected RIOTBOX_SESSION_KEY=${expected_key} in argv" >&2; exit 1; }
          echo "OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "OK"

  - name: pkg root is derived from the generated shim
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          export CONTEXT_MODE_BIN="${HOME}/.local/bin/context-mode"
          mkdir -p "${HOME}/.local/bin"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            '# Generated by the RiotBox image build. Pins the interpreter — see the' \
            '# Context Mode block in the Containerfile for why a bare node is wrong.' \
            'exec "/nvm/versions/node/v24.22.2/bin/node" "/home/llm/.riotbox/context-mode-plugin/v2.1.4/cli.mjs" "$@"' \
            > "${CONTEXT_MODE_BIN}"
          chmod +x "${CONTEXT_MODE_BIN}"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/container/context-mode-setup.sh"
          declare -F context_mode_pkg_root >/dev/null || { echo "FAIL: context_mode_pkg_root is not defined"; exit 1; }

          got="$(context_mode_pkg_root)"
          want="/home/llm/.riotbox/context-mode-plugin/v2.1.4"
          [ "${got}" = "${want}" ] || { echo "FAIL: got '${got}' want '${want}'"; exit 1; }
          echo "PKG_ROOT_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PKG_ROOT_OK"

  - name: pkg root fails loudly when the shim is missing or unparseable
    steps:
      - type: exec
        script: |
          set -uo pipefail
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          export CONTEXT_MODE_BIN="${HOME}/.local/bin/context-mode"
          mkdir -p "${HOME}/.local/bin"
          printf '#!/usr/bin/env bash\nexec /usr/bin/node /somewhere/else.js "$@"\n' \
            > "${CONTEXT_MODE_BIN}"
          chmod +x "${CONTEXT_MODE_BIN}"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/container/context-mode-setup.sh"
          declare -F context_mode_pkg_root >/dev/null || { echo "FAIL: context_mode_pkg_root is not defined"; exit 1; }

          if context_mode_pkg_root; then
            echo "FAIL: unparseable shim resolved anyway"; exit 1
          fi

          # A shim an image of the 1.x line wrote: its entry point is gone in
          # 2.x, so a root derived from it names a package with no CLI.
          printf '#!/usr/bin/env bash\nexec "/n/bin/node" "/n/lib/node_modules/context-mode/cli.bundle.mjs" "$@"\n' \
            > "${CONTEXT_MODE_BIN}"
          if context_mode_pkg_root; then
            echo "FAIL: a 1.x cli.bundle.mjs shim resolved anyway"; exit 1
          fi

          rm -f "${CONTEXT_MODE_BIN}"
          if context_mode_pkg_root; then
            echo "FAIL: missing shim resolved anyway"; exit 1
          fi
          echo "PKG_ROOT_REJECTS_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PKG_ROOT_REJECTS_OK"

  # The image build calls this verb against the package it just installed. What
  # is left for it to assert, now that upstream's own hook file defines the
  # events and the matchers, is the MCP server name: the hook bundle hardcodes
  # `mcp__plugin_context-mode_context-mode__<tool>` with nothing to steer it, so
  # a pin bump that renamed the prefix would leave every redirect pointing at a
  # tool the session does not have — and the registered plugin would still look
  # healthy while doing it.
  #
  # Both directions are exercised. The negative half is the guard; the positive
  # half is what stops it from being a guard that rejects everything, which is
  # how a build-time check gets deleted by the next person who hits it.
  - name: the claude build assert accepts the hook bundle and rejects a renamed prefix
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT
          PKG="${HOME}/pkg/context-mode"
          mkdir -p "${PKG}"

          source "{{.riotbox_dir}}/agents/registry.sh"
          declare -F agent_claude_context_mode_build_assert >/dev/null \
            || { echo "FAIL: agent_claude_context_mode_build_assert is not defined"; exit 1; }

          # Upstream's minified hook bundle, reduced to the string literal the
          # guard greps — quotes included, as the bundle spells it.
          printf 'var Wn="mcp__%s__",Ys=Object.freeze(["Bash"]);\n' "${CONTEXT_MODE_MCP_NAME}" \
            > "${PKG}/hook.mjs"
          agent_call claude context_mode_build_assert "${PKG}" \
            || { echo "FAIL: rejected a package whose hook bundle still names the server"; exit 1; }

          # The same file with the prefix renamed, and the old name left inside
          # a longer string: the grep must match the literal, not a substring.
          printf 'var d="see mcp__%s__ctx_search";var Wn="mcp__plugin_ctxmode_ctxmode__";\n' \
            "${CONTEXT_MODE_MCP_NAME}" > "${PKG}/hook.mjs"

          rc=0
          err="$(agent_call claude context_mode_build_assert "${PKG}" 2>&1 >/dev/null)" || rc=$?
          [ "${rc}" != "0" ] \
            || { echo "FAIL: accepted a package whose hook bundle no longer names the server"; exit 1; }
          case "${err}" in
            *"no longer appears in hook.mjs"*) ;;
            *) echo "FAIL: failed for the wrong reason: ${err}"; exit 1 ;;
          esac
          # Nothing obliges a caller to say which tree it handed over, so the
          # diagnostic has to name the root it read or a build failure does not
          # say which tree drifted.
          case "${err}" in
            *"${PKG}"*) ;;
            *) echo "FAIL: the diagnostic does not name the tree it read: ${err}"; exit 1 ;;
          esac

          # An unreadable package fails closed. The comparisons this guard
          # replaced could not: they put two command substitutions on either
          # side of a `!=`, so a run in which both failed compared "" to "" and
          # passed.
          rm -f "${PKG}/hook.mjs"
          rc=0
          agent_call claude context_mode_build_assert "${PKG}" >/dev/null 2>&1 || rc=$?
          [ "${rc}" != "0" ] \
            || { echo "FAIL: accepted a package with no hook bundle at all"; exit 1; }
          echo "BUILD_ASSERT_MCP_NAME_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "BUILD_ASSERT_MCP_NAME_OK"

  # Without the required-argument guard, an empty $1 sends the grep above at
  # "/hook.mjs" — an absolute path that never exists — so
  # the function still fails, but blames an upstream rename that never
  # happened. The guard exists so a missing tree root is diagnosed as a missing
  # tree root. Deliberately not `set -u` here: the Containerfile's
  # RUN block that calls this verb is not `set -u` either (see the comment
  # above its Context Mode block), so this reproduces the same shell the
  # guard has to hold up under — one where a missing $1 silently becomes "",
  # not an "unbound variable" abort.
  - name: the claude build assert rejects a missing tree root
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT

          source "{{.riotbox_dir}}/agents/registry.sh"
          declare -F agent_claude_context_mode_build_assert >/dev/null \
            || { echo "FAIL: agent_claude_context_mode_build_assert is not defined"; exit 1; }

          rc=0
          err="$(agent_call claude context_mode_build_assert 2>&1 >/dev/null)" || rc=$?
          [ "${rc}" != "0" ] \
            || { echo "FAIL: accepted a call with no tree root"; exit 1; }
          case "${err}" in
            *"no longer appears in hook.mjs"*)
              echo "FAIL: blamed an upstream rename instead of the missing argument: ${err}"
              exit 1
              ;;
            *"upstream tree root required"*) ;;
            *) echo "FAIL: failed for the wrong reason: ${err}"; exit 1 ;;
          esac
          echo "BUILD_ASSERT_REQUIRES_ROOT_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "BUILD_ASSERT_REQUIRES_ROOT_OK"

