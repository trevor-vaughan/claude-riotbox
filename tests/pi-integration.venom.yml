name: pi end-to-end runs through riotbox (opt-in)
vars:
  root: "."
  riotbox_dir: "{{.root}}"
  INTEGRATION: "0"

# Opt-in: every case needs a freshly built image (`task build`), so it gates
# in the script body and prints INTEGRATION_SKIPPED or INTEGRATION_OK (see the
# rationale above the integration case in tests/opencode.venom.yml). Live cases
# additionally need RIOTBOX_TEST_NVAPIKEY; the key is forwarded by variable
# name only and must never be echoed or traced.

testcases:
  - name: "pi runs a faux-provider turn with a tool call and keeps sessions across runs [integration]"
    steps:
      - type: exec
        script: |
          set -euo pipefail
          INTEGRATION="{{.INTEGRATION}}"
          if [ "${INTEGRATION}" != "1" ]; then
            echo "INTEGRATION_SKIPPED: run with --var INTEGRATION=1 to enable"; exit 0
          fi
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null
          export GIT_AUTHOR_NAME=riotbox-test GIT_AUTHOR_EMAIL=riotbox-test@invalid
          export GIT_COMMITTER_NAME=riotbox-test GIT_COMMITTER_EMAIL=riotbox-test@invalid
          REPO="$(cd "$(mktemp -d)" && pwd -P)"; HOSTPI="$(mktemp -d)"; LEDGER="$(mktemp -d)"
          SESSION_KEY="$(printf '%s\n' "${REPO}" | sed 's|/|-|g; s|^-||')"
          DATA_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/riotbox"
          SESSION_DIR="${DATA_DIR}/${SESSION_KEY}"
          BACKUP_DIR="${DATA_DIR}/backups/${SESSION_KEY}.git"
          trap 'rm -rf "${REPO}" "${HOSTPI}" "${LEDGER}" "${SESSION_DIR}" "${BACKUP_DIR}"' EXIT
          ( cd "${REPO}" && git init -q && echo hi > README.md && git add README.md && git commit -qm init )
          ( cd "{{.riotbox_dir}}" && task build >/dev/null 2>&1 )
          export PI_CODING_AGENT_DIR="${HOSTPI}" RIOTBOX_CONTEXT_LEDGER="${LEDGER}/ledger"
          # Pin knobs that launch.sh would otherwise take from ~/.config/riotbox/config.
          # RIOTBOX_NETWORK is a non-empty non-"none" value because the config uses
          # ${VAR:=...}, which also overrides an empty value.
          export RIOTBOX_HEADROOM=0 RIOTBOX_OVERLAY=0 RIOTBOX_NETWORK=default
          export RIOTBOX_CONTEXT_MODE=0
          mkdir -p "${HOSTPI}/extensions"
          cp "{{.riotbox_dir}}/tests/fixtures/pi/riotbox-faux-provider.js" "${HOSTPI}/extensions/"
          echo '{"defaultProvider":"riotbox-faux","defaultModel":"faux-1"}' > "${HOSTPI}/settings.json"
          out="$(cd "${REPO}" && "{{.riotbox_dir}}/bin/riotbox" --agent=pi run "create a todo" </dev/null)" || { rc=$?; echo "FAIL: riotbox run exited ${rc}"; printf '%s\n' "${out}"; exit 1; }
          printf '%s\n' "${out}" | tr -d '\r' | grep -qxE '[[:space:]]*RIOTBOX_FAUX_DONE[[:space:]]*' || { echo "FAIL: no faux reply"; echo "${out}"; exit 1; }
          mapfile -t files < <(find "${SESSION_DIR}/.pi-agent/sessions" -name '*.jsonl')
          [[ "${#files[@]}" -eq 1 ]] || { echo "FAIL: expected 1 session file, got ${#files[@]}"; exit 1; }
          grep -qF 'riotbox faux todo' "${files[0]}" || { echo "FAIL: todo call not persisted"; exit 1; }
          jq -e -s 'any(.[]; .message.role == "toolResult" and .message.toolName == "todo" and .message.isError == false)' "${files[0]}" >/dev/null \
            || { echo "FAIL: todo tool did not run successfully"; exit 1; }
          ( cd "${REPO}" && "{{.riotbox_dir}}/bin/riotbox" --agent=pi run "again" </dev/null >/dev/null ) || { rc=$?; echo "FAIL: second riotbox run exited ${rc}"; exit 1; }
          [[ "$(find "${SESSION_DIR}/.pi-agent/sessions" -name '*.jsonl' | wc -l)" -eq 2 ]] || { echo "FAIL: first session lost on re-sync"; exit 1; }
          ( cd "${REPO}" && test -z "$(git status --porcelain)" ) || { echo "FAIL: project tree dirtied"; exit 1; }
          echo "INTEGRATION_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex "INTEGRATION_OK|INTEGRATION_SKIPPED"

  - name: "pi with Context Mode keeps its session DB inside the session mount [integration]"
    steps:
      - type: exec
        script: |
          set -euo pipefail
          INTEGRATION="{{.INTEGRATION}}"
          if [ "${INTEGRATION}" != "1" ]; then
            echo "INTEGRATION_SKIPPED: run with --var INTEGRATION=1 to enable"; exit 0
          fi
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null
          export GIT_AUTHOR_NAME=riotbox-test GIT_AUTHOR_EMAIL=riotbox-test@invalid
          export GIT_COMMITTER_NAME=riotbox-test GIT_COMMITTER_EMAIL=riotbox-test@invalid
          REPO="$(cd "$(mktemp -d)" && pwd -P)"; HOSTPI="$(mktemp -d)"; LEDGER="$(mktemp -d)"
          SESSION_KEY="$(printf '%s\n' "${REPO}" | sed 's|/|-|g; s|^-||')"
          DATA_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/riotbox"
          SESSION_DIR="${DATA_DIR}/${SESSION_KEY}"
          BACKUP_DIR="${DATA_DIR}/backups/${SESSION_KEY}.git"
          trap 'rm -rf "${REPO}" "${HOSTPI}" "${LEDGER}" "${SESSION_DIR}" "${BACKUP_DIR}"' EXIT
          ( cd "${REPO}" && git init -q && echo hi > README.md && git add README.md && git commit -qm init )
          ( cd "{{.riotbox_dir}}" && task build >/dev/null 2>&1 )
          export PI_CODING_AGENT_DIR="${HOSTPI}" RIOTBOX_CONTEXT_LEDGER="${LEDGER}/ledger"
          # Pin knobs that launch.sh would otherwise take from ~/.config/riotbox/config.
          # RIOTBOX_NETWORK is a non-empty non-"none" value because the config uses
          # ${VAR:=...}, which also overrides an empty value.
          export RIOTBOX_HEADROOM=0 RIOTBOX_OVERLAY=0 RIOTBOX_NETWORK=default
          export RIOTBOX_CONTEXT_MODE=0
          mkdir -p "${HOSTPI}/extensions"
          cp "{{.riotbox_dir}}/tests/fixtures/pi/riotbox-faux-provider.js" "${HOSTPI}/extensions/"
          echo '{"defaultProvider":"riotbox-faux","defaultModel":"faux-1"}' > "${HOSTPI}/settings.json"
          ( cd "${REPO}" && RIOTBOX_CONTEXT_MODE=1 "{{.riotbox_dir}}/bin/riotbox" --agent=pi run "create a todo" </dev/null >/dev/null )
          find "${SESSION_DIR}/.pi-agent/context-mode/sessions" -name '*.db' | grep -q . \
            || { echo "FAIL: no Context Mode DB under .pi-agent/context-mode/sessions"; exit 1; }
          echo "INTEGRATION_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex "INTEGRATION_OK|INTEGRATION_SKIPPED"

  - name: "pi answers through the NVIDIA provider with a forwarded key [integration][live]"
    steps:
      - type: exec
        script: |
          set -euo pipefail
          INTEGRATION="{{.INTEGRATION}}"
          if [ "${INTEGRATION}" != "1" ]; then
            echo "INTEGRATION_SKIPPED: run with --var INTEGRATION=1 to enable"; exit 0
          fi
          [ -n "${RIOTBOX_TEST_NVAPIKEY:-}" ] || { echo "INTEGRATION_SKIPPED: RIOTBOX_TEST_NVAPIKEY not set"; exit 0; }
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null
          export GIT_AUTHOR_NAME=riotbox-test GIT_AUTHOR_EMAIL=riotbox-test@invalid
          export GIT_COMMITTER_NAME=riotbox-test GIT_COMMITTER_EMAIL=riotbox-test@invalid
          REPO="$(cd "$(mktemp -d)" && pwd -P)"; HOSTPI="$(mktemp -d)"; LEDGER="$(mktemp -d)"
          SESSION_KEY="$(printf '%s\n' "${REPO}" | sed 's|/|-|g; s|^-||')"
          DATA_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/riotbox"
          SESSION_DIR="${DATA_DIR}/${SESSION_KEY}"
          BACKUP_DIR="${DATA_DIR}/backups/${SESSION_KEY}.git"
          trap 'rm -rf "${REPO}" "${HOSTPI}" "${LEDGER}" "${SESSION_DIR}" "${BACKUP_DIR}"' EXIT
          ( cd "${REPO}" && git init -q && echo hi > README.md && git add README.md && git commit -qm init )
          ( cd "{{.riotbox_dir}}" && task build >/dev/null 2>&1 )
          export PI_CODING_AGENT_DIR="${HOSTPI}" RIOTBOX_CONTEXT_LEDGER="${LEDGER}/ledger"
          # Pin knobs that launch.sh would otherwise take from ~/.config/riotbox/config.
          # RIOTBOX_NETWORK is a non-empty non-"none" value because the config uses
          # ${VAR:=...}, which also overrides an empty value.
          export RIOTBOX_HEADROOM=0 RIOTBOX_OVERLAY=0 RIOTBOX_NETWORK=default
          export RIOTBOX_CONTEXT_MODE=0
          export NVIDIA_API_KEY="${RIOTBOX_TEST_NVAPIKEY}"
          export RIOTBOX_PASSTHROUGH_EXTRA_VARS="NVIDIA_API_KEY"
          echo '{"defaultProvider":"nvidia","defaultModel":"nvidia/nemotron-3-ultra-550b-a55b"}' > "${HOSTPI}/settings.json"
          out="$(cd "${REPO}" && "{{.riotbox_dir}}/bin/riotbox" --agent=pi run "What is six times seven? Reply with only the number, digits only." </dev/null)" || { rc=$?; echo "FAIL: riotbox run exited ${rc}"; printf '%s\n' "${out}"; exit 1; }
          printf '%s\n' "${out}" | tr -d '\r' | grep -qxE '[[:space:]]*42\.?[[:space:]]*' || { echo "FAIL: live reply missing"; echo "${out}"; exit 1; }
          echo "INTEGRATION_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex "INTEGRATION_OK|INTEGRATION_SKIPPED"

  - name: "opencode answers through the NVIDIA provider with a forwarded key [integration][live]"
    steps:
      - type: exec
        script: |
          set -euo pipefail
          INTEGRATION="{{.INTEGRATION}}"
          if [ "${INTEGRATION}" != "1" ]; then
            echo "INTEGRATION_SKIPPED: run with --var INTEGRATION=1 to enable"; exit 0
          fi
          [ -n "${RIOTBOX_TEST_NVAPIKEY:-}" ] || { echo "INTEGRATION_SKIPPED: RIOTBOX_TEST_NVAPIKEY not set"; exit 0; }
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null
          export GIT_AUTHOR_NAME=riotbox-test GIT_AUTHOR_EMAIL=riotbox-test@invalid
          export GIT_COMMITTER_NAME=riotbox-test GIT_COMMITTER_EMAIL=riotbox-test@invalid
          REPO="$(cd "$(mktemp -d)" && pwd -P)"; HOSTPI="$(mktemp -d)"; LEDGER="$(mktemp -d)"
          SESSION_KEY="$(printf '%s\n' "${REPO}" | sed 's|/|-|g; s|^-||')"
          DATA_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/riotbox"
          SESSION_DIR="${DATA_DIR}/${SESSION_KEY}"
          BACKUP_DIR="${DATA_DIR}/backups/${SESSION_KEY}.git"
          trap 'rm -rf "${REPO}" "${HOSTPI}" "${LEDGER}" "${SESSION_DIR}" "${BACKUP_DIR}"' EXIT
          ( cd "${REPO}" && git init -q && echo hi > README.md && git add README.md && git commit -qm init )
          ( cd "{{.riotbox_dir}}" && task build >/dev/null 2>&1 )
          export PI_CODING_AGENT_DIR="${HOSTPI}" RIOTBOX_CONTEXT_LEDGER="${LEDGER}/ledger"
          # Pin knobs that launch.sh would otherwise take from ~/.config/riotbox/config.
          # RIOTBOX_NETWORK is a non-empty non-"none" value because the config uses
          # ${VAR:=...}, which also overrides an empty value.
          export RIOTBOX_HEADROOM=0 RIOTBOX_OVERLAY=0 RIOTBOX_NETWORK=default
          export RIOTBOX_CONTEXT_MODE=0
          export NVIDIA_API_KEY="${RIOTBOX_TEST_NVAPIKEY}"
          export OPENCODE_CONFIG_CONTENT='{"model":"nvidia/nvidia/nemotron-3-ultra-550b-a55b"}'
          export RIOTBOX_PASSTHROUGH_EXTRA_VARS="NVIDIA_API_KEY OPENCODE_CONFIG_CONTENT"
          out="$(cd "${REPO}" && "{{.riotbox_dir}}/bin/riotbox" --agent=opencode run "What is six times seven? Reply with only the number, digits only." </dev/null)" || { rc=$?; echo "FAIL: riotbox run exited ${rc}"; printf '%s\n' "${out}"; exit 1; }
          printf '%s\n' "${out}" | tr -d '\r' | grep -qxE '[[:space:]]*42\.?[[:space:]]*' || { echo "FAIL: live reply missing"; echo "${out}"; exit 1; }
          echo "INTEGRATION_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex "INTEGRATION_OK|INTEGRATION_SKIPPED"
