        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'chmod -R u+rwx "${T}" 2>/dev/null || true; rm -rf "${T}"' EXIT
          if [ "$(id -u)" -eq 0 ]; then echo "SKIP: root ignores file modes"; echo "rmfail_ok=true"; exit 0; fi
          # Fixed names so the order is known: aaa is removed, bbb fails, ccc is left.
          for k in aaa bbb ccc; do
            mkdir -p "${DATA}/${k}" "${STATE}/${k}" "${T}/projects/${k}"
            printf '%s\n' "${T}/projects/${k}" >"${DATA}/${k}/.projects"
            printf '%s\n' "${T}/projects/${k}" >"${STATE}/${k}/projects"
          done
          mkdir "${DATA}/bbb/ro"; echo x >"${DATA}/bbb/ro/file"; chmod 555 "${DATA}/bbb/ro"
          rc=0; out="$(bash "{{.riotbox_dir}}/libexec/reset-session.sh" all force 2>&1)" || rc=$?
          chmod 755 "${DATA}/bbb/ro"
          [ "${rc}" -ne 0 ] || { echo "FAIL: exit 0 after a failed removal"; exit 1; }
          printf '%s\n' "${out}" | grep -qF "ERROR: could not fully remove session bbb" || { echo "FAIL: no error naming the session"; printf '%s\n' "${out}"; exit 1; }
          printf '%s\n' "${out}" | grep -qF "Removed 1 session(s) before the error; the rest were left in place." || { echo "FAIL: wrong count"; printf '%s\n' "${out}"; exit 1; }
          [ ! -e "${DATA}/aaa" ] || { echo "FAIL: aaa survived"; exit 1; }
          [ -d "${STATE}/bbb" ] && "{{.riotbox_dir}}/libexec/riotbox-core" is-session -- "${DATA}/bbb" "${STATE}/bbb" || { echo "FAIL: bbb is no longer a session"; exit 1; }
          [ -d "${DATA}/ccc" ] && [ -d "${STATE}/ccc" ] || { echo "FAIL: ccc was touched"; exit 1; }
          echo "rmfail_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "rmfail_ok=true"

  - name: an unexpected session-busy code at removal time after a removal reports the count
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          a="$(make_session a)"; b="$(make_session b)"
          tree="${T}/tree"; mkdir -p "${tree}"
          cp -a "{{.riotbox_dir}}/libexec" "{{.riotbox_dir}}/scripts" "{{.riotbox_dir}}/VERSION" "${tree}/"
          mv "${tree}/libexec/riotbox-core" "${tree}/libexec/riotbox-core.real"
          # Idle for the two selection checks and the first recheck, then an unexpected code.
          cat >"${tree}/libexec/riotbox-core" <<STUB
          #!/bin/sh
          if [ "\$1" = session-busy ]; then
            n=\$(cat "${T}/calls" 2>/dev/null || echo 0); n=\$((n + 1)); echo "\${n}" >"${T}/calls"
            [ "\${n}" -le 3 ] && exit 0
            echo "stub: boom" >&2; exit 2
          fi
          exec "\$(dirname "\$0")/riotbox-core.real" "\$@"
          STUB
          chmod +x "${tree}/libexec/riotbox-core"
          rc=0; out="$(echo y | ROOT_DIR="${tree}" bash "${tree}/libexec/reset-session.sh" all 2>&1)" || rc=$?
          [ "${rc}" -ne 0 ] || { echo "FAIL: exit 0"; exit 1; }
          printf '%s\n' "${out}" | grep -qF "Removed 1 session(s) before the error; the rest were left in place." || { echo "FAIL: wrong count"; printf '%s\n' "${out}"; exit 1; }
          left=0; for k in "${a}" "${b}"; do [ -d "${DATA}/${k}" ] && [ -d "${STATE}/${k}" ] && left=$((left + 1)); done
          [ "${left}" -eq 1 ] || { echo "FAIL: expected exactly one session left, got ${left}"; exit 1; }
          echo "abort3_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "abort3_ok=true"

  - name: an engine that stops answering while the prompt waits is reported as unanswered, not busy
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          a="$(make_session a)"; b="$(make_session b)"
          cat >"${T}/engine" <<STUB
          #!/bin/sh
          n=\$(cat "${T}/calls" 2>/dev/null || echo 0); n=\$((n + 1)); echo "\${n}" >"${T}/calls"
          [ "\${n}" -le 2 ] && exit 0
          echo "engine went away" >&2; exit 125
          STUB
          chmod +x "${T}/engine"; export CONTAINER_CMD="${T}/engine"
          out="$(echo y | bash "{{.riotbox_dir}}/libexec/reset-session.sh" all 2>&1)"
          printf '%s\n' "${out}" | grep -qF "Skipped 2 session(s) because the container engine did not answer after the list was shown:" || { echo "FAIL: wrong late wording"; printf '%s\n' "${out}"; exit 1; }
          printf '%s\n' "${out}" | grep -qF "became busy" && { echo "FAIL: reported as busy"; exit 1; }
          [ -d "${DATA}/${a}" ] && [ -d "${DATA}/${b}" ] || { echo "FAIL: a session was removed"; exit 1; }
          printf '%s\n' "${out}" | grep -qF "Removed 0 session(s)." || { echo "FAIL: wrong count"; exit 1; }
          echo "late_unanswered_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "late_unanswered_ok=true"

  - name: a key ending in a newline is shown quoted, so it differs from the key without it
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          a="$(make_session plain)"
          odd="${a}"$'\n'
          for k in "${a}" "${odd}"; do
            mkdir -p "${DATA}/${k}" "${STATE}/${k}/overlay/p/upper"
            printf '%s\n' "${T}/projects/plain" >"${DATA}/${k}/.projects"
            echo edit >"${STATE}/${k}/overlay/p/upper/f"
          done
          out="$(bash "{{.riotbox_dir}}/libexec/reset-session.sh" all force)"
          printf '%s\n' "${out}" | grep -qxF "  ${a}" || { echo "FAIL: the plain key is not listed bare"; printf '%s\n' "${out}"; exit 1; }
          printf '%s\n' "${out}" | grep -qF "\$'${a}\\n'" || { echo "FAIL: the newline key is not shown quoted"; printf '%s\n' "${out}"; exit 1; }
          echo "quoted_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "quoted_ok=true"

  - name: --project-missing matches a legacy session that has no state dir
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          gone="$(make_session gone)"; here="$(make_session here)"
          rm -rf "${STATE}/${gone}" "${STATE}/${here}"
          rmdir "${T}/projects/gone"
          bash "{{.riotbox_dir}}/libexec/reset-session.sh" all force --project-missing
          [ ! -e "${DATA}/${gone}" ] || { echo "FAIL: an orphaned session without a state dir survived"; exit 1; }
          [ -d "${DATA}/${here}" ] || { echo "FAIL: a session with a live project was removed"; exit 1; }
          echo "nostate_missing_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "nostate_missing_ok=true"

  - name: a glob character in the upper path does not change what the completeness walk ignores
    steps:
      - type: exec
        script: |
          set -euo pipefail
          T="$(mktemp -d)"
          trap 'chmod -R u+rwx "${T}" 2>/dev/null || true; rm -rf "${T}"' EXIT
          if [ "$(id -u)" -eq 0 ]; then echo "SKIP: root ignores file modes"; echo "globpath_ok=true"; exit 0; fi
          source "{{.riotbox_dir}}/scripts/lib/overlay-ignore.sh"
          up="${T}/we*i?r[d\\u"
          mkdir -p "${up}/.headroom/sub"; chmod 000 "${up}/.headroom/sub"
          if overlay_upper_has_changes "${up}" 2>/dev/null; then echo "FAIL: ignored dir counted under a glob-character path"; exit 1; fi
          chmod 700 "${up}/.headroom/sub"; rm -rf "${up}"
          mkdir -p "${up}/src/sub"; chmod 000 "${up}/src/sub"
          overlay_upper_has_changes "${up}" 2>/dev/null || { echo "FAIL: unreadable dir not pending under a glob-character path"; exit 1; }
          echo "globpath_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "globpath_ok=true"

  - name: a state dir under a parent that cannot be searched reads as pending, a missing one under a searchable parent does not
    steps:
      - type: exec
        script: |
          set -euo pipefail
          T="$(mktemp -d)"
          trap 'chmod -R u+rwx "${T}" 2>/dev/null || true; rm -rf "${T}"' EXIT
          if [ "$(id -u)" -eq 0 ]; then echo "SKIP: root ignores file modes"; echo "parent_ok=true"; exit 0; fi
          source "{{.riotbox_dir}}/scripts/lib/overlay-ignore.sh"
          mkdir -p "${T}/root/st/overlay/p/upper"; echo x >"${T}/root/st/overlay/p/upper/f"
          chmod 000 "${T}/root"
          overlay_state_pending "${T}/root/st" || { echo "FAIL: an unsearchable parent read as no overlays"; exit 1; }
          chmod 700 "${T}/root"
          if overlay_state_pending "${T}/root/nothing"; then echo "FAIL: a missing state dir read as pending"; exit 1; fi
          echo "parent_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "parent_ok=true"

  - name: a failure inside the state dir leaves the session listed, and a second run finishes it
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'chmod -R u+rwx "${T}" 2>/dev/null || true; rm -rf "${T}"' EXIT
          if [ "$(id -u)" -eq 0 ]; then echo "SKIP: root ignores file modes"; echo "statefail_ok=true"; exit 0; fi
          for k in aaa bbb ccc; do
            mkdir -p "${DATA}/${k}" "${STATE}/${k}" "${T}/projects/${k}"
            printf '%s\n' "${T}/projects/${k}" >"${DATA}/${k}/.projects"
            printf '%s\n' "${T}/projects/${k}" >"${STATE}/${k}/projects"
          done
          mkdir "${STATE}/bbb/ro"; echo x >"${STATE}/bbb/ro/file"; chmod 555 "${STATE}/bbb/ro"
          rc=0; out="$(bash "{{.riotbox_dir}}/libexec/reset-session.sh" all force 2>&1)" || rc=$?
          [ "${rc}" -ne 0 ] || { echo "FAIL: exit 0 after a failed removal"; exit 1; }
          printf '%s\n' "${out}" | grep -qF "ERROR: could not fully remove session bbb" || { echo "FAIL: no error"; printf '%s\n' "${out}"; exit 1; }
          printf '%s\n' "${out}" | grep -qF "rm -rf -- ${STATE}/bbb" || { echo "FAIL: no cleanup line"; printf '%s\n' "${out}"; exit 1; }
          printf '%s\n' "${out}" | grep -qF "Removed 1 session(s) before the error; the rest were left in place." || { echo "FAIL: wrong count"; printf '%s\n' "${out}"; exit 1; }
          "{{.riotbox_dir}}/libexec/riotbox-core" is-session -- "${DATA}/bbb" "${STATE}/bbb" || { echo "FAIL: the half-removed session is no longer a session"; exit 1; }
          chmod -R u+rwx "${STATE}/bbb"
          bash "{{.riotbox_dir}}/libexec/reset-session.sh" all force
          [ ! -e "${DATA}/bbb" ] && [ ! -e "${STATE}/bbb" ] && [ ! -e "${DATA}/ccc" ] && [ ! -e "${STATE}/ccc" ] || { echo "FAIL: the second run left something"; exit 1; }
          echo "statefail_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "statefail_ok=true"

  - name: a failed removal of a legacy session without a record leaves it listed
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'chmod -R u+rwx "${T}" 2>/dev/null || true; rm -rf "${T}"' EXIT
          if [ "$(id -u)" -eq 0 ]; then echo "SKIP: root ignores file modes"; echo "legacyfail_ok=true"; exit 0; fi
          mkdir -p "${DATA}/legacy/ro" "${T}/projects/legacy"
          printf '%s\n' "${T}/projects/legacy" >"${DATA}/legacy/.projects"
          echo x >"${DATA}/legacy/ro/file"; chmod 555 "${DATA}/legacy/ro"
          rc=0; bash "{{.riotbox_dir}}/libexec/reset-session.sh" all force >/dev/null 2>&1 || rc=$?
          [ "${rc}" -ne 0 ] || { echo "FAIL: exit 0 after a failed removal"; exit 1; }
          "{{.riotbox_dir}}/libexec/riotbox-core" is-session -- "${DATA}/legacy" "${STATE}/legacy" || { echo "FAIL: the legacy session lost its marker"; exit 1; }
          chmod -R u+rwx "${DATA}/legacy"
          bash "{{.riotbox_dir}}/libexec/reset-session.sh" all force
          [ ! -e "${DATA}/legacy" ] || { echo "FAIL: the second run left it"; exit 1; }
          echo "legacyfail_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "legacyfail_ok=true"

  - name: entries with dot, dash, space and newline names are all removed with their session
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          key="$(make_session odd)"
          for base in "${DATA}/${key}" "${STATE}/${key}"; do
            ( cd "${base}"; touch -- .hidden -rf "with space" $'new\nline'; mkdir -p -- .dotdir/sub -dir )
          done
          bash "{{.riotbox_dir}}/libexec/reset-session.sh" all force
          [ ! -e "${DATA}/${key}" ] && [ ! -e "${STATE}/${key}" ] || { echo "FAIL: a session with odd entry names was not fully removed"; exit 1; }
          echo "oddnames_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "oddnames_ok=true"

  - name: late skips are reported before the error line when the run aborts
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          for k in aaa bbb; do
            mkdir -p "${DATA}/${k}" "${STATE}/${k}" "${T}/projects/${k}"
            printf '%s\n' "${T}/projects/${k}" >"${DATA}/${k}/.projects"
          done
          tree="${T}/tree"; mkdir -p "${tree}"
          cp -a "{{.riotbox_dir}}/libexec" "{{.riotbox_dir}}/scripts" "{{.riotbox_dir}}/VERSION" "${tree}/"
          mv "${tree}/libexec/riotbox-core" "${tree}/libexec/riotbox-core.real"
          # Calls 1-2 select; call 3 (aaa) says busy; call 4 (bbb) fails unexpectedly.
          cat >"${tree}/libexec/riotbox-core" <<STUB
          #!/bin/sh
          if [ "\$1" = session-busy ]; then
            n=\$(cat "${T}/calls" 2>/dev/null || echo 0); n=\$((n + 1)); echo "\${n}" >"${T}/calls"
            [ "\${n}" -le 2 ] && exit 0
            [ "\${n}" -eq 3 ] && { echo "stub: busy" >&2; exit 1; }
            echo "stub: boom" >&2; exit 2
          fi
          exec "\$(dirname "\$0")/riotbox-core.real" "\$@"
          STUB
          chmod +x "${tree}/libexec/riotbox-core"
          rc=0; out="$(echo y | ROOT_DIR="${tree}" bash "${tree}/libexec/reset-session.sh" all 2>&1)" || rc=$?
          [ "${rc}" -ne 0 ] || { echo "FAIL: exit 0"; exit 1; }
          skipped="$(printf '%s\n' "${out}" | grep -nF "Skipped 1 session(s) that became busy after the list was shown:" | cut -d: -f1)"
          errline="$(printf '%s\n' "${out}" | grep -nF "before the error" | cut -d: -f1)"
          [ -n "${skipped}" ] && [ -n "${errline}" ] && [ "${skipped}" -lt "${errline}" ] || { echo "FAIL: the late skip was lost or came after the error"; printf '%s\n' "${out}"; exit 1; }
          echo "order_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "order_ok=true"

  - name: a state path that is not a directory is reported as such, not as pending overlay changes
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          key="$(make_session filestate)"
          rm -rf "${STATE}/${key}"; echo x >"${STATE}/${key}"
          out="$(bash "{{.riotbox_dir}}/libexec/reset-session.sh" all force)"
          printf '%s\n' "${out}" | grep -qF "Skipped 1 session(s) with an invalid name or a state path that is not a directory" || { echo "FAIL: wrong notice"; printf '%s\n' "${out}"; exit 1; }
          printf '%s\n' "${out}" | grep -qF "pending overlay" && { echo "FAIL: reported as pending overlay changes"; exit 1; }
          [ -d "${DATA}/${key}" ] && [ -f "${STATE}/${key}" ] || { echo "FAIL: something was removed"; exit 1; }
          echo "filestate_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "filestate_ok=true"
