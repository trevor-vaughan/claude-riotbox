  # riotbox-core is found next to the scripts (scripts/lib/riotbox-core.sh), so
  # these cases run a copy of the tree whose riotbox-core answers session-busy
  # with an unexpected exit code and passes every other verb to the real binary.
  - name: an unexpected session-busy exit code aborts before anything is removed
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          a="$(make_session a)"; b="$(make_session b)"
          tree="${T}/tree"; mkdir -p "${tree}"
          cp -a "{{.riotbox_dir}}/libexec" "{{.riotbox_dir}}/scripts" "{{.riotbox_dir}}/VERSION" "${tree}/"
          mv "${tree}/libexec/riotbox-core" "${tree}/libexec/riotbox-core.real"
          cat >"${tree}/libexec/riotbox-core" <<'STUB'
          #!/bin/sh
          if [ "$1" = session-busy ]; then echo "stub: boom" >&2; exit 2; fi
          exec "$(dirname "$0")/riotbox-core.real" "$@"
          STUB
          sed -i 's/^          //' "${tree}/libexec/riotbox-core"
          chmod +x "${tree}/libexec/riotbox-core"
          rc=0; out="$(ROOT_DIR="${tree}" bash "${tree}/libexec/reset-session.sh" all force 2>&1)" || rc=$?
          [ "${rc}" -ne 0 ] || { echo "FAIL: exit 0 after an unexpected engine verdict"; exit 1; }
          printf '%s\n' "${out}" | grep -qF "ERROR: riotbox-core session-busy failed (exit 2)" || { echo "FAIL: no error message"; printf '%s\n' "${out}"; exit 1; }
          [ -d "${DATA}/${a}" ] && [ -d "${DATA}/${b}" ] && [ -d "${STATE}/${a}" ] && [ -d "${STATE}/${b}" ] || { echo "FAIL: something was removed"; exit 1; }
          echo "abort_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "abort_ok=true"

  - name: an unexpected session-busy exit code at removal time aborts and leaves the rest in place
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          a="$(make_session a)"; b="$(make_session b)"
          tree="${T}/tree"; mkdir -p "${tree}"
          cp -a "{{.riotbox_dir}}/libexec" "{{.riotbox_dir}}/scripts" "{{.riotbox_dir}}/VERSION" "${tree}/"
          mv "${tree}/libexec/riotbox-core" "${tree}/libexec/riotbox-core.real"
          # Idle for the two selection-time checks, then an unexpected code.
          cat >"${tree}/libexec/riotbox-core" <<STUB
          #!/bin/sh
          if [ "\$1" = session-busy ]; then
            n=\$(cat "${T}/calls" 2>/dev/null || echo 0); n=\$((n + 1)); echo "\${n}" >"${T}/calls"
            [ "\${n}" -le 2 ] && exit 0
            echo "stub: boom" >&2; exit 2
          fi
          exec "\$(dirname "\$0")/riotbox-core.real" "\$@"
          STUB
          chmod +x "${tree}/libexec/riotbox-core"
          rc=0; out="$(echo y | ROOT_DIR="${tree}" bash "${tree}/libexec/reset-session.sh" all 2>&1)" || rc=$?
          [ "${rc}" -ne 0 ] || { echo "FAIL: exit 0 after an unexpected verdict at removal"; exit 1; }
          printf '%s\n' "${out}" | grep -qF "ERROR: riotbox-core session-busy failed (exit 2)" || { echo "FAIL: no error message"; printf '%s\n' "${out}"; exit 1; }
          [ -d "${DATA}/${a}" ] && [ -d "${DATA}/${b}" ] && [ -d "${STATE}/${a}" ] && [ -d "${STATE}/${b}" ] || { echo "FAIL: something was removed"; exit 1; }
          echo "abort2_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "abort2_ok=true"

