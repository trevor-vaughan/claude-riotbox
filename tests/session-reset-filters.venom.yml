name: session-reset filters — selection by age, size and project, with safe defaults
vars:
  root: "."
  riotbox_dir: "{{.root}}"

# libexec/session-summary.sh holds the helpers the filters stand on. A
# directory's own mtime changes only when an entry directly inside it is added
# or removed, so "last used" must come from the newest file anywhere below.

testcases:
  - name: session_last_used prints the exact newest mtime across the session and state dirs
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export TZ=UTC
          source "{{.riotbox_dir}}/libexec/session-summary.sh"
          T="$(mktemp -d)"; trap 'rm -rf "${T}"' EXIT
          # Newest of several files wins; an older file deeper in the tree does not.
          mkdir -p "${T}/s/deep" "${T}/st"
          echo x >"${T}/s/a"; echo x >"${T}/s/deep/old"; echo x >"${T}/s/b"
          touch -d '2024-03-05 06:07:08' "${T}/s/a"
          touch -d '2024-01-01 00:00:00' "${T}/s/deep/old"
          touch -d '2024-03-09 01:02:03' "${T}/s/b"
          touch -d '2020-01-01 00:00:00' "${T}/s/deep" "${T}/s" "${T}/st"
          got="$(session_last_used "${T}/s" "${T}/st")"
          [ "${got}" = "2024-03-09 01:02:03" ] || { echo "FAIL: session tree: got '${got}'"; exit 1; }
          # A newer file only in the state dir wins over an older session dir.
          echo x >"${T}/st/newer"
          touch -d '2024-05-05 05:05:05' "${T}/st/newer"
          touch -d '2020-01-01 00:00:00' "${T}/st"
          got="$(session_last_used "${T}/s" "${T}/st")"
          [ "${got}" = "2024-05-05 05:05:05" ] || { echo "FAIL: state dir: got '${got}'"; exit 1; }
          # A missing state dir is ignored.
          got="$(session_last_used "${T}/s" "${T}/missing")"
          [ "${got}" = "2024-03-09 01:02:03" ] || { echo "FAIL: missing state dir: got '${got}'"; exit 1; }
          none="$(session_last_used "${T}/missing" "${T}/missing")"
          [ -z "${none}" ] || { echo "FAIL: expected nothing for unreadable dirs, got '${none}'"; exit 1; }
          echo "last_used_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "last_used_ok=true"

  - name: session_used_within_days tells recent from stale and refuses to call an unreadable tree stale
    steps:
      - type: exec
        script: |
          set -euo pipefail
          source "{{.riotbox_dir}}/libexec/session-summary.sh"
          T="$(mktemp -d)"; trap 'chmod -R u+rwx "${T}"; rm -rf "${T}"' EXIT
          mkdir -p "${T}/recent" "${T}/stale"
          echo x >"${T}/recent/f"; echo x >"${T}/stale/f"
          find "${T}/stale" -exec touch -d '40 days ago' {} +
          expect() { # <want> <label> <args...>
            local want="$1" label="$2" rc=0
            shift 2
            session_used_within_days "$@" || rc=$?
            [ "${rc}" -eq "${want}" ] || { echo "FAIL: ${label} gave ${rc}, want ${want}"; exit 1; }
          }
          expect 0 "recent" 30 "${T}/recent"
          expect 1 "stale" 30 "${T}/stale"
          expect 2 "stale + missing dir" 30 "${T}/stale" "${T}/missing"
          expect 0 "recent + missing dir (hit wins over error)" 30 "${T}/recent" "${T}/missing"
          expect 2 "negative days" -5 "${T}/stale"
          expect 2 "non-numeric days" abc "${T}/stale"
          expect 2 "empty days" "" "${T}/stale"
          expect 2 "fractional days" 1.5 "${T}/stale"
          expect 2 "expression days" "2 years +" "${T}/stale"
          cd "${T}/stale"
          expect 2 "dir that looks like a find option" 30 -depth
          expect 2 "relative dir" 30 "stale"
          expect 2 "relative dir ." 30 .
          cd "${T}"
          if [ "$(id -u)" -ne 0 ]; then
            mkdir "${T}/stale/locked"; echo x >"${T}/stale/locked/f"
            find "${T}/stale" -exec touch -d '40 days ago' {} +
            chmod 000 "${T}/stale/locked"
            expect 2 "unreadable subtree" 30 "${T}/stale"
          else
            echo "SKIP chmod case (root)"
          fi
          echo "within_days_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "within_days_ok=true"

  - name: session_bytes sums the session and state dirs and survives an unreadable entry
    steps:
      - type: exec
        script: |
          set -euo pipefail
          source "{{.riotbox_dir}}/libexec/session-summary.sh"
          T="$(mktemp -d)"; trap 'chmod -R u+rwx "${T}"; rm -rf "${T}"' EXIT
          mkdir -p "${T}/s" "${T}/st"
          head -c 2097152 /dev/urandom >"${T}/s/a"
          head -c 1048576 /dev/urandom >"${T}/st/b"
          got="$(session_bytes "${T}/s" "${T}/st")"
          [ "${got}" -ge 3145728 ] && [ "${got}" -lt 3407872 ] || { echo "FAIL: expected 3-3.25 MiB, got ${got}"; exit 1; }
          only="$(session_bytes "${T}/s" "${T}/missing")"
          [ "${only}" -ge 2097152 ] && [ "${only}" -lt 3145728 ] || { echo "FAIL: state dir counted though missing: ${only}"; exit 1; }
          if [ "$(id -u)" -ne 0 ]; then
            mkdir "${T}/s/locked"; echo x >"${T}/s/locked/f"
            chmod 000 "${T}/s/locked"
            part="$(session_bytes "${T}/s" "${T}/st")"
            echo "reached_after_unreadable=true"
            [[ "${part}" =~ ^[0-9]+$ ]] && [ "${part}" -ge 3145728 ] || { echo "FAIL: no count with unreadable entry: '${part}'"; exit 1; }
          else
            echo "SKIP chmod case (root)"
          fi
          echo "bytes_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "bytes_ok=true"

  - name: session-list and the removal summary show the newest file's time, not the session dir's
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          key="$(make_session alpha)"
          touch -d '2020-01-01 00:00:00' "${DATA}/${key}" "${STATE}/${key}"
          list="$(bash "{{.riotbox_dir}}/libexec/list-sessions.sh")"
          printf '%s\n' "${list}" | grep -q "Last used:  $(date +%Y)-" || { echo "FAIL: session-list used the dir mtime"; printf '%s\n' "${list}"; exit 1; }
          summary="$(printf 'n\n' | bash "{{.riotbox_dir}}/libexec/reset-session.sh" all)"
          printf '%s\n' "${summary}" | grep -q "last used: $(date +%Y)-" || { echo "FAIL: the summary used the dir mtime"; printf '%s\n' "${summary}"; exit 1; }
          echo "summary_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "summary_ok=true"

  - name: a filter without all, a bad value and an unknown flag are refused and delete nothing
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          key="$(make_session alpha)"
          cd "${T}/projects/alpha"
          refuse() {
            local want="$1"; shift
            local rc=0 err
            err="$(bash "{{.riotbox_dir}}/libexec/reset-session.sh" "$@" 2>&1 </dev/null)" || rc=$?
            [ "${rc}" -ne 0 ] || { echo "FAIL: '$*' was accepted"; exit 1; }
            printf '%s\n' "${err}" | grep -qF -- "${want}" || { echo "FAIL: '$*' did not say '${want}'"; printf '%s\n' "${err}"; exit 1; }
            [ -d "${DATA}/${key}" ] && [ -f "${DATA}/${key}/payload" ] && [ -f "${STATE}/${key}/git-ai/config.json" ] ||
              { echo "FAIL: '$*' deleted the session"; exit 1; }
          }
          refuse "requires all"          --older-than 30d force
          refuse "requires all"          --larger-than 1G force
          refuse "requires all"          --project-missing force
          refuse "requires all"          --pending-overlays force
          refuse "needs a number of days" all --older-than 30
          refuse "needs a number of days" all --older-than 0d
          refuse "needs a number of days" all --older-than -5d
          refuse "needs a number of days" all --older-than 30D
          refuse "needs a number of days" all --older-than 30dd
          refuse "needs a number of days" all --older-than "3 0d"
          refuse "needs a number of days" all --older-than
          refuse "needs a number of days" all --older-than 1000000d
          refuse "needs a number of days" all --older-than 1000000000000000d
          refuse "needs a number of days" all --older-than 99999999999999999999d
          refuse "needs a number of days" all --older-than 08d
          refuse "needs a number of days" all --older-than 0030d
          refuse "needs a number of days" all --older-than $'30d\n'
          refuse "needs a number of days" all --older-than --larger-than
          refuse "needs a size"          all --larger-than --older-than
          refuse "--older-than given twice."  all --older-than 30d --older-than 60d
          refuse "--larger-than given twice." all --larger-than 1G --larger-than 2G
          refuse "needs a size"          all --larger-than abc
          refuse "needs a size"          all --larger-than -5
          refuse "needs a size"          all --larger-than 1e3
          refuse "needs a size"          all --larger-than ""
          refuse "needs a size"          all --larger-than " 5"
          refuse "needs a size"          all --larger-than "1G "
          refuse "needs a size"          all --larger-than "5K 6"
          refuse "needs a size"          all --larger-than 1.5
          refuse "needs a size"          all --larger-than 8E
          refuse "needs a size"          all --larger-than 99999999999999999999
          refuse "needs a size"          all --larger-than
          refuse "Unknown flag"          all --bogus
          echo "refused_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "refused_ok=true"

  - name: --older-than removes only sessions with nothing recent anywhere below them
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          old="$(make_session old)"; fresh="$(make_session fresh)"; deep="$(make_session deep)"
          age_session "${old}" 40
          age_session "${deep}" 40
          echo recent >"${STATE}/${deep}/git-ai/new"   # deep file is recent; dir mtimes stay old
          touch -d '40 days ago' "${DATA}/${deep}" "${STATE}/${deep}" "${STATE}/${deep}/git-ai"
          bash "{{.riotbox_dir}}/libexec/reset-session.sh" all force --older-than 30d
          [ ! -e "${DATA}/${old}" ] || { echo "FAIL: the stale session survived"; exit 1; }
          [ -d "${DATA}/${fresh}" ] || { echo "FAIL: the fresh session was removed"; exit 1; }
          [ -d "${DATA}/${deep}" ] || { echo "FAIL: a session with a recent deep file was removed"; exit 1; }
          assert_app_tree_intact
          echo "older_than_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "Removed 1 session(s)."
          - result.systemout ShouldContainSubstring "older_than_ok=true"

  - name: --larger-than removes only sessions over the size
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          big="$(make_session big)"; small="$(make_session small)"
          head -c 3145728 /dev/urandom >"${STATE}/${big}/git-ai/db"
          bash "{{.riotbox_dir}}/libexec/reset-session.sh" all force --larger-than 1M
          [ ! -e "${DATA}/${big}" ] || { echo "FAIL: the big session survived"; exit 1; }
          [ -d "${DATA}/${small}" ] || { echo "FAIL: the small session was removed"; exit 1; }
          echo "larger_than_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "larger_than_ok=true"

  - name: --project-missing removes only sessions whose every project is gone, and never one it cannot read
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          gone="$(make_session gone)"; here="$(make_session here)"; blank="$(make_session blank)"
          rmdir "${T}/projects/gone"
          rmdir "${T}/projects/blank"
          : >"${DATA}/${blank}/.projects"      # emptied: cannot tell, so no match
          bash "{{.riotbox_dir}}/libexec/reset-session.sh" all force --project-missing
          [ ! -e "${DATA}/${gone}" ] || { echo "FAIL: the orphaned session survived"; exit 1; }
          [ -d "${DATA}/${here}" ] || { echo "FAIL: a session with a live project was removed"; exit 1; }
          [ -d "${DATA}/${blank}" ] || { echo "FAIL: a session with an unreadable project list was removed"; exit 1; }
          echo "project_missing_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "project_missing_ok=true"

  - name: filters combine with AND
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          both="$(make_session both)"; oldonly="$(make_session oldonly)"; bigonly="$(make_session bigonly)"
          head -c 3145728 /dev/urandom >"${STATE}/${both}/git-ai/db"
          head -c 3145728 /dev/urandom >"${STATE}/${bigonly}/git-ai/db"
          age_session "${both}" 40
          age_session "${oldonly}" 40
          bash "{{.riotbox_dir}}/libexec/reset-session.sh" all force --older-than 30d --larger-than 1M
          [ ! -e "${DATA}/${both}" ] || { echo "FAIL: the session matching both survived"; exit 1; }
          [ -d "${DATA}/${oldonly}" ] || { echo "FAIL: old but small was removed"; exit 1; }
          [ -d "${DATA}/${bigonly}" ] || { echo "FAIL: big but recent was removed"; exit 1; }
          echo "and_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "and_ok=true"

  - name: sessions with pending overlay changes are skipped unless --pending-overlays
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          dirty="$(make_session dirty)"; clean="$(make_session clean)"
          mkdir -p "${STATE}/${dirty}/overlay/p/upper"
          echo edit >"${STATE}/${dirty}/overlay/p/upper/file.txt"
          out="$(bash "{{.riotbox_dir}}/libexec/reset-session.sh" all force)"
          printf '%s\n' "${out}" | grep -qF "Skipped 1 session(s) with pending overlay changes" || { echo "FAIL: no skip notice"; printf '%s\n' "${out}"; exit 1; }
          printf '%s\n' "${out}" | grep -qF -- "--pending-overlays" || { echo "FAIL: the notice does not name the flag"; exit 1; }
          [ -d "${DATA}/${dirty}" ] || { echo "FAIL: the session with pending changes was removed"; exit 1; }
          [ ! -e "${DATA}/${clean}" ] || { echo "FAIL: the clean session survived"; exit 1; }
          bash "{{.riotbox_dir}}/libexec/reset-session.sh" all force --pending-overlays
          [ ! -e "${DATA}/${dirty}" ] || { echo "FAIL: --pending-overlays did not include it"; exit 1; }
          echo "overlays_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "overlays_ok=true"

  - name: a session with a running container is skipped, even with --pending-overlays, and the rest are still reset
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          live="$(make_session live)"; idle="$(make_session idle)"
          mkdir -p "${STATE}/${live}/overlay/p/upper"
          echo edit >"${STATE}/${live}/overlay/p/upper/file.txt"
          install_engine_stub busy "${DATA}/${live}"
          out="$(bash "{{.riotbox_dir}}/libexec/reset-session.sh" all force --pending-overlays)"
          printf '%s\n' "${out}" | grep -qF "Skipped 1 session(s) with a running container" || { echo "FAIL: no skip notice"; printf '%s\n' "${out}"; exit 1; }
          [ -d "${DATA}/${live}" ] || { echo "FAIL: the live session was removed"; exit 1; }
          [ ! -e "${DATA}/${idle}" ] || { echo "FAIL: the idle session survived"; exit 1; }
          echo "busy_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "busy_ok=true"

  - name: when the engine cannot answer nothing is removed and the engine's message is shown once
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          a="$(make_session a)"; b="$(make_session b)"
          install_engine_stub down
          out="$(bash "{{.riotbox_dir}}/libexec/reset-session.sh" all force)"
          printf '%s\n' "${out}" | grep -qF "Skipped 2 session(s) because the container engine did not answer" || { echo "FAIL: no skip notice"; printf '%s\n' "${out}"; exit 1; }
          [ "$(printf '%s\n' "${out}" | grep -c 'could not ask')" -eq 1 ] || { echo "FAIL: the engine message was not shown exactly once"; printf '%s\n' "${out}"; exit 1; }
          printf '%s\n' "${out}" | grep -qF "No sessions match." || { echo "FAIL: no 'No sessions match.'"; exit 1; }
          [ -d "${DATA}/${a}" ] && [ -d "${DATA}/${b}" ] || { echo "FAIL: a session was removed while the engine was down"; exit 1; }
          echo "down_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "down_ok=true"

  - name: a filter that matches nothing says so and removes nothing
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          key="$(make_session fresh)"
          out="$(bash "{{.riotbox_dir}}/libexec/reset-session.sh" all force --older-than 30d)"
          printf '%s\n' "${out}" | grep -qF "No sessions match." || { echo "FAIL: no message"; printf '%s\n' "${out}"; exit 1; }
          [ -d "${DATA}/${key}" ] || { echo "FAIL: a session was removed"; exit 1; }
          echo "nomatch_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "nomatch_ok=true"

  - name: --older-than never selects a session whose tree it cannot fully read
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'chmod -R u+rwx "${T}" 2>/dev/null || true; rm -rf "${T}"' EXIT
          opaque="$(make_session opaque)"; plain="$(make_session plain)"
          mkdir "${STATE}/${opaque}/git-ai/locked"
          echo hidden >"${STATE}/${opaque}/git-ai/locked/f"
          age_session "${opaque}" 40
          age_session "${plain}" 40
          chmod 000 "${STATE}/${opaque}/git-ai/locked"
          bash "{{.riotbox_dir}}/libexec/reset-session.sh" all force --older-than 30d
          [ -d "${DATA}/${opaque}" ] || { echo "FAIL: a session with an unreadable subtree was removed"; exit 1; }
          [ ! -e "${DATA}/${plain}" ] || { echo "FAIL: the readable stale session survived"; exit 1; }
          echo "unreadable_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "unreadable_ok=true"

  - name: a session with no state dir is still selected by its age and removed cleanly
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          old="$(make_session old)"; fresh="$(make_session fresh)"
          rm -rf "${STATE}/${old}" "${STATE}/${fresh}"
          age_session "${old}" 40
          bash "{{.riotbox_dir}}/libexec/reset-session.sh" all force --older-than 30d
          [ ! -e "${DATA}/${old}" ] || { echo "FAIL: the stale session survived"; exit 1; }
          [ -d "${DATA}/${fresh}" ] || { echo "FAIL: the fresh session was removed"; exit 1; }
          echo "nostate_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "nostate_ok=true"

  - name: a symlinked session entry is unlinked and its target is never touched
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          mkdir -p "${T}/outside"
          echo precious >"${T}/outside/data"
          real="$(make_session real)"
          cp "${DATA}/${real}/.projects" "${T}/outside/.projects"
          ln -s "${T}/outside" "${DATA}/linked"
          out="$(bash "{{.riotbox_dir}}/libexec/reset-session.sh" all force --older-than 1d)"
          printf '%s\n' "${out}" | grep -qF "No sessions match." || { echo "FAIL: a fresh session or the link matched --older-than"; printf '%s\n' "${out}"; exit 1; }
          [ -d "${DATA}/${real}" ] && [ -L "${DATA}/linked" ] && [ "$(cat "${T}/outside/data")" = precious ] || { echo "FAIL: the filtered run touched something"; exit 1; }
          out="$(bash "{{.riotbox_dir}}/libexec/reset-session.sh" all force)"
          printf '%s\n' "${out}" | grep -qF "Removed 2 session(s)." || { echo "FAIL: wrong count"; printf '%s\n' "${out}"; exit 1; }
          [ ! -e "${DATA}/${real}" ] || { echo "FAIL: the real session survived"; exit 1; }
          [ ! -L "${DATA}/linked" ] && [ ! -e "${DATA}/linked" ] || { echo "FAIL: the link was not removed"; exit 1; }
          printf '%s\n' "${out}" | grep -qF "linked was a symlink to ${T}/outside; only the link was removed, its target was left in place." || { echo "FAIL: the link is reported as a plain session"; printf '%s\n' "${out}"; exit 1; }
          [ "$(cat "${T}/outside/data")" = precious ] && [ -f "${T}/outside/.projects" ] || { echo "FAIL: the link's target was touched"; exit 1; }
          echo "symlink_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "symlink_ok=true"

  # session-reset all deletes what overlay_state_pending calls "not pending",
  # so every way that function cannot tell must read as pending.
  - name: a dot-named overlay folder with changes makes the session pending
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          key="$(make_session dots)"
          mkdir -p "${STATE}/${key}/overlay/.dotfiles/upper" "${STATE}/${key}/overlay/.dotfiles/work"
          echo precious >"${STATE}/${key}/overlay/.dotfiles/upper/bashrc"
          out="$(bash "{{.riotbox_dir}}/libexec/reset-session.sh" all force)"
          printf '%s\n' "${out}" | grep -qF "Skipped 1 session(s) with pending overlay changes" || { echo "FAIL: no skip notice"; printf '%s\n' "${out}"; exit 1; }
          [ -f "${STATE}/${key}/overlay/.dotfiles/upper/bashrc" ] || { echo "FAIL: dot-named overlay changes were deleted"; exit 1; }
          echo "dotoverlay_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "dotoverlay_ok=true"

  - name: an overlay dir that cannot be listed makes the session pending
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
