  # The prompt can wait minutes. What was safe when the list was printed is
  # checked again for each session just before its rm -rf.
  - name: a container that starts while the prompt waits keeps its session from being removed
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          a="$(make_session a)"; b="$(make_session b)"
          # Two sessions are checked while the list is built (two ps calls);
          # from the third call on, a container mounts session a.
          cat >"${T}/engine" <<STUB
          #!/bin/sh
          case "\$1" in
          ps) n=\$(cat "${T}/calls" 2>/dev/null || echo 0); n=\$((n + 1)); echo "\${n}" >"${T}/calls"
              [ "\${n}" -le 2 ] || echo abc ;;
          container) printf 'abc\0web\0%s\0true\0\n' '${DATA}/${a}' ;;
          esac
          STUB
          sed -i 's/^          //' "${T}/engine"
          chmod +x "${T}/engine"; export CONTAINER_CMD="${T}/engine"
          out="$(echo y | bash "{{.riotbox_dir}}/libexec/reset-session.sh" all 2>&1)"
          [ -d "${DATA}/${a}" ] && [ -d "${STATE}/${a}" ] || { echo "FAIL: a session that became busy was removed"; printf '%s\n' "${out}"; exit 1; }
          [ ! -e "${DATA}/${b}" ] || { echo "FAIL: the idle session survived"; exit 1; }
          printf '%s\n' "${out}" | grep -qF "Removed 1 session(s)." || { echo "FAIL: wrong count"; printf '%s\n' "${out}"; exit 1; }
          printf '%s\n' "${out}" | grep -qF "Skipped 1 session(s) that became busy after the list was shown:" || { echo "FAIL: no late-skip notice"; printf '%s\n' "${out}"; exit 1; }
          echo "toctou_busy_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "toctou_busy_ok=true"

  - name: overlay changes that appear while the prompt waits keep their session from being removed
    steps:
      - type: exec
        script: |
          set -euo pipefail
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.riotbox_dir}}/tests/lib/session-commands-helpers.sh"
          setup_session_install
          trap 'rm -rf "${T}"' EXIT
          a="$(make_session a)"; b="$(make_session b)"
          # From the third engine call on (after the list), session a gains an overlay change.
          cat >"${T}/engine" <<STUB
          #!/bin/sh
          if [ "\$1" = ps ]; then
            n=\$(cat "${T}/calls" 2>/dev/null || echo 0); n=\$((n + 1)); echo "\${n}" >"${T}/calls"
            if [ "\${n}" -gt 2 ]; then
              mkdir -p "${STATE}/${a}/overlay/p/upper"; echo edit >"${STATE}/${a}/overlay/p/upper/f"
            fi
          fi
          exit 0
          STUB
          sed -i 's/^          //' "${T}/engine"
          chmod +x "${T}/engine"; export CONTAINER_CMD="${T}/engine"
          out="$(echo y | bash "{{.riotbox_dir}}/libexec/reset-session.sh" all 2>&1)"
          [ -f "${STATE}/${a}/overlay/p/upper/f" ] || { echo "FAIL: late overlay changes were deleted"; printf '%s\n' "${out}"; exit 1; }
          [ ! -e "${DATA}/${b}" ] || { echo "FAIL: the other session survived"; exit 1; }
          printf '%s\n' "${out}" | grep -qF "Skipped 1 session(s) that gained pending overlay changes after the list was shown:" || { echo "FAIL: no late-skip notice"; printf '%s\n' "${out}"; exit 1; }
          echo "toctou_overlay_ok=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "toctou_overlay_ok=true"

