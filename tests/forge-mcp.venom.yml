name: forge MCP wiring (GitHub + GitLab)
vars:
  root: "."
  riotbox_dir: "{{.root}}"

# The GitHub and GitLab MCP servers are wired on demand by the
# enable_github_mcp / enable_gitlab_mcp commands in the riotbox-gh-glab
# image, never at build or session start. These tests cover the agent
# verbs those commands dispatch to.
#
# The load-bearing property, asserted directly in "no credential value is
# ever written to disk": what lands in an agent config is a REFERENCE to an
# environment variable, never the token itself. The session directory is a
# host bind mount, so a token written there outlives the container.
#
# ── Where things are ────────────────────────────────────────────────────────
#
# The file is long. Every section below is introduced by a banner comment of
# the form `# ── <title> ──`, in this order:
#
#   the verbs, one agent at a time    what wire and strip write, preserve,
#                                     refuse and return, for both agents
#   whose entry is it                 the ownership rule, then a section per
#                                     forge, then the entry it cannot classify
#   wire input guards                 the token-variable and URL checks the
#                                     shipped commands cannot reach
#   the enable_* / disable_* commands the four real entry points, end to end
#   the dispatcher when an agent      forge_mcp_apply's skip, partial-failure
#     cannot deliver                  and no-support paths, via a stub agent

testcases:
  # ── the verbs, one agent at a time ────────────────────────────────────────
  #
  # What each verb writes and what it leaves alone, then every way it can give
  # up: a malformed config, a config directory it cannot write, and a document
  # that parses but cannot be indexed. The rule these share is that a give-up
  # path leaves the file byte-identical, and only a strip against an
  # unparseable config both warns and returns 0.
  - name: claude github wire writes a stdio entry naming the token variable
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          export CLAUDE_CONFIG_DIR="${TMP}/.claude"
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"

          agent_claude_github_mcp_wire GITHUB_TOKEN

          jq -r '
            .mcpServers.github
            | "type=" + .type
            + " command=" + .command
            + " args=" + (.args | join(","))
            + " token=" + .env.GITHUB_PERSONAL_ACCESS_TOKEN
          ' "${CLAUDE_CONFIG_DIR}/.claude.json"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "type=stdio"
          - result.systemout ShouldContainSubstring "command=github-mcp-server"
          - result.systemout ShouldContainSubstring "args=stdio"
          - result.systemout ShouldContainSubstring "token=${GITHUB_TOKEN}"

  - name: claude gitlab wire writes an http entry with a bearer header
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          export CLAUDE_CONFIG_DIR="${TMP}/.claude"
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"

          agent_claude_gitlab_mcp_wire "https://gitlab.example.com/api/v4/mcp" GITLAB_TOKEN

          jq -r '
            .mcpServers.gitlab
            | "type=" + .type
            + " url=" + .url
            + " auth=" + .headers.Authorization
          ' "${CLAUDE_CONFIG_DIR}/.claude.json"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "type=http"
          - result.systemout ShouldContainSubstring "url=https://gitlab.example.com/api/v4/mcp"
          - result.systemout ShouldContainSubstring "auth=Bearer ${GITLAB_TOKEN}"

  - name: claude wire preserves unrelated MCP servers and account metadata
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          export CLAUDE_CONFIG_DIR="${TMP}/.claude"
          mkdir -p "${CLAUDE_CONFIG_DIR}"
          cat >"${CLAUDE_CONFIG_DIR}/.claude.json" <<'JSON'
          {
            "someAccountKey": "keep-me",
            "mcpServers": {
              "codegraph": {"type": "stdio", "command": "codegraph", "args": ["mcp"]}
            }
          }
          JSON
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"

          agent_claude_github_mcp_wire GITHUB_TOKEN

          jq -r '
            "account=" + .someAccountKey
            + " codegraph=" + .mcpServers.codegraph.command
            + " github=" + .mcpServers.github.command
          ' "${CLAUDE_CONFIG_DIR}/.claude.json"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "account=keep-me"
          - result.systemout ShouldContainSubstring "codegraph=codegraph"
          - result.systemout ShouldContainSubstring "github=github-mcp-server"

  - name: claude wire is idempotent — a second identical call changes nothing
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          export CLAUDE_CONFIG_DIR="${TMP}/.claude"
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"

          agent_claude_github_mcp_wire GITHUB_TOKEN
          first="$(sha256sum "${CLAUDE_CONFIG_DIR}/.claude.json" | awk '{print $1}')"
          agent_claude_github_mcp_wire GITHUB_TOKEN
          second="$(sha256sum "${CLAUDE_CONFIG_DIR}/.claude.json" | awk '{print $1}')"

          if [ "${first}" = "${second}" ]; then
            echo "STABLE"
          else
            echo "CHANGED: ${first} -> ${second}" >&2
            exit 1
          fi
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "STABLE"

  - name: claude wire re-run with a different token variable updates the reference
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          export CLAUDE_CONFIG_DIR="${TMP}/.claude"
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"

          agent_claude_github_mcp_wire GITHUB_TOKEN
          agent_claude_github_mcp_wire GITHUB_PERSONAL_ACCESS_TOKEN

          jq -r '.mcpServers.github.env.GITHUB_PERSONAL_ACCESS_TOKEN' \
            "${CLAUDE_CONFIG_DIR}/.claude.json"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "${GITHUB_PERSONAL_ACCESS_TOKEN}"

  - name: claude strip removes only riotbox entries
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          export CLAUDE_CONFIG_DIR="${TMP}/.claude"
          mkdir -p "${CLAUDE_CONFIG_DIR}"
          cat >"${CLAUDE_CONFIG_DIR}/.claude.json" <<'JSON'
          {
            "mcpServers": {
              "codegraph": {"type": "stdio", "command": "codegraph", "args": ["mcp"]}
            }
          }
          JSON
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"

          agent_claude_github_mcp_wire GITHUB_TOKEN
          agent_claude_gitlab_mcp_wire "https://gitlab.com/api/v4/mcp" GITLAB_TOKEN
          agent_claude_github_mcp_strip
          agent_claude_gitlab_mcp_strip

          jq -r '"remaining=" + (.mcpServers | keys | join(","))' \
            "${CLAUDE_CONFIG_DIR}/.claude.json"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "remaining=codegraph"

  - name: claude strip on a config that never had the entry is a silent no-op
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          export CLAUDE_CONFIG_DIR="${TMP}/.claude"
          mkdir -p "${CLAUDE_CONFIG_DIR}"
          printf '{"mcpServers":{"codegraph":{"command":"codegraph"}}}\n' \
            >"${CLAUDE_CONFIG_DIR}/.claude.json"
          before="$(sha256sum "${CLAUDE_CONFIG_DIR}/.claude.json" | awk '{print $1}')"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"

          out="$(agent_claude_github_mcp_strip 2>&1)"
          after="$(sha256sum "${CLAUDE_CONFIG_DIR}/.claude.json" | awk '{print $1}')"

          if [ "${before}" != "${after}" ]; then
            echo "FAIL: file was rewritten" >&2
            exit 1
          fi
          if [ -n "${out}" ]; then
            echo "FAIL: expected silence, got: ${out}" >&2
            exit 1
          fi
          echo "SILENT_NOOP"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "SILENT_NOOP"

  - name: claude strip with no config file at all returns 0 and creates nothing
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          export CLAUDE_CONFIG_DIR="${TMP}/.claude"
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"

          agent_claude_gitlab_mcp_strip
          if [ -e "${CLAUDE_CONFIG_DIR}/.claude.json" ]; then
            echo "FAIL: strip created a config file" >&2
            exit 1
          fi
          echo "NOTHING_CREATED"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "NOTHING_CREATED"

  - name: opencode github wire writes a local server naming the token variable
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          export OPENCODE_CONFIG_DIR="${TMP}/opencode"
          mkdir -p "${OPENCODE_CONFIG_DIR}"
          printf '// generated banner line\n{"share":"disabled"}\n' \
            >"${OPENCODE_CONFIG_DIR}/opencode.jsonc"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/opencode/forge-mcp.sh"

          agent_opencode_github_mcp_wire GITHUB_TOKEN

          grep -v '^//' "${OPENCODE_CONFIG_DIR}/opencode.jsonc" | jq -r '
            .mcp.github
            | "type=" + .type
            + " command=" + (.command | join(","))
            + " enabled=" + (.enabled | tostring)
            + " token=" + .environment.GITHUB_PERSONAL_ACCESS_TOKEN
          '
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "type=local"
          - result.systemout ShouldContainSubstring "command=github-mcp-server,stdio"
          - result.systemout ShouldContainSubstring "enabled=true"
          - result.systemout ShouldContainSubstring "token={env:GITHUB_TOKEN}"

  - name: opencode gitlab wire writes a remote server with a bearer header
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          export OPENCODE_CONFIG_DIR="${TMP}/opencode"
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/opencode/forge-mcp.sh"

          agent_opencode_gitlab_mcp_wire "https://gitlab.example.com/api/v4/mcp" GITLAB_TOKEN

          grep -v '^//' "${OPENCODE_CONFIG_DIR}/opencode.jsonc" | jq -r '
            .mcp.gitlab
            | "type=" + .type
            + " url=" + .url
            + " auth=" + .headers.Authorization
          '
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "type=remote"
          - result.systemout ShouldContainSubstring "url=https://gitlab.example.com/api/v4/mcp"
          - result.systemout ShouldContainSubstring "auth=Bearer {env:GITLAB_TOKEN}"

  # headroom-exec.sh splits this file into banner and body with line-level
  # grep, and opencode_setup regenerates it from a banner template. A writer
  # that dropped the banner would break the first and silently disagree with
  # the second.
  - name: opencode wire preserves the generated banner and unrelated config keys
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          export OPENCODE_CONFIG_DIR="${TMP}/opencode"
          mkdir -p "${OPENCODE_CONFIG_DIR}"
          cat >"${OPENCODE_CONFIG_DIR}/opencode.jsonc" <<'JSONC'
          // This file is generated by riotbox at session start.
          // Edit your host opencode.json/opencode.jsonc to change anything else.
          {"permission":"allow","share":"disabled","mcp":{"other":{"type":"local","command":["x"]}}}
          JSONC

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/opencode/forge-mcp.sh"

          agent_opencode_github_mcp_wire GITHUB_TOKEN

          echo "banner=$(grep -c '^//' "${OPENCODE_CONFIG_DIR}/opencode.jsonc")"
          head -n 1 "${OPENCODE_CONFIG_DIR}/opencode.jsonc"
          grep -v '^//' "${OPENCODE_CONFIG_DIR}/opencode.jsonc" | jq -r '
            "permission=" + .permission
            + " other=" + (.mcp.other.command | join(","))
            + " github=" + (.mcp.github.command | join(","))
          '
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "banner=2"
          - result.systemout ShouldContainSubstring "// This file is generated by riotbox at session start."
          - result.systemout ShouldContainSubstring "permission=allow"
          - result.systemout ShouldContainSubstring "other=x"
          - result.systemout ShouldContainSubstring "github=github-mcp-server,stdio"

  - name: opencode strip removes only riotbox entries and keeps the banner
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          export OPENCODE_CONFIG_DIR="${TMP}/opencode"
          mkdir -p "${OPENCODE_CONFIG_DIR}"
          cat >"${OPENCODE_CONFIG_DIR}/opencode.jsonc" <<'JSONC'
          // generated banner line
          {"mcp":{"other":{"type":"local","command":["x"]}}}
          JSONC

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/opencode/forge-mcp.sh"

          agent_opencode_github_mcp_wire GITHUB_TOKEN
          agent_opencode_gitlab_mcp_wire "https://gitlab.com/api/v4/mcp" GITLAB_TOKEN
          agent_opencode_github_mcp_strip
          agent_opencode_gitlab_mcp_strip

          echo "banner=$(grep -c '^//' "${OPENCODE_CONFIG_DIR}/opencode.jsonc")"
          grep -v '^//' "${OPENCODE_CONFIG_DIR}/opencode.jsonc" | jq -r \
            '"remaining=" + (.mcp | keys | join(","))'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "banner=1"
          - result.systemout ShouldContainSubstring "remaining=other"

  - name: opencode strip on a config that never had the entry is a silent no-op
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          export OPENCODE_CONFIG_DIR="${TMP}/opencode"
          mkdir -p "${OPENCODE_CONFIG_DIR}"
          printf '// banner\n{"share":"disabled"}\n' \
            >"${OPENCODE_CONFIG_DIR}/opencode.jsonc"
          before="$(sha256sum "${OPENCODE_CONFIG_DIR}/opencode.jsonc" | awk '{print $1}')"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/opencode/forge-mcp.sh"

          out="$(agent_opencode_gitlab_mcp_strip 2>&1)"
          after="$(sha256sum "${OPENCODE_CONFIG_DIR}/opencode.jsonc" | awk '{print $1}')"

          if [ "${before}" != "${after}" ]; then
            echo "FAIL: file was rewritten" >&2
            exit 1
          fi
          if [ -n "${out}" ]; then
            echo "FAIL: expected silence, got: ${out}" >&2
            exit 1
          fi
          echo "SILENT_NOOP"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "SILENT_NOOP"

  - name: opencode wire refuses a malformed body and leaves the file byte-identical
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          export OPENCODE_CONFIG_DIR="${TMP}/opencode"
          mkdir -p "${OPENCODE_CONFIG_DIR}"
          printf '// banner\n{ not json at all\n' \
            >"${OPENCODE_CONFIG_DIR}/opencode.jsonc"
          before="$(sha256sum "${OPENCODE_CONFIG_DIR}/opencode.jsonc" | awk '{print $1}')"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/opencode/forge-mcp.sh"

          rc=0
          agent_opencode_github_mcp_wire GITHUB_TOKEN 2>/dev/null || rc=$?
          after="$(sha256sum "${OPENCODE_CONFIG_DIR}/opencode.jsonc" | awk '{print $1}')"

          if [ "${rc}" -eq 0 ]; then
            echo "FAIL: wire returned 0 on a malformed body" >&2
            exit 1
          fi
          if [ "${before}" != "${after}" ]; then
            echo "FAIL: malformed config was overwritten" >&2
            exit 1
          fi
          echo "REFUSED_AND_UNCHANGED"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "REFUSED_AND_UNCHANGED"

  # A strip that could not write must not be reported as a success: the caller
  # prints "<forge> MCP cleanup complete" on a 0 return, and the user asked to
  # revoke the agent's forge access. Making the config file's DIRECTORY
  # read-only is what fails json_write_atomic — it stages a temp file beside
  # the target, so the directory is the write it needs.
  - name: claude strip returns non-zero when the config cannot be written
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          # The mode has to come back before rm -rf can clear the tree. Single
          # quotes, so this reads the exports below at EXIT rather than now.
          trap 'chmod u+w "${CLAUDE_CONFIG_DIR}" 2>/dev/null || true; rm -rf "${TMP}"' EXIT
          export HOME="${TMP}"
          export CLAUDE_CONFIG_DIR="${TMP}/.claude"
          export OPENCODE_CONFIG_DIR="${TMP}/opencode"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"

          agent_claude_github_mcp_wire GITHUB_TOKEN
          chmod a-w "${CLAUDE_CONFIG_DIR}"
          # touch, not `: >`: a redirection failure on a special builtin would
          # abort this script instead of taking the branch below.
          if touch "${CLAUDE_CONFIG_DIR}/probe" 2>/dev/null; then
            echo "FAIL: the config directory is still writable, this proves nothing" >&2
            exit 1
          fi

          # Without this, a renamed verb would return 127 and read as a pass.
          if ! declare -F agent_claude_github_mcp_strip >/dev/null; then
            echo "FAIL: agent_claude_github_mcp_strip is not defined" >&2
            exit 1
          fi
          rc=0
          err="$(agent_claude_github_mcp_strip 2>&1 >/dev/null)" || rc=$?

          if [ "${rc}" -eq 0 ]; then
            echo "FAIL: strip returned 0 after the write failed" >&2
            exit 1
          fi
          case "${err}" in
          *"could not write"*) : ;;
          *)
            echo "FAIL: expected a write warning, got: ${err}" >&2
            exit 1
            ;;
          esac
          if ! jq -e '.mcpServers | has("github")' \
            "${CLAUDE_CONFIG_DIR}/.claude.json" >/dev/null; then
            echo "FAIL: the github entry is gone — the write did not fail" >&2
            exit 1
          fi
          echo "FAILED_LOUDLY_ENTRY_KEPT"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "FAILED_LOUDLY_ENTRY_KEPT"

  # The deliberate asymmetry with the wire verbs: an unparseable config is not
  # loaded by the agent either, and the disable commands are how a user gets
  # out of that state, so strip warns and still reports success.
  - name: claude strip warns and returns 0 on a malformed config
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          export HOME="${TMP}"
          export CLAUDE_CONFIG_DIR="${TMP}/.claude"
          export OPENCODE_CONFIG_DIR="${TMP}/opencode"
          mkdir -p "${CLAUDE_CONFIG_DIR}"
          printf '{ this is not json' >"${CLAUDE_CONFIG_DIR}/.claude.json"
          before="$(sha256sum "${CLAUDE_CONFIG_DIR}/.claude.json" | awk '{print $1}')"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"

          if ! declare -F agent_claude_github_mcp_strip >/dev/null; then
            echo "FAIL: agent_claude_github_mcp_strip is not defined" >&2
            exit 1
          fi
          rc=0
          err="$(agent_claude_github_mcp_strip 2>&1 >/dev/null)" || rc=$?
          after="$(sha256sum "${CLAUDE_CONFIG_DIR}/.claude.json" | awk '{print $1}')"

          if [ "${rc}" -ne 0 ]; then
            echo "FAIL: strip returned ${rc} on a malformed config" >&2
            exit 1
          fi
          case "${err}" in
          *"is not valid JSON"*) : ;;
          *)
            echo "FAIL: expected a parse warning, got: ${err}" >&2
            exit 1
            ;;
          esac
          if [ "${before}" != "${after}" ]; then
            echo "FAIL: malformed config was rewritten" >&2
            exit 1
          fi
          echo "WARNED_AND_UNCHANGED"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "WARNED_AND_UNCHANGED"

  # A document that parses but is not an object reaches the branch between the
  # two above: jq cannot index an array with .mcpServers, so the entry can be
  # neither found nor deleted. Same consequence as a failed write — the entry
  # is still registered — so the same non-zero return.
  - name: claude strip returns non-zero when the entry cannot be edited out
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          export HOME="${TMP}"
          export CLAUDE_CONFIG_DIR="${TMP}/.claude"
          export OPENCODE_CONFIG_DIR="${TMP}/opencode"
          mkdir -p "${CLAUDE_CONFIG_DIR}"
          printf '[1, 2, 3]\n' >"${CLAUDE_CONFIG_DIR}/.claude.json"
          before="$(sha256sum "${CLAUDE_CONFIG_DIR}/.claude.json" | awk '{print $1}')"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"

          if ! declare -F agent_claude_github_mcp_strip >/dev/null; then
            echo "FAIL: agent_claude_github_mcp_strip is not defined" >&2
            exit 1
          fi
          rc=0
          err="$(agent_claude_github_mcp_strip 2>&1 >/dev/null)" || rc=$?
          after="$(sha256sum "${CLAUDE_CONFIG_DIR}/.claude.json" | awk '{print $1}')"

          if [ "${rc}" -eq 0 ]; then
            echo "FAIL: strip returned 0 after the edit failed" >&2
            exit 1
          fi
          # Names the branch: the parse succeeded, the edit is what gave up.
          case "${err}" in
          *"could not clean"*) : ;;
          *)
            echo "FAIL: expected an edit warning, got: ${err}" >&2
            exit 1
            ;;
          esac
          if [ "${before}" != "${after}" ]; then
            echo "FAIL: the config was rewritten" >&2
            exit 1
          fi
          echo "FAILED_LOUDLY_CONFIG_UNCHANGED"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "FAILED_LOUDLY_CONFIG_UNCHANGED"

  # Same mechanism, probe and declare -F guard as the claude twin above, which
  # is where they are explained.
  - name: opencode strip returns non-zero when the config cannot be written
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'chmod u+w "${OPENCODE_CONFIG_DIR}" 2>/dev/null || true; rm -rf "${TMP}"' EXIT
          export HOME="${TMP}"
