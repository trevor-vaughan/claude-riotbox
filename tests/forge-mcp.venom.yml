name: forge MCP cleanup (GitHub + GitLab entries earlier images wired)
vars:
  root: "."
  riotbox_dir: "{{.root}}"

# Images up to 0.6.1 shipped enable_github_mcp / enable_gitlab_mcp, which
# registered a server in ${CLAUDE_CONFIG_DIR}/.claude.json. Issue #19 removed
# them. That file is in the host-mounted session directory, so the entries
# outlive the image; claude_strip_forge_mcp_entries takes back exactly what
# riotbox wrote — decided on the entry's shape, never on the key name — at
# every session start.
#
# Every case sources scripts/lib/json-write.sh first (and the container_setup
# cases scripts/lib/egress-prompt.sh), the way entrypoint.sh does before the
# agent setup loop.

testcases:
  - name: strip removes the GitHub entry riotbox wrote
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          mkdir -p "${CLAUDE_CONFIG_DIR}"
          cat > "${CLAUDE_CONFIG_DIR}/.claude.json" <<'JSON'
          {"mcpServers":{"github":{"type":"stdio","command":"github-mcp-server","args":["stdio"],"env":{"GITHUB_PERSONAL_ACCESS_TOKEN":"${GITHUB_TOKEN}"}}}}
          JSON

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"
          declare -F claude_strip_forge_mcp_entries >/dev/null \
            || { echo "FAIL: claude_strip_forge_mcp_entries is not defined"; exit 1; }
          claude_strip_forge_mcp_entries 2>"${TEST_DIR}/stderr"

          jq -e '.mcpServers == {}' "${CLAUDE_CONFIG_DIR}/.claude.json" >/dev/null \
            || { echo "FAIL: mcpServers is not exactly {}"; exit 1; }
          grep -q 'Removed' "${TEST_DIR}/stderr" \
            || { echo "FAIL: removal not reported"; exit 1; }
          echo "strip_github=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "strip_github=pass"

  - name: strip removes the GitLab entry riotbox wrote
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          mkdir -p "${CLAUDE_CONFIG_DIR}"
          cat > "${CLAUDE_CONFIG_DIR}/.claude.json" <<'JSON'
          {"mcpServers":{"gitlab":{"type":"http","url":"https://gitlab.example.com/api/v4/mcp","headers":{"Authorization":"Bearer ${GITLAB_TOKEN}"}}}}
          JSON

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"
          declare -F claude_strip_forge_mcp_entries >/dev/null \
            || { echo "FAIL: claude_strip_forge_mcp_entries is not defined"; exit 1; }
          claude_strip_forge_mcp_entries 2>"${TEST_DIR}/stderr"

          jq -e '.mcpServers == {}' "${CLAUDE_CONFIG_DIR}/.claude.json" >/dev/null \
            || { echo "FAIL: mcpServers is not exactly {}"; exit 1; }
          grep -q 'Removed' "${TEST_DIR}/stderr" \
            || { echo "FAIL: removal not reported"; exit 1; }
          echo "strip_gitlab=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "strip_gitlab=pass"

  - name: strip removes both and preserves siblings and unrelated keys
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          mkdir -p "${CLAUDE_CONFIG_DIR}"
          cat > "${CLAUDE_CONFIG_DIR}/.claude.json" <<'JSON'
          {"oauthAccount":{"emailAddress":"u@invalid"},"mcpServers":{"github":{"type":"stdio","command":"github-mcp-server","args":["stdio"],"env":{"GITHUB_PERSONAL_ACCESS_TOKEN":"${GITHUB_TOKEN}"}},"gitlab":{"type":"http","url":"https://gitlab.example.com/api/v4/mcp","headers":{"Authorization":"Bearer ${GITLAB_TOKEN}"}},"context-mode":{"type":"stdio","command":"context-mode","args":[]}}}
          JSON

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"
          declare -F claude_strip_forge_mcp_entries >/dev/null \
            || { echo "FAIL: claude_strip_forge_mcp_entries is not defined"; exit 1; }
          claude_strip_forge_mcp_entries 2>"${TEST_DIR}/stderr"

          jq -e '.mcpServers | keys == ["context-mode"]' "${CLAUDE_CONFIG_DIR}/.claude.json" >/dev/null \
            || { echo "FAIL: mcpServers is not exactly the sibling"; exit 1; }
          jq -e '.oauthAccount.emailAddress == "u@invalid"' "${CLAUDE_CONFIG_DIR}/.claude.json" >/dev/null \
            || { echo "FAIL: unrelated key lost"; exit 1; }
          echo "strip_both=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "strip_both=pass"

  - name: strip leaves a user-narrowed GitHub entry alone
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          mkdir -p "${CLAUDE_CONFIG_DIR}"
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"
          declare -F claude_strip_forge_mcp_entries >/dev/null \
            || { echo "FAIL: claude_strip_forge_mcp_entries is not defined"; exit 1; }

          # Each variant differs from what riotbox wrote by one field the user chose.
          while IFS=$'\t' read -r label config; do
            printf '%s\n' "${config}" > "${CLAUDE_CONFIG_DIR}/.claude.json"
            cp "${CLAUDE_CONFIG_DIR}/.claude.json" "${TEST_DIR}/before"
            claude_strip_forge_mcp_entries 2>"${TEST_DIR}/stderr"
            cmp -s "${TEST_DIR}/before" "${CLAUDE_CONFIG_DIR}/.claude.json" \
              || { echo "FAIL: ${label}: file changed"; exit 1; }
            grep -q 'Removed' "${TEST_DIR}/stderr" \
              && { echo "FAIL: ${label}: announced a removal"; exit 1; }
          done <<'VARIANTS'
          read-only args	{"mcpServers":{"github":{"type":"stdio","command":"github-mcp-server","args":["stdio","--read-only"],"env":{"GITHUB_PERSONAL_ACCESS_TOKEN":"${GITHUB_TOKEN}"}}}}
          extra toolsets env	{"mcpServers":{"github":{"type":"stdio","command":"github-mcp-server","args":["stdio"],"env":{"GITHUB_PERSONAL_ACCESS_TOKEN":"${GITHUB_TOKEN}","GITHUB_TOOLSETS":"repos"}}}}
          literal token	{"mcpServers":{"github":{"type":"stdio","command":"github-mcp-server","args":["stdio"],"env":{"GITHUB_PERSONAL_ACCESS_TOKEN":"ghp_literal"}}}}
          VARIANTS
          echo "strip_github_foreign=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "strip_github_foreign=pass"

  - name: strip leaves a user-configured GitLab entry alone
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          mkdir -p "${CLAUDE_CONFIG_DIR}"
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"
          declare -F claude_strip_forge_mcp_entries >/dev/null \
            || { echo "FAIL: claude_strip_forge_mcp_entries is not defined"; exit 1; }

          # Each variant differs from what riotbox wrote by one field the user chose.
          while IFS=$'\t' read -r label config; do
            printf '%s\n' "${config}" > "${CLAUDE_CONFIG_DIR}/.claude.json"
            cp "${CLAUDE_CONFIG_DIR}/.claude.json" "${TEST_DIR}/before"
            claude_strip_forge_mcp_entries 2>"${TEST_DIR}/stderr"
            cmp -s "${TEST_DIR}/before" "${CLAUDE_CONFIG_DIR}/.claude.json" \
              || { echo "FAIL: ${label}: file changed"; exit 1; }
            grep -q 'Removed' "${TEST_DIR}/stderr" \
              && { echo "FAIL: ${label}: announced a removal"; exit 1; }
          done <<'VARIANTS'
          other path	{"mcpServers":{"gitlab":{"type":"http","url":"https://gitlab.example.com/api/v4/other","headers":{"Authorization":"Bearer ${GITLAB_TOKEN}"}}}}
          extra header	{"mcpServers":{"gitlab":{"type":"http","url":"https://gitlab.example.com/api/v4/mcp","headers":{"Authorization":"Bearer ${GITLAB_TOKEN}","X-Extra":"1"}}}}
          literal token	{"mcpServers":{"gitlab":{"type":"http","url":"https://gitlab.example.com/api/v4/mcp","headers":{"Authorization":"Bearer glpat-literal"}}}}
          VARIANTS
          echo "strip_gitlab_foreign=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "strip_gitlab_foreign=pass"

  - name: strip is a silent no-op when there is nothing to remove
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          mkdir -p "${CLAUDE_CONFIG_DIR}"
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"
          declare -F claude_strip_forge_mcp_entries >/dev/null \
            || { echo "FAIL: claude_strip_forge_mcp_entries is not defined"; exit 1; }

          # (a) No file at all.
          claude_strip_forge_mcp_entries 2>"${TEST_DIR}/stderr"
          [ ! -e "${CLAUDE_CONFIG_DIR}/.claude.json" ] \
            || { echo "FAIL: created a config that was not there"; exit 1; }
          [ ! -s "${TEST_DIR}/stderr" ] \
            || { echo "FAIL: (a) not silent"; exit 1; }

          # (b) and (c) Compact documents: a rewrite would reflow them, so byte-identical
          # proves nothing was written.
          for config in '{"mcpServers":{"other":{"type":"stdio","command":"x"}}}' '{"numStartups":3}'; do
            printf '%s' "${config}" > "${CLAUDE_CONFIG_DIR}/.claude.json"
            cp "${CLAUDE_CONFIG_DIR}/.claude.json" "${TEST_DIR}/before"
            claude_strip_forge_mcp_entries 2>"${TEST_DIR}/stderr"
            cmp -s "${TEST_DIR}/before" "${CLAUDE_CONFIG_DIR}/.claude.json" \
              || { echo "FAIL: ${config}: file changed"; exit 1; }
            [ ! -s "${TEST_DIR}/stderr" ] \
              || { echo "FAIL: ${config}: not silent"; exit 1; }
          done
          echo "strip_noop=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "strip_noop=pass"

  - name: strip warns and changes nothing when .claude.json is malformed
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          mkdir -p "${CLAUDE_CONFIG_DIR}"
          printf '%s' '{"mcpServers":' > "${CLAUDE_CONFIG_DIR}/.claude.json"
          cp "${CLAUDE_CONFIG_DIR}/.claude.json" "${TEST_DIR}/before"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"
          declare -F claude_strip_forge_mcp_entries >/dev/null \
            || { echo "FAIL: claude_strip_forge_mcp_entries is not defined"; exit 1; }
          claude_strip_forge_mcp_entries 2>"${TEST_DIR}/stderr"
          grep -q 'not valid JSON' "${TEST_DIR}/stderr" \
            || { echo "FAIL: stderr lacks not valid JSON"; exit 1; }
          cmp -s "${TEST_DIR}/before" "${CLAUDE_CONFIG_DIR}/.claude.json" \
            || { echo "FAIL: file changed"; exit 1; }
          echo "strip_malformed=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "strip_malformed=pass"

  - name: strip warns and changes nothing when .claude.json is empty
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          mkdir -p "${CLAUDE_CONFIG_DIR}"
          printf '%s' '' > "${CLAUDE_CONFIG_DIR}/.claude.json"
          cp "${CLAUDE_CONFIG_DIR}/.claude.json" "${TEST_DIR}/before"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"
          declare -F claude_strip_forge_mcp_entries >/dev/null \
            || { echo "FAIL: claude_strip_forge_mcp_entries is not defined"; exit 1; }
          claude_strip_forge_mcp_entries 2>"${TEST_DIR}/stderr"
          grep -q 'not valid JSON' "${TEST_DIR}/stderr" \
            || { echo "FAIL: stderr lacks not valid JSON"; exit 1; }
          grep -qF "${CLAUDE_CONFIG_DIR}/.claude.json" "${TEST_DIR}/stderr" \
            || { echo "FAIL: stderr lacks the config path"; exit 1; }
          cmp -s "${TEST_DIR}/before" "${CLAUDE_CONFIG_DIR}/.claude.json" \
            || { echo "FAIL: file changed"; exit 1; }
          leftovers="$(find "${CLAUDE_CONFIG_DIR}" -maxdepth 1 -name '.claude.json.*')"
          [ -z "${leftovers}" ] \
            || { echo "FAIL: temp file left behind: ${leftovers}"; exit 1; }
          echo "strip_empty=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "strip_empty=pass"

  - name: strip warns and changes nothing when the root is not an object
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          mkdir -p "${CLAUDE_CONFIG_DIR}"
          printf '%s' '[1,2]' > "${CLAUDE_CONFIG_DIR}/.claude.json"
          cp "${CLAUDE_CONFIG_DIR}/.claude.json" "${TEST_DIR}/before"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"
          declare -F claude_strip_forge_mcp_entries >/dev/null \
            || { echo "FAIL: claude_strip_forge_mcp_entries is not defined"; exit 1; }
          claude_strip_forge_mcp_entries 2>"${TEST_DIR}/stderr"
          grep -q 'could not clean' "${TEST_DIR}/stderr" \
            || { echo "FAIL: stderr lacks could not clean"; exit 1; }
          cmp -s "${TEST_DIR}/before" "${CLAUDE_CONFIG_DIR}/.claude.json" \
            || { echo "FAIL: file changed"; exit 1; }
          echo "strip_nonobject=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "strip_nonobject=pass"

  - name: strip warns and cleans up when .claude.json cannot be written
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          mkdir -p "${CLAUDE_CONFIG_DIR}"
          cat > "${CLAUDE_CONFIG_DIR}/.claude.json" <<'JSON'
          {"mcpServers":{"github":{"type":"stdio","command":"github-mcp-server","args":["stdio"],"env":{"GITHUB_PERSONAL_ACCESS_TOKEN":"${GITHUB_TOKEN}"}}}}
          JSON
          trap 'chmod u+w "${CLAUDE_CONFIG_DIR}" 2>/dev/null; rm -rf "${TEST_DIR}"' EXIT
          chmod a-w "${CLAUDE_CONFIG_DIR}"

          # Root ignores the mode bits, so the unwritable case cannot be staged.
          # Probe with `touch`, not `: >`: a redirection failure on a POSIX special
          # builtin terminates a non-interactive shell outright.
          if touch "${CLAUDE_CONFIG_DIR}/.probe" 2>/dev/null; then
            rm -f "${CLAUDE_CONFIG_DIR}/.probe"
            echo "SKIP: running with write override (root?) — cannot stage an unwritable dir"
            echo "strip_unwritable=pass"
            exit 0
          fi

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"
          declare -F claude_strip_forge_mcp_entries >/dev/null \
            || { echo "FAIL: claude_strip_forge_mcp_entries is not defined"; exit 1; }
          claude_strip_forge_mcp_entries 2>"${TEST_DIR}/stderr"

          grep -q 'could not write' "${TEST_DIR}/stderr" \
            || { echo "FAIL: write failure was silent"; exit 1; }
          # A failed write must not be reported as a removal: the entry is still there.
          grep -q 'Removed' "${TEST_DIR}/stderr" \
            && { echo "FAIL: announced a removal that did not happen"; exit 1; }
          chmod u+w "${CLAUDE_CONFIG_DIR}"
          leftovers="$(find "${CLAUDE_CONFIG_DIR}" -maxdepth 1 -name '.claude.json.*')"
          [ -z "${leftovers}" ] \
            || { echo "FAIL: temp file left behind: ${leftovers}"; exit 1; }
          echo "strip_unwritable=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "strip_unwritable=pass"

  - name: container_setup strips a stale entry
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          mkdir -p "${CLAUDE_CONFIG_DIR}"
          export RIOTBOX_MANAGED_POLICY_DIR="${TEST_DIR}/policy"
          mkdir -p "${RIOTBOX_MANAGED_POLICY_DIR}"
          printf 'x\n' > "${RIOTBOX_MANAGED_POLICY_DIR}/CLAUDE.md"
          unset RIOTBOX_PROMPT
          cat > "${CLAUDE_CONFIG_DIR}/.claude.json" <<'JSON'
          {"mcpServers":{"gitlab":{"type":"http","url":"https://gitlab.example.com/api/v4/mcp","headers":{"Authorization":"Bearer ${GITLAB_TOKEN}"}}}}
          JSON

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/scripts/lib/egress-prompt.sh"
          source "{{.riotbox_dir}}/agents/claude/manifest.sh"
          declare -F agent_claude_container_setup >/dev/null \
            || { echo "FAIL: agent_claude_container_setup is not defined"; exit 1; }
          agent_claude_container_setup 2>"${TEST_DIR}/stderr"

          jq -e '.mcpServers == {}' "${CLAUDE_CONFIG_DIR}/.claude.json" >/dev/null \
            || { echo "FAIL: stale entry survived container_setup"; exit 1; }
          [ "$(cat "${RIOTBOX_MANAGED_POLICY_DIR}/CLAUDE.md")" = "x" ] \
            || { echo "FAIL: policy file was rewritten"; exit 1; }
          echo "container_setup_strip=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "container_setup_strip=pass"

  - name: strip removes an entry that names a different token variable
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          mkdir -p "${CLAUDE_CONFIG_DIR}"
          cat > "${CLAUDE_CONFIG_DIR}/.claude.json" <<'JSON'
          {"mcpServers":{"github":{"type":"stdio","command":"github-mcp-server","args":["stdio"],"env":{"GITHUB_PERSONAL_ACCESS_TOKEN":"${GH_TOKEN}"}}}}
          JSON

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"
          declare -F claude_strip_forge_mcp_entries >/dev/null \
            || { echo "FAIL: claude_strip_forge_mcp_entries is not defined"; exit 1; }
          claude_strip_forge_mcp_entries 2>"${TEST_DIR}/stderr"

          jq -e '.mcpServers == {}' "${CLAUDE_CONFIG_DIR}/.claude.json" >/dev/null \
            || { echo "FAIL: ${GH_TOKEN} entry survived"; exit 1; }
          echo "strip_other_var=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "strip_other_var=pass"

  - name: strip ignores non-object entries under the keys
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          mkdir -p "${CLAUDE_CONFIG_DIR}"
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"
          declare -F claude_strip_forge_mcp_entries >/dev/null \
            || { echo "FAIL: claude_strip_forge_mcp_entries is not defined"; exit 1; }

          while IFS= read -r config; do
            printf '%s\n' "${config}" > "${CLAUDE_CONFIG_DIR}/.claude.json"
            cp "${CLAUDE_CONFIG_DIR}/.claude.json" "${TEST_DIR}/before"
            claude_strip_forge_mcp_entries 2>"${TEST_DIR}/stderr"
            cmp -s "${TEST_DIR}/before" "${CLAUDE_CONFIG_DIR}/.claude.json" \
              || { echo "FAIL: ${config}: file changed"; exit 1; }
            [ ! -s "${TEST_DIR}/stderr" ] \
              || { echo "FAIL: ${config}: not silent"; exit 1; }
          done <<'VARIANTS'
          {"mcpServers":{"github":"s","gitlab":null}}
          VARIANTS
          echo "strip_nonobject_entry=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "strip_nonobject_entry=pass"

  - name: strip ignores mcpServers that is not an object
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          mkdir -p "${CLAUDE_CONFIG_DIR}"
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"
          declare -F claude_strip_forge_mcp_entries >/dev/null \
            || { echo "FAIL: claude_strip_forge_mcp_entries is not defined"; exit 1; }

          while IFS= read -r config; do
            printf '%s\n' "${config}" > "${CLAUDE_CONFIG_DIR}/.claude.json"
            cp "${CLAUDE_CONFIG_DIR}/.claude.json" "${TEST_DIR}/before"
            claude_strip_forge_mcp_entries 2>"${TEST_DIR}/stderr"
            cmp -s "${TEST_DIR}/before" "${CLAUDE_CONFIG_DIR}/.claude.json" \
              || { echo "FAIL: ${config}: file changed"; exit 1; }
            [ ! -s "${TEST_DIR}/stderr" ] \
              || { echo "FAIL: ${config}: not silent"; exit 1; }
          done <<'VARIANTS'
          {"mcpServers":[1,2]}
          {"mcpServers":"x"}
          {"mcpServers":null}
          VARIANTS
          echo "strip_nonobject_servers=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "strip_nonobject_servers=pass"

  - name: strip leaves a token reference with a trailing newline alone
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          mkdir -p "${CLAUDE_CONFIG_DIR}"
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"
          declare -F claude_strip_forge_mcp_entries >/dev/null \
            || { echo "FAIL: claude_strip_forge_mcp_entries is not defined"; exit 1; }

          # jq's `$` matches before a final newline; the predicates anchor with \z.
          # Built with jq so the JSON escape is right.
          for server in github gitlab; do
            jq -nc --arg server "${server}" '
              {mcpServers: {($server): (
                if $server == "github"
                then {type:"stdio",command:"github-mcp-server",args:["stdio"],env:{GITHUB_PERSONAL_ACCESS_TOKEN:"${A}\n"}}
                else {type:"http",url:"https://gitlab.example.com/api/v4/mcp",headers:{Authorization:"Bearer ${A}\n"}}
