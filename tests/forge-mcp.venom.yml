          JSON
          trap 'chmod u+w "${OPENCODE_CONFIG_DIR}" 2>/dev/null; rm -rf "${TEST_DIR}"' EXIT
          chmod a-w "${OPENCODE_CONFIG_DIR}"

          # Root ignores the mode bits; probe with `touch`, not `: >` (a failed
          # redirection on a special builtin kills a non-interactive shell).
          if touch "${OPENCODE_CONFIG_DIR}/.probe" 2>/dev/null; then
            rm -f "${OPENCODE_CONFIG_DIR}/.probe"
            echo "SKIP: running with write override (root?) — cannot stage an unwritable dir"
