                "args": ["stdio", "--read-only"],
                "env": {"GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"}
              }
            }
          }
          JSON
          before="$(sha256sum "${CLAUDE_CONFIG_DIR}/.claude.json" | awk '{print $1}')"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"

          if ! declare -F agent_claude_github_mcp_strip >/dev/null; then
            echo "FAIL: agent_claude_github_mcp_strip is not defined" >&2
            exit 1
          fi
          rc=0
          err="$(agent_claude_github_mcp_strip 2>&1 >/dev/null)" || rc=$?
          after="$(sha256sum "${CLAUDE_CONFIG_DIR}/.claude.json" | awk '{print $1}')"

          # The user's config is exactly what they asked for, so this is a
          # success, not a give-up path.
          if [ "${rc}" -ne 0 ]; then
            echo "FAIL: strip returned ${rc} on someone else's entry" >&2
            exit 1
          fi
          case "${err}" in
