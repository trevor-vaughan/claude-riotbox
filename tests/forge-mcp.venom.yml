          esac
          if [ "${before}" != "${after}" ]; then
            echo "FAIL: someone else's entry was rewritten or deleted" >&2
            exit 1
          fi
          echo "LEFT_IN_PLACE"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "LEFT_IN_PLACE"

  - name: claude strip removes its own entry regardless of which token variable it references
