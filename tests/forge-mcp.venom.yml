          mkdir -p "${OPENCODE_CONFIG_DIR}"
          printf '%s\n' '// banner' '{"mcp":{}}' > "${CONFIG}"
          chmod a-r "${CONFIG}"

          # Root ignores the mode bits, so the unreadable case cannot be staged.
          if cat "${CONFIG}" >/dev/null 2>&1; then
            echo "SKIP: running with read override (root?) — cannot stage an unreadable file"
            echo "oc_strip_unreadable=pass"
            exit 0
          fi

          # grep exits 2 on a read error and 1 on no match. Folding the two
          # together would report an unreadable config as one with nothing in it.
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/opencode/forge-mcp.sh"
          declare -F opencode_strip_forge_mcp_entries >/dev/null \
            || { echo "FAIL: opencode_strip_forge_mcp_entries is not defined"; exit 1; }
          opencode_strip_forge_mcp_entries 2>"${TEST_DIR}/stderr"
          grep -q 'could not read' "${TEST_DIR}/stderr" \
            || { echo "FAIL: read error was silent"; cat "${TEST_DIR}/stderr"; exit 1; }
          grep -qF "${CONFIG}" "${TEST_DIR}/stderr" \
            || { echo "FAIL: warning does not name the file"; exit 1; }
          echo "oc_strip_unreadable=pass"
        assertions:
