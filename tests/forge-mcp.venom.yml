  # ── whose entry is it ─────────────────────────────────────────────────────
  #
  # agents/claude/sync-settings.sh copies the host's ~/.claude.json into the
  # session at every launch, so a `github` entry the user configured on the
  # host is present in the very file these verbs write. Owning the key by name
  # would mean silently discarding a user's own narrowing (a --read-only
  # server, a restricted toolset) on wire, and deleting it on strip.
  #
  # Ownership is decided on the entry's SHAPE: transport, argv, the GitLab
  # endpoint path, and a credential block holding one variable reference and
  # nothing else. The token variable's NAME is deliberately not part of it —
  # one session may export GITHUB_PERSONAL_ACCESS_TOKEN and the next only
  # GITHUB_TOKEN, and both wrote riotbox's entry — but the block holding it is,
  # because github-mcp-server reads its restrictions from there.
  #
  # The cases below run that rule past both agents and both forges: argv and
  # environment narrowings, foreign endpoints and extra headers, riotbox's own
  # entry recognised across a changed token variable and a changed GITLAB_HOST,
  # the wire guard that keeps the two verbs in agreement, and the third answer
  # the check can give — "cannot tell", which is not "not ours".

  # ── ownership: github ─────────────────────────────────────────────────────

  - name: claude wire warns before replacing a github entry it did not write
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          unset XDG_CONFIG_HOME
          export HOME="${TMP}"
          export CLAUDE_CONFIG_DIR="${TMP}/.claude"
          export OPENCODE_CONFIG_DIR="${TMP}/opencode"
          mkdir -p "${CLAUDE_CONFIG_DIR}"
          cat >"${CLAUDE_CONFIG_DIR}/.claude.json" <<'JSON'
          {
            "mcpServers": {
              "github": {
                "type": "stdio",
                "command": "github-mcp-server",
                "args": ["stdio", "--read-only"],
                "env": {"GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"}
              }
            }
          }
          JSON

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"

          if ! declare -F agent_claude_github_mcp_wire >/dev/null; then
            echo "FAIL: agent_claude_github_mcp_wire is not defined" >&2
            exit 1
          fi
          rc=0
          err="$(agent_claude_github_mcp_wire GITHUB_TOKEN 2>&1 >/dev/null)" || rc=$?

          if [ "${rc}" -ne 0 ]; then
            echo "FAIL: wire returned ${rc}, it must still wire" >&2
            exit 1
          fi
          case "${err}" in
          *"github"*"not written by riotbox"*) : ;;
          *)
            echo "FAIL: expected a warning naming the key, got: ${err}" >&2
            exit 1
            ;;
          esac
          case "${err}" in
          *"not preserved"*) : ;;
          *)
            echo "FAIL: expected the warning to say restrictions are lost, got: ${err}" >&2
            exit 1
            ;;
          esac
          if ! jq -e '.mcpServers.github.args == ["stdio"]' \
            "${CLAUDE_CONFIG_DIR}/.claude.json" >/dev/null; then
            echo "FAIL: riotbox's entry did not land" >&2
            exit 1
          fi
          echo "WARNED_AND_REPLACED"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "WARNED_AND_REPLACED"

  # The regression guard on the warning above: it fires on a foreign entry, not
  # on every re-run. The third call changes the token variable, which changes
  # the entry without changing whose it is — shape, not equality.
  - name: claude wire is silent when it replaces its own entry
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          unset XDG_CONFIG_HOME
          export HOME="${TMP}"
          export CLAUDE_CONFIG_DIR="${TMP}/.claude"
          export OPENCODE_CONFIG_DIR="${TMP}/opencode"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"

          if ! declare -F agent_claude_github_mcp_wire >/dev/null; then
            echo "FAIL: agent_claude_github_mcp_wire is not defined" >&2
            exit 1
          fi
          agent_claude_github_mcp_wire GITHUB_TOKEN

          again="$(agent_claude_github_mcp_wire GITHUB_TOKEN 2>&1 >/dev/null)"
          if [ -n "${again}" ]; then
            echo "FAIL: re-wiring our own entry said: ${again}" >&2
            exit 1
          fi

          renamed="$(agent_claude_github_mcp_wire GITHUB_PERSONAL_ACCESS_TOKEN 2>&1 >/dev/null)"
          if [ -n "${renamed}" ]; then
            echo "FAIL: re-wiring with another token variable said: ${renamed}" >&2
            exit 1
          fi
          echo "SILENT_ON_OUR_OWN"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "SILENT_ON_OUR_OWN"

  - name: claude strip leaves a github entry it did not write
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
