          cat "${TEST_DIR}/banner" > "${CONFIG}"
          cat >> "${CONFIG}" <<'JSON'
          {"mcp":{"github":{"type":"local","command":["github-mcp-server","stdio"],"enabled":true,"environment":{"GITHUB_PERSONAL_ACCESS_TOKEN":"{env:GITHUB_TOKEN}"}},"keep":{"type":"local","command":["x"]}}}
          JSON
          unset RIOTBOX_PROMPT
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/scripts/lib/egress-prompt.sh"
          source "{{.riotbox_dir}}/agents/opencode/manifest.sh"
          declare -F agent_opencode_container_setup >/dev/null \
            || { echo "FAIL: agent_opencode_container_setup is not defined"; exit 1; }
          agent_opencode_container_setup 2>"${TEST_DIR}/stderr"

          grep -v '^//' "${CONFIG}" | jq -e '.mcp | keys == ["keep"]' >/dev/null \
            || { echo "FAIL: body check failed: .mcp | keys == ["keep"]"; exit 1; }
          grep -v '^//' "${CONFIG}" | jq -e '.permission == "allow"' >/dev/null \
            || { echo "FAIL: body check failed: .permission == "allow""; exit 1; }
          # The real banner opencode_setup writes (agents/opencode/setup.sh) must
          # survive the strip: eight `//` lines, the first being the generated notice.
          [ "$(grep -c '^//' "${CONFIG}")" -eq 8 ] \
            || { echo "FAIL: expected 8 banner lines, got $(grep -c '^//' "${CONFIG}")"; exit 1; }
          [ "$(head -n 1 "${CONFIG}")" = "// This file is generated by riotbox at session start." ] \
            || { echo "FAIL: first banner line changed"; exit 1; }
          echo "oc_container_setup_strip=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "oc_container_setup_strip=pass"
