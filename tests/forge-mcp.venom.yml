            claude_strip_forge_mcp_entries 2>"${TEST_DIR}/stderr"
            cmp -s "${TEST_DIR}/before" "${CLAUDE_CONFIG_DIR}/.claude.json" \
              || { echo "FAIL: ${server}: file changed"; exit 1; }
            grep -q 'Removed' "${TEST_DIR}/stderr" \
              && { echo "FAIL: ${server}: announced a removal"; exit 1; }
          done
          echo "strip_newline_token=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "strip_newline_token=pass"

  # ── opencode ───────────────────────────────────────────────────────────────
  # opencode_setup MERGES the persisted ~/.config/opencode/opencode.jsonc into
  # the one it writes (the persisted side wins), and sync-settings.sh resets
  # that directory only when the host has its own. So a stale mcp.github /
  # mcp.gitlab entry survives restarts exactly as Claude's does.
  # opencode_strip_forge_mcp_entries keeps the `//` banner and rewrites only
  # the body.

  - name: opencode strip removes the GitHub entry and keeps the banner
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          export OPENCODE_CONFIG_DIR="${HOME}/.config/opencode"
          CONFIG="${OPENCODE_CONFIG_DIR}/opencode.jsonc"
          mkdir -p "${OPENCODE_CONFIG_DIR}"
          # The banner opencode_setup writes: `//` lines, then a jq-generated JSON body.
          cat > "${TEST_DIR}/banner" <<'BANNER'
          // This file is generated by riotbox at session start.
          // Edit your host opencode.json/opencode.jsonc to change anything else.
          BANNER
          cat "${TEST_DIR}/banner" > "${CONFIG}"
          cat >> "${CONFIG}" <<'JSON'
          {"mcp":{"github":{"type":"local","command":["github-mcp-server","stdio"],"enabled":true,"environment":{"GITHUB_PERSONAL_ACCESS_TOKEN":"{env:GITHUB_TOKEN}"}}}}
          JSON

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/opencode/forge-mcp.sh"
          declare -F opencode_strip_forge_mcp_entries >/dev/null \
            || { echo "FAIL: opencode_strip_forge_mcp_entries is not defined"; exit 1; }
          opencode_strip_forge_mcp_entries 2>"${TEST_DIR}/stderr"

          grep -v '^//' "${CONFIG}" | jq -e '.mcp == {}' >/dev/null \
            || { echo "FAIL: body check failed: .mcp == {}"; exit 1; }
          diff <(grep '^//' "${CONFIG}") "${TEST_DIR}/banner" >/dev/null \
            || { echo "FAIL: banner changed"; exit 1; }
          grep -q 'Removed' "${TEST_DIR}/stderr" \
            || { echo "FAIL: removal not reported"; exit 1; }
          echo "oc_strip_github=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "oc_strip_github=pass"

