          grep -q 'could not write' "${TEST_DIR}/stderr" \
            || { echo "FAIL: write failure was silent"; exit 1; }
          grep -q 'Removed' "${TEST_DIR}/stderr" \
            && { echo "FAIL: announced a removal that did not happen"; exit 1; }
          chmod u+w "${OPENCODE_CONFIG_DIR}"
          leftovers="$(find "${OPENCODE_CONFIG_DIR}" -maxdepth 1 -name 'opencode.jsonc.*')"
          [ -z "${leftovers}" ] \
            || { echo "FAIL: temp file left behind: ${leftovers}"; exit 1; }
          echo "oc_strip_unwritable=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "oc_strip_unwritable=pass"

