  # github-mcp-server takes its restrictions from the environment as well as
  # from argv — GITHUB_TOOLSETS and GITHUB_HOST are environment-only, which is
  # why riotbox refuses to write them. An ownership rule that read argv alone
  # would hand a user's toolset-narrowed server to riotbox to overwrite and
  # then delete.
  - name: claude strip leaves a github entry narrowed through its environment block
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          unset XDG_CONFIG_HOME
          export HOME="${TMP}"
          export CLAUDE_CONFIG_DIR="${TMP}/.claude"
          export OPENCODE_CONFIG_DIR="${TMP}/opencode"
          mkdir -p "${CLAUDE_CONFIG_DIR}"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"

          if ! declare -F agent_claude_github_mcp_strip >/dev/null; then
            echo "FAIL: agent_claude_github_mcp_strip is not defined" >&2
            exit 1
          fi

          # Seeds an entry, strips, and insists the file came through it
          # untouched with an ownership warning on stderr.
          must_survive() {
            local label="$1" entry="$2" before after err rc=0
            printf '{"mcpServers":{"github":%s}}\n' "${entry}" \
              >"${CLAUDE_CONFIG_DIR}/.claude.json"
            before="$(sha256sum "${CLAUDE_CONFIG_DIR}/.claude.json" | awk '{print $1}')"

            err="$(agent_claude_github_mcp_strip 2>&1 >/dev/null)" || rc=$?
            after="$(sha256sum "${CLAUDE_CONFIG_DIR}/.claude.json" | awk '{print $1}')"

            if [ "${rc}" -ne 0 ]; then
              echo "FAIL[${label}]: strip returned ${rc} on someone else's entry" >&2
              exit 1
            fi
            case "${err}" in
            *"github"*"not written by riotbox"*) : ;;
            *)
              echo "FAIL[${label}]: expected an ownership warning, got: ${err}" >&2
              exit 1
              ;;
            esac
            if [ "${before}" != "${after}" ]; then
              echo "FAIL[${label}]: the entry was rewritten or deleted" >&2
              exit 1
            fi
          }

          must_survive toolsets '{"type":"stdio","command":"github-mcp-server","args":["stdio"],"env":{"GITHUB_PERSONAL_ACCESS_TOKEN":"${GH_RO}","GITHUB_TOOLSETS":"repos,issues"}}'
          must_survive literal-token '{"type":"stdio","command":"github-mcp-server","args":["stdio"],"env":{"GITHUB_PERSONAL_ACCESS_TOKEN":"ghp_a_real_looking_secret"}}'
          must_survive no-env '{"type":"stdio","command":"github-mcp-server","args":["stdio"]}'
          echo "LEFT_IN_PLACE"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "LEFT_IN_PLACE"

