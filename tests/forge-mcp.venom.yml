  # ── wire input guards ─────────────────────────────────────────────────────
  #
  # Two guards the four shipped commands cannot trip — container/forge-mcp.sh
  # picks the token variable's name from a fixed list and builds the URL
  # itself — but which the verbs are contractually required to enforce, because
  # they are also what a third agent and any direct caller implement against.
  #
  # Both failures are silent if unguarded rather than loud. A malformed
  # variable name lands in the config as a reference the agent cannot resolve
  # and presents as a server authenticating as nobody; a non-http(s) URL
  # presents as a connection error nothing explains. The endpoint-path guard
  # has its own cases above, under ownership.

  - name: claude wire verbs refuse input their config could not resolve
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          unset XDG_CONFIG_HOME
          export HOME="${TMP}"
          export CLAUDE_CONFIG_DIR="${TMP}/.claude"
          export OPENCODE_CONFIG_DIR="${TMP}/opencode"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"

          # A renamed or deleted verb returns 127, which every check below
          # would read as a refusal.
          for fn in agent_claude_github_mcp_wire agent_claude_gitlab_mcp_wire; do
            if ! declare -F "${fn}" >/dev/null; then
              echo "FAIL: ${fn} is not defined" >&2
              exit 1
            fi
          done

          # Runs a wire verb that must refuse, and insists on both the reason
          # and an untouched config: a guard that rejects the input only after
          # writing has not guarded anything.
          must_refuse() {
            local label="$1" expected="$2"
            shift 2
            local err rc=0
            err="$("$@" 2>&1 >/dev/null)" || rc=$?
            if [ "${rc}" -eq 0 ]; then
              echo "FAIL[${label}]: the verb accepted it" >&2
              exit 1
            fi
            case "${err}" in
            *"${expected}"*) : ;;
            *)
              echo "FAIL[${label}]: expected '${expected}', got: ${err}" >&2
              exit 1
              ;;
            esac
            # The whole tree, not just the config path: a refusal that leaked
            # a temp file or a staged write beside it is still a write.
            local written
            written="$(find "${TMP}" -type f | wc -l)"
            if [ "${written}" -ne 0 ]; then
              echo "FAIL[${label}]: a refused wire wrote ${written} file(s)" >&2
              find "${TMP}" -type f >&2
              exit 1
            fi
          }

          must_refuse github-token-var "is not a valid environment variable name" \
            agent_claude_github_mcp_wire 'GITHUB TOKEN'
          must_refuse gitlab-scheme "is not an http(s) URL" \
            agent_claude_gitlab_mcp_wire 'ftp://gitlab.example.com/api/v4/mcp' GITLAB_TOKEN
          must_refuse gitlab-token-var "is not a valid environment variable name" \
            agent_claude_gitlab_mcp_wire 'https://gitlab.example.com/api/v4/mcp' 'GITLAB TOKEN'
          echo "ALL_REFUSED_NOTHING_WRITTEN"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "ALL_REFUSED_NOTHING_WRITTEN"

  # The claude twin above carries the reasoning.
  - name: opencode wire verbs refuse input their config could not resolve
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          unset XDG_CONFIG_HOME
          export HOME="${TMP}"
          export CLAUDE_CONFIG_DIR="${TMP}/.claude"
          export OPENCODE_CONFIG_DIR="${TMP}/opencode"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/opencode/forge-mcp.sh"

          for fn in agent_opencode_github_mcp_wire agent_opencode_gitlab_mcp_wire; do
            if ! declare -F "${fn}" >/dev/null; then
              echo "FAIL: ${fn} is not defined" >&2
              exit 1
            fi
          done

          must_refuse() {
            local label="$1" expected="$2"
            shift 2
            local err rc=0
            err="$("$@" 2>&1 >/dev/null)" || rc=$?
            if [ "${rc}" -eq 0 ]; then
              echo "FAIL[${label}]: the verb accepted it" >&2
              exit 1
            fi
            case "${err}" in
            *"${expected}"*) : ;;
            *)
              echo "FAIL[${label}]: expected '${expected}', got: ${err}" >&2
              exit 1
              ;;
            esac
            # See the claude twin: the whole tree, not just the config path.
            local written
            written="$(find "${TMP}" -type f | wc -l)"
            if [ "${written}" -ne 0 ]; then
              echo "FAIL[${label}]: a refused wire wrote ${written} file(s)" >&2
              find "${TMP}" -type f >&2
              exit 1
            fi
          }

          must_refuse github-token-var "is not a valid environment variable name" \
            agent_opencode_github_mcp_wire 'GITHUB TOKEN'
          must_refuse gitlab-scheme "is not an http(s) URL" \
            agent_opencode_gitlab_mcp_wire 'ftp://gitlab.example.com/api/v4/mcp' GITLAB_TOKEN
          must_refuse gitlab-token-var "is not a valid environment variable name" \
            agent_opencode_gitlab_mcp_wire 'https://gitlab.example.com/api/v4/mcp' 'GITLAB TOKEN'
          echo "ALL_REFUSED_NOTHING_WRITTEN"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "ALL_REFUSED_NOTHING_WRITTEN"

  # ── ownership: an entry that cannot be classified ─────────────────────────
  #
  # "Cannot tell" is not "not ours". Reported as foreign, an entry riotbox did
  # write would stay registered while the caller printed "MCP cleanup complete"
  # and exited 0 — the one thing the strip contract says must never happen on a
  # path that gave up. Driven through the remove helper with a predicate that
  # fails to evaluate, because nothing an agent can write reaches this branch
  # through the verbs.
  - name: claude strip refuses to guess when it cannot classify the entry
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          unset XDG_CONFIG_HOME
          export HOME="${TMP}"
          export CLAUDE_CONFIG_DIR="${TMP}/.claude"
          export OPENCODE_CONFIG_DIR="${TMP}/opencode"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"

          if ! declare -F _agent_claude_forge_remove >/dev/null; then
            echo "FAIL: _agent_claude_forge_remove is not defined" >&2
            exit 1
          fi
          agent_claude_github_mcp_wire GITHUB_TOKEN

          rc=0
          err="$(_agent_claude_forge_remove "${_AGENT_CLAUDE_FORGE_GITHUB_SERVER}" 'error("unclassifiable")' 2>&1 >/dev/null)" || rc=$?

          if [ "${rc}" -eq 0 ]; then
            echo "FAIL: strip reported success without classifying the entry" >&2
            exit 1
          fi
          case "${err}" in
          *"could not clean"*) : ;;
          *)
            echo "FAIL: expected the could-not-clean warning, got: ${err}" >&2
            exit 1
            ;;
          esac
          if ! jq -e '.mcpServers | has("github")' \
            "${CLAUDE_CONFIG_DIR}/.claude.json" >/dev/null; then
            echo "FAIL: the entry was deleted on a path that gave up" >&2
            exit 1
          fi
          echo "FAILED_LOUDLY_ENTRY_KEPT"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "FAILED_LOUDLY_ENTRY_KEPT"

  - name: opencode strip refuses to guess when it cannot classify the entry
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          unset XDG_CONFIG_HOME
          export HOME="${TMP}"
          export CLAUDE_CONFIG_DIR="${TMP}/.claude"
          export OPENCODE_CONFIG_DIR="${TMP}/opencode"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/opencode/forge-mcp.sh"

          if ! declare -F _agent_opencode_forge_remove >/dev/null; then
            echo "FAIL: _agent_opencode_forge_remove is not defined" >&2
            exit 1
          fi
          agent_opencode_github_mcp_wire GITHUB_TOKEN

          rc=0
          err="$(_agent_opencode_forge_remove "${_AGENT_OPENCODE_FORGE_GITHUB_SERVER}" 'error("unclassifiable")' 2>&1 >/dev/null)" || rc=$?

          if [ "${rc}" -eq 0 ]; then
            echo "FAIL: strip reported success without classifying the entry" >&2
            exit 1
          fi
          case "${err}" in
          *"could not clean"*) : ;;
          *)
            echo "FAIL: expected the could-not-clean warning, got: ${err}" >&2
            exit 1
            ;;
          esac
          if ! grep -v '^//' "${OPENCODE_CONFIG_DIR}/opencode.jsonc" |
            jq -e '.mcp | has("github")' >/dev/null; then
            echo "FAIL: the entry was deleted on a path that gave up" >&2
            exit 1
          fi
          echo "FAILED_LOUDLY_ENTRY_KEPT"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "FAILED_LOUDLY_ENTRY_KEPT"

  # ── the enable_* / disable_* commands ──────────────────────────────────────
  #
  # These run the real entry points from container/. Each case points HOME and
  # both agent config dirs at a throwaway tree, so nothing touches the caller's
  # own configuration.

  - name: enable_github_mcp wires every registered agent
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          export HOME="${TMP}"
          export CLAUDE_CONFIG_DIR="${TMP}/.claude"
          export OPENCODE_CONFIG_DIR="${TMP}/.config/opencode"
          export GITHUB_TOKEN="ignored-by-design"

          "{{.riotbox_dir}}/container/enable_github_mcp"

          echo "claude=$(jq -r '.mcpServers.github.command' "${CLAUDE_CONFIG_DIR}/.claude.json")"
          echo "opencode=$(grep -v '^//' "${OPENCODE_CONFIG_DIR}/opencode.jsonc" | jq -r '.mcp.github.command[0]')"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "claude=github-mcp-server"
          - result.systemout ShouldContainSubstring "opencode=github-mcp-server"

  - name: enable_github_mcp prefers GITHUB_PERSONAL_ACCESS_TOKEN over GITHUB_TOKEN
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          export HOME="${TMP}"
          export CLAUDE_CONFIG_DIR="${TMP}/.claude"
          export OPENCODE_CONFIG_DIR="${TMP}/.config/opencode"
          export GITHUB_TOKEN="a"
          export GITHUB_PERSONAL_ACCESS_TOKEN="b"

          "{{.riotbox_dir}}/container/enable_github_mcp"

          jq -r '.mcpServers.github.env.GITHUB_PERSONAL_ACCESS_TOKEN' \
            "${CLAUDE_CONFIG_DIR}/.claude.json"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "${GITHUB_PERSONAL_ACCESS_TOKEN}"

  - name: enable_github_mcp falls back to GITHUB_TOKEN when it is the only one set
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          export HOME="${TMP}"
          export CLAUDE_CONFIG_DIR="${TMP}/.claude"
          export OPENCODE_CONFIG_DIR="${TMP}/.config/opencode"
          unset GITHUB_PERSONAL_ACCESS_TOKEN || true
          export GITHUB_TOKEN="a"

          "{{.riotbox_dir}}/container/enable_github_mcp"

          jq -r '.mcpServers.github.env.GITHUB_PERSONAL_ACCESS_TOKEN' \
            "${CLAUDE_CONFIG_DIR}/.claude.json"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "${GITHUB_TOKEN}"

  - name: enable_github_mcp refuses when no token variable is set and writes nothing
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          export HOME="${TMP}"
          export CLAUDE_CONFIG_DIR="${TMP}/.claude"
          export OPENCODE_CONFIG_DIR="${TMP}/.config/opencode"
          unset GITHUB_TOKEN GITHUB_PERSONAL_ACCESS_TOKEN || true

          rc=0
          out="$("{{.riotbox_dir}}/container/enable_github_mcp" 2>&1)" || rc=$?

          if [ "${rc}" -eq 0 ]; then
            echo "FAIL: expected a non-zero exit, got 0" >&2
            exit 1
          fi
          written="$(find "${TMP}" -type f | wc -l)"
          if [ "${written}" -ne 0 ]; then
            echo "FAIL: ${written} file(s) written on refusal" >&2
            find "${TMP}" -type f >&2
            exit 1
          fi
          echo "REFUSED_WROTE_NOTHING"
          echo "${out}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "REFUSED_WROTE_NOTHING"
          - result.systemout ShouldContainSubstring "GITHUB_TOKEN"

  - name: enable_gitlab_mcp refuses when GITLAB_TOKEN is unset and writes nothing
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          export HOME="${TMP}"
          export CLAUDE_CONFIG_DIR="${TMP}/.claude"
          export OPENCODE_CONFIG_DIR="${TMP}/.config/opencode"
          unset GITLAB_TOKEN || true

          rc=0
          out="$("{{.riotbox_dir}}/container/enable_gitlab_mcp" 2>&1)" || rc=$?

          if [ "${rc}" -eq 0 ]; then
            echo "FAIL: expected a non-zero exit, got 0" >&2
            exit 1
          fi
          written="$(find "${TMP}" -type f | wc -l)"
          if [ "${written}" -ne 0 ]; then
            echo "FAIL: ${written} file(s) written on refusal" >&2
            exit 1
          fi
          echo "REFUSED_WROTE_NOTHING"
          # The refusal has to name the variable to set, or it tells a user
          # only that something went wrong.
          echo "${out}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "REFUSED_WROTE_NOTHING"
          - result.systemout ShouldContainSubstring "GITLAB_TOKEN"

  - name: enable_gitlab_mcp normalizes every usable GITLAB_HOST form and refuses the rest
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          export GITLAB_TOKEN="ignored-by-design"

          # host value -> expected endpoint
          check() {
            local host_value="$1" expected="$2" label="$3"
            local dir="${TMP}/${label}"
            export HOME="${dir}"
            export CLAUDE_CONFIG_DIR="${dir}/.claude"
            export OPENCODE_CONFIG_DIR="${dir}/.config/opencode"
            if [ "${host_value}" = "__UNSET__" ]; then
              unset GITLAB_HOST || true
            else
              export GITLAB_HOST="${host_value}"
            fi
            "{{.riotbox_dir}}/container/enable_gitlab_mcp" >/dev/null
            local got
            got="$(jq -r '.mcpServers.gitlab.url' "${CLAUDE_CONFIG_DIR}/.claude.json")"
            if [ "${got}" != "${expected}" ]; then
              echo "FAIL: ${label}: got ${got}, expected ${expected}" >&2
              return 1
            fi
            echo "OK ${label} -> ${got}"
          }

          # A GITLAB_HOST that names no host. Every form below, accepted,
          # builds an endpoint pointing at nothing that STILL satisfies the
          # wire verbs' http(s) and /api/v4/mcp guards — a scheme other than
          # http(s) survives as part of the "host" and gets https:// prefixed
          # in front of it — so this is the only place they can be caught, and
          # they have to be caught before any agent config is opened.
          #
          # This is where a wrong scheme is refused end to end. The verb-level
          # case above ("gitlab wire refuses a URL its own strip would not
          # recognise") cannot cover it: an ftp:// GITLAB_HOST never reaches a
          # verb as ftp://, it reaches it as https://ftp://…
          reject() {
            local host_value="$1" label="$2"
            local dir="${TMP}/${label}" out rc=0
            export HOME="${dir}"
            export CLAUDE_CONFIG_DIR="${dir}/.claude"
            export OPENCODE_CONFIG_DIR="${dir}/.config/opencode"
            export GITLAB_HOST="${host_value}"
            out="$("{{.riotbox_dir}}/container/enable_gitlab_mcp" 2>&1)" || rc=$?
            if [ "${rc}" -eq 0 ]; then
              echo "FAIL: ${label}: GITLAB_HOST='${host_value}' was accepted" >&2
              return 1
            fi
            case "${out}" in
            *"does not name a host"*) : ;;
            *)
              echo "FAIL: ${label}: expected a host warning, got: ${out}" >&2
              return 1
              ;;
            esac
            if [ -d "${dir}" ] && [ "$(find "${dir}" -type f | wc -l)" -ne 0 ]; then
              echo "FAIL: ${label}: a refused run wrote a config" >&2
              find "${dir}" -type f >&2
              return 1
            fi
            echo "OK ${label} refused"
          }

          check "__UNSET__"                    "https://gitlab.com/api/v4/mcp"          default
          check "gitlab.example.com"           "https://gitlab.example.com/api/v4/mcp"  bare
          check "https://gitlab.example.com"   "https://gitlab.example.com/api/v4/mcp"  scheme
          check "https://gitlab.example.com/"  "https://gitlab.example.com/api/v4/mcp"  trailing
          check "http://gitlab.internal"       "http://gitlab.internal/api/v4/mcp"      plain_http
          # URI schemes are case-insensitive (RFC 3986 §3.1), so this is a
          # value a user can reasonably type. Matched exactly, it would look
          # like a bare host and get a second scheme prefixed onto it.
          check "HTTPS://gitlab.example.com"   "https://gitlab.example.com/api/v4/mcp"  upper_scheme
          check "HTTP://gl.internal:8080"      "http://gl.internal:8080/api/v4/mcp"     upper_scheme_port

          reject "https://"                    scheme_only
          reject "/"                           slash_only
          reject "https:///gitlab.example.com" empty_authority
          reject "ftp://gitlab.example.com"    wrong_scheme
          reject "git://gitlab.example.com"    unknown_scheme
          reject "https:"                      bare_scheme
          reject "   "                         whitespace_only
          echo "ALL_HOSTS_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "ALL_HOSTS_OK"
          - result.systemout ShouldContainSubstring "OK upper_scheme -> https://gitlab.example.com/api/v4/mcp"
          - result.systemout ShouldContainSubstring "OK scheme_only refused"
          - result.systemout ShouldContainSubstring "OK slash_only refused"
          - result.systemout ShouldContainSubstring "OK empty_authority refused"
          - result.systemout ShouldContainSubstring "OK wrong_scheme refused"
          - result.systemout ShouldContainSubstring "OK unknown_scheme refused"
          - result.systemout ShouldContainSubstring "OK bare_scheme refused"
          - result.systemout ShouldContainSubstring "OK whitespace_only refused"

  # Issue #9: "If the scripts are re-run, they will reload the MCP servers and
  # use whatever environment variables are set at the time." Re-running in the
  # SAME session directory, not a fresh one, is what that means in practice.
  - name: re-running an enable command picks up a changed environment in place
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          export HOME="${TMP}"
          export CLAUDE_CONFIG_DIR="${TMP}/.claude"
          export OPENCODE_CONFIG_DIR="${TMP}/.config/opencode"
          export GITLAB_TOKEN="ignored-by-design"

          export GITLAB_HOST="gitlab.example.com"
          "{{.riotbox_dir}}/container/enable_gitlab_mcp" >/dev/null
          echo "first=$(jq -r '.mcpServers.gitlab.url' "${CLAUDE_CONFIG_DIR}/.claude.json")"

          # Same session directory, different environment, run it again.
          export GITLAB_HOST="https://gitlab.internal.example"
          "{{.riotbox_dir}}/container/enable_gitlab_mcp" >/dev/null
          echo "second=$(jq -r '.mcpServers.gitlab.url' "${CLAUDE_CONFIG_DIR}/.claude.json")"
          echo "opencode=$(grep -v '^//' "${OPENCODE_CONFIG_DIR}/opencode.jsonc" | jq -r '.mcp.gitlab.url')"

          # And the github side: swap which variable holds the token.
          export GITHUB_TOKEN="ignored-by-design"
          "{{.riotbox_dir}}/container/enable_github_mcp" >/dev/null
          export GITHUB_PERSONAL_ACCESS_TOKEN="ignored-by-design"
          "{{.riotbox_dir}}/container/enable_github_mcp" >/dev/null
          echo "github=$(jq -r '.mcpServers.github.env.GITHUB_PERSONAL_ACCESS_TOKEN' "${CLAUDE_CONFIG_DIR}/.claude.json")"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "first=https://gitlab.example.com/api/v4/mcp"
          - result.systemout ShouldContainSubstring "second=https://gitlab.internal.example/api/v4/mcp"
          - result.systemout ShouldContainSubstring "opencode=https://gitlab.internal.example/api/v4/mcp"
          - result.systemout ShouldContainSubstring "github=${GITHUB_PERSONAL_ACCESS_TOKEN}"

  # The property the whole design exists for. If someone later "simplifies"
  # a reference into a value, this is the test that stops it.
  - name: no credential value is ever written to disk
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          export HOME="${TMP}"
          export CLAUDE_CONFIG_DIR="${TMP}/.claude"
          export OPENCODE_CONFIG_DIR="${TMP}/.config/opencode"
          export GITHUB_TOKEN="ghp_SENTINELdeadbeefSENTINEL"
          export GITLAB_TOKEN="glpat_SENTINELdeadbeefSENTINEL"
          export GITLAB_HOST="gitlab.example.com"

          "{{.riotbox_dir}}/container/enable_github_mcp"
          "{{.riotbox_dir}}/container/enable_gitlab_mcp"

          # Every file the commands could have touched, searched for either
          # secret. grep -r over the tree, not just the two configs we expect:
          # a leak into some other file is still a leak.
          if grep -rlF "SENTINELdeadbeefSENTINEL" "${TMP}" 2>/dev/null | grep -q .; then
            echo "FAIL: a token value reached disk:" >&2
            grep -rlF "SENTINELdeadbeefSENTINEL" "${TMP}" >&2
            exit 1
          fi

          # ...and prove the wiring actually happened, so this cannot pass by
          # writing nothing at all.
          jq -e '.mcpServers.github and .mcpServers.gitlab' \
            "${CLAUDE_CONFIG_DIR}/.claude.json" >/dev/null
          echo "NO_SECRETS_ON_DISK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "NO_SECRETS_ON_DISK"

  - name: disable commands remove what the enable commands wrote, for every agent
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          export HOME="${TMP}"
          export CLAUDE_CONFIG_DIR="${TMP}/.claude"
          export OPENCODE_CONFIG_DIR="${TMP}/.config/opencode"
          export GITHUB_TOKEN="ignored-by-design"
          export GITLAB_TOKEN="ignored-by-design"

          "{{.riotbox_dir}}/container/enable_github_mcp"
          "{{.riotbox_dir}}/container/enable_gitlab_mcp"
          "{{.riotbox_dir}}/container/disable_github_mcp"
          "{{.riotbox_dir}}/container/disable_gitlab_mcp"

          echo "claude=$(jq -r '.mcpServers | keys | length' "${CLAUDE_CONFIG_DIR}/.claude.json")"
          echo "opencode=$(grep -v '^//' "${OPENCODE_CONFIG_DIR}/opencode.jsonc" | jq -r '.mcp | keys | length')"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "claude=0"
          - result.systemout ShouldContainSubstring "opencode=0"

  - name: disable commands are safe to run when nothing was ever enabled
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          export HOME="${TMP}"
          export CLAUDE_CONFIG_DIR="${TMP}/.claude"
          export OPENCODE_CONFIG_DIR="${TMP}/.config/opencode"

          "{{.riotbox_dir}}/container/disable_github_mcp"
          "{{.riotbox_dir}}/container/disable_gitlab_mcp"

          written="$(find "${TMP}" -type f | wc -l)"
          if [ "${written}" -ne 0 ]; then
            echo "FAIL: disable created ${written} file(s)" >&2
            exit 1
          fi
          echo "CLEAN_NOOP"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "CLEAN_NOOP"

  # BASH_SOURCE[0] is never symlink-resolved. The image puts the four commands
  # on PATH only as symlinks under ~/.local/bin, pointing at the real files
  # under ~/.riotbox — the layout every other case in this file bypasses by
  # invoking container/<cmd> directly out of the source tree. This case is the
  # only one that reproduces the image layout: library and commands copied
  # into one directory that is NOT on PATH, reachable only through symlinks
  # from a directory that is.
  - name: the four commands work when invoked through a PATH symlink
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          export HOME="${TMP}/home"
          mkdir -p "${HOME}" "${TMP}/lib" "${TMP}/bin"

          # Mirror the image: forge-mcp.sh, agents/ and lib/ sit beside the
          # commands (the layout forge-mcp.sh probes for first), and that
          # directory is reachable only through the bin/ symlinks.
          cp "{{.riotbox_dir}}/container/forge-mcp.sh" "${TMP}/lib/"
          cp -r "{{.riotbox_dir}}/agents" "${TMP}/lib/agents"
          mkdir -p "${TMP}/lib/lib"
          cp "{{.riotbox_dir}}/scripts/lib/json-write.sh" "${TMP}/lib/lib/"
          for c in enable_github_mcp enable_gitlab_mcp disable_github_mcp disable_gitlab_mcp; do
            cp "{{.riotbox_dir}}/container/${c}" "${TMP}/lib/${c}"
            chmod +x "${TMP}/lib/${c}"
            ln -sf "${TMP}/lib/${c}" "${TMP}/bin/${c}"
          done

          export PATH="${TMP}/bin:${PATH}"
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          export OPENCODE_CONFIG_DIR="${HOME}/.config/opencode"
          export GITHUB_TOKEN="ignored-by-design"
          export GITLAB_TOKEN="ignored-by-design"
          unset GITLAB_HOST || true
          mkdir -p "${CLAUDE_CONFIG_DIR}"

          enable_github_mcp
          jq -r '.mcpServers.github.command' "${CLAUDE_CONFIG_DIR}/.claude.json"
          disable_github_mcp
          echo "github_present=$(jq -r '.mcpServers | has("github")' "${CLAUDE_CONFIG_DIR}/.claude.json")"

          enable_gitlab_mcp
          jq -r '.mcpServers.gitlab.url' "${CLAUDE_CONFIG_DIR}/.claude.json"
          disable_gitlab_mcp
          echo "gitlab_present=$(jq -r '.mcpServers | has("gitlab")' "${CLAUDE_CONFIG_DIR}/.claude.json")"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring github-mcp-server
          - result.systemout ShouldContainSubstring "https://gitlab.com/api/v4/mcp"
          - result.systemout ShouldContainSubstring "github_present=false"
          - result.systemout ShouldContainSubstring "gitlab_present=false"

  - name: claude wire refuses a malformed config and leaves it byte-identical
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          export CLAUDE_CONFIG_DIR="${TMP}/.claude"
          mkdir -p "${CLAUDE_CONFIG_DIR}"
          printf '{ this is not json' >"${CLAUDE_CONFIG_DIR}/.claude.json"
          before="$(sha256sum "${CLAUDE_CONFIG_DIR}/.claude.json" | awk '{print $1}')"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"

          rc=0
          agent_claude_github_mcp_wire GITHUB_TOKEN 2>/dev/null || rc=$?
          after="$(sha256sum "${CLAUDE_CONFIG_DIR}/.claude.json" | awk '{print $1}')"

          if [ "${rc}" -eq 0 ]; then
            echo "FAIL: wire returned 0 on a malformed config" >&2
            exit 1
          fi
          if [ "${before}" != "${after}" ]; then
            echo "FAIL: malformed config was overwritten" >&2
            exit 1
          fi
          echo "REFUSED_AND_UNCHANGED"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "REFUSED_AND_UNCHANGED"

  # ── the dispatcher when an agent cannot deliver ────────────────────────────
  #
  # The forge verbs are the OPTIONAL part of the agent contract, and
  # forge_mcp_apply has three answers for a registry that does not fully
  # implement them: skip one agent, fail after some succeeded, and refuse when
  # none can. Both shipped agents implement all four verbs and both succeed, so
  # no case above can reach any of them.
  #
  # Each case below builds the image layout — forge-mcp.sh with agents/ and
  # lib/ beside it — in a throwaway tree, with a stub agent added to or
  # standing in for the real registry. Nothing here edits the real agents/
  # directory; the registry discovers agents by globbing, which is exactly what
  # makes a temp tree enough. The same shape as the zztest stub in
  # tests/agents.venom.yml.

  - name: forge_mcp_apply skips an agent without the verbs and still succeeds
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          unset XDG_CONFIG_HOME
          mkdir -p "${TMP}/lib/agents/zzstub" "${TMP}/lib/lib" "${TMP}/home"
          cp "{{.riotbox_dir}}/container/forge-mcp.sh" "${TMP}/lib/"
          cp "{{.riotbox_dir}}/agents/registry.sh" "${TMP}/lib/agents/"
          cp -r "{{.riotbox_dir}}/agents/claude" "{{.riotbox_dir}}/agents/opencode" \
            "${TMP}/lib/agents/"
          cp "{{.riotbox_dir}}/scripts/lib/json-write.sh" "${TMP}/lib/lib/"
          cp "{{.riotbox_dir}}/container/enable_github_mcp" "${TMP}/lib/"
          chmod +x "${TMP}/lib/enable_github_mcp"

          # The three cases in this section each build their own tree, and the
          # duplication is deliberate: what each proves IS its registry, so
          # hoisting the setup into one shared fixture would couple three
          # different registries to one shape. The third case in particular
          # must keep a registry holding NOTHING but this stub — copy claude
          # and opencode into it and it silently stops testing anything.

          # A registered agent with no forge verbs at all — the state every
          # agent was in before issue #9, and the state a third agent starts
          # in.
          cat >"${TMP}/lib/agents/zzstub/manifest.sh" <<'EOF'
          agent_zzstub_real_binary() { printf 'zzstub\n'; }
          EOF

          export HOME="${TMP}/home"
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          export OPENCODE_CONFIG_DIR="${HOME}/.config/opencode"
          export GITHUB_TOKEN="ignored-by-design"

          rc=0
          err="$("${TMP}/lib/enable_github_mcp" 2>&1 >/dev/null)" || rc=$?

          # Skipping is not failing: the agents that can be wired were.
          if [ "${rc}" -ne 0 ]; then
            echo "FAIL: exit ${rc} when one agent of three lacks the verbs" >&2
            echo "${err}" >&2
            exit 1
          fi
          case "${err}" in
          *"zzstub: no github MCP support — skipped."*) : ;;
          *)
            echo "FAIL: expected the skip line for zzstub, got: ${err}" >&2
            exit 1
            ;;
          esac
          if ! jq -e '.mcpServers | has("github")' \
            "${CLAUDE_CONFIG_DIR}/.claude.json" >/dev/null; then
            echo "FAIL: the agents that do support github were not wired" >&2
            exit 1
          fi
          echo "SKIPPED_OUT_LOUD"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "SKIPPED_OUT_LOUD"

  # A partial success is a failure. The user asked for every agent, one of them
  # did not deliver, and reporting 0 would leave that discoverable only by
  # reading stderr — which on the strip side means an agent keeping forge
  # access the user asked to revoke.
  - name: forge_mcp_apply exits non-zero when an agent's verb fails
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          unset XDG_CONFIG_HOME
          mkdir -p "${TMP}/lib/agents/zzstub" "${TMP}/lib/lib" "${TMP}/home"
          cp "{{.riotbox_dir}}/container/forge-mcp.sh" "${TMP}/lib/"
          cp "{{.riotbox_dir}}/agents/registry.sh" "${TMP}/lib/agents/"
          cp -r "{{.riotbox_dir}}/agents/claude" "{{.riotbox_dir}}/agents/opencode" \
            "${TMP}/lib/agents/"
          cp "{{.riotbox_dir}}/scripts/lib/json-write.sh" "${TMP}/lib/lib/"
          cp "{{.riotbox_dir}}/container/disable_github_mcp" "${TMP}/lib/"
          chmod +x "${TMP}/lib/disable_github_mcp"

          # Implements the verb and gives up, the way a real one does when the
          # config cannot be written. Driven through the DISABLE command on
          # purpose: the per-agent failure line interpolates the action, and
          # the wire half of it is already exercised by every other path.
          cat >"${TMP}/lib/agents/zzstub/manifest.sh" <<'EOF'
          agent_zzstub_real_binary() { printf 'zzstub\n'; }
          agent_zzstub_github_mcp_strip() { echo "  [forge-mcp] WARN: could not clean zzstub config — the github entry is still registered." >&2; return 1; }
          EOF

          export HOME="${TMP}/home"
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          export OPENCODE_CONFIG_DIR="${HOME}/.config/opencode"

          rc=0
          err="$("${TMP}/lib/disable_github_mcp" 2>&1 >/dev/null)" || rc=$?

          if [ "${rc}" -eq 0 ]; then
            echo "FAIL: exit 0 with one agent failed" >&2
            exit 1
          fi
          case "${err}" in
          *"zzstub: github MCP strip FAILED."*) : ;;
          *)
            echo "FAIL: expected the per-agent failure line, got: ${err}" >&2
            exit 1
            ;;
          esac
          # The count is what tells a user this was partial rather than total.
          case "${err}" in
          *"1 agent(s) failed; 2 succeeded."*) : ;;
          *)
            echo "FAIL: expected the failed/succeeded tally, got: ${err}" >&2
            exit 1
            ;;
          esac
          echo "FAILED_LOUDLY_WITH_A_TALLY"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "FAILED_LOUDLY_WITH_A_TALLY"

  # Skipping every agent is not "nothing to do", it is a command that cannot do
  # what it was asked. Exiting 0 here would report success for a forge no agent
  # in the session can reach.
  - name: forge_mcp_apply exits non-zero when no registered agent has the verbs
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          unset XDG_CONFIG_HOME
          mkdir -p "${TMP}/lib/agents/zzstub" "${TMP}/lib/lib" "${TMP}/home"
          cp "{{.riotbox_dir}}/container/forge-mcp.sh" "${TMP}/lib/"
          cp "{{.riotbox_dir}}/agents/registry.sh" "${TMP}/lib/agents/"
          cp "{{.riotbox_dir}}/scripts/lib/json-write.sh" "${TMP}/lib/lib/"
          cp "{{.riotbox_dir}}/container/enable_github_mcp" "${TMP}/lib/"
          chmod +x "${TMP}/lib/enable_github_mcp"

          # The only agent in this registry, and it has no forge verbs.
          cat >"${TMP}/lib/agents/zzstub/manifest.sh" <<'EOF'
          agent_zzstub_real_binary() { printf 'zzstub\n'; }
          EOF

          export HOME="${TMP}/home"
          export CLAUDE_CONFIG_DIR="${HOME}/.claude"
          export OPENCODE_CONFIG_DIR="${HOME}/.config/opencode"
          export GITHUB_TOKEN="ignored-by-design"

          rc=0
          err="$("${TMP}/lib/enable_github_mcp" 2>&1 >/dev/null)" || rc=$?

          if [ "${rc}" -eq 0 ]; then
            echo "FAIL: exit 0 with no agent able to wire github" >&2
            exit 1
          fi
          case "${err}" in
          *"no registered agent supports the github MCP server."*) : ;;
          *)
            echo "FAIL: expected the no-support error, got: ${err}" >&2
            exit 1
            ;;
          esac
          written="$(find "${TMP}/home" -type f | wc -l)"
          if [ "${written}" -ne 0 ]; then
            echo "FAIL: ${written} file(s) written when nothing could be wired" >&2
            find "${TMP}/home" -type f >&2
            exit 1
          fi
          echo "REFUSED_NO_SUPPORT"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "REFUSED_NO_SUPPORT"

  # The dispatcher's own status line, on the path where a strip removed
  # nothing. It says "cleanup complete" rather than "server removed" because
  # strip returns 0 on four non-removal paths — no config, no entry, a config
  # too malformed to edit, and an entry riotbox did not write — and announcing
  # a removal there contradicts the stderr line explaining why there was none.
  - name: a strip that removed nothing does not report a removal
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          unset XDG_CONFIG_HOME
          export HOME="${TMP}"
          export CLAUDE_CONFIG_DIR="${TMP}/.claude"
          export OPENCODE_CONFIG_DIR="${TMP}/.config/opencode"

          # No config file anywhere: nothing to remove, and the command still
          # succeeds.
          rc=0
          out="$("{{.riotbox_dir}}/container/disable_github_mcp" 2>/dev/null)" || rc=$?
          if [ "${rc}" -ne 0 ]; then
            echo "FAIL: disable returned ${rc} with nothing to remove" >&2
            exit 1
          fi
          # The exact retired string, not the bare word: some future status
          # line may legitimately contain "removed" without claiming this one.
          case "${out}" in
          *"MCP server removed."*)
            echo "FAIL: reported a removal when nothing was removed: ${out}" >&2
            exit 1
            ;;
          esac
          case "${out}" in
          *"claude: github MCP cleanup complete."*) : ;;
          *)
            echo "FAIL: expected the cleanup status line, got: ${out}" >&2
            exit 1
            ;;
          esac
          echo "NO_FALSE_REMOVAL"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "NO_FALSE_REMOVAL"
