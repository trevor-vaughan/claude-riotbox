            echo "FAIL: the config directory is still writable, this proves nothing" >&2
            exit 1
          fi

          if ! declare -F agent_opencode_github_mcp_strip >/dev/null; then
            echo "FAIL: agent_opencode_github_mcp_strip is not defined" >&2
            exit 1
          fi
          rc=0
          err="$(agent_opencode_github_mcp_strip 2>&1 >/dev/null)" || rc=$?

          if [ "${rc}" -eq 0 ]; then
            echo "FAIL: strip returned 0 after the write failed" >&2
            exit 1
          fi
          case "${err}" in
          *"could not write"*) : ;;
          *)
            echo "FAIL: expected a write warning, got: ${err}" >&2
            exit 1
            ;;
          esac
          if ! grep -v '^//' "${OPENCODE_CONFIG_DIR}/opencode.jsonc" |
            jq -e '.mcp | has("github")' >/dev/null; then
