          source "{{.riotbox_dir}}/agents/claude/forge-mcp.sh"

          if ! declare -F agent_claude_github_mcp_strip >/dev/null; then
            echo "FAIL: agent_claude_github_mcp_strip is not defined" >&2
            exit 1
          fi
          for var in GITHUB_PERSONAL_ACCESS_TOKEN GITHUB_TOKEN; do
            agent_claude_github_mcp_wire "${var}"
            agent_claude_github_mcp_strip
            if jq -e '.mcpServers | has("github")' \
              "${CLAUDE_CONFIG_DIR}/.claude.json" >/dev/null; then
              echo "FAIL: our entry survived a strip after wiring with ${var}" >&2
              exit 1
            fi
          done
          echo "REMOVED_EITHER_WAY"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "REMOVED_EITHER_WAY"

