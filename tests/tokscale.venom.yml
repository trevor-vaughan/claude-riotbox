name: scripts/tokscale-riotbox.sh — session scan roots
vars:
  root: "."
  riotbox_dir: "{{.root}}"

testcases:
  - name: every agent's session store becomes a tokscale scan root
    steps:
      - type: exec
        script: |
          set -euo pipefail
          command -v unshare >/dev/null && unshare -rn true 2>/dev/null \
            || { echo "TOKSCALE_SKIPPED: no unprivileged user namespaces"; exit 0; }
          T="$(mktemp -d)"; trap 'rm -rf "${T}"' EXIT
          # Claude's transcripts sit in the session dir; opencode's and Pi's in
          # the session's state dir.
          mkdir -p "${T}/data/s1/projects" "${T}/state/s2/opencode-data/storage/message" "${T}/state/s3/pi-agent/sessions"
          printf '#!/bin/sh\necho "EXTRA=${TOKSCALE_EXTRA_DIRS}"\n' > "${T}/tok"; chmod +x "${T}/tok"
          out="$(RIOTBOX_DATA_DIR="${T}/data" RIOTBOX_STATE_ROOT="${T}/state" TOKSCALE_BIN="${T}/tok" bash "{{.riotbox_dir}}/scripts/tokscale-riotbox.sh")"
          for want in "claude:${T}/data/s1/projects" "opencode:${T}/state/s2/opencode-data" \
                      "opencode:${T}/state/s2/opencode-data/storage/message" "pi:${T}/state/s3/pi-agent/sessions"; do
            printf '%s\n' "${out}" | grep -qF "${want}" || { echo "FAIL: missing ${want}"; echo "${out}"; exit 1; }
          done
          echo "TOKSCALE_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex "TOKSCALE_OK|TOKSCALE_SKIPPED"

  - name: a session without a pi sessions dir adds no pi root
    steps:
      - type: exec
        script: |
          set -euo pipefail
          command -v unshare >/dev/null && unshare -rn true 2>/dev/null \
            || { echo "TOKSCALE_SKIPPED: no unprivileged user namespaces"; exit 0; }
          T="$(mktemp -d)"; trap 'rm -rf "${T}"' EXIT
          mkdir -p "${T}/state/s1/pi-agent"
          printf '#!/bin/sh\necho "EXTRA=${TOKSCALE_EXTRA_DIRS}"\n' > "${T}/tok"; chmod +x "${T}/tok"
          out="$(RIOTBOX_DATA_DIR="${T}/data" RIOTBOX_STATE_ROOT="${T}/state" TOKSCALE_BIN="${T}/tok" bash "{{.riotbox_dir}}/scripts/tokscale-riotbox.sh")"
          if printf '%s\n' "${out}" | grep -qF 'pi:'; then echo "FAIL: pi root without sessions/"; exit 1; fi
          echo "TOKSCALE_NOPI_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex "TOKSCALE_NOPI_OK|TOKSCALE_SKIPPED"

  - name: the roots default under XDG_DATA_HOME and legacy stores inside a session dir are not scanned
    steps:
      - type: exec
        script: |
          set -euo pipefail
          command -v unshare >/dev/null && unshare -rn true 2>/dev/null \
            || { echo "TOKSCALE_SKIPPED: no unprivileged user namespaces"; exit 0; }
          T="$(mktemp -d)"; trap 'rm -rf "${T}"' EXIT
          unset RIOTBOX_DATA_DIR RIOTBOX_STATE_ROOT
          export XDG_DATA_HOME="${T}/xdg"
          mkdir -p "${XDG_DATA_HOME}/riotbox-state/s1/pi-agent/sessions" \
                   "${XDG_DATA_HOME}/riotbox/s2/.pi-agent/sessions" \
                   "${XDG_DATA_HOME}/riotbox/s2/.local-share-opencode"
          printf '#!/bin/sh\necho "EXTRA=${TOKSCALE_EXTRA_DIRS}"\n' > "${T}/tok"; chmod +x "${T}/tok"
          out="$(TOKSCALE_BIN="${T}/tok" bash "{{.riotbox_dir}}/scripts/tokscale-riotbox.sh")"
          printf '%s\n' "${out}" | grep -qF "pi:${XDG_DATA_HOME}/riotbox-state/s1/pi-agent/sessions" \
            || { echo "FAIL: default state root not scanned"; echo "${out}"; exit 1; }
          if printf '%s\n' "${out}" | grep -qF '/s2/'; then echo "FAIL: a legacy store was scanned"; echo "${out}"; exit 1; fi
          echo "TOKSCALE_DEFAULTS_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex "TOKSCALE_DEFAULTS_OK|TOKSCALE_SKIPPED"

  - name: container-plantable scan roots that are symlinks are not passed to tokscale
    steps:
      - type: exec
        script: |
          set -euo pipefail
          command -v unshare >/dev/null && unshare -rn true 2>/dev/null \
            || { echo "TOKSCALE_SKIPPED: no unprivileged user namespaces"; exit 0; }
          T="$(mktemp -d)"; trap 'rm -rf "${T}"' EXIT
          mkdir -p "${T}/target" "${T}/data/bad" "${T}/data/good/projects" \
                   "${T}/state/bad/opencode-data/storage" "${T}/state/bad/pi-agent" \
                   "${T}/state/good/opencode-data/storage/message" "${T}/state/good/pi-agent/sessions"
          ln -s "${T}/target" "${T}/data/bad/projects"
          ln -s "${T}/target" "${T}/state/bad/opencode-data/storage/message"
          ln -s "${T}/target" "${T}/state/bad/pi-agent/sessions"
          printf '#!/bin/sh\necho "EXTRA=${TOKSCALE_EXTRA_DIRS}"\n' > "${T}/tok"; chmod +x "${T}/tok"
          out="$(RIOTBOX_DATA_DIR="${T}/data" RIOTBOX_STATE_ROOT="${T}/state" TOKSCALE_BIN="${T}/tok" bash "{{.riotbox_dir}}/scripts/tokscale-riotbox.sh")"
          for want in "claude:${T}/data/good/projects" "opencode:${T}/state/good/opencode-data/storage/message" "pi:${T}/state/good/pi-agent/sessions"; do
            printf '%s\n' "${out}" | grep -qF "${want}" || { echo "FAIL: missing ${want}"; echo "${out}"; exit 1; }
          done
          if printf '%s\n' "${out}" | grep -qE '/bad/(projects|opencode-data/storage/message|pi-agent/sessions)'; then echo "FAIL: planted link passed on"; echo "${out}"; exit 1; fi
          echo "TOKSCALE_SYMLINK_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex "TOKSCALE_SYMLINK_OK|TOKSCALE_SKIPPED"
