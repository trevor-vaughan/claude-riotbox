  - name: the pi build assert passes on a well-formed tree and fails on each break for its own reason
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset CONTEXT_MODE_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED CONTEXT_MODE_DATA_DIR CONTEXT_MODE_PLATFORM
          export CONTEXT_MODE_BIN="${HOME}/.local/bin/context-mode"
          PKG="${HOME}/nvm/lib/node_modules/context-mode"
          mkdir -p "${HOME}/.local/bin" "${PKG}/build/adapters/pi" "${HOME}/.pi/agent"
          echo '{"pi":{"extensions":["./build/adapters/pi/extension.js"]}}' > "${PKG}/package.json"
          printf '' > "${PKG}/build/adapters/pi/extension.js"
          printf '%s\n' '#!/usr/bin/env bash' "exec \"/n/bin/node\" \"${PKG}/cli.bundle.mjs\" \"\$@\"" > "${CONTEXT_MODE_BIN}"
          chmod +x "${CONTEXT_MODE_BIN}"
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/container/context-mode-setup.sh"
          source "{{.riotbox_dir}}/agents/pi/context-mode.sh"
          T="${TEST_DIR}/t"
          mk() { rm -rf "${T}"; mkdir -p "${T}/build/adapters/pi"
            echo '{"pi":{"extensions":["./build/adapters/pi/extension.js"]}}' > "${T}/package.json"
            : > "${T}/build/adapters/pi/extension.js"
            echo 'export class PiAdapter extends BaseAdapter {}' > "${T}/build/adapters/pi/index.js"
            printf '%s\n' 'switch (p) {' '        case "pi": {' '            // PiAdapter pins storage.' '            const { PiAdapter } = await import("./pi/index.js");' '            return new PiAdapter();' '        }' > "${T}/build/adapters/detect.js"; }
          # expect_fail <label> <phrase>: build_assert must fail AND name <phrase> on stderr.
          expect_fail() {
            if agent_pi_context_mode_build_assert "${T}" 2>"${TEST_DIR}/err"; then echo "FAIL: $1 accepted"; exit 1; fi
            grep -qF -- "$2" "${TEST_DIR}/err" || { echo "FAIL: $1 failed for the wrong reason"; cat "${TEST_DIR}/err"; exit 1; }
          }
          mk; agent_pi_context_mode_build_assert "${T}" || { echo "FAIL: good tree rejected"; exit 1; }
          mk; echo '{"pi":{"extensions":["./other.js"]}}' > "${T}/package.json"
          expect_fail manifest 'no longer declares pi.extensions'
          mk; rm "${T}/build/adapters/pi/extension.js"
          expect_fail extension-file 'no longer ships build/adapters/pi/extension.js'
          mk; rm "${T}/build/adapters/pi/index.js"
          expect_fail index-missing 'no longer ships build/adapters/pi/index.js'
          mk; printf '%s\n' '    getSessionDir() { return "/x"; }' >> "${T}/build/adapters/pi/index.js"
          expect_fail override 'overrides getSessionDir()'
          mk; printf '%s\n' '    async getSessionDir() { return "/x"; }' >> "${T}/build/adapters/pi/index.js"
          expect_fail async-override 'overrides getSessionDir()'
          mk; printf '%s\n' '    getSessionDir = () => "/x";' >> "${T}/build/adapters/pi/index.js"
          expect_fail arrow-override 'overrides getSessionDir()'
          mk; printf '%s\n' 'class A{x(){}}getSessionDir(){return 1}' >> "${T}/build/adapters/pi/index.js"
          expect_fail minified-override 'overrides getSessionDir()'
          mk; printf '%s\n' '    // getSessionDir() is inherited' >> "${T}/build/adapters/pi/index.js"
          agent_pi_context_mode_build_assert "${T}" || { echo "FAIL: comment mention rejected"; exit 1; }
          mk; echo 'switch (p) {}' > "${T}/build/adapters/detect.js"
          expect_fail detect 'maps the platform id'
          mk; printf '%s\n' 'switch (p) {' '        case "pi": {' '            // PiAdapter pins storage.' '            return null;' '        }' > "${T}/build/adapters/detect.js"
          expect_fail comment-only-detect 'maps the platform id'
          echo "BUILD_ASSERT_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "BUILD_ASSERT_OK"

  - name: setup wires pi and exports its store, data root and platform
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset CONTEXT_MODE_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED CONTEXT_MODE_DATA_DIR CONTEXT_MODE_PLATFORM
          export CONTEXT_MODE_BIN="${HOME}/.local/bin/context-mode"
          PKG="${HOME}/nvm/lib/node_modules/context-mode"
          mkdir -p "${HOME}/.local/bin" "${PKG}/build/adapters/pi" "${HOME}/.pi/agent"
          echo '{"pi":{"extensions":["./build/adapters/pi/extension.js"]}}' > "${PKG}/package.json"
          printf '' > "${PKG}/build/adapters/pi/extension.js"
          printf '%s\n' '#!/usr/bin/env bash' "exec \"/n/bin/node\" \"${PKG}/cli.bundle.mjs\" \"\$@\"" > "${CONTEXT_MODE_BIN}"
          chmod +x "${CONTEXT_MODE_BIN}"
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/container/context-mode-setup.sh"
          source "{{.riotbox_dir}}/agents/registry.sh"
          echo '{"packages":["/x/ext"]}' > "${HOME}/.pi/agent/settings.json"
          export RIOTBOX_CONTEXT_MODE=1 RIOTBOX_AGENT=pi
          context_mode_setup >/dev/null 2>&1
          [[ "${CONTEXT_MODE_DIR:-}" == "${HOME}/.pi/agent/context-mode" ]] || { echo "FAIL: store '${CONTEXT_MODE_DIR:-}'"; exit 1; }
          [[ "${CONTEXT_MODE_DATA_DIR:-}" == "${HOME}/.pi/agent" ]] || { echo "FAIL: data '${CONTEXT_MODE_DATA_DIR:-}'"; exit 1; }
          [[ "${CONTEXT_MODE_PLATFORM:-}" == "pi" ]] || { echo "FAIL: platform"; exit 1; }
          jq -e --arg p "${PKG}" '.packages == ["/x/ext", $p]' "${HOME}/.pi/agent/settings.json" >/dev/null || { echo "FAIL: not wired"; exit 1; }
          export RIOTBOX_CONTEXT_MODE=0
          context_mode_setup >/dev/null 2>&1
          jq -e '.packages == ["/x/ext"]' "${HOME}/.pi/agent/settings.json" >/dev/null || { echo "FAIL: not stripped when off"; exit 1; }
          echo "SETUP_PI_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "SETUP_PI_OK"
