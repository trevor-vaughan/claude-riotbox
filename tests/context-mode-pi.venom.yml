name: agents/pi/context-mode.sh — Pi package wiring, stripping, and storage
vars:
  root: "."
  riotbox_dir: "{{.root}}"

# Context Mode reaches Pi as a Pi package: the installed context-mode root
# (which declares pi.extensions) is listed in the RiotBox-owned `packages`
# array of ~/.pi/agent/settings.json. Each case sources the verb file directly.

testcases:
  - name: store, data and platform pin Pi's storage inside the session mount
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset CONTEXT_MODE_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED CONTEXT_MODE_DATA_DIR CONTEXT_MODE_PLATFORM
          export CONTEXT_MODE_BIN="${HOME}/.local/bin/context-mode"
          PKG="${HOME}/nvm/lib/node_modules/context-mode"
          mkdir -p "${HOME}/.local/bin" "${PKG}/build/adapters/pi" "${HOME}/.pi/agent"
          echo '{"pi":{"extensions":["./build/adapters/pi/extension.js"]}}' > "${PKG}/package.json"
          printf '' > "${PKG}/build/adapters/pi/extension.js"
          printf '%s\n' '#!/usr/bin/env bash' "exec \"/n/bin/node\" \"${PKG}/cli.bundle.mjs\" \"\$@\"" > "${CONTEXT_MODE_BIN}"
          chmod +x "${CONTEXT_MODE_BIN}"
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/container/context-mode-setup.sh"
          source "{{.riotbox_dir}}/agents/pi/context-mode.sh"
          [[ "$(agent_pi_context_mode_store_dir)" == "${HOME}/.pi/agent/context-mode" ]] || { echo "FAIL: store"; exit 1; }
          [[ "$(agent_pi_context_mode_data_dir)" == "${HOME}/.pi/agent" ]] || { echo "FAIL: data root"; exit 1; }
          [[ "$(agent_pi_context_mode_platform)" == "pi" ]] || { echo "FAIL: platform"; exit 1; }
          echo "PINS_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PINS_OK"

  - name: wire appends the package root once and keeps existing packages
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset CONTEXT_MODE_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED CONTEXT_MODE_DATA_DIR CONTEXT_MODE_PLATFORM
          export CONTEXT_MODE_BIN="${HOME}/.local/bin/context-mode"
          PKG="${HOME}/nvm/lib/node_modules/context-mode"
          mkdir -p "${HOME}/.local/bin" "${PKG}/build/adapters/pi" "${HOME}/.pi/agent"
          echo '{"pi":{"extensions":["./build/adapters/pi/extension.js"]}}' > "${PKG}/package.json"
          printf '' > "${PKG}/build/adapters/pi/extension.js"
          printf '%s\n' '#!/usr/bin/env bash' "exec \"/n/bin/node\" \"${PKG}/cli.bundle.mjs\" \"\$@\"" > "${CONTEXT_MODE_BIN}"
          chmod +x "${CONTEXT_MODE_BIN}"
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/container/context-mode-setup.sh"
          source "{{.riotbox_dir}}/agents/pi/context-mode.sh"
          echo '{"packages":["/x/ext"],"k":1}' > "${HOME}/.pi/agent/settings.json"
          agent_pi_context_mode_wire 2>/dev/null
          agent_pi_context_mode_wire 2>/dev/null
          jq -e --arg p "${PKG}" '.packages == ["/x/ext", $p] and .k == 1' "${HOME}/.pi/agent/settings.json" >/dev/null \
            || { echo "FAIL"; cat "${HOME}/.pi/agent/settings.json"; exit 1; }
          echo "WIRE_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "WIRE_OK"

  - name: wire fails and writes nothing when the package has no pi.extensions
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          export HOME="${TEST_DIR}"
          unset CONTEXT_MODE_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED CONTEXT_MODE_DATA_DIR CONTEXT_MODE_PLATFORM
          export CONTEXT_MODE_BIN="${HOME}/.local/bin/context-mode"
          PKG="${HOME}/nvm/lib/node_modules/context-mode"
          mkdir -p "${HOME}/.local/bin" "${PKG}/build/adapters/pi" "${HOME}/.pi/agent"
          echo '{"pi":{"extensions":["./build/adapters/pi/extension.js"]}}' > "${PKG}/package.json"
          printf '' > "${PKG}/build/adapters/pi/extension.js"
          printf '%s\n' '#!/usr/bin/env bash' "exec \"/n/bin/node\" \"${PKG}/cli.bundle.mjs\" \"\$@\"" > "${CONTEXT_MODE_BIN}"
          chmod +x "${CONTEXT_MODE_BIN}"
          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          source "{{.riotbox_dir}}/container/context-mode-setup.sh"
          source "{{.riotbox_dir}}/agents/pi/context-mode.sh"
          echo '{}' > "${PKG}/package.json"
          echo '{"packages":[]}' > "${HOME}/.pi/agent/settings.json"
          if agent_pi_context_mode_wire 2>/dev/null; then echo "FAIL: returned 0"; exit 1; fi
          jq -e '.packages == []' "${HOME}/.pi/agent/settings.json" >/dev/null || { echo "FAIL: wrote"; exit 1; }
          echo "WIRE_REFUSE_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "WIRE_REFUSE_OK"

