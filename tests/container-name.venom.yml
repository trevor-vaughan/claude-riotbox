name: container name generation (truncation, hash, random suffix)
vars:
  root: "."
  riotbox_dir: "{{.root}}"

# Pins the shape of generate_container_name() in mount-projects.sh. Every
# name is a readable part plus a random 8-hex suffix, never derived from
# what the engine lists: two launches that probed for a free name could both
# find the same one free and then clash on --name, and nothing keys off the
# name (sessions are found by label and by mounts). The readable part of a
# set's name (a) fits within the 64-char cap with the suffix, (b) is the
# same for a set regardless of CLI ordering, and (c) differs for sets that
# share a trailing run of basenames, through the set hash. "Stable part"
# below is the name without its suffix.

testcases:
  - name: multi-project name fits within 64 chars
    steps:
      - type: exec
        script: |
          set -euo pipefail
          BASE="$(mktemp -d)"
          trap 'rm -rf "${BASE}"' EXIT
          for d in alpha bravo charlie delta echo-dir foxtrot golf hotel india juliet kilo lima; do
              mkdir -p "${BASE}/${d}"
          done
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/mount-projects.sh"
          generate_container_name \
              "${BASE}/alpha" "${BASE}/bravo" "${BASE}/charlie" "${BASE}/delta" \
              "${BASE}/echo-dir" "${BASE}/foxtrot" "${BASE}/golf" "${BASE}/hotel" \
              "${BASE}/india" "${BASE}/juliet" "${BASE}/kilo" "${BASE}/lima"
          echo "NAME=${CONTAINER_NAME}"
          echo "LEN=${#CONTAINER_NAME}"
          # Verify name starts with the riotbox prefix (not left-truncated away)
          case "${CONTAINER_NAME}" in
              riotbox-*) echo "PREFIX_OK" ;;
              *) echo "PREFIX_LOST" ;;
          esac
          # Verify only podman-legal characters
          if printf '%s' "${CONTAINER_NAME}" | grep -Eq '^[a-zA-Z0-9][a-zA-Z0-9_.-]*$'; then
              echo "CHARS_OK"
          else
              echo "CHARS_BAD"
          fi
          # Verify length <= 64
          if [ "${#CONTAINER_NAME}" -le 64 ]; then
              echo "LEN_OK"
          else
              echo "LEN_OVER"
          fi
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "PREFIX_OK"
          - result.systemout ShouldContainSubstring "CHARS_OK"
          - result.systemout ShouldContainSubstring "LEN_OK"

  - name: multi-project stable part is the same across argument orderings
    steps:
      - type: exec
        script: |
          set -euo pipefail
          BASE="$(mktemp -d)"
          trap 'rm -rf "${BASE}"' EXIT
          mkdir -p "${BASE}/aaa" "${BASE}/bbb" "${BASE}/ccc"
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/mount-projects.sh"
          generate_container_name "${BASE}/aaa" "${BASE}/bbb" "${BASE}/ccc"
          name1="${CONTAINER_NAME}"
          generate_container_name "${BASE}/ccc" "${BASE}/bbb" "${BASE}/aaa"
          name2="${CONTAINER_NAME}"
          echo "NAME1=${name1}"
          echo "NAME2=${name2}"
          if [ "${name1%-*}" = "${name2%-*}" ]; then echo "STABLE"; else echo "DIFFER"; fi
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "STABLE"

  - name: different project sets sharing a trailing tail do not collide
    steps:
      - type: exec
        script: |
          set -euo pipefail
          BASE="$(mktemp -d)"
          trap 'rm -rf "${BASE}"' EXIT
          # Two project sets that differ only in the first directory.
          # Under the old left-truncation strategy the long trailing tail
          # would dominate and the names would collide. Compared without the
          # random suffix, which would make any two names differ.
          mkdir -p "${BASE}/group1/unique-leader-aaaaaaaaaaaaaaaaaaaaa"
          mkdir -p "${BASE}/group2/unique-leader-bbbbbbbbbbbbbbbbbbbbb"
          for d in shared-tail-1 shared-tail-2 shared-tail-3 shared-tail-4 shared-tail-5; do
              mkdir -p "${BASE}/group1/${d}" "${BASE}/group2/${d}"
          done
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/mount-projects.sh"
          generate_container_name \
              "${BASE}/group1/unique-leader-aaaaaaaaaaaaaaaaaaaaa" \
              "${BASE}/group1/shared-tail-1" "${BASE}/group1/shared-tail-2" \
              "${BASE}/group1/shared-tail-3" "${BASE}/group1/shared-tail-4" \
              "${BASE}/group1/shared-tail-5"
          name1="${CONTAINER_NAME}"
          generate_container_name \
              "${BASE}/group2/unique-leader-bbbbbbbbbbbbbbbbbbbbb" \
              "${BASE}/group2/shared-tail-1" "${BASE}/group2/shared-tail-2" \
              "${BASE}/group2/shared-tail-3" "${BASE}/group2/shared-tail-4" \
              "${BASE}/group2/shared-tail-5"
          name2="${CONTAINER_NAME}"
          echo "NAME1=${name1}"
          echo "NAME2=${name2}"
          if [ "${name1%-*}" != "${name2%-*}" ]; then echo "UNIQUE"; else echo "COLLIDE"; fi
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "UNIQUE"

  - name: multi-project name carries the first basename, a project-count marker, the hash and a suffix
    steps:
      - type: exec
        script: |
          set -euo pipefail
          BASE="$(mktemp -d)"
          trap 'rm -rf "${BASE}"' EXIT
          mkdir -p "${BASE}/alpha" "${BASE}/bravo" "${BASE}/charlie"
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/mount-projects.sh"
          # Sorted order is alpha < bravo < charlie, so alpha is the first.
          generate_container_name "${BASE}/charlie" "${BASE}/alpha" "${BASE}/bravo"
          echo "NAME=${CONTAINER_NAME}"
          hash="$(session_set_hash "${BASE}/alpha" "${BASE}/bravo" "${BASE}/charlie")"
          printf '%s\n' "${CONTAINER_NAME}" | grep -Eqx "riotbox-alpha-2more-${hash}-[0-9a-f]{8}" \
            && echo "SHAPE_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "SHAPE_OK"

  - name: single-project name is riotbox-basename plus a random suffix
    steps:
      - type: exec
        script: |
          set -euo pipefail
          BASE="$(mktemp -d)"
          trap 'rm -rf "${BASE}"' EXIT
          mkdir -p "${BASE}/my project"
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/mount-projects.sh"
          generate_container_name "${BASE}/my project"
          echo "NAME=${CONTAINER_NAME}"
          printf '%s\n' "${CONTAINER_NAME}" | grep -Eqx 'riotbox-my-project-[0-9a-f]{8}' && echo "SHAPE_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "SHAPE_OK"

  - name: two launches of one project or set get different names without asking the engine
    steps:
      - type: exec
        script: |
          set -euo pipefail
          BASE="$(mktemp -d)"
          trap 'rm -rf "${BASE}"' EXIT
          mkdir -p "${BASE}/alpha" "${BASE}/bravo"
          # An engine that records any call: naming must not consult it, since
          # a name found free can be taken before the container is created.
          printf '#!/usr/bin/env bash\necho called >>"%s/engine.log"\n' "${BASE}" >"${BASE}/engine"
          chmod +x "${BASE}/engine"
          export CONTAINER_CMD="${BASE}/engine"
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/mount-projects.sh"
          for set in "${BASE}/alpha" "${BASE}/alpha ${BASE}/bravo"; do
            # shellcheck disable=SC2086 # split the set on purpose
            generate_container_name ${set}
            first="${CONTAINER_NAME}"
            # shellcheck disable=SC2086
            generate_container_name ${set}
            second="${CONTAINER_NAME}"
            echo "FIRST=${first} SECOND=${second}"
            [ "${first}" != "${second}" ] || { echo "BAD: same name twice" >&2; exit 1; }
            [ "${first%-*}" = "${second%-*}" ] || { echo "BAD: stable part differs" >&2; exit 1; }
          done
          [ ! -e "${BASE}/engine.log" ] || { echo "BAD: naming asked the engine" >&2; exit 1; }
          echo "OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "OK"

  - name: a long first basename is trimmed to keep the cap, the hash and the suffix
    steps:
      - type: exec
        script: |
          set -euo pipefail
          BASE="$(mktemp -d)"
          trap 'rm -rf "${BASE}"' EXIT
          long="a-very-long-leading-project-directory-name-that-fills-the-name"
          mkdir -p "${BASE}/${long}" "${BASE}/zulu"
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/mount-projects.sh"
          generate_container_name "${BASE}/${long}" "${BASE}/zulu"
          name="${CONTAINER_NAME}"
          echo "NAME=${name}"
          hash="$(session_set_hash "${BASE}/${long}" "${BASE}/zulu")"
          [ "${#name}" -le 64 ] || { echo "BAD: ${#name} chars" >&2; exit 1; }
          printf '%s\n' "${name}" | grep -Eqx "riotbox-a-very-[a-z-]*-1more-${hash}-[0-9a-f]{8}" \
            || { echo "BAD: prefix, marker, hash or suffix lost" >&2; exit 1; }
          echo "OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "OK"

  - name: a long single-project basename is trimmed to keep the prefix, the cap and the suffix
    steps:
      - type: exec
        script: |
          set -euo pipefail
          BASE="$(mktemp -d)"
          trap 'rm -rf "${BASE}"' EXIT
          long="project-$(printf 'x%.0s' $(seq 1 80))"
          mkdir -p "${BASE}/${long}"
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/scripts/mount-projects.sh"
          generate_container_name "${BASE}/${long}"
          name="${CONTAINER_NAME}"
          echo "NAME=${name}"
          [ "${#name}" -le 64 ] || { echo "BAD: ${#name} chars" >&2; exit 1; }
          printf '%s\n' "${name}" | grep -Eqx 'riotbox-project-x+-[0-9a-f]{8}' \
            || { echo "BAD: prefix or suffix lost" >&2; exit 1; }
          echo "OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "OK"
