name: Context Mode — launcher guard and doctor preflight
vars:
  root: "."
  riotbox_dir: "{{.root}}"

# RIOTBOX_CONTEXT_MODE and RIOTBOX_HEADROOM both keep tool output out of the
# model's context, at different layers — headroom compresses payloads in
# flight through a proxy, Context Mode keeps them out of the transcript
# through a PreToolUse hook. They compose in principle, but the combination is
# unmeasured and doubles the surface where a session can misbehave, so the
# launcher refuses the pair the way it refuses RIOTBOX_NESTED with
# RIOTBOX_SOCKET. The doctor check catches the same pair, because a value
# persisted in ~/.config/riotbox/config would otherwise only surface at launch.

testcases:
  - name: launcher refuses context-mode together with headroom
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          out="$(RIOTBOX_CONTEXT_MODE=1 RIOTBOX_HEADROOM=1 \
                 XDG_CONFIG_HOME="${TEST_DIR}/config" \
                 RIOTBOX_SYSCONF_DIR="${TEST_DIR}/etc" \
                 CONTAINER_CMD=/bin/true IMAGE_NAME=riotbox \
                 ROOT_DIR="{{.riotbox_dir}}" \
                 bash "{{.riotbox_dir}}/libexec/launch.sh" true 2>&1)" && rc=0 || rc=$?

          [ "${rc}" = "1" ] || { echo "FAIL: expected exit 1, got ${rc}"; exit 1; }
          echo "${out}" | grep -q "mutually exclusive" \
            || { echo "FAIL: no mutual-exclusion message: ${out}"; exit 1; }
          echo "${out}" | grep -q "RIOTBOX_CONTEXT_MODE" \
            || { echo "FAIL: message does not name the variable: ${out}"; exit 1; }
          echo "mutex=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "mutex=pass"

  - name: launcher guard fires before any mount or session setup
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          # A session directory under a throwaway XDG_DATA_HOME: if the guard
          # let the launch reach setup_projects, that tree would be created.
          RIOTBOX_CONTEXT_MODE=1 RIOTBOX_HEADROOM=1 \
            XDG_CONFIG_HOME="${TEST_DIR}/config" \
            XDG_DATA_HOME="${TEST_DIR}/data" \
            RIOTBOX_SYSCONF_DIR="${TEST_DIR}/etc" \
            CONTAINER_CMD=/bin/true IMAGE_NAME=riotbox \
            ROOT_DIR="{{.riotbox_dir}}" \
            bash "{{.riotbox_dir}}/libexec/launch.sh" true >/dev/null 2>&1 || true

          [ ! -d "${TEST_DIR}/data/riotbox" ] \
            || { echo "FAIL: session setup ran before the guard"; exit 1; }
          echo "mutex_early=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "mutex_early=pass"

  # The seam. `${RIOTBOX_CONTEXT_MODE:+-e RIOTBOX_CONTEXT_MODE=…}` in
  # libexec/launch.sh is the only thing joining the host-side toggle to the
  # in-container consumer. Drop or mistype it and nothing else complains: the
  # launcher still accepts the toggle, `riotbox doctor` still reports [ok], and
  # context_mode_setup sees an unset variable — so it takes the off branch and
  # *strips* wiring instead of writing it. A feature that reports healthy
  # everywhere and does nothing. Same shape as the RIOTBOX_HEADROOM passthrough
  # test in tests/headroom.venom.yml: a fake CONTAINER_CMD dumps its argv.
  - name: launch.sh passes -e RIOTBOX_CONTEXT_MODE into the container when enabled
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"; trap 'rm -rf "${TMP}"' EXIT
          mkdir -p "${TMP}/etc" "${TMP}/xdg" "${TMP}/data" "${TMP}/proj"
          cat > "${TMP}/fake-cmd" <<'FAKE'
          #!/usr/bin/env bash
          printf '%s\n' "$*" > "${CAPTURE}"
          FAKE
          chmod +x "${TMP}/fake-cmd"
          export CAPTURE="${TMP}/argv"
          # The two toggles are mutually exclusive and the launcher refuses the
          # pair, so shed any ambient headroom env before asking for this one.
          unset RIOTBOX_HEADROOM RIOTBOX_HEADROOM_ACTIVE
          RIOTBOX_CONTEXT_MODE=1 \
          RIOTBOX_DRY_RUN=1 \
          RIOTBOX_PROJECTS="${TMP}/proj" \
          RIOTBOX_DATA_DIR="${TMP}/data" \
          RIOTBOX_SYSCONF_DIR="${TMP}/etc" XDG_CONFIG_HOME="${TMP}/xdg" HOME="${TMP}" \
          ROOT_DIR="{{.riotbox_dir}}" CONTAINER_CMD="${TMP}/fake-cmd" IMAGE_NAME=riotbox \
            bash "{{.riotbox_dir}}/libexec/launch.sh" bash
          argv="$(cat "${CAPTURE}")"
          echo "ARGV=${argv}"
          echo "${argv}" | grep -q -- "-e RIOTBOX_CONTEXT_MODE=1" \
            || { echo "BAD: -e RIOTBOX_CONTEXT_MODE=1 missing from container argv" >&2; exit 1; }
          echo "OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "-e RIOTBOX_CONTEXT_MODE=1"
          - result.systemout ShouldContainSubstring "OK"

  # The other half of the seam: an unset toggle must not reach the container at
  # all. A passthrough written without the `:+` expansion emits a bare
  # `-e RIOTBOX_CONTEXT_MODE` on every launch, which podman resolves from the
  # host environment — turning "unset here" into "whatever the host had".
  - name: launch.sh emits no context-mode env when the toggle is unset
    steps:
      - type: exec
        script: |
          set -euo pipefail
          TMP="$(mktemp -d)"; trap 'rm -rf "${TMP}"' EXIT
          mkdir -p "${TMP}/etc" "${TMP}/xdg" "${TMP}/data" "${TMP}/proj"
          cat > "${TMP}/fake-cmd" <<'FAKE'
          #!/usr/bin/env bash
          printf '%s\n' "$*" > "${CAPTURE}"
          FAKE
          chmod +x "${TMP}/fake-cmd"
          export CAPTURE="${TMP}/argv"
          # Gate-off means gate-off: shed any ambient toggle (e.g. when this
          # suite itself runs inside a context-mode-enabled riotbox session).
          unset RIOTBOX_CONTEXT_MODE
          RIOTBOX_DRY_RUN=1 \
          RIOTBOX_PROJECTS="${TMP}/proj" \
          RIOTBOX_DATA_DIR="${TMP}/data" \
          RIOTBOX_SYSCONF_DIR="${TMP}/etc" XDG_CONFIG_HOME="${TMP}/xdg" HOME="${TMP}" \
          ROOT_DIR="{{.riotbox_dir}}" CONTAINER_CMD="${TMP}/fake-cmd" IMAGE_NAME=riotbox \
            bash "{{.riotbox_dir}}/libexec/launch.sh" bash
          argv="$(cat "${CAPTURE}")"
          echo "ARGV=${argv}"
          echo "${argv}" | grep -q "RIOTBOX_CONTEXT_MODE" \
            && { echo "BAD: context-mode env leaked into a default launch" >&2; exit 1; }
          echo "OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldNotContainSubstring "RIOTBOX_CONTEXT_MODE"
          - result.systemout ShouldContainSubstring "OK"

  # "Not requested" has two arms — unset, and the literal 0 a user who read the
  # docs and turned the feature back off leaves behind — and only the unset arm
  # was ever walked here. Drop the `= "0"` clause from the predicate and the
  # explicit opt-out falls through to the "not recognized" arm below, so doctor
  # fails with exit 22 for doing exactly what the docs say, with a hint telling
  # the user to unset a variable they deliberately set. Both arms run here for
  # that reason, and both assert the reported value as well as the code: the
  # report echoes back what doctor read, which is the whole point of reporting
  # a no-op check at all.
  #
  # XDG_CONFIG_HOME and RIOTBOX_SYSCONF_DIR are isolated before the source, and
  # the two output knobs unset, for the reason spelled out above the image cases
  # further down: preflight.sh sources both config files as arbitrary shell, and
  # a developer's own RIOTBOX_DOCTOR_QUIET=1 suppresses every [ok] line — which
  # is the line this case reads.
  - name: doctor passes when the feature is not requested
    steps:
      - type: exec
        script: |
          set -e
          TMP="$(mktemp -d)"; trap 'rm -rf "${TMP}"' EXIT
          mkdir -p "${TMP}/xdg" "${TMP}/etc"
          export XDG_CONFIG_HOME="${TMP}/xdg" RIOTBOX_SYSCONF_DIR="${TMP}/etc"
          unset RIOTBOX_DOCTOR_JSON RIOTBOX_DOCTOR_QUIET
          source "{{.riotbox_dir}}/scripts/preflight.sh"
          for value in unset 0; do
            if [ "${value}" = "unset" ]; then
              unset RIOTBOX_CONTEXT_MODE
            else
              export RIOTBOX_CONTEXT_MODE="${value}"
            fi
            rc=0
            out="$(preflight_check_context_mode 2>&1)" || rc=$?
            [ "${rc}" = "0" ] \
              || { echo "FAIL (${value}): expected 0, got ${rc}: ${out}"; exit 1; }
            echo "${out}" | grep -q "not requested" \
              || { echo "FAIL (${value}): opting out is not reported as a no-op: ${out}"; exit 1; }
            # The unset arm renders as the literal "unset" by the same
            # substitution, so one grep covers both values.
            echo "${out}" | grep -q "RIOTBOX_CONTEXT_MODE=${value}" \
              || { echo "FAIL (${value}): report does not echo the value read: ${out}"; exit 1; }
          done
          echo "doctor_not_requested=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "doctor_not_requested=pass"

  - name: doctor fails with exit 22 on an unrecognized value
    steps:
      - type: exec
        script: |
          set -e
          source "{{.riotbox_dir}}/scripts/preflight.sh"
          export RIOTBOX_CONTEXT_MODE=true
          rc=0
          out="$(preflight_check_context_mode 2>&1)" || rc=$?
          [ "${rc}" = "22" ] || { echo "FAIL: expected 22, got ${rc}"; exit 1; }
          echo "${out}" | grep -q "not recognized" \
            || { echo "FAIL: no hint about the bad value: ${out}"; exit 1; }
          echo "doctor_badvalue=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "doctor_badvalue=pass"

  - name: doctor fails with exit 22 when both context features are enabled
    steps:
      - type: exec
        script: |
          set -e
          source "{{.riotbox_dir}}/scripts/preflight.sh"
          export RIOTBOX_CONTEXT_MODE=1 RIOTBOX_HEADROOM=1
          rc=0
          out="$(preflight_check_context_mode 2>&1)" || rc=$?
          [ "${rc}" = "22" ] || { echo "FAIL: expected 22, got ${rc}"; exit 1; }
          echo "${out}" | grep -q "mutually exclusive" \
            || { echo "FAIL: no mutual-exclusion hint: ${out}"; exit 1; }
          echo "doctor_mutex=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "doctor_mutex=pass"

  # Everything above returns before the image is ever consulted, so the three
  # branches that decide whether a real, opted-in session can start were never
  # reached: the podman/image guard, the in-image probe, and the [ok] report a
  # working image is supposed to produce. podman is stubbed on PATH the way
  # tests/doctor-headroom.venom.yml stubs it, so these run without a container
  # runtime.
  #
  # All three isolate XDG_CONFIG_HOME and RIOTBOX_SYSCONF_DIR, and do it before
  # the `source`. preflight.sh sources both config files at file level as
  # arbitrary shell (scripts/preflight.sh:78-83) — deliberately, so a library
  # caller sees the same layering an executed doctor does — which means the
  # developer's own ~/.config/riotbox/config runs inside these cases. The
  # earlier cases in this file happen to survive that because they assert on
  # message text that every output mode preserves; these three assert on the
  # rendered `[ok]`/`[fail]` gutter, so a single `: "${RIOTBOX_DOCTOR_JSON:=1}"`
  # in a developer's config would fail all three against unmodified code. The
  # two output knobs are unset for the same reason: they can arrive from the
  # ambient environment as well as from a config file.
  #
  # RIOTBOX_AGENT is pinned to claude in each of them rather than left to the
  # ambient value, and that is not a formality. The check returns before the
  # image is consulted for an agent with no Context Mode support, so these cases
  # reach the probe at all only because the agent in scope has the storage verb —
  # and bin/riotbox always sets RIOTBOX_AGENT while libexec/launch.sh always
  # forwards it, so running this suite inside an `--agent=opencode` container
  # would silently move every one of them onto the other agent. claude is the
  # default and the only supported agent with no wire verb, which makes the pin
  # the anchor for the image path as well: a check that probed for a wire verb
  # would report the default agent as unsupported and never run the probe these
  # cases assert on.
  - name: doctor reports ok when the stubbed image carries a working context-mode
    steps:
      - type: exec
        script: |
          set -e
          TMP="$(mktemp -d)"; trap 'rm -rf "${TMP}"' EXIT
          mkdir -p "${TMP}/xdg" "${TMP}/etc"
          # Exported so the stub, which runs as a grandchild of this shell, can
          # write where this shell reads. Each argument is recorded NUL-ended,
          # so the probe script and the JSON passed with -e survive as one
          # argument each instead of being re-split on whitespace.
          export RUN_ARGV="${TMP}/run-argv" RUN_STORE="${TMP}/run-store"
          cat > "${TMP}/podman" <<'STUB'
          #!/usr/bin/env bash
          case "$1" in
            image) exit 0 ;;   # `podman image exists <img>`
            run)
              printf '%s\0' "$@" > "${RUN_ARGV}"
              # The store mount's source, as the container would see it: it
              # has to exist while the probe runs.
              for a in "$@"; do
                case "${a}" in
                  *:/home/llm/.context-mode:z)
                    src="${a%:/home/llm/.context-mode:z}"
                    printf '%s\n' "${src}" > "${RUN_STORE}"
                    [ -d "${src}" ] || exit 1 ;;
                esac
              done
              exit 0 ;;
          esac
          exit 1
          STUB
          chmod +x "${TMP}/podman"
          export PATH="${TMP}:${PATH}"
          export XDG_CONFIG_HOME="${TMP}/xdg" RIOTBOX_SYSCONF_DIR="${TMP}/etc"
          unset RIOTBOX_DOCTOR_JSON RIOTBOX_DOCTOR_QUIET
          unset CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED
          source "{{.riotbox_dir}}/scripts/preflight.sh"
          export RIOTBOX_CONTEXT_MODE=1 RIOTBOX_AGENT=claude
          unset RIOTBOX_HEADROOM
          rc=0
          out="$(preflight_check_context_mode 2>&1)" || rc=$?
          echo "${out}"
          [ "${rc}" = "0" ] || { echo "FAIL: expected 0, got ${rc}"; exit 1; }
          echo "${out}" | grep -q "\[ok\]" \
            || { echo "FAIL: no [ok] report for a working image: ${out}"; exit 1; }
          echo "${out}" | grep -q "not requested" \
            && { echo "FAIL: reported not-requested with the toggle on: ${out}"; exit 1; }

          # The [ok] above says only that podman exited 0, which the stub does
          # unconditionally. What the check is worth is in what it runs and how,
          # so the recorded argv is read back one argument at a time.
          [ -f "${RUN_ARGV}" ] \
            || { echo "FAIL: the check never ran the in-image probe"; exit 1; }
          mapfile -d '' argv < "${RUN_ARGV}"
          has_arg() { local a; for a in "${argv[@]}"; do [ "${a}" = "$1" ] && return 0; done; return 1; }
          arg_after() { local i; for ((i = 0; i < ${#argv[@]} - 1; i++)); do
            [ "${argv[i]}" = "$1" ] && { printf '%s' "${argv[i+1]}"; return 0; }; done; return 1; }

          # Offline, and outside the riotbox entrypoint, as before.
          has_arg "--network=none" \
            || { echo "FAIL: probe does not run offline"; exit 1; }
          [ "$(arg_after --entrypoint)" = "/usr/bin/bash" ] \
            || { echo "FAIL: probe does not bypass the riotbox entrypoint"; exit 1; }

          # The script the container runs is the shipped probe file, byte for
          # byte, so the body case below tests what doctor sends.
          [ "$(arg_after -c)" = "$(cat "{{.riotbox_dir}}/scripts/lib/context-mode-probe.sh")" ] \
            || { echo "FAIL: the probe sent is not scripts/lib/context-mode-probe.sh"; exit 1; }

          # The pins are the Containerfile's, and the hook table is the file the
          # build compares against, so doctor and build judge one thing.
          cf="{{.riotbox_dir}}/Containerfile"
          pin="$(sed -n 's/^ARG CONTEXT_MODE_VERSION=//p' "${cf}" | head -1)"
          node_pin="$(sed -n 's/^ARG CONTEXT_MODE_NODE=//p' "${cf}" | head -1)"
          hooks="$(jq -Sc . "{{.riotbox_dir}}/container/context-mode-hooks-expected.json")"
          [ -n "${pin}" ] && [ -n "${node_pin}" ] || { echo "FAIL: fixture cannot read the pins"; exit 1; }
          has_arg "CM_PIN=${pin}" || { echo "FAIL: probe not handed CM_PIN=${pin}"; exit 1; }
          has_arg "CM_NODE_PIN=${node_pin}" || { echo "FAIL: probe not handed CM_NODE_PIN=${node_pin}"; exit 1; }
          has_arg "CM_HOOKS_EXPECTED=${hooks}" || { echo "FAIL: probe not handed the expected hook table"; exit 1; }

          # The store is mounted the way a session mounts it: a host directory
          # at ~/.context-mode, relabelled, under the launcher's keep-id user
          # mapping — without that mapping the image user cannot write a host
          # directory, and the probe would test a session nobody runs.
          has_arg "--userns=keep-id:uid=$(id -u),gid=$(id -g)" \
            || { echo "FAIL: probe does not map the user the way the launcher does"; exit 1; }
          [ "$(arg_after --user)" = "$(id -u):$(id -g)" ] \
            || { echo "FAIL: probe does not run as the launcher's --user"; exit 1; }
          [ -s "${RUN_STORE}" ] || { echo "FAIL: no store mounted at /home/llm/.context-mode"; exit 1; }
          [ ! -e "$(cat "${RUN_STORE}")" ] \
            || { echo "FAIL: the scratch store $(cat "${RUN_STORE}") was left behind"; exit 1; }
          echo "doctor_image_ok=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "[ok]"
          - result.systemout ShouldNotContainSubstring "not requested"
          - result.systemout ShouldContainSubstring "doctor_image_ok=pass"

  # An image that was never built is a different problem from an image that was
  # built wrong, and the two hints send the user to different commands. Pinning
  # the hint, not just the code, is what keeps them from collapsing into one.
  - name: doctor fails with exit 22 and names riotbox build when the image is missing
    steps:
      - type: exec
        script: |
          set -e
          TMP="$(mktemp -d)"; trap 'rm -rf "${TMP}"' EXIT
          mkdir -p "${TMP}/xdg" "${TMP}/etc"
          cat > "${TMP}/podman" <<'STUB'
          #!/usr/bin/env bash
          exit 1
          STUB
          chmod +x "${TMP}/podman"
          export PATH="${TMP}:${PATH}"
          export XDG_CONFIG_HOME="${TMP}/xdg" RIOTBOX_SYSCONF_DIR="${TMP}/etc"
          unset RIOTBOX_DOCTOR_JSON RIOTBOX_DOCTOR_QUIET
          source "{{.riotbox_dir}}/scripts/preflight.sh"
          export RIOTBOX_CONTEXT_MODE=1 RIOTBOX_AGENT=claude
          unset RIOTBOX_HEADROOM
          rc=0
          out="$(preflight_check_context_mode 2>&1)" || rc=$?
          echo "${out}"
          [ "${rc}" = "22" ] || { echo "FAIL: expected 22, got ${rc}"; exit 1; }
          echo "${out}" | grep -q "riotbox build" \
            || { echo "FAIL: hint does not name riotbox build: ${out}"; exit 1; }
          echo "${out}" | grep -q "riotbox rebuild" \
            && { echo "FAIL: sent the user to rebuild for an image that is not there: ${out}"; exit 1; }
          echo "doctor_image_missing=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "[fail]"
          - result.systemout ShouldContainSubstring "riotbox build"
          - result.systemout ShouldContainSubstring "doctor_image_missing=pass"

  # The image exists but the in-image probe fails. `riotbox build` is a no-op
  # against an image that already exists, so this arm has to say rebuild, and
  # it has to say what the probe found: every check in it prints one line on
  # stderr naming the fault, and a bare "rebuild" would hide which one.
  - name: doctor fails with exit 22, names riotbox rebuild and the probe's finding when the in-image probe fails
    steps:
      - type: exec
        script: |
          set -e
          TMP="$(mktemp -d)"; trap 'rm -rf "${TMP}"' EXIT
          mkdir -p "${TMP}/xdg" "${TMP}/etc"
          cat > "${TMP}/podman" <<'STUB'
          #!/usr/bin/env bash
          case "$1" in
            image) exit 0 ;;   # the image is there
            run)               # …but the probe inside it finds a fault
              echo "first line of noise" >&2
              echo "context-mode --version is '2.1.3', this riotbox pins 2.1.4" >&2
              exit 1 ;;
          esac
          exit 1
          STUB
          chmod +x "${TMP}/podman"
          export PATH="${TMP}:${PATH}"
          export XDG_CONFIG_HOME="${TMP}/xdg" RIOTBOX_SYSCONF_DIR="${TMP}/etc"
          unset RIOTBOX_DOCTOR_JSON RIOTBOX_DOCTOR_QUIET
          unset CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED
          source "{{.riotbox_dir}}/scripts/preflight.sh"
          export RIOTBOX_CONTEXT_MODE=1 RIOTBOX_AGENT=claude
          unset RIOTBOX_HEADROOM
          rc=0
          out="$(preflight_check_context_mode 2>&1)" || rc=$?
          echo "${out}"
          [ "${rc}" = "22" ] || { echo "FAIL: expected 22, got ${rc}"; exit 1; }
          echo "${out}" | grep -q "riotbox rebuild" \
            || { echo "FAIL: hint does not name riotbox rebuild: ${out}"; exit 1; }
          echo "${out}" | grep -q -F "this riotbox pins 2.1.4" \
            || { echo "FAIL: hint does not carry the probe's finding: ${out}"; exit 1; }

          # A probe that dies without a word (podman itself failing, say) still
          # gets a hint that says so rather than an empty one.
          cat > "${TMP}/podman" <<'STUB'
          #!/usr/bin/env bash
          case "$1" in
            image) exit 0 ;;
            run)   exit 1 ;;
          esac
          exit 1
          STUB
          rc=0
          out="$(preflight_check_context_mode 2>&1)" || rc=$?
          echo "${out}"
          [ "${rc}" = "22" ] || { echo "FAIL: silent probe, expected 22, got ${rc}"; exit 1; }
          echo "${out}" | grep -q "without saying why" \
            || { echo "FAIL: a silent probe failure is not reported as one: ${out}"; exit 1; }
          echo "${out}" | grep -q "riotbox rebuild" \
            || { echo "FAIL: silent probe, hint does not name riotbox rebuild: ${out}"; exit 1; }
          echo "doctor_image_probe_fails=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "[fail]"
          - result.systemout ShouldContainSubstring "riotbox rebuild"
          - result.systemout ShouldContainSubstring "doctor_image_probe_fails=pass"

  # The pins and the hook table the probe is handed come from the install tree
  # doctor runs from. Without them there is nothing to compare the image to,
  # and the check fails before starting a container rather than passing the
  # probe empty values it would read as a mismatch. PREFLIGHT_SCRIPT_DIR is
  # pointed at a copy of scripts/ beside a reduced tree, the only way to give
  # the sourced file a different Containerfile.
  - name: doctor fails with exit 22 when the install tree has no Context Mode pins or hook table
    steps:
      - type: exec
        script: |
          set -e
          TMP="$(mktemp -d)"; trap 'rm -rf "${TMP}"' EXIT
          mkdir -p "${TMP}/xdg" "${TMP}/etc" "${TMP}/tree/container"
          export RUN_MARK="${TMP}/ran"
          cat > "${TMP}/podman" <<'STUB'
          #!/usr/bin/env bash
          case "$1" in
            image) exit 0 ;;
            run)   touch "${RUN_MARK}"; exit 0 ;;
          esac
          exit 1
          STUB
          chmod +x "${TMP}/podman"
          export PATH="${TMP}:${PATH}"
          export XDG_CONFIG_HOME="${TMP}/xdg" RIOTBOX_SYSCONF_DIR="${TMP}/etc"
          unset RIOTBOX_DOCTOR_JSON RIOTBOX_DOCTOR_QUIET
          unset CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED
          source "{{.riotbox_dir}}/scripts/preflight.sh"
          export RIOTBOX_CONTEXT_MODE=1 RIOTBOX_AGENT=claude
          unset RIOTBOX_HEADROOM
          cp -r "{{.riotbox_dir}}/scripts" "${TMP}/tree/scripts"
          PREFLIGHT_SCRIPT_DIR="${TMP}/tree/scripts"

          # 1. A Containerfile with no Context Mode ARGs.
          echo "FROM scratch" > "${TMP}/tree/Containerfile"
          cp "{{.riotbox_dir}}/container/context-mode-hooks-expected.json" "${TMP}/tree/container/"
          rc=0
          out="$(preflight_check_context_mode 2>&1)" || rc=$?
          echo "${out}"
          [ "${rc}" = "22" ] || { echo "FAIL: no pins, expected 22, got ${rc}"; exit 1; }
          echo "${out}" | grep -q "CONTEXT_MODE_VERSION" \
            || { echo "FAIL: no pins, hint does not name the ARG: ${out}"; exit 1; }
          [ ! -e "${RUN_MARK}" ] || { echo "FAIL: no pins, but the probe ran anyway"; exit 1; }

          # 2. Pins present, the hook table missing.
          grep -E '^ARG CONTEXT_MODE_(VERSION|NODE)=' "{{.riotbox_dir}}/Containerfile" \
            > "${TMP}/tree/Containerfile"
          rm "${TMP}/tree/container/context-mode-hooks-expected.json"
          rc=0
          out="$(preflight_check_context_mode 2>&1)" || rc=$?
          echo "${out}"
          [ "${rc}" = "22" ] || { echo "FAIL: no hook table, expected 22, got ${rc}"; exit 1; }
          echo "${out}" | grep -q "context-mode-hooks-expected.json" \
            || { echo "FAIL: no hook table, hint does not name the file: ${out}"; exit 1; }
          [ ! -e "${RUN_MARK}" ] || { echo "FAIL: no hook table, but the probe ran anyway"; exit 1; }

          # 3. Control: both restored, the probe runs and the check passes.
          cp "{{.riotbox_dir}}/container/context-mode-hooks-expected.json" "${TMP}/tree/container/"
          rc=0
          out="$(preflight_check_context_mode 2>&1)" || rc=$?
          [ "${rc}" = "0" ] || { echo "FAIL: control, expected 0, got ${rc}: ${out}"; exit 1; }
          [ -e "${RUN_MARK}" ] || { echo "FAIL: control, the probe never ran"; exit 1; }
          echo "doctor_pins=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "doctor_pins=pass"

  # The cases above stub `podman run`, so the probe body never executes there.
  # This one runs scripts/lib/context-mode-probe.sh the way doctor sends it
  # (`bash -c "<file contents>"`) against a fake image layout under a temporary
  # HOME: the shim at ~/.local/bin/context-mode exec'ing an absolute Node
  # against the package's cli.mjs, the staged package under
  # ~/.riotbox/context-mode-plugin/v<pin>, and a writable ~/.context-mode. The
  # bundles are small stand-ins run on the Node on PATH, written to answer the
  # way 2.x does for exactly the calls the probe makes; the image build runs
  # the same probes against the real package.
  #
  # Shape 1 is the positive control the others are read against: without it,
  # a fixture the probe rejected for an unrelated reason would make every
  # negative shape pass while discriminating nothing. Each negative shape
  # breaks one thing and must fail with a message naming it.
  - name: the probe body exits 0 on a healthy 2.x image and names the fault on every broken one
    steps:
      - type: exec
        script: |
          set -e
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          # shellcheck disable=SC1091
          source "{{.riotbox_dir}}/tests/lib/context-mode-store-helpers.sh"
          cm_require_node probe_body
          umask 022
          TMP="$(mktemp -d)"
          # Shape "store not writable" chmods a directory 0555 on purpose, so
          # a plain `rm -rf` in the trap cannot empty it.
          trap 'chmod -R u+w "${TMP}" 2>/dev/null; rm -rf "${TMP}"' EXIT
          unset CONTEXT_MODE_DIR CONTEXT_MODE_DATA_DIR RIOTBOX_CONTEXT_MODE RIOTBOX_AGENT _CONTEXT_MODE_WIRED
          unset RIOTBOX_CM_PLUGIN_DIR
          probe="$(cat "{{.riotbox_dir}}/scripts/lib/context-mode-probe.sh")"
          NODE_EXE="$(command -v node)"
          PIN=2.1.4
          NODE_PIN="$("${NODE_EXE}" --version)"; NODE_PIN="${NODE_PIN#v}"
          HOOKS_EXPECTED="$(jq -Sc . "{{.riotbox_dir}}/container/context-mode-hooks-expected.json")"

          # The probe's last check writes to ~/.context-mode, which as root
          # passes whatever the mode, so the store-not-writable shape could
          # never fail and would pass while proving nothing. As uid 0 the
          # probe drops to uid 65534 instead of skipping. Fixtures stay owned
          # by the runner and world-readable, which is how the image user reads
          # a tree the build left; the store directory is made writable for
          # "whoever the probe runs as" with 0777 in the healthy shapes.
          PROBE_AS=""
          if [ "$(id -u)" = "0" ]; then
            command -v setpriv >/dev/null \
              || { echo "FAIL: running as root without setpriv — cannot drop privileges, and the store shape is meaningless as uid 0"; exit 1; }
            PROBE_AS="setpriv --reuid=65534 --regid=65534 --clear-groups"
            chmod 0755 "${TMP}"
            # A drop that does not work would blame the probe for the
            # environment: no CAP_SETUID, or a Node or TMPDIR the dropped uid
            # cannot reach. One line exercises the drop and both traversals.
            ${PROBE_AS} test -x "${NODE_EXE}" \
              || { echo "FAIL: dropped to uid 65534 but it cannot execute ${NODE_EXE} — check CAP_SETUID and that its path is traversable by other users; this is the test environment, not the probe"; exit 1; }
            ${PROBE_AS} test -r "${TMP}" \
              || { echo "FAIL: dropped to uid 65534 but it cannot reach ${TMP} — check that TMPDIR is traversable by other users; this is the test environment, not the probe"; exit 1; }
          fi

          # stage_image <home>: a healthy 2.x layout.
          stage_image() {
            local home="$1" pkg="$1/.riotbox/context-mode-plugin/v${PIN}"
            mkdir -p "${home}/.local/bin" "${home}/.context-mode" \
                     "${pkg}/.claude-plugin" "${pkg}/hooks" "${pkg}/opencode" "${pkg}/pi"
            chmod 0777 "${home}/.context-mode"
            printf '#!/usr/bin/env bash\nexec "%s" "%s/cli.mjs" "$@"\n' "${NODE_EXE}" "${pkg}" \
              > "${home}/.local/bin/context-mode"
            chmod +x "${home}/.local/bin/context-mode"
            printf '{"name":"context-mode","version":"%s","type":"module"}\n' "${PIN}" > "${pkg}/package.json"
            printf 'if (process.argv[2] === "--version") console.log("%s");\n' "${PIN}" > "${pkg}/cli.mjs"
            echo '{"name":"context-mode","hooks":"./hooks/claude-code.json"}' > "${pkg}/.claude-plugin/plugin.json"
            echo 'export default { id: "context-mode", server() {}, setup() {} };' > "${pkg}/opencode/plugin.js"
            echo 'export default function piExtension() {}' > "${pkg}/pi/index.js"
            # Answers the way the real hook does: a decision for WebFetch,
            # nothing for a plain Bash call — and only when asked as Claude.
            cat > "${pkg}/hook.mjs" <<'HOOK'
          import { readFileSync } from "node:fs";
          const i = process.argv.indexOf("--agent");
          if (i < 0 || process.argv[i + 1] !== "claude-code") process.exit(0);
          const ev = JSON.parse(readFileSync(0, "utf8"));
          if (ev.hook_event_name === "PreToolUse" && ev.tool_name === "WebFetch")
            console.log(JSON.stringify({ hookSpecificOutput: { hookEventName: "PreToolUse", permissionDecision: "deny" } }));
          HOOK
            # The table the expectation file pins, every command the rewritten
            # absolute-Node form the build leaves.
            jq --arg cmd "\"${NODE_EXE}\" \"\${CLAUDE_PLUGIN_ROOT}/hook.mjs\" --agent claude-code" \
              '{hooks: map_values(map({matcher: ., hooks: [{type: "command", command: $cmd}]}))
                | map_values(map(if .matcher == null then del(.matcher) else . end))}' \
              "{{.riotbox_dir}}/container/context-mode-hooks-expected.json" > "${pkg}/hooks/claude-code.json"
          }

          # run_probe <home> [VAR=value ...]: the probe as doctor runs it, its
          # stderr kept in ${TMP}/err. PATH has no Node, as in the image, where
          # only the shim's absolute path reaches one.
          run_probe() {
            local home="$1"; shift
            ${PROBE_AS} env HOME="${home}" PATH="${home}/.local/bin:/usr/bin:/bin" TMPDIR=/tmp \
              CM_PIN="${PIN}" CM_NODE_PIN="${NODE_PIN}" CM_HOOKS_EXPECTED="${HOOKS_EXPECTED}" "$@" \
              bash -c "${probe}" 2>"${TMP}/err" >/dev/null
          }

          # expect_fail <shape> <home> <phrase> [VAR=value ...]
          expect_fail() {
            local shape="$1" home="$2" phrase="$3"; shift 3
            local rc=0
            run_probe "${home}" "$@" || rc=$?
            [ "${rc}" != "0" ] || { echo "FAIL: ${shape} did not fail the probe"; exit 1; }
            grep -q -F -- "${phrase}" "${TMP}/err" \
              || { echo "FAIL: ${shape} failed without naming it (want '${phrase}'):"; cat "${TMP}/err"; exit 1; }
            echo "ok: ${shape} -> $(cat "${TMP}/err")"
          }

          pkg_of() { printf '%s\n' "$1/.riotbox/context-mode-plugin/v${PIN}"; }

          # 1. Healthy.
          H="${TMP}/healthy"; stage_image "${H}"
          rc=0; run_probe "${H}" || rc=$?
          [ "${rc}" = "0" ] || { echo "FAIL: healthy shape exited ${rc}:"; cat "${TMP}/err"; exit 1; }
          [ ! -s "${TMP}/err" ] || { echo "FAIL: healthy shape wrote to stderr:"; cat "${TMP}/err"; exit 1; }
          [ -z "$(ls -A "${H}/.context-mode")" ] \
            || { echo "FAIL: the probe left files in the store"; exit 1; }

          # 2. No CLI on PATH.
          H="${TMP}/no-cli"; stage_image "${H}"; rm "${H}/.local/bin/context-mode"
          expect_fail "no CLI" "${H}" "no context-mode on PATH"

          # 3. The CLI is not the pinned version.
          H="${TMP}/cli-version"; stage_image "${H}"
          echo 'console.log("2.1.3");' > "$(pkg_of "${H}")/cli.mjs"
          expect_fail "CLI version" "${H}" "context-mode --version is '2.1.3', this riotbox pins ${PIN}"

          # 4. The CLI does not run at all.
          H="${TMP}/cli-dead"; stage_image "${H}"
          echo 'process.exit(3);' > "$(pkg_of "${H}")/cli.mjs"
          expect_fail "CLI dead" "${H}" "context-mode --version failed"

          # 5. The shim runs a Node other than the pin.
          H="${TMP}/node-pin"; stage_image "${H}"
          expect_fail "Node pin" "${H}" "this riotbox pins v0.0.1" CM_NODE_PIN=0.0.1

          # 6. A shim whose exec line names no cli.mjs, so neither the Node nor
          # the package root can be read out of it.
          H="${TMP}/shim-shape"; stage_image "${H}"
          printf '#!/usr/bin/env bash\necho %s\n' "${PIN}" > "${H}/.local/bin/context-mode"
          expect_fail "shim shape" "${H}" "cannot read the pinned Node and package root"

          # 7. The OpenCode adapter's default export has lost setup.
          H="${TMP}/opencode"; stage_image "${H}"
          echo 'export default { id: "context-mode", server() {} };' > "$(pkg_of "${H}")/opencode/plugin.js"
          expect_fail "OpenCode export" "${H}" "OpenCode adapter"

          # 8. The OpenCode adapter is gone.
          H="${TMP}/opencode-gone"; stage_image "${H}"; rm "$(pkg_of "${H}")/opencode/plugin.js"
          expect_fail "OpenCode missing" "${H}" "OpenCode adapter"

          # 9. No Pi extension.
          H="${TMP}/pi"; stage_image "${H}"; rm "$(pkg_of "${H}")/pi/index.js"
          expect_fail "Pi extension" "${H}" "pi/index.js"

          # 10. No staged tree where the session looks for one.
          H="${TMP}/no-tree"; stage_image "${H}"; mkdir -p "${H}/empty"
          expect_fail "no staged tree" "${H}" "no staged Claude plugin tree" RIOTBOX_CM_PLUGIN_DIR="${H}/empty"

          # 11. A staged version that is not a string, which
          # context_mode_staged_version refuses and a session would unregister.
          H="${TMP}/tree-version"; stage_image "${H}"
          echo '{"version":214,"type":"module"}' > "$(pkg_of "${H}")/package.json"
          expect_fail "staged version type" "${H}" "declares no version"

          # 12. A staged tree at another version than the pin.
          H="${TMP}/tree-pin"; stage_image "${H}"
          echo '{"version":"2.1.3","type":"module"}' > "$(pkg_of "${H}")/package.json"
          expect_fail "staged version pin" "${H}" "is context-mode 2.1.3, this riotbox pins ${PIN}"

          # 13. No plugin manifest, so nothing can register the tree.
          H="${TMP}/manifest"; stage_image "${H}"; rm "$(pkg_of "${H}")/.claude-plugin/plugin.json"
          expect_fail "plugin manifest" "${H}" ".claude-plugin/plugin.json"

          # 14. A hook table that differs from the expectation file.
          H="${TMP}/table"; stage_image "${H}"
          jq 'del(.hooks.UserPromptSubmit)' "$(pkg_of "${H}")/hooks/claude-code.json" > "${TMP}/t.json"
          mv "${TMP}/t.json" "$(pkg_of "${H}")/hooks/claude-code.json"
          expect_fail "hook table" "${H}" "context-mode-hooks-expected.json"

          # 15. A hook that answers nothing: the session would route nothing.
          H="${TMP}/hook-silent"; stage_image "${H}"; echo '' > "$(pkg_of "${H}")/hook.mjs"
          expect_fail "silent hook" "${H}" "no PreToolUse decision for WebFetch"

          # 16. A hook that answers every tool, which would pass shape 15's
          # check while proving nothing.
          H="${TMP}/hook-all"; stage_image "${H}"
          echo 'console.log(JSON.stringify({hookSpecificOutput:{permissionDecision:"deny"}}));' \
            > "$(pkg_of "${H}")/hook.mjs"
          expect_fail "indiscriminate hook" "${H}" "for a plain ls"

          # 17. A hook command that still invokes a bare node. PATH holds no
          # Node, so it answers nothing, as it would on the image.
          H="${TMP}/bare-node"; stage_image "${H}"
          jq '(.hooks[][].hooks[].command) |= sub("^\"[^\"]*\""; "node")' \
            "$(pkg_of "${H}")/hooks/claude-code.json" > "${TMP}/t.json"
          mv "${TMP}/t.json" "$(pkg_of "${H}")/hooks/claude-code.json"
          expect_fail "bare node" "${H}" "no PreToolUse decision for WebFetch"

          # 18. A store the session user cannot write.
          H="${TMP}/store-ro"; stage_image "${H}"; chmod 0555 "${H}/.context-mode"
          expect_fail "read-only store" "${H}" "${H}/.context-mode is not writable"

          # 19. No store at all.
          H="${TMP}/store-gone"; stage_image "${H}"; rmdir "${H}/.context-mode"
          expect_fail "missing store" "${H}" "${H}/.context-mode is not writable"
          echo "probe_body=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldMatchRegex "probe_body=(pass|SKIPPED)"

  # Context Mode is wired per agent through the optional registry verbs (see
  # docs/dev/agent-contract.md), so an agent implementing none of them
  # runs with the feature off however the toggle is set. doctor is where a user
  # checks whether the feature will engage, so it has to say that rather than
  # reporting on an image probe the session will never act on.
  #
  # The unsupported agent is simulated by unsetting the real verb after the
  # source, so both arms run the same `declare -F` probe production uses — a
  # fixture agent would only prove the fixture agrees with itself. podman is
  # stubbed, and XDG_CONFIG_HOME/RIOTBOX_SYSCONF_DIR isolated before the source,
  # for the reasons given above the image cases.
  #
  # claude is walked first and on its own. It is the default agent and, since
  # the plugin adoption, the only supported one with no wire verb — so it is the
  # single arm that can catch a check probing for the wrong verb. The opencode
  # arms cannot: opencode implements both verbs, so it is reported supported
  # whichever one the check asks for.
  - name: doctor reports an agent with no Context Mode support
    steps:
      - type: exec
        script: |
          set -e
          TMP="$(mktemp -d)"; trap 'rm -rf "${TMP}"' EXIT
          mkdir -p "${TMP}/xdg" "${TMP}/etc"
          cat > "${TMP}/podman" <<'STUB'
          #!/usr/bin/env bash
          case "$1" in
            image) exit 0 ;;   # `podman image exists <img>`
            run)   exit 0 ;;   # the in-image context-mode probe
          esac
          exit 1
          STUB
          chmod +x "${TMP}/podman"
          export PATH="${TMP}:${PATH}"
          export XDG_CONFIG_HOME="${TMP}/xdg" RIOTBOX_SYSCONF_DIR="${TMP}/etc"
          unset RIOTBOX_DOCTOR_JSON RIOTBOX_DOCTOR_QUIET
          source "{{.riotbox_dir}}/scripts/preflight.sh"
          export RIOTBOX_CONTEXT_MODE=1
          unset RIOTBOX_HEADROOM

          # claude: the default agent, and the one whose support the check gets
          # wrong if it probes for a verb Claude Code no longer has.
          export RIOTBOX_AGENT=claude
          rc=0
          out="$(preflight_check_context_mode 2>&1)" || rc=$?
          [ "${rc}" = "0" ] || { echo "FAIL: claude, expected 0, got ${rc}: ${out}"; exit 1; }
          echo "${out}" | grep -q "\[ok\]" \
            || { echo "FAIL: claude got no [ok]: ${out}"; exit 1; }
          echo "${out}" | grep -q "no Context Mode support" \
            && { echo "FAIL: called the default agent unsupported: ${out}"; exit 1; }

          export RIOTBOX_AGENT=opencode

          # Supported: opencode implements the verbs, so the check runs on
          # through to the image the way it always has.
          rc=0
          out="$(preflight_check_context_mode 2>&1)" || rc=$?
          [ "${rc}" = "0" ] || { echo "FAIL: supported agent, expected 0, got ${rc}: ${out}"; exit 1; }
          echo "${out}" | grep -q "\[ok\]" \
            || { echo "FAIL: supported agent got no [ok]: ${out}"; exit 1; }
          echo "${out}" | grep -q "no Context Mode support" \
            && { echo "FAIL: called a supported agent unsupported: ${out}"; exit 1; }

          # Unsupported: the same agent with its contract verb taken away. That
          # verb, not the wire verb, is what the check probes — Claude Code has
          # no wire verb at all, and probing for one would report the default
          # agent as unsupported on an image where the feature works.
          unset -f agent_opencode_context_mode_build_assert
          rc=0
          out="$(preflight_check_context_mode 2>&1)" || rc=$?
          # ok, not fail: a fail carries an exit code and would make
          # `riotbox doctor` non-zero for a legitimate configuration.
          [ "${rc}" = "0" ] || { echo "FAIL: unsupported agent, expected 0, got ${rc}: ${out}"; exit 1; }
          echo "${out}" | grep -q "\[ok\]" \
            || { echo "FAIL: reported as a failure rather than an ok line: ${out}"; exit 1; }
          echo "${out}" | grep -q "no Context Mode support" \
            || { echo "FAIL: doctor did not report the missing support: ${out}"; exit 1; }
          echo "${out}" | grep -q "opencode" \
            || { echo "FAIL: the report does not name the agent: ${out}"; exit 1; }
          echo "doctor_agent_support=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "doctor_agent_support=pass"

  - name: doctor runs the context-mode check as part of the full walk
    steps:
      - type: exec
        script: |
          set -e
          grep -q "preflight_check_context_mode" "{{.riotbox_dir}}/scripts/preflight.sh" \
            || { echo "FAIL: check not defined"; exit 1; }
          # The check must be registered in preflight_run's list, not merely
          # defined — a check nothing calls is a check that never runs.
          sed -n '/^preflight_run()/,/^}/p' "{{.riotbox_dir}}/scripts/preflight.sh" \
            | grep -q "preflight_check_context_mode" \
            || { echo "FAIL: check not registered in preflight_run"; exit 1; }
          echo "doctor_registered=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "doctor_registered=pass"
