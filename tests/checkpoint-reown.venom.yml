name: Checkpoint and reown workflow integration tests
vars:
  root: "."
  riotbox_dir: "{{.root}}"
  helpers: "{{.root}}/tests/lib/git-test-helpers.sh"

testcases:
  # -- Checkpoint creation --

  - name: Checkpoint does NOT create empty commit when repo is clean
    steps:
      - type: exec
        script: |
          source "{{.helpers}}"
          init_test_repo
          trap 'rm -rf "${TEST_DIR}"' EXIT
          human_commit "initial"
          head_before="$(git rev-parse HEAD)"
          count_before="$(git rev-list --count HEAD)"
          ROOT_DIR="{{.riotbox_dir}}" RIOTBOX_PROJECTS="${REPO_DIR}" \
            RIOTBOX_CHECKPOINT_QUIET=1 \
            bash "{{.riotbox_dir}}/libexec/checkpoint.sh" 2>&1
          head_after="$(git rev-parse HEAD)"
          echo "before=${head_before} after=${head_after}"
          [ "${head_before}" = "${head_after}" ]
          [ "${count_before}" = "$(git rev-list --count HEAD)" ]
          # The clean-tree contract: the snapshot ref points AT HEAD, so no new
          # commit object was created anywhere — not on the branch, not off it.
          ref="$(git for-each-ref --format='%(refname)' refs/riotbox/checkpoints)"
          echo "ref=${ref}"
          [ -n "${ref}" ]
          [ "$(git rev-parse "${ref}")" = "${head_before}" ]
          echo "clean_no_commit=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "clean_no_commit=true"

  # The snapshot is attributable to the user, not to the container: it is the
  # user's own pre-session state and the object never leaves their machine.
  - name: Checkpoint snapshot is authored by the human identity
    steps:
      - type: exec
        script: |
          source "{{.helpers}}"
          init_test_repo
          trap 'rm -rf "${TEST_DIR}"' EXIT
          human_commit "initial"
          echo "dirty" >> dirty.txt
          ROOT_DIR="{{.riotbox_dir}}" RIOTBOX_PROJECTS="${REPO_DIR}" \
            RIOTBOX_CHECKPOINT_QUIET=1 \
            bash "{{.riotbox_dir}}/libexec/checkpoint.sh" 2>&1
          ref="$(git for-each-ref --format='%(refname)' refs/riotbox/checkpoints)"
          [ -n "${ref}" ]
          # The tree is dirty, so commit-tree really did seal a NEW object —
          # otherwise this would be reading HEAD's identity, not the snapshot's.
          [ "$(git rev-parse "${ref}")" != "$(git rev-parse HEAD)" ]
          author="$(git log -1 --format='%ae' "${ref}")"
          committer="$(git log -1 --format='%ce' "${ref}")"
          echo "author=${author} committer=${committer}"
          [ "${author}" = "${HUMAN_EMAIL}" ]
          [ "${committer}" = "${HUMAN_EMAIL}" ]
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "author=human@example.com committer=human@example.com"

  # The backup push names three refspecs. Only refs/riotbox/checkpoints/* is
  # load-bearing for the safety net, and it is the one that does NOT travel by
  # default — so a regression to --all/--tags would back up the branches and
  # silently store no snapshot at all.
  - name: Checkpoint pushes to a bare backup repo
    steps:
      - type: exec
        script: |
          source "{{.helpers}}"
          init_test_repo
          trap 'rm -rf "${TEST_DIR}"' EXIT
          human_commit "initial"
          git tag v1.0.0
          echo "dirty" >> dirty.txt
          ROOT_DIR="{{.riotbox_dir}}" RIOTBOX_PROJECTS="${REPO_DIR}" \
            RIOTBOX_CHECKPOINT_QUIET=1 \
            bash "{{.riotbox_dir}}/libexec/checkpoint.sh" 2>&1
          # The store is keyed on the canonical project PATH, not the basename.
          backup="$(backup_path "${REPO_DIR}")"
          echo "backup=${backup}"
          test -d "${backup}"
          snap_count="$(git -C "${backup}" for-each-ref --format='%(refname)' refs/riotbox/checkpoints | wc -l | tr -d ' ')"
          echo "backup_snapshots=${snap_count}"
          [ "${snap_count}" -eq 1 ]
          ref="$(git for-each-ref --format='%(refname)' refs/riotbox/checkpoints)"
          [ "$(git -C "${backup}" rev-parse "${ref}")" = "$(git rev-parse "${ref}")" ]
          # ...and the head and tag refspecs landed too.
          [ "$(git -C "${backup}" rev-parse refs/heads/main)" = "$(git rev-parse refs/heads/main)" ]
          [ "$(git -C "${backup}" rev-parse refs/tags/v1.0.0)" = "$(git rev-parse refs/tags/v1.0.0)" ]
          echo "backup_created=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "backup_snapshots=1"
          - result.systemout ShouldContainSubstring "backup_created=true"

  - name: Second checkpoint pushes to existing backup repo
    steps:
      - type: exec
        script: |
          source "{{.helpers}}"
          init_test_repo
          trap 'rm -rf "${TEST_DIR}"' EXIT
          human_commit "initial"
          echo "wip1" >> dirty.txt
          ROOT_DIR="{{.riotbox_dir}}" RIOTBOX_PROJECTS="${REPO_DIR}" \
            RIOTBOX_CHECKPOINT_QUIET=1 \
            bash "{{.riotbox_dir}}/libexec/checkpoint.sh" 2>&1
          backup="$(backup_path "${REPO_DIR}")"
          [ "$(git -C "${backup}" for-each-ref --format='%(refname)' refs/riotbox/checkpoints | wc -l)" -eq 1 ]
          # The snapshot ref carries a one-second timestamp, so a second run
          # inside the same second would collide instead of accumulating.
          sleep 1
          human_commit "more human work"
          echo "wip2" >> dirty.txt
          ROOT_DIR="{{.riotbox_dir}}" RIOTBOX_PROJECTS="${REPO_DIR}" \
            RIOTBOX_CHECKPOINT_QUIET=1 \
            bash "{{.riotbox_dir}}/libexec/checkpoint.sh" 2>&1
          snap_count="$(git -C "${backup}" for-each-ref --format='%(refname)' refs/riotbox/checkpoints | wc -l | tr -d ' ')"
          echo "backup_snapshots=${snap_count}"
          [ "${snap_count}" -eq 2 ]
          # The second run also carried the branch that moved between them.
          [ "$(git -C "${backup}" rev-parse refs/heads/main)" = "$(git rev-parse refs/heads/main)" ]
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "backup_snapshots=2"

  # -- Full workflow: checkpoint -> LLM commits -> reown --

  - name: Reown rewrites llm commits after checkpoint with dirty state
    steps:
      - type: exec
        script: |
          source "{{.helpers}}"
          init_test_repo
          trap 'rm -rf "${TEST_DIR}"' EXIT
          human_commit "initial"
          echo "unsaved work" >> dirty.txt
          # checkpoint with dirty state
          git add -A
          git -c "user.name=${HUMAN_NAME}" -c "user.email=${HUMAN_EMAIL}" \
              commit -m "checkpoint: pre-riotbox-test" >/dev/null

          llm_commit "llm feature A"
          llm_commit "llm feature B"
          "{{.riotbox_dir}}/scripts/reown-commits.sh" --force 2>&1
          llm_count=$(count_by_author "${LLM_EMAIL}")
          echo "llm=${llm_count}"
          [ "${llm_count}" -eq 0 ]
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "llm=0"

  - name: Reown rewrites llm commits after checkpoint with clean state
    steps:
      - type: exec
        script: |
          source "{{.helpers}}"
          init_test_repo
          trap 'rm -rf "${TEST_DIR}"' EXIT
          human_commit "initial"
          # No checkpoint commit needed when clean — just tag
          llm_commit "llm work"
          "{{.riotbox_dir}}/scripts/reown-commits.sh" --force 2>&1
          llm_count=$(count_by_author "${LLM_EMAIL}")
          echo "llm=${llm_count}"
          [ "${llm_count}" -eq 0 ]
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "llm=0"

  - name: Reown handles multiple sessions (only rewrites remaining llm commits)
    steps:
      - type: exec
        script: |
          source "{{.helpers}}"
          init_test_repo
          trap 'rm -rf "${TEST_DIR}"' EXIT
          human_commit "initial"

          # Session 1: llm work, then reown
          llm_commit "session 1 llm"
          "{{.riotbox_dir}}/scripts/reown-commits.sh" --force 2>&1

          # Session 2: more llm work
          llm_commit "session 2 llm"
          "{{.riotbox_dir}}/scripts/reown-commits.sh" --force 2>&1

          llm_count=$(count_by_author "${LLM_EMAIL}")
          human_count=$(count_by_author "${HUMAN_EMAIL}")
          echo "llm=${llm_count} human=${human_count}"
          [ "${llm_count}" -eq 0 ]
          [ "${human_count}" -eq 3 ]
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "llm=0 human=3"

  - name: Reown does not touch commits before the oldest llm commit
    steps:
      - type: exec
        script: |
          source "{{.helpers}}"
          init_test_repo
          trap 'rm -rf "${TEST_DIR}"' EXIT
          human_commit "pre-llm human work"
          old_hash="$(git rev-parse HEAD)"
          llm_commit "llm work"
          "{{.riotbox_dir}}/scripts/reown-commits.sh" --force
          new_hash="$(git rev-parse HEAD~1)"
          echo "old=${old_hash} new=${new_hash}"
          [ "${old_hash}" = "${new_hash}" ]
          msg_author="$(git log --format='%ae %s' | grep 'pre-llm human work')"
          echo "pre_llm_author=${msg_author}"
          echo "${msg_author}" | grep -q "^${HUMAN_EMAIL} "
        assertions:
          - result.code ShouldEqual 0

  - name: Reown preserves file content after rewriting
    steps:
      - type: exec
        script: |
          source "{{.helpers}}"
          init_test_repo
          trap 'rm -rf "${TEST_DIR}"' EXIT
          human_commit "initial"
          echo "feature content" >> feature.txt
          git add -A
          GIT_AUTHOR_NAME="${LLM_NAME}" GIT_AUTHOR_EMAIL="${LLM_EMAIL}" \
          GIT_COMMITTER_NAME="${LLM_NAME}" GIT_COMMITTER_EMAIL="${LLM_EMAIL}" \
              git commit -m "add feature" >/dev/null
          "{{.riotbox_dir}}/scripts/reown-commits.sh" --force
          content="$(cat feature.txt)"
          echo "content=${content}"
          [ "${content}" = "feature content" ]
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "content=feature content"

  - name: Reown exits cleanly with no llm commits
    steps:
      - type: exec
        script: |
          source "{{.helpers}}"
          init_test_repo
          trap 'rm -rf "${TEST_DIR}"' EXIT
          human_commit "initial"
          human_commit "more human work"
          "{{.riotbox_dir}}/scripts/reown-commits.sh" --force 2>&1
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "No container-authored commits found"

  # -- Backup and recovery --

  - name: Backup repo survives a llm history rewrite
    steps:
      - type: exec
        script: |
          source "{{.helpers}}"
          init_test_repo
          trap 'rm -rf "${TEST_DIR}"' EXIT
          human_commit "precious work"
          echo "unsaved work" >> dirty.txt
          ROOT_DIR="{{.riotbox_dir}}" RIOTBOX_PROJECTS="${REPO_DIR}" \
            RIOTBOX_CHECKPOINT_QUIET=1 \
            bash "{{.riotbox_dir}}/libexec/checkpoint.sh" 2>&1
          backup="$(backup_path "${REPO_DIR}")"
          ref="$(git for-each-ref --format='%(refname)' refs/riotbox/checkpoints)"
          [ -n "${ref}" ]
          snapshot="$(git rev-parse "${ref}")"

          # The agent rewrites history and deletes the local snapshot ref — the
          # snapshot lives in the project it is handed read-write, so this is
          # exactly what the off-mount copy exists to survive.
          llm_commit "llm work"
          git reset --hard HEAD~1 >/dev/null
          git update-ref -d "${ref}"
          git reflog expire --expire=now --all
          git gc --prune=now --quiet
          # Prove the destruction took, or "the backup still has it" is empty.
          if git cat-file -e "${snapshot}" 2>/dev/null; then
            echo "FIXTURE INVALID: the snapshot object survived locally — nothing was actually destroyed" >&2
            exit 1
          fi

          # The pristine copy is intact, content and history alike.
          [ "$(git -C "${backup}" rev-parse "${ref}")" = "${snapshot}" ]
          git -C "${backup}" show "${ref}:dirty.txt" | grep -q "unsaved work"
          git -C "${backup}" log --format='%s' "${ref}" | grep -q "precious work"
          echo "backup_survived=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "backup_survived=true"
          - result.systemerr ShouldNotContainSubstring "FIXTURE INVALID"

  # The end-to-end recovery proof, following the flow `riotbox checkpoints`
  # prints: fetch with an EXPLICIT refspec (refs/riotbox/* travels with neither
  # a default fetch nor a clone), then `git restore --source=<ref> -- .`.
  - name: Project is recoverable from backup after history destruction
    steps:
      - type: exec
        script: |
          source "{{.helpers}}"
          init_test_repo
          trap 'rm -rf "${TEST_DIR}"' EXIT
          human_commit "precious work"
          echo "precious uncommitted work" > precious.txt
          ROOT_DIR="{{.riotbox_dir}}" RIOTBOX_PROJECTS="${REPO_DIR}" \
            RIOTBOX_CHECKPOINT_QUIET=1 \
            bash "{{.riotbox_dir}}/libexec/checkpoint.sh" 2>&1
          backup="$(backup_path "${REPO_DIR}")"
          ref="$(git for-each-ref --format='%(refname)' refs/riotbox/checkpoints)"
          [ -n "${ref}" ]
          snapshot="$(git rev-parse "${ref}")"

          # Total destruction of everything inside the mount: the branch, the
          # snapshot ref, the reflogs, the objects and the working tree.
          llm_commit "llm work"
          git checkout -q --orphan wiped
          git rm -q -rf . >/dev/null
          git update-ref -d refs/heads/main
          git update-ref -d "${ref}"
          git reflog expire --expire=now --all
          git gc --prune=now --quiet
          if [ -e precious.txt ] || [ -e history.txt ]; then
            echo "FIXTURE INVALID: the working tree survived the destruction" >&2
            exit 1
          fi
          if git cat-file -e "${snapshot}" 2>/dev/null; then
            echo "FIXTURE INVALID: the snapshot object survived locally — the backup would not be what recovers it" >&2
            exit 1
          fi

          # A DEFAULT fetch does not bring snapshot refs across. That is why the
          # documented recovery names the refspec, and why asserting it here
          # keeps the next step from passing for the wrong reason.
          git fetch "${backup}" >/dev/null 2>&1
          if git cat-file -e "${snapshot}" 2>/dev/null; then
            echo "FIXTURE INVALID: a default fetch already restored the snapshot — the explicit refspec proves nothing" >&2
            exit 1
          fi

          # The documented recovery flow.
          git fetch "${backup}" 'refs/riotbox/checkpoints/*:refs/riotbox/checkpoints/*'
          [ "$(git rev-parse "${ref}")" = "${snapshot}" ]
          git restore --source="${ref}" -- .

          # Both halves are back: the uncommitted file and the committed history.
          grep -q "precious uncommitted work" precious.txt
          grep -q "precious work" history.txt
          git log --format='%s' "${ref}" | grep -q "precious work"
          echo "recovered=true"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "recovered=true"
          - result.systemerr ShouldNotContainSubstring "FIXTURE INVALID"

  - name: Reown backup tag allows restore to pre-reown state
    steps:
      - type: exec
        script: |
          source "{{.helpers}}"
          init_test_repo
          trap 'rm -rf "${TEST_DIR}"' EXIT
          human_commit "initial"
          llm_commit "llm work"
          pre_reown_head="$(git rev-parse HEAD)"
          "{{.riotbox_dir}}/scripts/reown-commits.sh" --force
          backup_tag="$(git tag -l 'backup/pre-reown-*' | head -1)"
          [ -n "${backup_tag}" ]
          git reset --hard "${backup_tag}"
          [ "$(git rev-parse HEAD)" = "${pre_reown_head}" ]
          llm_count=$(count_by_author "${LLM_EMAIL}")
          echo "llm_after_restore=${llm_count}"
          [ "${llm_count}" -eq 1 ]
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "llm_after_restore=1"
