name: headroom opencode — proxy lifecycle, wrap delegation, fallbacks
vars:
  root: "."
  riotbox_dir: "{{.root}}"
  shared_helpers: "{{.root}}/tests/lib/wrapper-shared.sh"
  test_port: "18787"

# Pins agents/opencode/headroom-exec.sh. The helper owns the proxy and
# nothing else: it must (a) reuse or spawn `headroom proxy --memory --learn`,
# (b) delegate routing and launch to `headroom wrap opencode --no-proxy`
# only after the proxy answers, (c) write nothing to the merged
# opencode.jsonc itself, and (d) degrade to unwrapped opencode on any proxy
# failure.
#
# Why the helper survives at all now that `wrap opencode` exists: passing
# --memory to it appends a "## Memory" block to AGENTS.md in the CWD, which
# in a session is the caller's bind-mounted repository. Owning the proxy
# here keeps cross-session memory without writing to the user's checkout.
# See the helper's header.
#
# Fakes: `headroom proxy` is faked with a python3 accept-once TCP listener;
# each readiness probe consumes one accept, so listeners exit on their own
# and never leak across cases. `headroom wrap opencode` is faked to log its
# argv and then exec the post-`--` arguments through opencode, so the
# wrapper's RIOTBOX_HEADROOM_ACTIVE guard resolves them to the real binary
# exactly as upstream's `shutil.which("opencode")` launch does.

testcases:
  - name: spawn path — proxy started once, launch delegated to wrap opencode
    steps:
      - type: exec
        script: |
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.shared_helpers}}"
          setup_wrapper_sandbox opencode
          trap 'rm -rf "${TEST_DIR}"' EXIT
          install_generic_wrapper_for opencode
          cat > "${TEST_DIR}/realbin/headroom" <<'FAKE'
          #!/usr/bin/env bash
          printf 'FAKE_HEADROOM_ARGV=%s\n' "$*" >>"${HOME}/headroom-calls.log"
          if [ "${1:-}" = "proxy" ]; then
            port=8787
            prev=""
            for a in "$@"; do [ "${prev}" = "--port" ] && port="${a}"; prev="${a}"; done
            exec python3 -c "import socket; s=socket.socket(); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1); s.bind(('127.0.0.1', ${port})); s.listen(1); s.accept()"
          fi
          if [ "${1:-}" = "wrap" ] && [ "${2:-}" = "opencode" ]; then
            shift 2
            while [ "$#" -gt 0 ]; do a="$1"; shift; [ "${a}" = "--" ] && break; done
            exec opencode "$@"
          fi
          FAKE
          chmod +x "${TEST_DIR}/realbin/headroom"
          export RIOTBOX_HEADROOM=1 HEADROOM_PORT={{.test_port}}
          unset RIOTBOX_HEADROOM_ACTIVE
          out="$(opencode run "do work" 2>&1)"
          echo "${out}"
          calls="${HOME}/headroom-calls.log"
          grep -c 'FAKE_HEADROOM_ARGV=proxy' "${calls}" | grep -qx 1 \
            || { echo "FAIL: proxy not spawned exactly once" >&2; cat "${calls}" >&2; exit 1; }
          grep -q 'FAKE_HEADROOM_ARGV=proxy --port {{.test_port}} --memory --learn' "${calls}" \
            || { echo "FAIL: proxy argv missing --memory/--learn" >&2; cat "${calls}" >&2; exit 1; }
          # Delegation carries every flag the offline-after-build posture needs,
          # and --no-proxy so upstream does not start a second proxy.
          grep -q 'FAKE_HEADROOM_ARGV=wrap opencode --no-proxy --no-mcp --no-serena --port {{.test_port}} -- run do work' "${calls}" \
            || { echo "FAIL: wrap opencode argv wrong" >&2; cat "${calls}" >&2; exit 1; }
          echo "SPAWN_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "SPAWN_OK"
          - result.systemout ShouldContainSubstring "FAKE_REAL_opencode_INVOKED"
          - result.systemout ShouldContainSubstring "arg=--auto"
          - result.systemout ShouldContainSubstring "arg=do work"

  - name: reuse path — listening proxy is not respawned, delegation still happens
    steps:
      - type: exec
        script: |
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.shared_helpers}}"
          setup_wrapper_sandbox opencode
          trap 'rm -rf "${TEST_DIR}"' EXIT
          install_generic_wrapper_for opencode
          cat > "${TEST_DIR}/realbin/headroom" <<'FAKE'
          #!/usr/bin/env bash
          printf 'FAKE_HEADROOM_ARGV=%s\n' "$*" >>"${HOME}/headroom-calls.log"
          if [ "${1:-}" = "proxy" ]; then
            echo "FAKE_PROXY_SPAWNED"
            exit 0
          fi
          if [ "${1:-}" = "wrap" ] && [ "${2:-}" = "opencode" ]; then
            shift 2
            while [ "$#" -gt 0 ]; do a="$1"; shift; [ "${a}" = "--" ] && break; done
            exec opencode "$@"
          fi
          FAKE
          chmod +x "${TEST_DIR}/realbin/headroom"
          # Two accepts: the bind-wait probe below consumes the first, the
          # helper's reuse probe consumes the second (then the listener exits).
          python3 -c "import socket; s=socket.socket(); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1); s.bind(('127.0.0.1', {{.test_port}})); s.listen(2); s.accept(); s.accept()" &
          listener=$!
          for _ in $(seq 1 50); do
            (exec 3<>"/dev/tcp/127.0.0.1/{{.test_port}}") 2>/dev/null && { exec 3>&- 3<&-; break; } || sleep 0.1
          done
          export RIOTBOX_HEADROOM=1 HEADROOM_PORT={{.test_port}}
          unset RIOTBOX_HEADROOM_ACTIVE
          out="$(opencode run "do work" 2>&1)"
          echo "${out}"
          kill "${listener}" 2>/dev/null || true
          wait "${listener}" 2>/dev/null || true
          grep -q 'FAKE_HEADROOM_ARGV=wrap opencode --no-proxy' "${HOME}/headroom-calls.log" \
            || { echo "FAIL: wrap opencode not invoked on reuse" >&2; exit 1; }
          echo "REUSE_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "REUSE_OK"
          - result.systemout ShouldContainSubstring "FAKE_REAL_opencode_INVOKED"
          - result.systemout ShouldContainSubstring "arg=--auto"
          - result.systemout ShouldContainSubstring "arg=do work"
          - result.systemout ShouldNotContainSubstring "FAKE_PROXY_SPAWNED"

  - name: proxy dies at startup — warn, no delegation, runs unwrapped
    steps:
      - type: exec
        script: |
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.shared_helpers}}"
          setup_wrapper_sandbox opencode
          trap 'rm -rf "${TEST_DIR}"' EXIT
          install_generic_wrapper_for opencode
          cat > "${TEST_DIR}/realbin/headroom" <<'FAKE'
          #!/usr/bin/env bash
          printf 'FAKE_HEADROOM_ARGV=%s\n' "$*" >>"${HOME}/headroom-calls.log"
          exit 3
          FAKE
          chmod +x "${TEST_DIR}/realbin/headroom"
          export RIOTBOX_HEADROOM=1 HEADROOM_PORT={{.test_port}}
          unset RIOTBOX_HEADROOM_ACTIVE
          opencode run "do work" 2>"${TEST_DIR}/stderr"
          echo "--- stderr ---"
          cat "${TEST_DIR}/stderr"
          # A dead proxy must not be papered over by delegating anyway: the
          # session runs unwrapped rather than routed at a port nothing serves.
          grep -q 'FAKE_HEADROOM_ARGV=wrap' "${HOME}/headroom-calls.log" \
            && { echo "FAIL: delegated despite proxy failure" >&2; exit 1; }
          [ ! -f "${HOME}/.config/opencode/opencode.jsonc" ] \
            || { echo "FAIL: config written despite proxy failure" >&2; exit 1; }
          echo "DIED_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "DIED_OK"
          - result.systemout ShouldContainSubstring "FAKE_REAL_opencode_INVOKED"
          - result.systemout ShouldContainSubstring "WARNING"
          - result.systemout ShouldContainSubstring "running opencode unwrapped"

  - name: readiness timeout — warn, spawned proxy killed, runs unwrapped
    steps:
      - type: exec
        script: |
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.shared_helpers}}"
          setup_wrapper_sandbox opencode
          trap 'rm -rf "${TEST_DIR}"' EXIT
          install_generic_wrapper_for opencode
          # Fake proxy that stays alive but never listens. The odd sleep
          # duration is a unique marker so the pgrep/pkill below cannot
          # match (or kill) unrelated processes on a shared host.
          cat > "${TEST_DIR}/realbin/headroom" <<'FAKE'
          #!/usr/bin/env bash
          printf 'FAKE_HEADROOM_ARGV=%s\n' "$*" >>"${HOME}/headroom-calls.log"
          exec sleep 7919
          FAKE
          chmod +x "${TEST_DIR}/realbin/headroom"
          export RIOTBOX_HEADROOM=1 HEADROOM_PORT={{.test_port}}
          export RIOTBOX_HEADROOM_PROXY_TIMEOUT=2
          unset RIOTBOX_HEADROOM_ACTIVE
          opencode run "do work" 2>"${TEST_DIR}/stderr"
          echo "--- stderr ---"
          cat "${TEST_DIR}/stderr"
          # The half-started proxy must not outlive the fallback.
          sleep 1
          if pgrep -f 'sleep 7919' >/dev/null 2>&1; then
            echo "FAIL: spawned proxy still running after timeout fallback" >&2
            pkill -f 'sleep 7919' || true
            exit 1
          fi
          grep -q 'FAKE_HEADROOM_ARGV=wrap' "${HOME}/headroom-calls.log" \
            && { echo "FAIL: delegated despite readiness timeout" >&2; exit 1; }
          echo "TIMEOUT_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "TIMEOUT_OK"
          - result.systemout ShouldContainSubstring "FAKE_REAL_opencode_INVOKED"
          - result.systemout ShouldContainSubstring "WARNING"
          - result.systemout ShouldContainSubstring "not ready after 2s"

  - name: user-set baseURL gets a notice naming the override, and still delegates
    steps:
      - type: exec
        script: |
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.shared_helpers}}"
          setup_wrapper_sandbox opencode
          trap 'rm -rf "${TEST_DIR}"' EXIT
          install_generic_wrapper_for opencode
          cat > "${TEST_DIR}/realbin/headroom" <<'FAKE'
          #!/usr/bin/env bash
          printf 'FAKE_HEADROOM_ARGV=%s\n' "$*" >>"${HOME}/headroom-calls.log"
          if [ "${1:-}" = "proxy" ]; then
            port=8787
            prev=""
            for a in "$@"; do [ "${prev}" = "--port" ] && port="${a}"; prev="${a}"; done
            exec python3 -c "import socket; s=socket.socket(); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1); s.bind(('127.0.0.1', ${port})); s.listen(1); s.accept()"
          fi
          if [ "${1:-}" = "wrap" ] && [ "${2:-}" = "opencode" ]; then
            shift 2
            while [ "$#" -gt 0 ]; do a="$1"; shift; [ "${a}" = "--" ] && break; done
            exec opencode "$@"
          fi
          FAKE
          chmod +x "${TEST_DIR}/realbin/headroom"
          # Pre-seed a merged config the way setup.sh writes it: // banner +
          # plain-JSON body, anthropic already routed to a corporate gateway.
          mkdir -p "${HOME}/.config/opencode"
          cat > "${HOME}/.config/opencode/opencode.jsonc" <<'CFG'
          // file generated by riotbox at session start.
          {"permission":"allow","provider":{"anthropic":{"options":{"baseURL":"https://gw.corp.example/v1"}}}}
          CFG
          export RIOTBOX_HEADROOM=1 HEADROOM_PORT={{.test_port}}
          unset RIOTBOX_HEADROOM_ACTIVE
          opencode run "do work" 2>"${TEST_DIR}/stderr"
          echo "--- stderr ---"
          cat "${TEST_DIR}/stderr"
          # Upstream's OPENCODE_CONFIG_CONTENT wins over the file, so the
          # override is real and must be announced rather than hidden. The
          # notice names the provider so a corporate-gateway user can act.
          grep -q 'anthropic' "${TEST_DIR}/stderr" \
            || { echo "FAIL: no notice naming the overridden provider" >&2; exit 1; }
          grep -q 'FAKE_HEADROOM_ARGV=wrap opencode --no-proxy' "${HOME}/headroom-calls.log" \
            || { echo "FAIL: did not delegate" >&2; exit 1; }
          echo "NOTICE_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "NOTICE_OK"
          - result.systemout ShouldContainSubstring "NOTICE"
          - result.systemout ShouldContainSubstring "FAKE_REAL_opencode_INVOKED"

  - name: helper writes nothing to the merged config — that is upstream's job now
    steps:
      - type: exec
        script: |
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.shared_helpers}}"
          setup_wrapper_sandbox opencode
          trap 'rm -rf "${TEST_DIR}"' EXIT
          install_generic_wrapper_for opencode
          cat > "${TEST_DIR}/realbin/headroom" <<'FAKE'
          #!/usr/bin/env bash
          if [ "${1:-}" = "proxy" ]; then
            port=8787
            prev=""
            for a in "$@"; do [ "${prev}" = "--port" ] && port="${a}"; prev="${a}"; done
            exec python3 -c "import socket; s=socket.socket(); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1); s.bind(('127.0.0.1', ${port})); s.listen(1); s.accept()"
          fi
          if [ "${1:-}" = "wrap" ] && [ "${2:-}" = "opencode" ]; then
            shift 2
            while [ "$#" -gt 0 ]; do a="$1"; shift; [ "${a}" = "--" ] && break; done
            exec opencode "$@"
          fi
          FAKE
          chmod +x "${TEST_DIR}/realbin/headroom"
          mkdir -p "${HOME}/.config/opencode"
          cat > "${HOME}/.config/opencode/opencode.jsonc" <<'CFG'
          // file generated by riotbox at session start.
          {"permission":"allow","plugin":["/home/llm/.riotbox/context-mode-plugin.js"]}
          CFG
          cp "${HOME}/.config/opencode/opencode.jsonc" "${TEST_DIR}/before"
          export RIOTBOX_HEADROOM=1 HEADROOM_PORT={{.test_port}}
          unset RIOTBOX_HEADROOM_ACTIVE
          opencode run "do work" >/dev/null 2>&1
          # The whole point of delegating: no jq surgery, no temp-file swap,
          # and in particular no chance of dropping the Context Mode plugin
          # entry that setup.sh put in the array.
          diff -u "${TEST_DIR}/before" "${HOME}/.config/opencode/opencode.jsonc" \
            || { echo "FAIL: helper modified the merged config" >&2; exit 1; }
          echo "NOWRITE_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "NOWRITE_OK"

  - name: unparseable merged config does not block delegation
    steps:
      - type: exec
        script: |
          export RIOTBOX_DIR="{{.riotbox_dir}}"
          source "{{.shared_helpers}}"
          setup_wrapper_sandbox opencode
          trap 'rm -rf "${TEST_DIR}"' EXIT
          install_generic_wrapper_for opencode
          cat > "${TEST_DIR}/realbin/headroom" <<'FAKE'
          #!/usr/bin/env bash
          printf 'FAKE_HEADROOM_ARGV=%s\n' "$*" >>"${HOME}/headroom-calls.log"
          if [ "${1:-}" = "proxy" ]; then
            port=8787
            prev=""
            for a in "$@"; do [ "${prev}" = "--port" ] && port="${a}"; prev="${a}"; done
            exec python3 -c "import socket; s=socket.socket(); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1); s.bind(('127.0.0.1', ${port})); s.listen(1); s.accept()"
          fi
          if [ "${1:-}" = "wrap" ] && [ "${2:-}" = "opencode" ]; then
            shift 2
            while [ "$#" -gt 0 ]; do a="$1"; shift; [ "${a}" = "--" ] && break; done
            exec opencode "$@"
          fi
          FAKE
          chmod +x "${TEST_DIR}/realbin/headroom"
          mkdir -p "${HOME}/.config/opencode"
          printf '// banner\n{not json' > "${HOME}/.config/opencode/opencode.jsonc"
          cp "${HOME}/.config/opencode/opencode.jsonc" "${TEST_DIR}/before"
          export RIOTBOX_HEADROOM=1 HEADROOM_PORT={{.test_port}}
          unset RIOTBOX_HEADROOM_ACTIVE
          opencode run "do work" 2>"${TEST_DIR}/stderr"
          echo "--- stderr ---"
          cat "${TEST_DIR}/stderr"
          # The config is only read to decide whether to print the override
          # notice. An unreadable one costs the notice, not the session: the
          # helper no longer parses it to build anything.
          diff -u "${TEST_DIR}/before" "${HOME}/.config/opencode/opencode.jsonc" \
            || { echo "FAIL: corrupt config was modified" >&2; exit 1; }
          grep -q 'FAKE_HEADROOM_ARGV=wrap opencode --no-proxy' "${HOME}/headroom-calls.log" \
            || { echo "FAIL: corrupt config blocked delegation" >&2; exit 1; }
          echo "CORRUPT_OK"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "CORRUPT_OK"
          - result.systemout ShouldContainSubstring "FAKE_REAL_opencode_INVOKED"
