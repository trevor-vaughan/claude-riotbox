name: scripts/lib/json-write.sh atomic config writer
vars:
  root: "."
  riotbox_dir: "{{.root}}"

# Pins the public contract of scripts/lib/json-write.sh. Every caller
# (container/codegraph-setup.sh, agents/claude/context-mode.sh) rewrites an
# agent config file the user owns, in a bind-mounted host session directory, so
# a regression here either loses configuration that cannot be recovered or
# leaves a file on the host looser than the user set it.

testcases:
  - name: atomic write preserves an existing file mode
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          target="${TEST_DIR}/settings.json"
          echo '{"a":1}' > "${target}"
          chmod 640 "${target}"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          json_write_atomic "${target}" '{"a":2}'

          [ "$(stat -c '%a' "${target}")" = "640" ] \
            || { echo "FAIL: mode not preserved"; exit 1; }
          jq -e '.a == 2' "${target}" >/dev/null \
            || { echo "FAIL: content not written"; exit 1; }
          echo "atomic_mode=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "atomic_mode=pass"

  - name: atomic write creates a new file 0600 and leaves no staging file
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          target="${TEST_DIR}/nested/settings.json"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          json_write_atomic "${target}" '{"a":1}'

          [ "$(stat -c '%a' "${target}")" = "600" ] \
            || { echo "FAIL: new file not 0600"; exit 1; }
          [ "$(find "${TEST_DIR}/nested" -name 'settings.json.*' | wc -l)" = "0" ] \
            || { echo "FAIL: staging file left behind"; exit 1; }
          echo "atomic_create=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "atomic_create=pass"

  # The failure path, which the success cases above cannot reach. These targets
  # live in the user's bind-mounted session directory, so a staging file that
  # survives a failed write is litter on the host that nothing ever collects —
  # and it sits beside the real config under a name a reader has to squint at.
  # Only the rename is failed here: an unwritable directory would fail at
  # mktemp instead, leaving nothing to clean up, and it cannot be staged as
  # root at all (the codegraph suite skips its equivalent case for exactly
  # that reason). Shimming `mv` reaches the branch as any user.
  #
  # Coupling the test to `mv` is deliberate, not a shortcut around a better
  # seam. The rename IS the contract this library documents — "a partial write
  # must never replace a good config, hence the staging file and the rename",
  # and "a rename adopts the source inode's mode" is why the mode assertion
  # below belongs to the same guarantee. A rewrite that stops renaming has
  # abandoned both, so this case failing to shim anything is the correct
  # outcome, not a stale test to relax.
  - name: a failed write leaves the target intact and no staging file behind
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          target="${TEST_DIR}/settings.json"
          printf '{"statusLine":{"command":"mine.sh"}}\n' > "${target}"
          chmod 640 "${target}"
          cp "${target}" "${TEST_DIR}/before"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          mv() { return 1; }
          rc=0
          json_write_atomic "${target}" '{"a":2}' || rc=$?
          unset -f mv

          [ "${rc}" != "0" ] \
            || { echo "FAIL: reported success on a write that never landed"; exit 1; }
          cmp -s "${TEST_DIR}/before" "${target}" \
            || { echo "FAIL: target changed: $(cat "${target}")"; exit 1; }
          [ "$(stat -c '%a' "${target}")" = "640" ] \
            || { echo "FAIL: mode changed to $(stat -c '%a' "${target}")"; exit 1; }
          leftovers="$(find "${TEST_DIR}" -maxdepth 1 -name 'settings.json.*')"
          [ -z "${leftovers}" ] \
            || { echo "FAIL: staging file left behind: ${leftovers}"; exit 1; }
          echo "atomic_failed_write=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "atomic_failed_write=pass"

  # A target that is a directory is not an absurd state to guard against: it is
  # what podman and docker create when a bind mount's source path does not
  # exist on the host, and libexec/launch.sh mounts the very config paths these
  # callers rewrite. One mistyped or not-yet-created host path is enough.
  #
  # `mv file dir` moves the file INTO the directory and exits 0, and `stat` on a
  # directory happily returns 755, so every guard in the writer passes: the
  # caller is told its config was replaced while the content sits at
  # <target>/<basename>.XXXXXX and the real config is untouched. Refusing before
  # the staging file exists is what turns that silent loss into the failure
  # branch each caller already has.
  - name: a directory target is refused before anything is staged
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          target="${TEST_DIR}/settings.json"
          mkdir "${target}"
          chmod 755 "${target}"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          # Without this, a renamed or deleted writer makes the whole case pass:
          # bash exits 127 for a missing command, which is the non-zero this
          # test is looking for.
          declare -F json_write_atomic >/dev/null \
            || { echo "FAIL: json_write_atomic is not defined"; exit 1; }
          rc=0
          json_write_atomic "${target}" '{"a":2}' || rc=$?

          [ "${rc}" != "0" ] \
            || { echo "FAIL: reported success writing onto a directory"; exit 1; }
          [ -d "${target}" ] \
            || { echo "FAIL: target is no longer the directory it was"; exit 1; }
          strays="$(find "${TEST_DIR}" -mindepth 1 -not -path "${target}")"
          [ -z "${strays}" ] \
            || { echo "FAIL: wrote something anyway - ${strays}"; exit 1; }
          echo "atomic_dir_target=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "atomic_dir_target=pass"

  # Same reachable state one indirection further out, and the reason the guard
  # must not exempt symlinks: a host config path can be a symlink into a shared
  # dotfiles directory, and if that directory is the bind mount source podman
  # created, the target resolves to a directory while looking like a file. `mv`
  # follows it and drops the content inside, so a guard that trusts a symlink
  # loses the write exactly as before.
  - name: a symlink to a directory is refused the same way
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          target="${TEST_DIR}/settings.json"
          mkdir "${TEST_DIR}/dotfiles"
          ln -s "${TEST_DIR}/dotfiles" "${target}"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          declare -F json_write_atomic >/dev/null \
            || { echo "FAIL: json_write_atomic is not defined"; exit 1; }
          rc=0
          json_write_atomic "${target}" '{"a":2}' || rc=$?

          [ "${rc}" != "0" ] \
            || { echo "FAIL: reported success writing through a symlinked directory"; exit 1; }
          [ -L "${target}" ] \
            || { echo "FAIL: target is no longer the symlink it was"; exit 1; }
          strays="$(find "${TEST_DIR}/dotfiles" "${TEST_DIR}" -mindepth 1 -not -path "${target}" -not -path "${TEST_DIR}/dotfiles")"
          [ -z "${strays}" ] \
            || { echo "FAIL: wrote something anyway - ${strays}"; exit 1; }
          echo "atomic_symlink_dir_target=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "atomic_symlink_dir_target=pass"

  # A symlink to a regular file passes the type check above (`-f` follows it),
  # so the mode read has to follow it too: `stat -c %a` on the link itself
  # reports the link's own 0777, and the rename would hand that to the regular
  # file that replaces it — a world-writable config on the host.
  - name: a symlink to a 0600 file becomes a 0600 regular file and the target is untouched
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          echo '{"victim":true}' > "${TEST_DIR}/victim.json"
          chmod 600 "${TEST_DIR}/victim.json"
          ln -s victim.json "${TEST_DIR}/settings.json"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          json_write_atomic "${TEST_DIR}/settings.json" '{"a":1}'

          [ -f "${TEST_DIR}/settings.json" ] && [ ! -L "${TEST_DIR}/settings.json" ] \
            || { echo "FAIL: the link was not replaced by a regular file"; exit 1; }
          mode="$(stat -c '%a' "${TEST_DIR}/settings.json")"
          [ "${mode}" = "600" ] || { echo "FAIL: mode ${mode}, want 600"; exit 1; }
          jq -e '.a == 1' "${TEST_DIR}/settings.json" >/dev/null \
            || { echo "FAIL: content not written"; exit 1; }
          jq -e '.victim == true' "${TEST_DIR}/victim.json" >/dev/null \
            || { echo "FAIL: the link target was written"; exit 1; }
          echo "symlink_0600=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "symlink_0600=pass"

  - name: a symlink to a 0640 file takes the target's 0640, not the link's 0777
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          echo '{}' > "${TEST_DIR}/victim.json"
          chmod 640 "${TEST_DIR}/victim.json"
          ln -s "${TEST_DIR}/victim.json" "${TEST_DIR}/settings.json"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          json_write_atomic "${TEST_DIR}/settings.json" '{"a":1}'

          mode="$(stat -c '%a' "${TEST_DIR}/settings.json")"
          [ "${mode}" = "640" ] || { echo "FAIL: mode ${mode}, want 640"; exit 1; }
          echo "symlink_0640=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "symlink_0640=pass"

  - name: a dangling symlink becomes a 0600 regular file and its target is not created
    steps:
      - type: exec
        script: |
          set -e
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEST_DIR}"' EXIT
          ln -s missing.json "${TEST_DIR}/settings.json"

          source "{{.riotbox_dir}}/scripts/lib/json-write.sh"
          json_write_atomic "${TEST_DIR}/settings.json" '{"a":1}'

          [ -f "${TEST_DIR}/settings.json" ] && [ ! -L "${TEST_DIR}/settings.json" ] \
            || { echo "FAIL: the link was not replaced by a regular file"; exit 1; }
          mode="$(stat -c '%a' "${TEST_DIR}/settings.json")"
          [ "${mode}" = "600" ] || { echo "FAIL: mode ${mode}, want 600"; exit 1; }
          [ ! -e "${TEST_DIR}/missing.json" ] \
            || { echo "FAIL: the dangling link's target was created"; exit 1; }
          echo "dangling=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "dangling=pass"

  # The writer is shared because the entrypoint sources codegraph-setup.sh and
  # context-mode-setup.sh independently, so neither may own it. That only works
  # if the library is sourced first: a source line moved below either setup
  # script leaves both calling an undefined function at session start.
  - name: entrypoint sources the writer ahead of both setup scripts
    steps:
      - type: exec
        script: |
          set -e
          cd "{{.riotbox_dir}}"
          # Anchored on the source statement itself: the comment above it and
          # the shellcheck directive beside it both name the file, so an
          # unanchored match is satisfied by an entrypoint that sources nothing.
          lib_line="$(grep -nE '^[[:space:]]*source .*/lib/json-write\.sh' container/entrypoint.sh | head -1 | cut -d: -f1)"
          [ -n "${lib_line}" ] \
            || { echo "FAIL: entrypoint.sh does not source the JSON writer"; exit 1; }
          for setup in codegraph-setup.sh context-mode-setup.sh; do
            setup_line="$(grep -nE "^[[:space:]]*source .*/${setup}" container/entrypoint.sh | head -1 | cut -d: -f1)"
            [ -n "${setup_line}" ] \
              || { echo "FAIL: entrypoint.sh does not source ${setup}"; exit 1; }
            [ "${lib_line}" -lt "${setup_line}" ] \
              || { echo "FAIL: the writer is sourced after ${setup}"; exit 1; }
          done
          echo "entrypoint_order=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "entrypoint_order=pass"

  # container/context-mode-setup.sh and agents/claude/context-mode.sh are both
  # sourced by the image build, which asserts the build-time constants the
  # second one defines against the installed package. Those sources must stay
  # free of side effects and must not need this library, so the dependency is a
  # call inside a function and never a top-level source.
  - name: the setup scripts depend on the writer without sourcing it
    steps:
      - type: exec
        script: |
          set -e
          cd "{{.riotbox_dir}}"
          # container/context-mode-setup.sh is deliberately not in this list.
          # The code that writes JSON moved to agents/claude/context-mode.sh;
          # what is left there (context_mode_pkg_root, context_mode_setup)
          # writes nothing, so "calls the shared writer" is no longer true of
          # it. The standalone-source probe below still covers it.
          for setup in container/codegraph-setup.sh agents/claude/context-mode.sh; do
            grep -q 'json_write_atomic' "${setup}" \
              || { echo "FAIL: ${setup} no longer calls the shared writer"; exit 1; }
            grep -qE '^[[:space:]]*(source|\.) .*json-write\.sh' "${setup}" \
              && { echo "FAIL: ${setup} sources the library itself"; exit 1; }
            grep -qE '^[a-z_]+_write_json_atomic\(\)' "${setup}" \
              && { echo "FAIL: ${setup} defines its own copy of the writer"; exit 1; }
          done
          # The build sources both files and reads the constants the Context
          # Mode layer's guards need; nothing either does on source may call
          # the missing writer.
          out="$(bash -uc '. container/context-mode-setup.sh
            . agents/claude/context-mode.sh
            : "${CONTEXT_MODE_BIN:?}"
            : "${CONTEXT_MODE_MCP_NAME:?}"
            echo standalone_source_ok' 2>&1)"
          [ "${out}" = "standalone_source_ok" ] \
            || { echo "FAIL: standalone source is not side-effect free: ${out}"; exit 1; }
          echo "setup_dependency=pass"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "setup_dependency=pass"
