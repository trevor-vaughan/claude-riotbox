version: "3"

includes:
  build:
    taskfile: .taskfiles/build.yml
  container:
    taskfile: .taskfiles/container.yml
  lint:
    taskfile: .taskfiles/lint.yml
  test:
    taskfile: .taskfiles/test.yml
  release:
    taskfile: .taskfiles/release.yml
  go:
    taskfile: .taskfiles/go.yml

vars:
  TEST_DIR: '{{.TEST_DIR | default ".test-output"}}'

dotenv: [".env"]

tasks:
  default:
    silent: true
    cmd: |
      task --list 2>/dev/null
  build:
    desc: "Alias for build:image"
    cmds:
      - task: build:image

  rebuild:
    desc: "Rebuild from scratch (alias for container:rebuild)"
    cmds:
      - task: container:rebuild

  update:
    desc: "Upgrade only the LLM CLI tools (alias for container:update)"
    cmds:
      - task: container:update

  test:
    desc: "Run Go suites, then the venom integration suites (MODE=human|llm; venom suite filter via --)"
    cmds:
      - task: go:build
      - task: go:test
      - task: test:run
        vars:
          ARGS: "{{.CLI_ARGS}}"

  lint:
    desc: "Alias for lint:run"
    cmds:
      - task: lint:run

  fmt:
    desc: "Alias for go:fmt"
    cmds:
      - task: go:fmt

  clean:
    desc: "Remove build output: test output, dist/, configs/, libexec/riotbox-core and Task's .task/ cache"
    cmd: rm -rf "{{.TEST_DIR}}" dist configs libexec/riotbox-core .task

  check:
    desc: Run all quality gates
    deps: [lint, test, test:lint]
