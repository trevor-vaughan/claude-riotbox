# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Release build for RiotBox: riotbox-core per architecture, the rpm/deb app
# packages that carry it, signed checksums and SBOMs. Follows the pattern of
# github.com/trevor-vaughan/ginkgoleaf. Local dry run: task release:package.
version: 2

project_name: riotbox

builds:
  - id: riotbox-core
    main: ./cmd/riotbox-core
    binary: riotbox-core
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    # Reproducible: file times pinned to the commit, no wall-clock in the binary.
    mod_timestamp: "{{ .CommitTimestamp }}"
    # Same flags as scripts/build-core.sh. {{.Version}} is the tag without
    # its "v", which the release workflow checks equals VERSION.
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: riotbox-core
    ids: [riotbox-core]
    formats: [tar.gz]
    name_template: "riotbox-core_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # The binary only: install.sh --binary extracts exactly this member.
    files:
      - none*
    # Not the build user's name: the member is root:root like the packages.
    builds_info:
      owner: root
      group: root

nfpms:
  - id: riotbox
    ids: [riotbox-core]
    package_name: riotbox
    file_name_template: "{{ .ConventionalFileName }}"
    formats: [rpm, deb]
    # Reproducible: package timestamps pinned to the commit, as the binaries'.
    mtime: "{{ .CommitDate }}"
    # riotbox-core lands where scripts/lib/riotbox-core.sh looks for it.
    bindir: /opt/riotbox/libexec
    section: utils
    priority: optional
    maintainer: "RiotBox maintainers <noreply@users.noreply.github.com>"
    description: |
      RiotBox — container-based isolation for running AI coding agents autonomously.
      Installs the app tree to /opt/riotbox with the riotbox CLI on PATH.
    vendor: "RiotBox"
    homepage: "https://github.com/trevor-vaughan/claude-riotbox"
    license: "Apache-2.0"
    dependencies:
      - git
      # flock(1): serializes concurrent launches' host-side config sync.
      - util-linux
    contents:
      # App tree (read-only) under /opt/riotbox.
      - src: ./bin
        dst: /opt/riotbox/bin
      # *.sh, not the directory: a riotbox-core left by `task go:build` must not
      # ride along beside the release build that bindir installs. Every libexec
      # entry is a .sh script. A non-.sh addition must be listed here AND
      # accepted by tests/lib/libexec-glob-coverage.sh (riotbox-core.venom.yml),
      # which checks only this glob and fails on any file it does not match.
      - src: ./libexec/*.sh
        dst: /opt/riotbox/libexec
      - src: ./scripts
        dst: /opt/riotbox/scripts
      - src: ./agents
        dst: /opt/riotbox/agents
      - src: ./container
        dst: /opt/riotbox/container
      # NOTE: top-level configs/ is intentionally NOT shipped. It is a host-specific
      # build artifact regenerated by scripts/build.sh from the installing user's
      # tool configs at `riotbox build` time (see the Containerfile `COPY configs/`).
      - src: ./Containerfile
        dst: /opt/riotbox/Containerfile
      - src: ./.dockerignore
        dst: /opt/riotbox/.dockerignore
      - src: ./VERSION
        dst: /opt/riotbox/VERSION
      # Entrypoint on PATH.
      - src: /opt/riotbox/bin/riotbox
        dst: /usr/bin/riotbox
        type: symlink
      # System-default config (XDG user config overrides these). Only the files
      # the host-side launcher actually reads are shipped: launch.sh sources
      # `config` and detect-mounts.sh reads `mounts.conf`, both with
      # env > XDG > /etc precedence. plugins.conf is intentionally NOT shipped to
      # /etc — it is consumed container-side (plugin-setup.sh) where host /etc is
      # not visible, so a system plugins.conf would silently do nothing. Plugins
      # are configured per-user ($XDG_CONFIG_HOME/riotbox/plugins.conf) or via the
      # RIOTBOX_PLUGINS env var.
      - src: ./scripts/configs/config
        dst: /etc/riotbox/config
        type: "config|noreplace"
      - src: ./scripts/configs/mounts.conf
        dst: /etc/riotbox/mounts.conf
        type: "config|noreplace"
    scripts:
      postinstall: ./packaging/postinstall.sh

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archive
    artifacts: archive
  - id: package
    artifacts: package

signs:
  - id: cosign-keyless
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ .Version }}-snapshot"

# CHANGELOG.md is written by git-cliff (task release:bump); the release
# workflow passes its section as the notes.
changelog:
  disable: true
